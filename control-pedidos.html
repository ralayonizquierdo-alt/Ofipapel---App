function documentosCampana(ps) {
  const docs = [];
  for (const [campo, tipo] of [['propuesta', 'Propuesta'], ['factura', 'Factura final']]) {
    for (const p of ps) for (const nombre of docsDe(p[campo])) {
      let d = docs.find((x) => x.campo === campo && x.nombre === nombre);
      if (!d) docs.push(d = { campo, tipo, nombre, pedidos: [], lineas: 0, importe: 0 });
      d.pedidos.push(p);
      const ls = (p[campo].lineas || []).filter((l) => docsDe(p[campo]).length === 1 || claveDocumento(l, p[campo]) === nombre);
      d.lineas += ls.length; d.importe = CP.red2(d.importe + ls.reduce((t, l) => t + (CP.parseNum(l.importe) || 0), 0));
    }
  }
  return docs;
}
function bloqueDocumentos(g) {
  const docs = documentosCampana(g.pedidos);
  const nFotos = g.pedidos.reduce((s, p) => s + fotosDe(p).length, 0);
  const fila = (d, i) => `<li><b>${h(d.nombre)}</b> · ${d.pedidos.length} pedido(s) (${d.pedidos.map((p) => nPed(p.numero)).join(', ')}) · ${d.lineas} líneas · ${fmt(d.importe)} €
    ${d.campo === 'factura' ? `<button class="btn peque" onclick="excelDeFactura(${js(g.clave)}, ${i})" title="Excel de Géminis solo de esta factura">📥 Excel Géminis</button>
      <button class="btn peque" onclick="guiaDeFactura(${js(g.clave)}, ${i})" title="Guía de facturación solo de esta factura">🧾 Guía</button>` : ''}
    <button class="btn peque peligro" onclick="quitarDocumentoCampana(${js(g.clave)}, ${i})" title="Quitarlo de todos los pedidos de la campaña">🗑️ Quitar</button></li>`;
  const lista = (campo, titulo) => {
    const ds = docs.map((d, i) => [d, i]).filter(([d]) => d.campo === campo);
    return `<div><b>${titulo} (${ds.length})</b>${ds.length ? `<ul style="margin:4px 0 0 18px;padding:0">${ds.map(([d, i]) => fila(d, i)).join('')}</ul>` : ' <span class="pequeno">ninguna</span>'}</div>`;
  };
  const cu = cuadreCampana(g.pedidos);
  const lineaCuadre = !cu.facturadas ? '' : (cu.difs.length || cu.sinCliente || cu.sinValidar)
    ? `<div class="aviso-caja mal" style="margin:6px 0"><b>🧮 Artículos: ${cu.facturadas} uds. facturadas por el proveedor, ${cu.aClientes} a clientes</b>${cu.sinCliente ? ` · ${cu.sinCliente} sin cliente` : ''}${cu.sinValidar ? ` · ${cu.sinValidar} en pedidos sin validar` : ''}
        ${cu.difs.length ? `<ul style="margin:4px 0 0 18px;padding:0">${cu.difs.map((d) => `<li>Pedido ${h(nPed(d.numero))} (${h(d.cliente)}) · <b>${h(d.ref)}</b>: facturadas ${d.facturado}, al cliente ${d.aCliente}</li>`).join('')}</ul>` : ''}</div>`
    : `<div class="aviso-caja ok" style="margin:6px 0"><b>🧮 Artículos cuadrados:</b> las ${cu.facturadas} uds. que factura el proveedor están todas facturadas a un cliente.</div>`;
  return `${lineaCuadre}<details class="no-imprimir" style="margin:8px 0"><summary>📂 Documentos subidos: 📷 ${nFotos} foto(s) · 📄 ${docs.filter((d) => d.campo === 'propuesta').length} propuesta(s) · 🧾 ${docs.filter((d) => d.campo === 'factura').length} factura(s) final(es)</summary>
    <div style="display:grid;gap:8px;margin-top:8px">${lista('propuesta', '📄 Propuestas del proveedor')}${lista('factura', '🧾 Facturas finales')}</div></details>`;
}

function cuadreCampana(ps) {

    const eq = p.propuesta ? equivalenciasDe(p) : Object.assign({}, p.equivalencias);
    return { numero: p.numero, cliente: p.cliente, sinCliente: Boolean(p.sobrantes), validado: p.validado,
      factura: p.factura.lineas.map((l) => (eq[l.ref] ? Object.assign({}, l, { ref: eq[l.ref] }) : l)),
      final: (p.final && p.final.lineas) || [] };

function quitarDocumentoCampana(clave, indice) {
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave);
  const docs = documentosCampana(ps);
  if (!docs.length) { alert('Esta campaña no tiene propuestas ni facturas subidas.'); return; }
  let elegidos;
  if (indice != null) elegidos = [docs[indice]].filter(Boolean);
  else {
    const r = prompt('¿Qué documento quitas? Se quita de todos los pedidos de la campaña.\n\n' +
      docs.map((d, i) => `${i + 1}) ${d.tipo} · ${d.nombre} (${d.pedidos.length} pedido(s))`).join('\n') +
      '\n\nEscribe el número, o TODO para quitarlos todos:');
    if (r == null || !r.trim()) return;
    elegidos = r.trim().toUpperCase() === 'TODO' ? docs : [docs[Number(r) - 1]].filter(Boolean);
  }
  if (!elegidos.length) { alert('Ese número no está en la lista.'); return; }
  const validados = [...new Set(elegidos.flatMap((d) => d.pedidos))].filter((p) => p.validado).length;
  if (!confirm(`Se quita${elegidos.length > 1 ? 'n' : ''} ${elegidos.map((d) => d.nombre).join(', ')}.` +
    (validados ? `\n${validados} pedido(s) validado(s) tendrán que revalidarse.` : '') + '\n¿Seguir?')) return;
  for (const d of elegidos) {
    for (const p of d.pedidos) {
      const x = p[d.campo];
      if (!x) continue;
      const quedan = docsDe(x).length > 1 ? x.lineas.filter((l) => claveDocumento(l, x) !== d.nombre) : [];
      if (quedan.length) {
        x.lineas = quedan;

        p[d.campo] = null;
        if (d.campo === 'propuesta') p.decisiones = {};

      if (d.campo === 'propuesta') invalidar(p); else restosPorFactura(p);

  // El pedido «lo que sobra de la factura» sin nada ya no pinta nada.
  quitarPedidos(ps.filter((p) => p.sobrantes && !p.propuesta && !p.factura).map((p) => p.id));
  guardar(); pintar();

}

/** Nuestra referencia `nuestra` es la `delProveedor` de su propuesta (o se
 *  deshace con nuestra = ''). Se recuerda también para ese proveedor. */
function emparejar(delProveedor, nuestra) {
  const p = pedidoActual();
  p.equivalencias = Object.assign({}, p.equivalencias);
  const k = prov(p.proveedor);
  const c = E.catalogos[k] = E.catalogos[k] || { fecha: hoy(), items: {} };
  c.equivalencias = Object.assign({}, c.equivalencias);
  if (nuestra) { p.equivalencias[delProveedor] = nuestra; c.equivalencias[delProveedor] = nuestra; delete p.decisiones[nuestra]; }
  else { delete p.equivalencias[delProveedor]; delete c.equivalencias[delProveedor]; }
  invalidar(p); guardar(); pintar();
}
function marcarDec(c) {

  const nm = comparar(pedidoActual()).filter((f) => f.revisar && marcadasDec.has(f.ref)).length;
  const n = document.getElementById('nMarcadas'), barra = document.getElementById('barraBloque');

/** Misma decisión para todas las marcadas; a la que no admite esa decisión no se le toca y se avisa. */
function decidirEnBloque(accion) {
  if (!accion) { alert('Elige primero la decisión.'); return; }
  const p = pedidoActual();
  const filas = comparar(p).filter((f) => f.revisar && marcadasDec.has(f.ref));
  if (!filas.length) { alert('No hay ninguna marcada.'); return; }
  const no = [];
  for (const f of filas) {
    if (!CP.accionesPara(f, p.tipo).includes(accion)) { no.push(f.ref); continue; }
    p.decisiones[f.ref] = Object.assign({}, p.decisiones[f.ref], { accion });
  }
  marcadasDec.clear();
  invalidar(p); guardar(); pintar();
  if (no.length) alert(`Hecho en ${filas.length - no.length}. Estas no admiten esa decisión y siguen igual: ${no.join(', ')}`);
}
function decide(ref, campo, valor) {
  const p = pedidoActual();
  if (campo === 'accion' && String(valor).startsWith('eq:')) { emparejar(String(valor).slice(3), ref); return; }
  p.decisiones[ref] = Object.assign({}, p.decisiones[ref], { [campo]: valor });
  // La nota para el proveedor solo cambia el texto de la reclamación: no hay que revalidar.
  if (campo !== 'motivo') invalidar(p);
  guardar(); pintar();
}

/** «4 780100027 3,25 CALENDARIO» · «1EXP 883840127 180,14» · también separado por tabuladores (copiado de Excel). */
function pegarLineas(destino) {
  const p = pedidoActual();
  const aPropuesta = destino === 'propuesta';
  const txt = document.getElementById(aPropuesta ? 'txtPegarProp' : 'txtPegar').value;
  const nuevas = [];
  const malas = [];
  for (const crudo of txt.split(/\r?\n/)) {
    const linea = crudo.trim();
    if (!linea) continue;
    const m = linea.match(/^(\d+(?:[.,]\d+)?)\s*(EXP\.?|EX\.?)?\s+(\S+)\s*(.*)$/i);
    if (!m) { malas.push(linea); continue; }
    let resto = m[4].trim();
    let precio = null;
    const mp = resto.match(/(?:^|\s)(\d+(?:[.,']\d{1,2})?)\s*€?\s*(.*)$/);
    if (mp) { precio = CP.parseNum(mp[1]); resto = (resto.slice(0, mp.index) + ' ' + mp[2]).trim(); }
    // Descuentos justo tras el precio, solo si llevan % o + (un número suelto
    // podría ser el principio de la descripción): «10%», «10+5», «10%+5%».
    let dtos = [];
    const md = resto.match(/^(\d+(?:[.,]\d+)?%(?:\s*\+\s*\d+(?:[.,]\d+)?%?)*|\d+(?:[.,]\d+)?(?:\s*\+\s*\d+(?:[.,]\d+)?%?)+)\s*(.*)$/);
    if (md) { dtos = CP.parseDtos(md[1].replace(/\s+/g, '')); resto = md[2].trim(); }
    nuevas.push({ cant: CP.parseNum(m[1]), exp: Boolean(m[2]), ref: CP.normRef(m[3]), precio, dtos, desc: resto, duda: '' });
  }
  if (aPropuesta) {
    if (p.propuesta && !confirm('¿Sustituir la propuesta actual por estas líneas?')) return;
    p.propuesta = { archivo: 'Líneas pegadas', fecha: hoy(), cabecera: {}, lineas: nuevas };
  } else {
    p.lineas.push(...nuevas);
  }
  invalidar(p); guardar(); pintar();
  if (malas.length) alert(`Añadidas ${nuevas.length}. No he entendido ${malas.length}:\n` + malas.slice(0, 8).join('\n'));
}

// ── Fotos → lectura con IA ───────────────────────────────────────────────────
/** Abre la imagen para reducirla. createImageBitmap falla en algunos móviles
 *  («The source image could not be decoded»): se prueba con <img>, y si
 *  tampoco, un JPEG no muy grande se manda tal cual. */
function imagenPorImg(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('no decodifica')); };
    img.src = url;
  });
}
async function reducirImagen(file) {
  let src;
  try { src = await createImageBitmap(file); } catch {
    try { src = await imagenPorImg(file); } catch {
      if (/jpe?g/i.test(file.type || file.name) && file.size && file.size < 3 * 1024 * 1024) return base64DeFichero(file);
      throw new Error('el móvil no puede abrir esta imagen. Si está solo en la nube (Google Fotos), ábrela antes en la galería para que se descargue, o hazle una captura y sube la captura');
    }
  }
  const ancho = src.width || src.naturalWidth;
  const alto = src.height || src.naturalHeight;
  const lado = 1600;
  const k = Math.min(1, lado / Math.max(ancho, alto));
  const c = document.createElement('canvas');
  c.width = Math.round(ancho * k); c.height = Math.round(alto * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

const esPdf = (f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const esImagen = (f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name);
function base64DeFichero(file) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => mal(new Error('No se ha podido leer el fichero'));
    fr.readAsDataURL(file);
  });
}
const leerUnaFoto = (file) => leerConIA(file, 'manuscrito');

/** Manda una foto (reducida) o un PDF (tal cual) a la función de lectura y
 *  espera el resultado. modo: 'manuscrito' | 'documento'. */
/** Sin saldo en la cuenta de la API no se lee nada: se avisa en claro y los
 *  bucles de varias fotos/documentos se paran en vez de fallar uno a uno. */
const MSG_SIN_SALDO = 'Se ha acabado el saldo de la cuenta de la IA (Anthropic). Hay que recargarlo en console.anthropic.com → Plans & Billing; las fotos no se han perdido, súbelas otra vez después.';
function errorDeLectura(msg) {
  const e = new Error(/credit balance|billing|purchase credits/i.test(String(msg)) ? MSG_SIN_SALDO : msg);
  if (e.message === MSG_SIN_SALDO) e.sinSaldo = true;
  return e;
}
async function leerConIA(file, modo) {
  if (!EN_NETLIFY) throw new Error('aquí no se pueden leer fotos ni PDF: abre la app en ofipapel.netlify.app (tus datos ya están en la nube y salen igual)');
  const jobId = nuevoId();
  const pdf = esPdf(file);
  const imagenBase64 = pdf ? await base64DeFichero(file) : await reducirImagen(file);
  if (imagenBase64.length > 24 * 1024 * 1024) throw new Error('El PDF es demasiado grande (máximo unos 18 MB). Si es un escaneado, prueba a reducirlo o haz una foto de cada página.');
  // 1) Subida (función normal, admite hasta 6 MB). 2) Lectura en segundo plano,
  // que solo recibe el jobId: Netlify corta a 256 KB lo que se le manda a una
  // Background Function, y una foto o un PDF pasan de eso (error 413).
  const cab = { 'content-type': 'application/json', 'x-ocr-token': OCR_TOKEN };
  const bloqueo = await pantallaEncendida();
  try {
  // En trozos de 3,5 MB: cada envío a una función normal no puede pasar de 6 MB.
  const TROZO = 3.5 * 1024 * 1024;
  const partes = Math.max(1, Math.ceil(imagenBase64.length / TROZO));
  for (let parte = 0; parte < partes; parte++) {
    const sub = await fetchReintentando(FN + 'leer-pedido-manuscrito-subir', {
      method: 'POST', headers: cab,
      body: JSON.stringify({ jobId, imagenBase64: imagenBase64.slice(parte * TROZO, (parte + 1) * TROZO), mediaType: pdf ? 'application/pdf' : 'image/jpeg', parte, partes }),
    });
    if (!sub.ok) {
      const e = await sub.json().catch(() => ({}));
      throw new Error(e.error || 'No se ha podido subir (' + sub.status + '). ¿Estás en la web de Netlify?');
    }
  }
  const r = await fetchReintentando(FN + 'leer-pedido-manuscrito-background', { method: 'POST', headers: cab, body: JSON.stringify({ jobId, modo }) }, 2);
  if (r.status !== 202 && !r.ok) throw new Error('El lector no responde (' + r.status + '). ¿Estás en la web de Netlify?');
  // La lectura sigue en el servidor aunque el móvil pierda la red un momento
  // (salir a otra app, apagar la pantalla, pasar de wifi a datos): una
  // consulta fallida no la da por perdida, se vuelve a preguntar.
  const limite = Date.now() + 8 * 60 * 1000;
  let sinRed = null;
  while (Date.now() < limite) {
    await espera(3000);
    let e;
    try { e = await fetch(FN + 'leer-pedido-manuscrito-estado?jobId=' + encodeURIComponent(jobId), { headers: { 'x-ocr-token': OCR_TOKEN } }); }
    catch (err) { sinRed = err; continue; }
    sinRed = null;
    if (e.status === 202) continue;
    const data = await e.json().catch(() => ({}));
    if (!e.ok) throw new Error(data.error || 'Error consultando la lectura');
    if (data.status === 'error') throw errorDeLectura(data.error);
    if (data.status === 'done') return data.resultado;
  }
  throw new Error(sinRed ? 'Sin conexión: no se ha podido recoger la lectura. Revisa la cobertura y vuelve a intentarlo.' : 'La lectura ha tardado más de 8 minutos');
  } finally { if (bloqueo) bloqueo.release().catch(() => {}); }
}
/** fetch que reintenta si falla la red («Failed to fetch»), no si el servidor contesta un error. */
async function fetchReintentando(url, opciones, intentos = 4) {
  for (let i = 1; ; i++) {
    try { return await fetch(url, opciones); }
    catch (err) {
      if (i >= intentos) throw new Error('Sin conexión con el servidor (' + err.message + '). Revisa la cobertura y vuelve a intentarlo.');
      await espera(2000 * i);
    }
  }
}
/** Que la pantalla no se apague mientras se lee (si el navegador lo permite). */
async function pantallaEncendida() {
  try { return navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch { return null; }
}

/** Nº de pedido de una hoja: el que pone «añadir al pedido nº 4» en las notas
 *  manda sobre el del encabezado (es una hoja suelta que va a otro pedido). */
function numeroDeHoja(res) {
  const nota = String(res.notas || '').match(/pedido\s*n\S*\s*(\d+)/i);
  if (nota) return nota[1];
  const crudo = String(res.numeroPedido || '');
  // «1/4» es la hoja del talonario, no el pedido; y de «Pedido Nº 12» vale el
  // primer número entero (antes se pegaban todas las cifras: «1/4» → «14»).
  if (/\d\s*\/\s*\d/.test(crudo)) return '';
  const m = crudo.match(/\d+/);
  return m ? m[0] : '';
}
const claveCliente = (c) => String(c || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]/g, '');

function anadirLecturaA(p, res, nombre) {
  // La misma hoja subida otra vez (mismas referencias y cantidades que una foto
  // que ya tiene el pedido) no se añade: duplicaría todas sus líneas.
  const nuevas = (res.lineas || []).map((l) => ({ ref: CP.normRef(l.referencia), cant: CP.parseNum(l.cantidad) || 0 }));
  const firma = CP.firmaLineas(nuevas);
  if (firma) {
    const igual = fotosDe(p).find((f) => CP.firmaLineas(p.lineas.filter((l) => l.foto === f.nombre)) === firma);
    if (igual) {
      p.notas = [p.notas, `${nombre}: es la misma hoja que ${igual.nombre}, no se ha añadido`].filter(Boolean).join(' | ');
      return 0;
    }
  }
  let descAnterior = '';
  let n = 0;
  for (const l of res.lineas || []) {
    const desc = (l.descripcion || '').trim();
    descAnterior = desc && !/^[-–"'`,.~]+$/.test(desc) ? desc : descAnterior;
    p.lineas.push({ cant: CP.parseNum(l.cantidad) || 0, exp: Boolean(l.esExpositor), ref: CP.normRef(l.referencia),
      precio: CP.parseNum(l.precio), desc: descAnterior, duda: (l.duda || '').trim(), foto: nombre });
    n++;
  }
  (p.fotos = p.fotos || []).push({ nombre, hoja: (res.hoja || '').trim(), lineas: n, fecha: new Date().toISOString() });
  if (!p.cliente && res.cliente) p.cliente = res.cliente.toUpperCase();
  if (!p.numero && numeroDeHoja(res)) p.numero = numeroDeHoja(res);
  if (!p.proveedor && res.proveedor) p.proveedor = prov(res.proveedor);
  const extra = [res.hoja && `hoja ${res.hoja}`, res.notas].filter(Boolean).join(' · ');
  if (extra) p.notas = [p.notas, `${nombre}: ${extra}`].filter(Boolean).join(' | ');
  if (numeroDeHoja(res) && numeroDeHoja(res) !== String(p.numero).replace(/\D/g, '')) {
    p.notas = [p.notas, `${nombre} dice pedido nº ${res.numeroPedido}`].filter(Boolean).join(' | ');
  }
  invalidar(p);
  return n;
}

/**
 * Lee varias fotos de pedidos del comercial.
 *  - destino: el pedido al que van TODAS (cuando se leen desde dentro de un
 *    pedido, o si en el formulario se escribió el nº).
 *  - sin destino: cada foto va al pedido con el nº que se lea en ella; las
 *    hojas 1/4…4/4 del mismo nº se juntan en uno, y lo que no trae nº va a un
 *    pedido «sin número» para revisarlo.

/** Las fotos de la última subida que no se han podido leer (solo en memoria):
 *  se enseñan con su nombre y un botón para volver a intentarlas. */
let fotosFallidas = null;
function vistaFallidas() {
  const f = fotosFallidas;
  if (!f || !f.files.length) return '';
  return `<div class="aviso-caja mal no-imprimir"><b>⚠️ ${f.files.length} foto(s) de la última subida sin leer:</b>
    <div class="pequeno" style="margin:4px 0">${f.files.map((x) => h(x.name)).join(' · ')}</div>
    <div class="fila"><button class="btn primario" onclick="reintentarFallidas()">🔁 Volver a intentar esas ${f.files.length}</button>
    <button class="btn peque" onclick="fotosFallidas=null;pintar()">Olvidarlas</button></div></div>`;
}
function reintentarFallidas() {
  const f = fotosFallidas;
  if (!f) return;
  const destino = f.destinoId ? pedidoPorId(f.destinoId) : null;
  leerFotos(f.files, destino, f.base);
}
async function leerFotos(files, destino, base) {
  const lista = [...files];
  const lote = new Map(); // nº leído → pedido creado en esta tanda
  const tocados = new Set();
  const errores = [];
  let total = 0;
  let sinSaldo = 0; // fotos que quedan sin leer por falta de saldo
  const avisos = [];
  const fallidas = []; // File de las que no se han podido leer, para reintentarlas
  const progreso = (txt) => { const c = document.getElementById('progresoFotos') || document.getElementById('progresoLote'); if (c) c.textContent = txt; };
  for (let i = 0; i < lista.length; i++) {
    progreso(`Leyendo foto ${i + 1} de ${lista.length} (${lista[i].name})… puede tardar un minuto por foto.`);
    // Una foto ya leída (mismo nombre de fichero) no se vuelve a pagar ni a sumar.
    const yaEn = !destino && E.pedidos.find((x) => x.lineas.some((l) => l.foto === lista[i].name) || (x.fotos || []).some((f) => f.nombre === lista[i].name));
    if (yaEn) { errores.push(`${lista[i].name}: ya estaba leída en el pedido nº ${yaEn.numero}, no se repite`); continue; }
    try {
      const res = await leerUnaFoto(lista[i]);
      let p = destino || null;
      let clave = null;
      if (!p) {
        const num = numeroDeHoja(res);
        const cli = claveCliente(res.cliente);
        // Agrupar por nº de pedido; si la hoja no lo trae, por cliente; y si
        // tampoco, la hoja va sola a su propio pedido. NUNCA se juntan hojas
        // «sin nada» en un mismo pedido: eso mezclaba clientes distintos.
        clave = num ? 'n:' + num : cli ? 'c:' + cli : 'f:' + lista[i].name;
        const proveedorHoja = (base && base.proveedor) || prov(res.proveedor);
        const mismaCampana = (x) => !esRepo(x) && !x.validado && x.proveedor === proveedorHoja && (x.campana || '') === ((base && base.campana) || '');
        // Un pedido ya creado (p. ej. fotos hechas de una en una con la cámara)
        // con ese nº —o, sin nº, con ese cliente— recibe la hoja.
        const existente = E.pedidos.find((x) => mismaCampana(x) &&
          (num ? String(x.numero) === num : (cli && !x.numero && claveCliente(x.cliente) === cli)));
        // Desde «Subir los pedidos de una campaña» (soloNuevos) nunca se toca
        // un pedido que ya existía: se crea uno nuevo y se avisa.
        p = lote.get(clave) || (base && base.soloNuevos ? null : existente);
        if (!p && existente && base && base.soloNuevos && !lote.has(clave)) {
          avisos.push(`${lista[i].name}: ya había un pedido nº ${existente.numero || '—'} ${existente.cliente || ''} en esta campaña; se ha creado otro aparte — si es el mismo, quita la foto del nuevo y súbela dentro del existente`);
        }
        if (!p) {
          p = { id: nuevoId(), tipo: 'comercial', proveedor: (base && base.proveedor) || prov(res.proveedor), campana: (base && base.campana) || '', numero: num,
            cliente: '', fecha: (base && base.fecha) || hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null };
          E.pedidos.push(p);
        }
      }
      if (p.lineas.some((l) => l.foto === lista[i].name) || (p.fotos || []).some((f) => f.nombre === lista[i].name)) {
        errores.push(`${lista[i].name}: ya estaba leída en el pedido nº ${p.numero}, no se repite`);
        continue;
      }
      if (clave) lote.set(clave, p);
      const nLeidas = anadirLecturaA(p, res, lista[i].name);
      if (!nLeidas && (res.lineas || []).length) avisos.push(`${lista[i].name}: es la misma hoja que otra foto del pedido nº ${p.numero || '—'}; no se ha añadido para no duplicar sus líneas`);
      total += nLeidas;
      tocados.add(p);
      guardar(); pintar();
    } catch (err) {
      if (err.sinSaldo) { sinSaldo = lista.length - i; fallidas.push(...lista.slice(i)); break; }
      errores.push(`${lista[i].name}: ${err.message}`);
      fallidas.push(lista[i]);
    }
  }
  const ps = [...tocados];
  fotosFallidas = fallidas.length ? { files: fallidas, destinoId: destino ? destino.id : null, base, fecha: new Date() } : null;
  if (!destino && ps.length === 1) abrirPedido(ps[0].id); else pintar();
  progreso(total ? `Leídas ${total} líneas. Revísalas con las fotos antes de comparar.` : '');
  let msg = ps.length ? `Leídas ${lista.length - errores.length} de ${lista.length} fotos:\n` +
    ps.map((p) => `· Pedido nº ${p.numero || '(sin número)'} ${p.cliente || ''} — ${p.lineas.length} líneas`).join('\n') : 'No se ha podido leer ninguna foto.';
  if (errores.length) msg += `\n\nNo se han podido leer ${errores.length}:\n` + errores.slice(0, 6).join('\n');
  if (avisos.length) msg += `\n\n⚠️ Revisa:\n` + avisos.slice(0, 6).join('\n');
  if (sinSaldo) msg = `⚠️ ${MSG_SIN_SALDO}\n\nQuedan ${sinSaldo} foto(s) sin leer.` + (ps.length ? '\n\n' + msg : '');
  if (lista.length > 1 || errores.length || avisos.length || sinSaldo) alert(msg);
}

// ── Propuestas (Excel) ───────────────────────────────────────────────────────
async function leerExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const hoja = wb.Sheets[wb.SheetNames[0]];
  return CP.leerPropuesta(XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '', raw: true }));
}
/** Excel → lector de columnas; PDF o foto → lectura con IA + comprobaciones. */
/** Texto de un PDF, línea a línea (por posición), con el mismo pdf.js que la
 *  herramienta de importación. Se carga solo cuando hace falta. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function textoDePdf(file) {
  if (!window.pdfjsLib) {
    await new Promise((ok, mal) => { const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.onload = ok; s.onerror = () => mal(new Error('no se pudo cargar el lector de PDF')); document.head.appendChild(s); });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  }
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const lineas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter((it) => it.str && it.str.trim());
    const filas = [];
    for (const it of items) {
      const y = it.transform[5];
      let f = filas.find((x) => Math.abs(x.y - y) < 3);
      if (!f) filas.push(f = { y, items: [] });
      f.items.push(it);
    }
    filas.sort((a, b) => b.y - a.y);
    for (const f of filas) {
      f.items.sort((a, b) => a.transform[4] - b.transform[4]);
      let texto = '', fin = null;
      for (const it of f.items) {
        const x = it.transform[4];
        texto += (fin != null && x - fin > 1 ? ' ' : '') + it.str;
        fin = x + (it.width || 0);
      }
      lineas.push(texto);
    }
  }
  return lineas;
}
/** Un documento del proveedor, o varios si es una factura que agrupa varios
 *  pedidos nuestros (`separarPorPedido`). Siempre una lista. */
async function leerDocumentosProveedor(file, idProgreso) {
  const res = await leerFicheroProveedor(file, idProgreso, null, true);
  return Array.isArray(res) ? res : [res];
}
/** Con `numero`, de una factura agrupada se queda la parte de ese pedido. */
async function leerFicheroProveedor(file, idProgreso, numero, partes) {
  if (!esPdf(file) && !esImagen(file)) return leerExcel(file);
  // Nuestro pedido de Géminis («Propuesta de Pedido»): se lee exacto, sin IA.
  if (esPdf(file)) {
    try {
      const g = CP.leerPedidoGeminis(await textoDePdf(file));
      if (g) { const doc = CP.lineasDeDocumento(g); doc.control = Object.assign({}, doc.control, { exacto: true }); return doc; }
    } catch (e) { /* si no se puede, lo lee la IA como siempre */ }
  }
  const caja = idProgreso && document.getElementById(idProgreso);
  if (caja) caja.textContent = `Leyendo ${file.name}… puede tardar uno o dos minutos.`;
  try {
    const res = await leerConIA(file, 'documento');
    const trozos = CP.separarPorPedido(res);
    if (trozos.length > 1) {
      const docs = trozos.map(CP.lineasDeDocumento);
      if (partes) return docs;
      const n = String(numero || '').replace(/\D/g, '');
      const suyo = n && docs.find((d) => d.cabecera.numeroPedido === Number(n));
      if (suyo) return suyo;
    }
    return CP.lineasDeDocumento(res);
  } finally {
    const c = idProgreso && document.getElementById(idProgreso);
    if (c) c.textContent = '';
  }
}

/** Resumen de las comprobaciones de un documento leído con IA. */
function avisoControl(doc) {
  if (!doc || !doc.control) return '';
  const c = doc.control;
  if (c.exacto) return `<div class="aviso-caja ok">Pedido de Géminis leído directamente del PDF, sin IA: ${(doc.lineas || []).length} líneas, con la columna «Unidades» como cantidad y «Rfc.Compra» como referencia.</div>`;
  const dudas = (doc.lineas || []).filter((l) => l.duda).length;
  const base = c.base == null
    ? `<div class="aviso-caja aviso">No se ha encontrado la base imponible del documento: no puedo comprobar que estén todas las líneas (suma leída ${fmt(c.sumaLineas)} €). Revísalas con el PDF.</div>`
    : c.cuadra
      ? `<div class="aviso-caja ok">Las líneas leídas suman ${fmt(c.sumaLineas)} €, igual que la base del documento (${fmt(c.base)} €).</div>`
      : `<div class="aviso-caja mal"><b>No cuadra:</b> las líneas leídas suman ${fmt(c.sumaLineas)} € y la base del documento es ${fmt(c.base)} €. Falta o sobra alguna línea, o hay un importe mal leído: revísalo con el PDF antes de comparar.</div>`;
  return base + (dudas ? `<div class="aviso-caja aviso">${dudas} línea(s) con duda de lectura (en ámbar abajo).</div>` : '') +
    (doc.cabecera && doc.cabecera.observaciones ? `<div class="pequeno">Notas del documento: ${h(doc.cabecera.observaciones)}</div>` : '');
}

function guardarCatalogo(proveedor, archivo, catalogo) {
  if (!catalogo) return;
  const n = Object.keys(catalogo).length;
  // Solo cuenta como catálogo si trae bastante más que lo pedido: el
  // formulario de Finocam lleva la tarifa entera; una propuesta corta no.
  if (n < 50) return;
  // Manda lo más reciente: una propuesta con la tarifa completa sustituye a la
  // tarifa subida antes en «Datos» (los proveedores cambian de tarifa a menudo).
  const ajuste = (E.catalogos[prov(proveedor)] || {}).ajuste;
  E.catalogos[prov(proveedor)] = Object.assign({ fecha: hoy(), archivo, items: catalogo }, ajuste ? { ajuste } : {});
}
/** Pone la propuesta del proveedor en el pedido. Si ya tenía una, la nueva la
 *  sustituye: se mantienen las decisiones de lo que no cambia y se quitan las
 *  demás (hay que volver a decidirlas). Devuelve un texto para avisar, o ''. */
function asignarPropuesta(p, archivo, prop) {
  let aviso = '';
  if (p.propuesta) {
    const r = CP.decisionesQueSiguen(p.propuesta.lineas, prop.lineas, p.decisiones);
    p.decisiones = r.decisiones;
    aviso = `sustituye a ${p.propuesta.archivo}` + (r.quitadas.length ? `; ${r.quitadas.length} decisión(es) a revisar de nuevo` : '') + (p.validado ? '; hay que volver a validar' : '');
  }
  p.propuesta = { archivo, fecha: hoy(), cabecera: prop.cabecera, lineas: prop.lineas, control: prop.control || null };
  guardarCatalogo(p.proveedor, archivo, prop.catalogo);
  invalidar(p);
  return aviso;
}
async function cargarPropuestaEn(id, file) {
  if (!file) return;
  const p = pedidoPorId(id);
  try {
    const prop = await leerFicheroProveedor(file, 'progresoProp', p.numero);
    const n = prop.cabecera.numeroPedido;
    if (n != null && String(n) !== String(p.numero).replace(/\D/g, '') &&
        !confirm(`El Excel dice «${prop.cabecera.observaciones}» y este es el pedido nº ${p.numero}. ¿Cargarlo aquí igualmente?`)) return;
    if (p.propuesta && !confirm(`Este pedido ya tiene la propuesta ${p.propuesta.archivo}. ¿Sustituirla por ${file.name}?\nLas decisiones de lo que no cambia se mantienen; lo que cambie hay que volver a decidirlo.`)) return;
    const aviso = asignarPropuesta(p, file.name, prop);
    guardar(); pintar();
    if (aviso) alert(`Propuesta nueva cargada (${aviso}).`);
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
/** Documentos del proveedor leídos pero sin pedido claro: se quedan aquí
 *  (solo en memoria) hasta que el usuario elige a qué pedido van. */
let sinAsignar = [];
let ultimaCarga = [];

/** Pedido al que va una propuesta/factura: por nº y, si no, por el cliente
 *  que aparezca en Observaciones / «su pedido». Solo si hay uno claro. */
function pedidoParaPropuesta(prop) { return pedidoParaDocumento(prop, (p) => !p.validado); }
function pedidoParaDocumento(prop, filtro) {
  const n = prop.cabecera.numeroPedido;
  const abiertos = E.pedidos.filter(filtro);
  let c = abiertos.filter((p) => n != null && String(p.numero).replace(/\D/g, '') === String(n));
  if (c.length !== 1) {
    const obs = claveCliente(prop.cabecera.observaciones);
    const porCliente = abiertos.filter((p) => claveCliente(p.cliente).length >= 4 && obs.includes(claveCliente(p.cliente)));
    if (porCliente.length === 1) c = porCliente;
  }
  if (c.length !== 1) {
    // Nuestro nº de pedido citado en el documento («95109 · Informe de validación de pedido»).
    const texto = ` ${prop.cabecera.numero || ''} ${prop.cabecera.observaciones || ''} ${prop.cabecera.pedidoCliente || ''} `;
    const porNum = abiertos.filter((p) => { const d = String(p.numero || '').replace(/\D/g, ''); return d.length >= 4 && new RegExp(`(^|\\D)${d}(\\D|$)`).test(texto); });
    if (porNum.length === 1) c = porNum;
  }
  return c.length === 1 ? c[0] : null;
}

/** Importe de un documento leído: suma de sus líneas (importe del proveedor
 *  o, si no lo trae, precio neto × cantidad). */
function importeDoc(prop) {
  return CP.red2((prop.lineas || []).reduce((t, l) => {
    const imp = CP.parseNum(l.importe);
    if (imp != null) return t + imp;
    const neto = CP.precioNeto(l);
    return t + (neto != null ? neto * (CP.parseNum(l.cant) || 0) : 0);
  }, 0));
}
const textoParecido = (x) => `${x.comunes} de ${x.deDoc} referencias coinciden`;

/** «0001771692.PDF · Pedido 5_ B2F» para cada parte de una factura agrupada. */
const nombrePorPedido = (nombre, prop, n) => (n > 1 ? `${nombre} · ${(prop.cabecera.observaciones || '').split(' · ')[0] || 'sin pedido'}` : nombre);
async function cargarPropuestasVarias(files, clave) {
  const enCampana = (q) => !clave || claveGrupo(q) === clave;
  // Copia antes del primer await: el onchange hace this.value='' justo después
  // de llamar, y eso vacía la FileList original (solo se procesaba el primero).
  const lista = [...files];
  ultimaCarga = [];
  const progreso = (t) => { const c = document.getElementById('progresoProps'); if (c) c.textContent = t; };
  // 1) Leer todos.
  const leidos = [];
  const agrupadas = [];
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    progreso(`Leyendo ${i + 1} de ${lista.length}: ${f.name}${esPdf(f) || esImagen(f) ? ' (PDF/foto: hasta un minuto)' : ''}…`);
    try {
      const docs = await leerDocumentosProveedor(f);
      // Factura agrupada de varios pedidos: sus «Pedido N» no siempre son los
      // nuestros (los «B2F» de Miquelrius), así que se reparte por referencias.
      if (docs.length > 1 && clave) { agrupadas.push({ archivo: f.name, prop: { cabecera: docs[0].cabecera, lineas: docs.flatMap((d) => d.lineas), catalogo: {} } }); continue; }
      for (const prop of docs) leidos.push({ id: nuevoId(), archivo: nombrePorPedido(f.name, prop, docs.length), prop });
    } catch (err) {
      if (err.sinSaldo) { ultimaCarga.push({ ok: false, texto: MSG_SIN_SALDO }); break; }
      ultimaCarga.push({ ok: false, texto: `${f.name}: ${err.message}` });
    }
  }
  progreso('Emparejando cada documento con su pedido…');
  const usados = new Set();
  const asignar = (x, p, como) => {
    if (!p.numero && x.prop.cabecera.numeroPedido != null) p.numero = String(x.prop.cabecera.numeroPedido);
    const sustituye = asignarPropuesta(p, x.archivo, x.prop);
    usados.add(p.id);
    const aviso = (sustituye ? ` — 🔁 ${sustituye}` : '') + (x.prop.control && x.prop.control.cuadra === false ? ' — ⚠️ no cuadra con su base imponible, revísalo' : '');
    ultimaCarga.push({ ok: true, importe: importeDoc(x.prop), texto: `${x.archivo} → nº ${p.numero || '—'} ${p.cliente || ''} · ${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${como ? ` (${como})` : ''}${aviso}` });
  };
  // 2) Por nº de pedido o cliente que traiga el documento.
  const resto = [];
  for (const x of leidos) {
    const p = pedidoParaDocumento(x.prop, (q) => !q.validado && enCampana(q) && !usados.has(q.id));
    if (p) asignar(x, p, ''); else resto.push(x);
  }
  // Una reposición con un solo pedido abierto: el documento es suyo.
  const grupoRepo = clave && E.pedidos.some((q) => claveGrupo(q) === clave && esRepo(q));
  if (grupoRepo && resto.length === 1) {
    const abiertos = E.pedidos.filter((q) => !q.validado && !q.archivado && enCampana(q) && !usados.has(q.id));
    if (abiertos.length === 1) asignar(resto.pop(), abiertos[0], 'el único pedido de esta reposición');
  }
  // 3) Los que no: por las referencias que coinciden con pedidos sin propuesta
  //    (también los que quedaron pendientes de otra carga).
  const pendientesAntes = sinAsignar.filter((y) => y.destino !== 'factura' && (y.clave || null) === (clave || null));
  const porContenido = resto.concat(pendientesAntes);
  if (porContenido.length) {
    const candidatos = E.pedidos.filter((q) => !q.validado && enCampana(q) && !q.propuesta && q.lineas.length && !usados.has(q.id));
    const rep = CP.repartirPorContenido(porContenido.map((x) => ({ id: x.id, lineas: x.prop.lineas })), candidatos);
    const asignadosIds = new Set();
    for (const a of rep.asignados) {
      const x = porContenido.find((y) => y.id === a.docId);
      asignar(x, pedidoPorId(a.pedidoId), 'por contenido: ' + textoParecido(a));
      asignadosIds.add(x.id);
    }
    sinAsignar = sinAsignar.filter((y) => !asignadosIds.has(y.id));
    for (const x of resto) {
      if (asignadosIds.has(x.id)) continue;
      sinAsignar.push(Object.assign(x, { clave: clave || null, sugerencia: rep.sugerencias[x.id] || null }));
    }
    for (const y of sinAsignar) if (!asignadosIds.has(y.id) && rep.sugerencias[y.id]) y.sugerencia = rep.sugerencias[y.id];
  }
  if (agrupadas.length) {
    ultimaCarga.push({ ok: true, texto: `${agrupadas.map((x) => x.archivo).join(', ')}: factura de varios pedidos juntos → repartida por referencias:` });
    aplicarReparto(agrupadas, clave);
  }
  // 4) Sumatorio de la carga.
  const okk = ultimaCarga.filter((x) => x.ok);
  if (leidos.length > 1) {
    ultimaCarga.push({ ok: true, texto: `Total: ${leidos.length} documento(s) leídos · ${leidos.reduce((t, x) => t + x.prop.lineas.length, 0)} líneas · ${fmt(CP.red2(leidos.reduce((t, x) => t + importeDoc(x.prop), 0)))} € · ${okk.length} asignado(s) a su pedido${sinAsignar.length ? ` · ${sinAsignar.length} por confirmar abajo` : ''}` });
  }
  progreso('');
  guardar(); pintar();
  const caja = document.getElementById('avisoCarga'); if (caja) caja.scrollIntoView({ block: 'start' });
}

/** Factura o propuesta de toda la campaña junta (el proveedor no la separa por
 *  cliente): se reparte por referencias entre los pedidos sin validar de la
 *  campaña (`repartirPorReferencias`). Lo que no pidió ningún cliente, o lo que
 *  viene de más, va a un pedido aparte «SIN CLIENTE», donde sale en «Sobran»
 *  para decidir (aceptarlo para la tienda o reclamarlo). Las facturas se suben
 *  según llegan: cada una se suma a lo ya repartido (lo que ya le llegó a un
 *  pedido no se le vuelve a dar) y volver a subir la misma la sustituye
 *  (cada línea repartida guarda su `origen`). */
const CLIENTE_SOBRANTES = 'SIN CLIENTE · LO QUE SOBRA DE LA FACTURA';
async function repartirFacturaCampana(files, clave) {
  const lista = [...files];
  if (!lista.length) return;
  const pedidos = E.pedidos.filter((q) => !q.archivado && !esRepo(q) && claveGrupo(q) === clave);
  const destino = pedidos.filter((q) => !q.validado && !q.sobrantes);
  if (!destino.length) { alert('No hay pedidos sin validar en esta campaña.'); return; }
  if (!confirm(`Se repartirán ${lista.length} documento(s) entre los ${destino.length} pedidos sin validar de esta campaña, por referencias.\n\nSi el proveedor sirve en varias veces, sube cada factura cuando llegue: se suma a lo ya repartido. Volver a subir la misma factura la sustituye.`)) return;
  ultimaCarga = [];
  const progreso = (t) => { const c = document.getElementById('progresoProps'); if (c) c.textContent = t; };
  const docs = [];
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    progreso(`Leyendo ${i + 1} de ${lista.length}: ${f.name}${esPdf(f) || esImagen(f) ? ' (PDF/foto: uno o dos minutos; no salgas de la app)' : ''}…`);
    try { docs.push({ archivo: f.name, prop: await leerFicheroProveedor(f) }); }
    catch (err) {
      ultimaCarga.push({ ok: false, texto: `${f.name}: ${err.message}` });
      if (err.sinSaldo) break;
    }
  }
  progreso('');
  if (!docs.length) { pintar(); return; }
  aplicarReparto(docs, clave);
}
/** Reparte por referencias documentos ya leídos ({archivo, prop}) entre los
 *  pedidos sin validar de la campaña. Añade el resultado a `ultimaCarga`. */
function aplicarReparto(docs, clave) {
  const pedidos = E.pedidos.filter((q) => !q.archivado && !esRepo(q) && claveGrupo(q) === clave);
  const destino = pedidos.filter((q) => !q.validado && !q.sobrantes);
  if (!destino.length) { ultimaCarga.push({ ok: false, texto: 'No hay pedidos sin validar en esta campaña para repartir la factura.' }); pintar(); return; }
  // `subida` + `pos`: el orden de cada línea en la factura (el Excel de Géminis sale en ese orden).
  const subida = Date.now();
  let pos = 0;
  const lineas = docs.flatMap((d) => d.prop.lineas.map((l) => Object.assign({}, l, { origen: d.archivo, subida, pos: pos++ }, l.fra || !(d.prop.cabecera || {}).numero ? {} : { fra: d.prop.cabecera.numero })));
  const cab = Object.assign({}, docs[0].prop.cabecera, { numeroPedido: null, observaciones: `Repartida por referencias entre los pedidos de la campaña (${docs.map((d) => d.archivo).join(', ')})` });
  const nombres = docs.map((d) => d.archivo);
  // Lo que ya le llegó a cada pedido con otras facturas repartidas antes (no
  // con las que se suben ahora, que se sustituyen).
  const previas = (q) => (q.propuesta && q.propuesta.reparto ? q.propuesta.lineas.filter((l) => !nombres.includes(l.origen)) : []);
  const r = CP.repartirPorReferencias(lineas, destino.map((q) => ({ id: q.id, numero: q.numero, cliente: q.cliente,
    lineas: q.lineas.concat(previas(q).map((l) => ({ ref: l.ref, cant: -(CP.parseNum(l.cant) || 0) }))) })),
  { todos: pedidos.filter((q) => !q.sobrantes).map((q) => ({ id: q.id, numero: q.numero, cliente: q.cliente, lineas: q.lineas })) });
  // También lo que se asignó antes por los «Pedido N» de una factura agrupada
  // («factura.PDF · Pedido 9_ B2F»): con el reparto, ya no vale.
  const deEsteReparto = (q) => q.propuesta && (q.propuesta.reparto || / · Pedido /i.test(String(q.propuesta.archivo || '')) || nombres.some((n) => String(q.propuesta.archivo || '').startsWith(n)));
  const archivoDe = (ls) => 'Reparto: ' + [...new Set(ls.map((l) => l.origen).filter(Boolean))].join(' + ');
  const prop = (ls) => ({ cabecera: cab, lineas: ls, catalogo: {}, control: null });
  const porNumero = (x) => Number(String(x.numero).replace(/\D/g, '')) || 0;
  for (const q of destino.slice().sort((x, y) => porNumero(x) - porNumero(y))) {
    const nuevas = r.porPedido.get(q.id) || [];
    const antes = previas(q);
    if (nuevas.length) {
      const todas = antes.concat(nuevas);
      const aviso = asignarPropuesta(q, archivoDe(todas), prop(todas));
      q.propuesta.reparto = true;
      ultimaCarga.push({ ok: true, importe: importeDoc({ lineas: nuevas }), texto: `→ nº ${nPed(q.numero)} ${q.cliente || ''} · ${nuevas.length} líneas · ${fmt(importeDoc({ lineas: nuevas }))} €${antes.length ? ` (más ${antes.length} de facturas anteriores)` : ''}${aviso && !antes.length ? ` — 🔁 ${aviso}` : ''}` });
    } else if (deEsteReparto(q)) {
      // Lo que le tocó de estas facturas en un reparto anterior (o con la
      // asignación por «Pedido N») ya no es suyo; lo de otras facturas, sí.
      if (antes.length) asignarPropuesta(q, archivoDe(antes), prop(antes)), q.propuesta.reparto = true;
      else { q.propuesta = null; q.decisiones = {}; invalidar(q); }
    }
  }
  const ej = pedidos[0];
  // Lo que sobra puede ser un resto de un pedido anterior que llega ahora: se
  // le da a quien lo esperaba y sale de Restos. Antes se deshace lo rescatado
  // con estos mismos ficheros (volver a subir una factura la sustituye).
  for (const x of E.restos) {
    const fuera = x.asignaciones.filter((a) => a.reparto && nombres.includes(a.origen));
    if (!fuera.length) continue;
    x.pendiente += fuera.reduce((t, a) => t + a.cant, 0);
    x.asignaciones = x.asignaciones.filter((a) => !fuera.includes(a));
  }
  // Manda el bloque: si es de un pedido ya validado, sus líneas se suman a SU
  // propuesta y ese pedido se reabre para revalidarlo (sus restos se rehacen al
  // validar). Nunca van a otro pedido.
  for (const id of [...new Set(r.sobrantes.filter((l) => l.duenoId).map((l) => l.duenoId))]) {
    const q = pedidoPorId(id);
    const suyas = r.sobrantes.filter((l) => l.duenoId === id).map((l) => { const c = Object.assign({}, l); delete c.deBloque; delete c.duenoId; return c; });
    if (!q) continue;
    const antes = q.propuesta ? q.propuesta.lineas.filter((l) => !nombres.includes(l.origen)) : [];
    asignarPropuesta(q, archivoDe(antes.concat(suyas)), prop(antes.concat(suyas)));
    q.propuesta.reparto = true;
    invalidar(q);
    ultimaCarga.push({ ok: true, texto: `→ nº ${nPed(q.numero)} ${q.cliente} (estaba validado) · +${suyas.length} líneas de su bloque «${suyas[0].bloque}»: revísalo y vuelve a validarlo` });
  }
  r.sobrantes = r.sobrantes.filter((l) => !l.duenoId);
  // Lo que no viene por bloques puede rescatar restos de cualquiera (el más antiguo primero); un bloque sin dueño va entero a «sin cliente».
  const rescate = CP.restosQueLlegan(E.restos, r.sobrantes.filter((l) => !l.deBloque), ej.proveedor);
  rescate.sobrantes.push(...r.sobrantes.filter((l) => l.deBloque));
  for (const a of rescate.asignaciones) {
    const x = E.restos.find((y) => y.id === a.restoId);
    x.asignaciones.push({ fecha: hoy(), cant: a.cant, origen: a.origen, reparto: true });
    x.pendiente -= a.cant;
  }
  r.sobrantes = rescate.sobrantes;
  if (rescate.asignaciones.length) ultimaCarga.push({ ok: true, texto: `♻️ Llegan ${rescate.asignaciones.length} resto(s) pendiente(s) de pedidos anteriores (salen de Restos): ` + rescate.asignaciones.map((a) => `nº ${nPed(a.numero)} ${a.cliente} ${a.ref} × ${a.cant}`).join(' · ') });
  // Lo que no pidió ningún cliente: a su pedido aparte de la campaña.
  let sob = pedidos.find((q) => q.sobrantes);
  if (r.sobrantes.length) {
    if (!sob) {
      sob = { id: nuevoId(), tipo: 'comercial', proveedor: ej.proveedor, campana: ej.campana, numero: siguienteNumero(ej.proveedor, ej.campana), cliente: CLIENTE_SOBRANTES,
        fecha: hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null, sobrantes: true };
      E.pedidos.push(sob);
    }
    if (!sob.validado) { const todas = previas(sob).concat(r.sobrantes); asignarPropuesta(sob, archivoDe(todas), prop(todas)); sob.propuesta.reparto = true; }
    ultimaCarga.push({ ok: true, texto: `→ nº ${nPed(sob.numero)} ${CLIENTE_SOBRANTES} · ${r.sobrantes.length} líneas · ${fmt(importeDoc({ lineas: r.sobrantes }))} € (no las pidió ningún cliente o vienen de más: decide en ese pedido si se quedan para la tienda o se reclaman)` });
  } else if (sob && !sob.validado && sob.propuesta && sob.propuesta.reparto) {
    const antes = previas(sob);
    if (antes.length) { asignarPropuesta(sob, archivoDe(antes), prop(antes)); sob.propuesta.reparto = true; } else { sob.propuesta = null; sob.decisiones = {}; invalidar(sob); }
  }
  const sinNada = destino.filter((q) => !r.porPedido.has(q.id)).length;
  ultimaCarga.push({ ok: true, texto: `Total: ${docs.length} documento(s) · ${lineas.length} líneas · ${fmt(CP.red2(lineas.reduce((t, l) => t + (l.importe || 0), 0)))} € · repartido entre ${r.porPedido.size} pedido(s)${sinNada ? ` · ${sinNada} pedido(s) sin nada en esta factura` : ''}` });
  guardar(); pintar();
  const caja = document.getElementById('avisoCarga'); if (caja) caja.scrollIntoView({ block: 'start' });
}

function vistaSinAsignar() {
  const ok = ultimaCarga.filter((x) => x.ok), mal = ultimaCarga.filter((x) => !x.ok);
  // Una factura final también puede ir a un pedido sin validar (una reposición

  const opcionesDe = (x) => (x.destino === 'factura'
    ? E.pedidos.filter((p) => !p.archivado && claveGrupo(p) === x.clave).sort((a, b) => Number(Boolean(b.validado)) - Number(Boolean(a.validado)))
    : E.pedidos.filter((p) => !p.validado && (!x.clave || claveGrupo(p) === x.clave)).sort((a, b) => Number(Boolean(a.propuesta)) - Number(Boolean(b.propuesta))))
    .map((p) => `<option value="${p.id}">${esRepo(p) ? 'Repo.' : 'Nº'} ${h(p.numero || '—')} ${h(p.cliente || p.proveedor)}${x.destino === 'factura' ? (p.factura ? ' (ya tiene factura)' : '') : p.propuesta ? ' (ya tiene propuesta)' : ''}</option>`).join('');

      ${sinAsignar.map((x) => `<div class="fila" style="margin-top:8px;align-items:center">
        <span style="flex:1 1 200px">${x.destino === 'factura' ? '<span class="chip info">Factura final</span> ' : ''}<b>${h(x.archivo)}</b>${x.prop.cabecera.observaciones ? `<div class="pequeno">${h(x.prop.cabecera.observaciones)}</div>` : ''}<div class="pequeno">${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${x.sugerencia ? ` · parecido a nº ${h((pedidoPorId(x.sugerencia.pedidoId) || {}).numero || '—')}: ${textoParecido(x.sugerencia)}` : ''}</div></span>
        <select id="asig-${x.id}" style="flex:1 1 160px"><option value="">— elegir pedido —</option>${opcionesDe(x).replace(x.sugerencia ? `value="${x.sugerencia.pedidoId}"` : '\u0000', `value="${x.sugerencia ? x.sugerencia.pedidoId : ''}" selected`)}</select>
        <button class="btn peque" onclick="asignarManual('${x.id}')">Asignar</button>
        <button class="btn peque peligro" onclick="descartarSinAsignar('${x.id}')">✕</button></div>`).join('')}
      <div class="fila" style="margin-top:10px"><button class="btn primario" onclick="asignarTodasElegidas()">Asignar todas las elegidas</button></div></div>` : '');
}
function asignarManual(id) {
  const x = sinAsignar.find((y) => y.id === id);
  const pid = document.getElementById('asig-' + id).value;
  if (!x || !pid) { alert('Elige el pedido.'); return; }
  const p = pedidoPorId(pid);
  let extra = '';
  if (x.destino === 'factura' && p.validado) {
    if (p.factura && !confirm(`El pedido nº ${p.numero} ya tiene factura (${p.factura.archivo}). ¿Sustituirla?`)) return;
    asignarFactura(p, x.archivo, x.prop);
  } else {
    if (p.propuesta && !confirm(`El pedido nº ${p.numero} ya tiene propuesta (${p.propuesta.archivo}). ¿Sustituirla?`)) return;
    extra = asignarPropuesta(p, x.archivo, x.prop);
  }
  sinAsignar = sinAsignar.filter((y) => y.id !== id);
  ultimaCarga.push({ ok: true, texto: `${x.archivo} → nº ${p.numero} ${p.cliente || ''}${extra ? ` — 🔁 ${extra}` : ''}` });
  guardar(); pintar();
}
function asignarTodasElegidas() {
  const elegidas = sinAsignar.filter((x) => (document.getElementById('asig-' + x.id) || {}).value);
  if (!elegidas.length) { alert('Elige el pedido de al menos uno.'); return; }
  const ids = elegidas.map((x) => document.getElementById('asig-' + x.id).value);
  if (new Set(ids).size !== ids.length && !confirm('Has elegido el mismo pedido para dos documentos: el segundo sustituirá al primero. ¿Seguir?')) return;
  for (const x of elegidas) {
    const p = pedidoPorId(document.getElementById('asig-' + x.id).value);
    const extra = x.destino === 'factura' && p.validado ? (asignarFactura(p, x.archivo, x.prop), '') : asignarPropuesta(p, x.archivo, x.prop);
    ultimaCarga.push({ ok: true, texto: `${x.archivo} → nº ${p.numero || '—'} ${p.cliente || ''} · ${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${extra ? ` — 🔁 ${extra}` : ''}` });
  }
  const hechos = new Set(elegidas.map((x) => x.id));
  sinAsignar = sinAsignar.filter((x) => !hechos.has(x.id));
  guardar(); pintar();
}
function descartarSinAsignar(id) { sinAsignar = sinAsignar.filter((y) => y.id !== id); pintar(); }

// ── Último control: la factura final del proveedor ───────────────────────────
// Se compara con lo VALIDADO (no con la propuesta): pasa que se confirma una
// propuesta y luego facturan otra cosa porque en ese momento algo se agotó.
function revisarFactura(p) {
  if (!p.factura || !p.final) return null;
  return CP.controlFactura(p.final.lineas, p.factura.lineas, { dtoValidado: p.final.dto, dtoFactura: (p.factura.cabecera || {}).dtoGlobal, sustituciones: p.factura.sustituciones });
}
function chipFactura(p) {
  const r = revisarFactura(p);
  if (!r) return '';
  if (r.cuadra) return ' <span class="chip ok">Factura ✓</span>';
  const partes = [];
  if (r.faltan.length) partes.push(r.faltan.length + ' no vienen');
  if (r.sobran.length) partes.push(r.sobran.length + ' de más');
  if (r.precios.length) partes.push(r.precios.length + ' precio');
  return ` <span class="chip mal">Factura: ${partes.join(' · ')}</span>`;
}
function vistaFacturaFinal(p) {
  if (!p.validado || !p.final) {
    return p.propuesta ? `<div class="tarjeta"><h2>4 · Factura final del proveedor</h2><div class="vacio">Cuando valides el pedido podrás subir aquí la factura final para el último control.</div></div>` : '';
  }
  const r = revisarFactura(p);
  const lista = (xs, f) => `<ul style="margin:6px 0 0;padding-left:18px">${xs.map(f).join('')}</ul>`;
  return `
  <div class="tarjeta">
    <h2>4 · Factura final del proveedor <span class="pequeno">(último control${esRepo(p) ? ', opcional' : ''})</span></h2>
    
    <div class="fila no-imprimir">
      <label>Factura final (PDF, Excel o foto)<input type="file" onchange="cargarFacturaEn('${p.id}', this.files[0]); this.value=''"></label>
    </div>
    <div id="progresoFactura" class="progreso"></div>
    ${!p.factura ? '<div class="vacio">Sin factura todavía.</div>' : `
    <div class="resumen"><span class="chip info">${h(p.factura.archivo)}</span><span class="chip gris">${p.factura.lineas.length} líneas</span></div>
    ${p.factura.control ? avisoControl(p.factura) : ''}
    ${r.cuadra ? `<div class="aviso-caja ok"><b>✅ La factura cuadra con lo validado:</b> están todas las referencias, en la misma cantidad y al mismo precio.</div>
    ${r.cambiosRef && r.cambiosRef.length ? `<div class="aviso-caja info"><b>🔁 Facturado con otra referencia (${r.cambiosRef.length})</b>${lista(r.cambiosRef, (x) => `<li><b>${h(x.ref)}</b> → <b>${h(x.refFactura)}</b> ${h(x.desc)} — ${x.cant} ud.${x.manual ? ` <button class="btn peque no-imprimir" onclick="sustituir('${p.id}', ${js(x.ref)}, '')">deshacer</button>` : ''}</li>`)}</div>` : ''}` : `
    <div class="aviso-caja ${r.faltan.length ? 'mal' : 'ok'}"><b>${r.faltan.length ? `❌ No vienen en la factura ${r.faltan.length} referencia(s)` : '✅ No falta nada de lo validado'}</b>
      ${r.faltan.length ? lista(r.faltan, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — faltan ${x.cant}${x.total ? '' : ` de ${x.de}`} ud.${r.sobran.length ? ` <select class="no-imprimir" onchange="sustituir('${p.id}', ${js(x.ref)}, this.value)"><option value="">¿Lo sustituye algo facturado de más?</option>${r.sobran.map((y) => `<option value="${h(y.ref)}">${h(y.ref)} ${h(y.desc)} (+${y.cant})</option>`).join('')}</select>` : ''}</li>`) : ''}</div>
    ${r.sobran.length ? `<div class="aviso-caja aviso"><b>⚠️ Facturado sin estar en lo validado (${r.sobran.length})</b>${lista(r.sobran, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — +${x.cant} ud.</li>`)}</div>` : ''}
    ${r.cambiosRef && r.cambiosRef.length ? `<div class="aviso-caja info"><b>🔁 Facturado con otra referencia (${r.cambiosRef.length})</b> — no falta ni sobra${lista(r.cambiosRef, (x) => `<li><b>${h(x.ref)}</b> → <b>${h(x.refFactura)}</b> ${h(x.desc)} — ${x.cant} ud.${x.manual ? ` <button class="btn peque no-imprimir" onclick="sustituir('${p.id}', ${js(x.ref)}, '')">deshacer</button>` : ''}</li>`)}</div>` : ''}
    ${r.precios.length ? `<div class="aviso-caja aviso"><b>Precio neto distinto al validado (${r.precios.length})</b>${lista(r.precios, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — validado ${fmt(x.validado)} → facturado ${fmt(x.facturado)}</li>`)}</div>` : ''}
    ${r.faltan.length ? `<p class="pequeno">${esRepo(p) ? 'Lo que no viene en la factura no entra en el Excel de Géminis: reclámalo al proveedor si hace falta.' : 'La factura manda: lo que no viene <b>pasa a Restos del cliente</b> (como si no hubiera stock), no sale en su guía de facturación ni en el Excel de Géminis.'}</p>` : ''}`}`}
  </div>`;
}
/** Factura(s) final(es) de toda la campaña junta: cada línea va al pedido
 *  validado que la pidió (`repartirPorReferencias` contra lo validado); lo que
 *  no pidió nadie o viene de más va al pedido con el que más comparte ese PDF,
 *  para que salga como «de más» y no se pierda del Excel de Géminis. Se acumula
 *  factura a factura (cada línea guarda su `origen`; subir la misma sustituye). */
function repartirFacturas(docs, clave) {
  const pedidos = E.pedidos.filter((q) => !q.archivado && claveGrupo(q) === clave && q.validado && q.final);
  if (!pedidos.length) { ultimaCarga.push({ ok: false, texto: 'No hay pedidos validados en esta campaña para repartir la factura.' }); return; }
  const nombres = docs.map((d) => d.archivo);
  // `subida` + `pos`: el orden de cada línea en la factura (el Excel de Géminis sale en ese orden).
  const subida = Date.now();
  let pos = 0;
  const lineas = docs.flatMap((d) => d.prop.lineas.map((l) => Object.assign({}, l, { origen: d.archivo, subida, pos: pos++ }, l.fra || !(d.prop.cabecera || {}).numero ? {} : { fra: d.prop.cabecera.numero })));
  const dtoGlobal = docs.map((d) => d.prop.cabecera.dtoGlobal).find((x) => x) || null;
  const cab = Object.assign({}, docs[0].prop.cabecera, { numeroPedido: null, dtoGlobal,
    observaciones: `Factura repartida por referencias entre los pedidos validados (${nombres.join(', ')})` });
  const previas = (q) => (q.factura && q.factura.reparto ? q.factura.lineas.filter((l) => !nombres.includes(l.origen)) : []);
  const r = CP.repartirPorReferencias(lineas, pedidos.map((q) => ({ id: q.id, numero: q.numero, cliente: q.cliente,
    lineas: q.final.lineas.concat(previas(q).map((l) => ({ ref: l.ref, cant: -(CP.parseNum(l.cant) || 0) }))) })),
    { todos: E.pedidos.filter((q) => !q.archivado && claveGrupo(q) === clave && !q.sobrantes).map((q) => ({ id: q.id, numero: q.numero, cliente: q.cliente, lineas: (q.final && q.final.lineas) || q.lineas })) });
  // Lo que pidió un pedido se queda en ese pedido aunque solo le lleguen unas
  // líneas sueltas: lo demás queda pendiente en sus Restos hasta la siguiente
  // factura. Antes esas líneas se le daban a otro cliente como «sin pedir»
  // (Finocam FV2605151: 2 calendarios de TANIA acababan en PAPELES).
  // Un bloque de factura que no es de ningún pedido abierto no se reparte entre otros (regla del propietario).
  if (r.bloquesSinDueno.length || r.sobrantes.some((l) => l.deBloque)) ultimaCarga.push({ ok: false, texto: `Bloques de la factura sin pedido en esta campaña (no se reparten entre otros): ${[...new Set(r.sobrantes.filter((l) => l.deBloque).map((l) => l.bloque))].join(', ')}` });
  // Lo sobrante va al pedido de su albarán, como lo haría una persona: el que
  // se queda el resto de esa misma línea o la línea de justo encima en el PDF
  // (Finocam FV2605761: 2 calendarios de más de TANIA y el expositor vacío de
  // su albarán acababan en ALDAYO). Sin eso, al que más líneas recibe del PDF.
  const duenoDePos = new Map();
  for (const [id, ls] of r.porPedido) for (const x of ls) if (x.pos != null) duenoDePos.set(x.origen + '|' + x.pos, id);
  const vecino = (l) => {
    if (l.pos == null) return null;
    for (let p = l.pos; p >= 0; p--) { const id = duenoDePos.get(l.origen + '|' + p); if (id) return id; }
    return null;
  };
  for (const l of r.sobrantes.filter((x) => !x.deBloque)) {
    const id = vecino(l);
    if (id && r.porPedido.has(id)) { r.porPedido.get(id).push(Object.assign({}, l, { deMas: true })); continue; }
    const cuenta = new Map();
    for (const [id, ls] of r.porPedido) cuenta.set(id, ls.filter((x) => x.origen === l.origen).length);
    const destino = [...cuenta].sort((a, b) => b[1] - a[1])[0];
    if (!destino) continue;
    r.porPedido.get(destino[0]).push(Object.assign({}, l, { deMas: true }));
  }
  const archivoDe = (ls) => 'Reparto: ' + [...new Set(ls.map((l) => l.origen).filter(Boolean))].join(' + ');
  const porNumero = (x) => Number(String(x.numero).replace(/\D/g, '')) || 0;
  let nDeMas = 0;
  for (const q of pedidos.slice().sort((a, b) => porNumero(a) - porNumero(b))) {
    const nuevas = r.porPedido.get(q.id) || [];
    const antes = previas(q);
    const deEste = q.factura && (q.factura.reparto || nombres.some((n) => String(q.factura.archivo || '').startsWith(n)));
    if (!nuevas.length && !deEste) continue;
    const todas = antes.concat(nuevas);
    if (!todas.length) { q.factura = null; restosPorFactura(q); continue; }
    asignarFactura(q, archivoDe(todas), { cabecera: cab, lineas: todas, control: null });
    q.factura.reparto = true;
    const rv = revisarFactura(q);
    const dm = nuevas.filter((l) => l.deMas).length; nDeMas += dm;
    if (nuevas.length) ultimaCarga.push({ ok: true, texto: `→ nº ${nPed(q.numero)} ${q.cliente || ''} · ${nuevas.length} líneas · ${fmt(importeDoc({ lineas: nuevas }))} €${rv && rv.cuadra ? ' — ✅ cuadra' : rv && rv.faltan.length ? ` — ❌ no vienen ${rv.faltan.length}` : ' — ⚠️ revisar'}${dm ? ` (${dm} sin pedir)` : ''}` });
  }
  ultimaCarga.push({ ok: true, texto: `Total: ${docs.length} documento(s) · ${lineas.length} líneas · ${fmt(CP.red2(lineas.reduce((t, l) => t + (CP.parseNum(l.importe) || 0), 0)))} € · repartido entre ${r.porPedido.size} pedido(s)${nDeMas ? ` · ${nDeMas} línea(s) que no pidió nadie, en el pedido de su albarán` : ''}${dtoGlobal ? ` · dto. global ${dtoGlobal} %` : ''}` });
}
/** El usuario decide que lo facturado de más sustituye a lo que no viene. */
function sustituir(id, refValidada, refFactura) {
  const p = pedidoPorId(id);
  if (!p || !p.factura) return;
  const s = p.factura.sustituciones = Object.assign({}, p.factura.sustituciones);
  if (refFactura) s[refValidada] = refFactura; else delete s[refValidada];
  restosPorFactura(p);
  guardar(); pintar();
}
function asignarFactura(p, archivo, doc) {
  // Cada línea recuerda su sitio en la factura (si no lo trae ya de un reparto).
  const subida = Date.now();
  const fra = (doc.cabecera || {}).numero || '';
  const lineas = (doc.lineas || []).map((l, i) => Object.assign({}, l, { origen: l.origen || archivo, subida: l.subida != null ? l.subida : subida, pos: l.pos != null ? l.pos : i },
    // El nº de esta factura solo a sus propias líneas: las de facturas subidas antes (otro `origen`) no.
    l.fra || !fra || (l.origen && l.origen !== archivo) ? {} : { fra }));
  p.factura = { archivo, fecha: hoy(), cabecera: doc.cabecera || {}, lineas, control: doc.control || null };
  restosPorFactura(p);
}
/** La factura final manda: lo validado que no viene en ella pasa a Restos del
 *  cliente (solo pedidos del comercial; la reposición nunca va a Restos). Se
 *  regenera cada vez; los que ya tienen llegadas registradas no se tocan. */
function restosPorFactura(p) {
  if (esRepo(p)) return;
  const conLlegadas = E.restos.filter((x) => x.pedidoId === p.id && x.deFactura && x.asignaciones.length);
  E.restos = E.restos.filter((x) => x.pedidoId !== p.id || !x.deFactura || x.asignaciones.length);
  if (!p.factura || !p.final) return;
  const opc = { dtoValidado: p.final.dto, dtoFactura: (p.factura.cabecera || {}).dtoGlobal, sustituciones: p.factura.sustituciones };
  for (const x of CP.restosDeFactura(p.final.lineas, p.factura.lineas, opc)) {
    if (conLlegadas.some((c) => CP.claveRef(c.ref) === CP.claveRef(x.ref))) continue;
    E.restos.push({ id: nuevoId(), pedidoId: p.id, proveedor: p.proveedor, cliente: p.cliente, numero: p.numero, ref: x.ref, desc: x.desc, ean: x.ean,
      precio: x.precio, cant: x.cant, pendiente: x.cant, fecha: p.fecha, asignaciones: [], anulado: false, deFactura: true });
  }
}
async function cargarFacturaEn(id, file) {
  if (!file) return;
  const p = pedidoPorId(id);
  try {
    const doc = await leerFicheroProveedor(file, 'progresoFactura', p.numero);
    const n = doc.cabecera.numeroPedido;
    if (n != null && String(n) !== String(p.numero).replace(/\D/g, '') &&
        !confirm(`La factura parece del pedido ${n} y este es el nº ${p.numero}. ¿Cargarla aquí igualmente?`)) return;
    if (p.factura && !confirm(`Este pedido ya tiene factura (${p.factura.archivo}). ¿Sustituirla?`)) return;
    asignarFactura(p, file.name, doc);
    guardar(); pintar();
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
/** Varias facturas finales de una campaña a la vez: cada una a su pedido
 *  validado por nº o cliente; las que no casan se preguntan. */
async function cargarFacturasVarias(files, clave) {
  const lista = [...files];
  // Reposición sin ningún pedido validado: la factura hace de propuesta (se compara con nuestro pedido).
  const grupo = E.pedidos.filter((q) => claveGrupo(q) === clave && !q.archivado);
  if (grupo.length && grupo.every(esRepo) && !grupo.some((q) => q.validado)) return cargarPropuestasVarias(lista, clave);
  ultimaCarga = [];
  const progreso = (t) => { const c = document.getElementById('progresoProps'); if (c) c.textContent = t; };
  const leidos = [];
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    progreso(`Leyendo factura ${i + 1} de ${lista.length}: ${f.name}…`);
    try {
      const docs = await leerDocumentosProveedor(f);
      for (const prop of docs) leidos.push({ id: nuevoId(), archivo: nombrePorPedido(f.name, prop, docs.length), prop });
    }
    catch (err) {
      if (err.sinSaldo) { ultimaCarga.push({ ok: false, texto: MSG_SIN_SALDO }); break; }
      ultimaCarga.push({ ok: false, texto: `${f.name}: ${err.message}` });
    }
  }
  // En una campaña del comercial, la factura final que no trae nº de pedido
  // suele juntar los albaranes de varios clientes (Finocam: AV2604921…929, y
  // además partida en varios PDF): se reparte por referencias, sin preguntar.
  const ejemplo = E.pedidos.find((q) => claveGrupo(q) === clave);
  const sinNumero = ejemplo && !esRepo(ejemplo) ? leidos.filter((x) => x.prop.cabecera.numeroPedido == null) : [];
  if (sinNumero.length) {
    repartirFacturas(sinNumero, clave);
    progreso('');
    guardar(); pintar();
    const caja = document.getElementById('avisoCarga'); if (caja) caja.scrollIntoView({ block: 'start' });
    if (sinNumero.length === leidos.length) return;
    leidos.splice(0, leidos.length, ...leidos.filter((x) => !sinNumero.includes(x)));
  }
  const usados = new Set();
  const asignar = (x, p, como) => {
    asignarFactura(p, x.archivo, x.prop);
    usados.add(p.id);
    const r = revisarFactura(p);
    ultimaCarga.push({ ok: true, texto: `Factura ${x.archivo} → nº ${p.numero} ${p.cliente || ''} · ${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${como ? ` (${como})` : ''}${r && r.faltan.length ? ` — ❌ no vienen ${r.faltan.length} referencia(s)` : r && !r.cuadra ? ' — ⚠️ revisar diferencias' : ' — ✅ cuadra'}` });
  };
  // 1) por nº de pedido o cliente; 2) por las referencias que coinciden con lo validado
  const resto = [];
  for (const x of leidos) {
    const p = pedidoParaDocumento(x.prop, (q) => q.validado && claveGrupo(q) === clave && !usados.has(q.id));
    if (p) asignar(x, p, ''); else resto.push(x);
  }
  if (resto.length) {
    const candidatos = E.pedidos.filter((q) => q.validado && q.final && claveGrupo(q) === clave && !q.factura && !usados.has(q.id));
    const rep = CP.repartirPorContenido(resto.map((x) => ({ id: x.id, lineas: x.prop.lineas })), candidatos.map((q) => ({ id: q.id, lineas: q.final.lineas })));
    const hechos = new Set();
    for (const a of rep.asignados) { const x = resto.find((y) => y.id === a.docId); asignar(x, pedidoPorId(a.pedidoId), 'por contenido: ' + textoParecido(a)); hechos.add(x.id); }
    for (const x of resto) if (!hechos.has(x.id)) sinAsignar.push(Object.assign(x, { destino: 'factura', clave, sugerencia: rep.sugerencias[x.id] || null }));
  }
  if (leidos.length > 1) ultimaCarga.push({ ok: true, texto: `Total: ${leidos.length} factura(s) · ${leidos.reduce((t, x) => t + x.prop.lineas.length, 0)} líneas · ${fmt(CP.red2(leidos.reduce((t, x) => t + importeDoc(x.prop), 0)))} €` });
  progreso('');
  guardar(); pintar();
  const caja = document.getElementById('avisoCarga'); if (caja) caja.scrollIntoView({ block: 'start' });
}

// ── Validar: restos y notas ──────────────────────────────────────────────────
function validarPedido() {
  const p = pedidoActual();
  let r;
  try { r = CP.aplicarDecisiones(comparar(p), p.decisiones, { comercial: !esRepo(p) }); }
  catch (err) { alert(err.message); return; }

  // Los restos de este pedido que ya tienen llegadas registradas no se tocan;
  // el resto se regenera desde las decisiones actuales. (Una reposición no
  // genera restos: su lista llega siempre vacía.)
  const conLlegadas = E.restos.filter((x) => x.pedidoId === p.id && x.asignaciones.length);
  E.restos = E.restos.filter((x) => x.pedidoId !== p.id || x.asignaciones.length);
  for (const x of r.restos) {
    if (conLlegadas.some((c) => c.ref === x.ref)) continue;
    E.restos.push({ id: nuevoId(), pedidoId: p.id, proveedor: p.proveedor, cliente: p.cliente, numero: p.numero, ref: x.ref, desc: x.desc, ean: x.ean,
      precio: x.precio, cant: x.cant, pendiente: x.cant, fecha: p.fecha, asignaciones: [], anulado: false });
  }
  E.notas = E.notas.filter((n) => n.pedidoId !== p.id || n.resuelta);
  for (const n of r.notas) {
    E.notas.push({ id: nuevoId(), pedidoId: p.id, cliente: p.cliente, numero: p.numero, proveedor: p.proveedor, ref: n.ref, desc: n.desc, texto: n.texto, fecha: hoy(), resuelta: false });
  }
  p.final = { fecha: hoy(), lineas: r.lineas, dto: (p.propuesta.cabecera || {}).dtoGlobal };
  p.validado = true;
  restosPorFactura(p);
  if (esRepo(p)) {
    // Precio neto aceptado → historial del proveedor, para comparar los próximos.
    const hist = E.historial[p.proveedor] = E.historial[p.proveedor] || {};
    const global = (p.final.dto || 0) / 100;
    for (const l of r.lineas) {
      const neto = CP.precioNeto(l);
      if (neto != null) hist[CP.normRef(l.ref)] = { neto: CP.red2(neto * (1 - global)), fecha: p.fecha };
    }
  }
  guardar(); pintar();
  alert(esRepo(p)
    ? `Reposición validada: ${r.lineas.length} líneas, ${r.notas.length} notas. Precios netos guardados para la próxima comparación.`
    : `Pedido validado: ${r.lineas.length} líneas, ${r.restos.length} a restos, ${r.notas.length} notas de facturación.`);
}

function prepararLlegada(lineas) {
  const proveedor = document.getElementById('llProv').value;
  if (!proveedor) { alert('No hay restos pendientes de ningún proveedor.'); return; }
  const origen = document.getElementById('llOrigen').value.trim() || 'Llegada ' + fmtFecha(hoy());
  const abiertos = E.restos.filter((r) => !r.anulado);
  llegada = { proveedor, origen, lineas, propuesta: CP.sugerirAsignacion(abiertos, lineas, proveedor) };
  pintar();
}
async function llegadaDesdeExcel(file) {
  if (!file) return;
  try {
    const p = await leerFicheroProveedor(file, 'progresoLlegada');
    if (p.control && p.control.cuadra === false) alert(`Ojo: las líneas leídas de ${file.name} no cuadran con su base imponible. Revisa el reparto antes de confirmarlo.`);
    prepararLlegada(p.lineas.map((l) => ({ ref: l.ref, cant: l.cant })));
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
function llegadaDesdeTexto() {
  const lineas = [];
  for (const t of document.getElementById('llTexto').value.split(/\r?\n/)) {
    const m = t.trim().match(/^(\S+)\s+(\d+(?:[.,]\d+)?)/);
    if (m) lineas.push({ ref: m[1], cant: CP.parseNum(m[2]) });
  }
  if (!lineas.length) { alert('Escribe «referencia cantidad» en cada línea.'); return; }
  prepararLlegada(lineas);
}
function vistaPropuestaLlegada() {
  const { asignaciones, sobrante } = llegada.propuesta;
  const resto = (id) => E.restos.find((r) => r.id === id);
  return `
    <h3>Reparto propuesto (${h(llegada.origen)})</h3>
    ${asignaciones.length ? `<table>
      <tr><th>Cliente</th><th>Pedido</th><th>Fecha resto</th><th>Referencia</th><th>Descripción</th><th class="num">Pendiente</th><th class="num">Se le asigna</th></tr>
      ${asignaciones.map((a, i) => { const r = resto(a.restoId); return `<tr>
        <td><b>${h(r.cliente)}</b></td><td>${h(r.numero)}</td><td>${h(fmtFecha(r.fecha))}</td><td>${h(r.ref)}</td><td>${h(r.desc)}</td>
        <td class="num">${r.pendiente}</td>
        <td class="num"><input class="cant" value="${a.cant}" onchange="llegada.propuesta.asignaciones[${i}].cant=CP.parseNum(this.value)||0"></td></tr>`; }).join('')}
    </table>` : `<div class="aviso-caja aviso">Nada de lo que llega está en restos de ${h(llegada.proveedor)}.</div>`}
    ${sobrante.length ? `<div class="aviso-caja info">Sin cliente esperándolo (va a stock): ${sobrante.map((s) => `${h(s.ref)} × ${s.cant}`).join(', ')}</div>` : ''}
    <div class="fila" style="margin-top:10px">
      ${asignaciones.length ? `<button class="btn primario" onclick="confirmarLlegada()">Confirmar reparto</button>` : ''}
      <button class="btn" onclick="llegada=null;pintar()">Cancelar</button>
    </div>`;
}
function confirmarLlegada() {
  for (const a of llegada.propuesta.asignaciones) {
    const r = E.restos.find((x) => x.id === a.restoId);
    const cant = Math.min(a.cant || 0, r.pendiente);
    if (cant <= 0) continue;
    r.asignaciones.push({ fecha: hoy(), cant, origen: llegada.origen });
    r.pendiente -= cant;
  }
  const resumen = llegada.propuesta.asignaciones.filter((a) => a.cant > 0).map((a) => `${a.cliente}: ${a.ref} × ${a.cant}`).join('\n');
  llegada = null; guardar(); pintar();
  alert('Reparto guardado. Entregar a:\n' + resumen);
}
function anularResto(id) {
  const r = E.restos.find((x) => x.id === id);
  if (!confirm(`¿Anular el resto de ${r.cliente}: ${r.ref} × ${r.pendiente}? (el cliente ya no lo espera)`)) return;
  r.anulado = true; guardar(); pintar();
}
