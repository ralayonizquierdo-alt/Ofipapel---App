<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Pedidos · Ofipapel</title>
<meta name="theme-color" content="#1e7d32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-pedidos.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-ofipapel-192.png">
<link rel="apple-touch-icon" href="icon-ofipapel-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- La versión en la URL obliga a bajar la lógica nueva junto con el HTML (que
     nunca se cachea). Sin ella, un móvil cargó el HTML nuevo con la lógica
     vieja y la app se quedó trabada (2026-10-07). Cámbiala al tocar la lógica. -->
<script src="control-pedidos-logica.js?v=2026-10-08-4"></script>
<!--
  Control de pedidos del comercial: compara lo que el comercial apuntó a mano
  con la propuesta que manda el proveedor, obliga a decidir cada discordancia,
  deja en RESTOS lo que el cliente pidió y no llega, y reconoce esos restos
  cuando aparecen en un pedido posterior. Exporta el Excel 5.0/95 para Géminis.

  Las reglas viven en control-pedidos-logica.js (con pruebas en
  scripts/probar-control-pedidos.js); aquí solo hay interfaz.

  Los datos se guardan en este navegador (localStorage). Es una app de un solo
  usuario por ahora: si se borra el navegador se pierde todo, así que la
  pestaña «Datos» descarga una copia de seguridad. Pasar a una base de datos
  compartida es el siguiente paso cuando haga falta usarla desde dos equipos.
-->
<style>
:root{
  --verde-oscuro:#145c26; --verde:#1e7d32; --verde-claro:#eaf7ec; --acento:#8bc34a;
  --texto:#1c2b1f; --texto2:#5d6b5f; --borde:#dfe8e1; --fondo:#f6f9f7; --tarjeta:#fff;
  --rojo:#b3261e; --rojo-claro:#fdecea; --ambar:#8a5a00; --ambar-claro:#fff4dc; --azul-claro:#e8f0fe; --azul:#1a56b0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:var(--texto);background:var(--fondo);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));color:#fff;padding:18px 16px 0}
header h1{margin:0 0 10px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Estado de la nube, junto al título. */
.nube{font-size:12px;font-weight:500;background:#fff2;border-radius:12px;padding:3px 9px;white-space:nowrap;cursor:pointer;border:0;color:#fff}
.nube.mal{background:#b3261e}
#avisoNube{max-width:1180px;margin:0 auto;padding:10px 16px 0}
#avisoNube:empty,#avisoFallo:empty,#avisoWeb:empty{display:none}
#avisoWeb{max-width:1180px;margin:0 auto;padding:10px 16px 0}
#avisoFallo{max-width:1180px;margin:0 auto;padding:10px 16px 0}
/* Entrada con usuario: tapa toda la app hasta que hay sesión. */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px #0004}
#login h2{margin:0;color:var(--verde-oscuro);font-size:20px}
#login input{font-size:16px}
#login .error{color:var(--rojo);font-size:14px;min-height:1em}
/* Las pestañas, siempre en una sola línea: si no caben, se desliza la barra (nunca la página). */
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;white-space:nowrap;background:transparent;border:0;color:#fff;opacity:.75;padding:10px 12px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0}
nav button.activa{background:var(--fondo);color:var(--verde-oscuro);opacity:1;font-weight:600}
nav .cuenta{background:#fff3;border-radius:10px;padding:1px 7px;margin-left:4px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:14px}
.tarjeta h2{margin:0 0 12px;font-size:17px;color:var(--verde-oscuro)}
.tarjeta h3{margin:14px 0 8px;font-size:15px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--texto2);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c8d4cb;border-radius:8px;background:#fff;color:var(--texto)}
input[type=number]{width:80px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.btn{font:inherit;border:1px solid var(--verde);background:#fff;color:var(--verde-oscuro);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--verde-claro)}
.btn.primario{background:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-oscuro)}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn.peque{padding:4px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabla-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--texto2);font-weight:600;border-bottom:2px solid var(--borde);padding:6px}
td{border-bottom:1px solid var(--borde);padding:5px 6px;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clic{cursor:pointer} tr.clic:hover{background:var(--verde-claro)}
td input{padding:4px 6px;width:100%} td input.cant{width:64px} td input.precio{width:82px}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
/* Un nombre de fichero o una referencia muy larga sin espacios no puede
   ensanchar la página: en Android eso hace que Chrome la aleje entera. */
main{overflow-wrap:anywhere}
.chip.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.chip.mal{background:var(--rojo-claro);color:var(--rojo)}
.chip.aviso{background:var(--ambar-claro);color:var(--ambar)}
.chip.info{background:var(--azul-claro);color:var(--azul)}
.chip.gris{background:#eef0ef;color:var(--texto2)}
.motivo{font-size:12px;color:var(--texto2)}
.motivo.revisar{color:var(--rojo)}
.duda{background:var(--ambar-claro)}
.fuera-catalogo input.ref{border-color:var(--rojo);background:var(--rojo-claro)}
.sugerencia{font-size:12px;margin-top:3px}
.sugerencia button{font-size:12px;border:1px dashed var(--azul);background:var(--azul-claro);color:var(--azul);border-radius:6px;padding:1px 6px;cursor:pointer;margin:2px 3px 0 0}
.aviso-caja{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.aviso-caja.mal{background:var(--rojo-claro);color:var(--rojo)}
.aviso-caja.aviso{background:var(--ambar-claro);color:var(--ambar)}
.aviso-caja.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.aviso-caja.info{background:var(--azul-claro);color:var(--azul)}
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.vacio{color:var(--texto2);font-style:italic;padding:8px 0}
#vistaImportar{padding:0 12px 12px}
#vistaImportar iframe{display:block;width:100%;height:calc(100vh - 150px);min-height:600px;border:1px solid var(--borde);border-radius:12px;background:#fff}
.importar-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
li.descartada{text-decoration:line-through;opacity:.65}
.dlg{border:0;border-radius:14px;padding:18px;width:min(560px,94vw);box-shadow:0 10px 40px #0005}
.dlg::backdrop{background:#0006}
.dlg h2{margin:0 0 10px;color:var(--verde-oscuro);font-size:18px}
.dlg label{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.dlg textarea{min-height:110px}
.libreta{margin:10px 0}
.libreta-cab{margin-bottom:6px}
/* Hoja de libreta: renglones azules de 36px, margen rojo y columnas como el talonario. */
.hoja{--r:36px;position:relative;background-color:#fffef4;border:1px solid #e6dfbf;border-radius:6px;box-shadow:0 2px 6px #0001;
  background-image:linear-gradient(to right,transparent 42px,#e79a9a 42px,#e79a9a 44px,transparent 44px),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--r) - 1px),#bcd4ec calc(var(--r) - 1px),#bcd4ec var(--r));
  max-height:60vh;overflow:auto;font-family:'Kalam','Segoe Print','Comic Sans MS',cursive}
.renglon{display:grid;grid-template-columns:44px 104px 150px 1fr 96px;height:36px;align-items:end;margin:0}
.renglon > span{padding:0 8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #f0c9c9;height:100%;display:flex;align-items:flex-end}
.renglon > .l-num{border-left:0;justify-content:center;color:#c98a8a;font-size:14px}
.renglon.titulos{position:sticky;top:0;z-index:1;background:#fffef4}
.renglon.titulos .t-corto{display:none}
.renglon.titulos .exp-toggle{margin-left:6px;letter-spacing:0;text-transform:none}
.renglon.titulos > span{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a55;align-items:center}
.renglon.escrito{color:#1c3f94;font-size:20px;line-height:1}
.renglon .l-precio{justify-content:flex-end}
.renglon .l-todo{grid-column:2 / -1}
.renglon.tachado > span:not(.l-num){text-decoration:line-through;text-decoration-color:#c33;color:#7c8aa8}
.renglon.nuevo input{all:unset;box-sizing:border-box;width:100%;height:34px;padding-top:12px;line-height:20px;font:inherit;font-size:20px;color:#1c3f94;caret-color:#c33}
.renglon.nuevo input:focus{background:#fff3b0aa}
.renglon.nuevo input::placeholder{color:#9fb3d6}
.renglon.nuevo .l-precio input{text-align:right}
.renglon.nuevo .l-cant{gap:4px;align-items:center;padding-bottom:0}
.renglon.nuevo .l-cant input{min-width:0;flex:1 1 auto}
.exp-toggle{flex:0 0 auto;font:600 11px/1 system-ui,sans-serif;padding:5px 6px;border:1px solid #9fb3d6;border-radius:999px;background:#fff;color:#1c3f94;cursor:pointer;min-height:0}
.exp-toggle[aria-pressed=true]{background:#c33;border-color:#c33;color:#fff}
#qaRefModo[aria-pressed=true]{background:#1c3f94;border-color:#1c3f94}
.renglon .l-cant small{margin-left:4px;color:#c33;font-size:12px}
.casilla{flex-direction:row!important;align-items:center;gap:6px;align-self:flex-end;padding-bottom:8px}
details.grupo{border:1px solid var(--borde,#ddd);border-radius:10px;padding:10px 12px;margin-top:12px}
details.grupo>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px}
details.grupo>summary .resumen{margin:0}
details.grupo>summary::before{content:"▸";color:var(--texto2)}
details.grupo[open]>summary::before{content:"▾"}
.pequeno{font-size:12px;color:var(--texto2)}
.oculto{display:none!important}
table.lista-pedidos .c-movil{display:none}
.progreso{font-size:13px;color:var(--texto2);margin-top:6px}
/* ── Móvil (Android) ──────────────────────────────────────────────────────
   Por debajo de 700px las tablas se convierten en tarjetas: cada fila es una
   tarjeta y cada celda lleva delante el nombre de su columna (data-th, que
   pone ponerEtiquetas() al pintar). Controles de al menos 44px para el dedo y
   letra de 16px en los campos para que el navegador no haga zoom al tocarlos. */
@media (max-width:700px){
  html,body{font-size:15px}
  header{padding:12px 12px 0}
  header h1{font-size:19px;margin-bottom:8px}
  nav button{padding:10px 10px}
  main{padding:10px}
  .tarjeta{padding:12px;border-radius:10px}
  .fila{gap:8px}
  .fila > label{flex:1 1 140px}
  .fila > .btn{flex:1 1 auto}
  input,select,textarea{font-size:16px;min-height:44px}
  input[type=checkbox]{min-height:0;width:22px;height:22px}
  input[type=file]{min-height:0;font-size:14px;max-width:100%}
  .btn{min-height:44px;padding:10px 14px}
  .btn.peque{min-height:40px;font-size:14px}
  .tabla-scroll{overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  tr:has(> th){display:none}
  tr{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
  tr.duda{background:var(--ambar-claro)}
  td{border:0;padding:4px 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;text-align:right}
  td::before{content:attr(data-th);font-size:12px;color:var(--texto2);text-align:left;flex:0 0 34%}
  td[data-th=""]::before{display:none}
  td[data-th=""]{justify-content:flex-end}
  td input,td select{flex:1 1 55%;width:auto;min-width:0}
  td input.cant,td input.precio{flex:0 1 120px}
  td > div,td .fila{flex:1 1 100%;text-align:left}
  td.num{text-align:right}
  .resumen{gap:6px}
  .chip{font-size:12px}
  .sugerencia button{padding:6px 8px;margin:4px 4px 0 0}
  /* Pedidos de una campaña: lista compacta de dos líneas por pedido. */
  table.lista-pedidos tr{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:0 8px;padding:8px 8px;margin-bottom:6px}
  table.lista-pedidos tr:has(> th){display:none}
  table.lista-pedidos td.c-d{display:none}
  table.lista-pedidos td.c-movil{display:block;text-align:left;padding:0;min-width:0}
  table.lista-pedidos td::before{display:none}
  table.lista-pedidos td.c-sel,table.lista-pedidos td.c-borrar{display:block;padding:0;width:auto}
  table.lista-pedidos td.c-borrar .btn{min-height:38px;padding:4px 10px}
  table.lista-pedidos .m-tit{font-weight:600;font-size:15px;overflow-wrap:anywhere}
  table.lista-pedidos .m-dat{font-size:12px;color:var(--texto2);margin-top:2px}
  table.lista-pedidos .m-est{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  table.lista-pedidos .m-est .chip{font-size:11px;padding:1px 7px}
  .renglon{grid-template-columns:28px 82px 92px 1fr 64px}
  .renglon.titulos .t-largo{display:none}
  .renglon.titulos .t-corto{display:inline}
  /* Líneas de artículos: tarjetas compactas (cantidad, exp., referencia y
     precio en una fila; descripción debajo; la duda solo si la hay). */
  table.t-lineas tr,table.t-repo tr{display:grid;gap:2px 6px;padding:6px 8px;margin-bottom:6px}
  table.t-lineas tr{grid-template-columns:62px 34px 1fr 86px;grid-template-areas:"cant exp ref precio" "desc desc desc x" "duda duda duda duda"}
  table.t-repo tr{grid-template-columns:62px 1fr 86px 76px;grid-template-areas:"cant ref precio dtos" "desc desc desc x" "imp imp neto neto" "duda duda duda duda"}
  table.t-lineas tr:has(> th),table.t-repo tr:has(> th){display:none}
  table.t-lineas td,table.t-repo td{display:block;padding:0;min-width:0;text-align:left}
  table.t-lineas td::before,table.t-repo td::before{display:block;font-size:10px;line-height:1.3;margin:0}
  table.t-lineas td input:not([type=checkbox]),table.t-repo td input{width:100%;min-height:36px;padding:4px 6px}
  table.t-lineas td.c-exp input{margin-top:6px}
  .c-cant{grid-area:cant}.c-exp{grid-area:exp}.c-ref{grid-area:ref}.c-precio{grid-area:precio}.c-desc{grid-area:desc}
  .c-duda{grid-area:duda}.c-x{grid-area:x;align-self:end}.c-dtos{grid-area:dtos}.c-imp{grid-area:imp}.c-neto{grid-area:neto}
  table.t-repo td.c-imp,table.t-repo td.c-neto{display:flex;gap:6px;font-size:13px}
  table.t-repo td.c-imp::before,table.t-repo td.c-neto::before{font-size:12px}
  td.c-duda.vacia{display:none}
  td.c-duda .btn{margin-top:4px}
  td.c-x .btn{min-height:36px;padding:4px 12px}
  .renglon > span{padding:0 4px 2px}
  .renglon.escrito,.renglon.nuevo input{font-size:18px}
  .hoja{background-image:linear-gradient(to right,transparent 28px,#e79a9a 28px,#e79a9a 30px,transparent 30px),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--r) - 1px),#bcd4ec calc(var(--r) - 1px),#bcd4ec var(--r))}
}
@media print{header,nav,.no-imprimir{display:none!important}body{background:#fff}.tarjeta{border:0}}
</style>
</head>
<body>
<header>
  <h1>Control de Pedidos <button id="estadoNube" class="nube oculto" onclick="vista='datos';pedidoAbierto=null;pintar()" title="Ver el estado de la nube"></button></h1>
  <nav id="nav">
    <button data-vista="importar" class="activa">📄 PDF a Excel</button>
    <button data-vista="pedidos">Campañas</button>
    <button data-vista="nuevo">✍️ Pedido a mano</button>
    <button data-vista="reposicion">🔄 Reposición</button>
    <button data-vista="restos">Restos <span class="cuenta" id="cuentaRestos">0</span></button>
    <button data-vista="notas" title="Notas de facturación">Notas <span class="cuenta" id="cuentaNotas">0</span></button>
    <button data-vista="datos">Datos</button>
  </nav>
</header>
<div id="avisoWeb" class="no-imprimir"></div>
<div id="avisoFallo" class="no-imprimir"></div>
<div id="avisoNube" class="no-imprimir"></div>
<main id="main"></main>
<dialog id="dlgEnvio" class="dlg"></dialog>
<div id="login" class="oculto">
  <form onsubmit="event.preventDefault(); entrarConUsuario()">
    <h2>Control de Pedidos</h2>
    <p class="pequeno" style="margin:0">Entra con tu usuario una vez en este dispositivo: se queda guardado.</p>
    <label>Usuario<input id="loginUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="luis, rober, miguel…"></label>
    <label>Contraseña<input id="loginClave" type="password" autocomplete="current-password"></label>
    <div class="error" id="loginError"></div>
    <button class="btn primario" id="loginBoton" type="submit">Entrar</button>
  </form>
</div>
<!-- «Importación Pedidos Proveedores» tal cual, sin tocar: es otra página del
     mismo sitio (importacion-pedidos-proveedores.html) mostrada en un iframe.
     Va fuera de #main para que no se recargue (ni pierda la factura cargada)
     al cambiar de pestaña. -->
<section id="vistaImportar" class="oculto">
  <div class="importar-barra no-imprimir">
    <a class="btn peque" href="importacion-pedidos-proveedores.html" target="_blank" rel="noopener">Abrir en pestaña aparte ↗</a>
  </div>
</section>

<script>
'use strict';
const CP = window.ControlPedidos;
// Cualquier fallo, a la vista: mejor un aviso rojo que una app que no responde.
window.addEventListener('error', (ev) => mostrarFallo(ev.message));
window.addEventListener('unhandledrejection', (ev) => mostrarFallo(ev.reason && (ev.reason.message || ev.reason)));
function mostrarFallo(msg) {
  const c = document.getElementById('avisoFallo');
  if (!c || !msg) return;
  c.innerHTML = `<div class="aviso-caja mal" style="margin:0"><b>⚠️ Algo ha fallado:</b> ${String(msg).replace(/[<>&]/g, '')}. Recarga la página; si se repite, haz captura de este aviso.</div>`;
}
const CLAVE = 'ofipapel.controlPedidos.v1';
const OCR_TOKEN = 'ofipapel-ocr-2026'; // el mismo que leer-reserva-airbnb; no es un secreto (ver la función)
const FN = '/.netlify/functions/';
// La lectura de fotos y PDF vive en las funciones de Netlify: la copia de
// GitHub Pages (y cualquier otra web) no las tiene y daba «405». Los datos
// están en la nube, así que basta con abrir la app en la web buena.
const WEB_BUENA = 'https://ofipapel.netlify.app/control-pedidos.html';
const EN_NETLIFY = /(^|\.)netlify\.app$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

// ── Estado ───────────────────────────────────────────────────────────────────
// pedidos:  [{id, tipo:'comercial'|'reposicion', proveedor, campana, numero, cliente, fecha, notas,
//             lineas:[{ref,desc,cant,precio,exp,duda, dtos,udsCaja,importe (reposición)}],
//             propuesta:{archivo,fecha,cabecera,lineas}, decisiones:{ref:{accion,cant,precio,nota}}, validado, final}]
// restos:   [{id, pedidoId, proveedor, cliente, numero, ref, desc, ean, precio, cant, pendiente, fecha, asignaciones:[{fecha,cant,origen}], anulado}]
// notas:    [{id, pedidoId, cliente, numero, proveedor, ref, desc, texto, fecha, resuelta}]
// catalogos:{PROVEEDOR: {fecha, archivo, items:{ref:{d,p,ean}}}}
// historial:{PROVEEDOR: {REF: {neto, fecha}}}  último precio neto aceptado en una reposición validada
let E = cargar();
let vista = 'importar'; // la app arranca siempre en «PDF a Excel», la primera pestaña
let pedidoAbierto = null;
let soloDiscordancias = true;

function cargar() {
  const base = { pedidos: [], restos: [], notas: [], catalogos: {}, historial: {} };
  try {
    const raw = localStorage.getItem(CLAVE);
    return raw ? Object.assign(base, JSON.parse(raw)) : base;
  } catch { return base; }
}
function guardar() {
  guardarLocal();
  pintarCuentas();
  programarSubida();
}
function guardarLocal() {
  try { localStorage.setItem(CLAVE, JSON.stringify(E)); }
  catch (e) { alert('No se han podido guardar los cambios en este navegador (' + e.message + '). Descarga una copia en «Datos».'); }
}

const h = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Valor seguro dentro de un onclick="…": literal JSON escapado para atributo. */
const js = (v) => h(JSON.stringify(String(v == null ? '' : v)));
const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const hoy = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => CP.fmt(n);
/** Precio unitario sin perder decimales: 1,065 se ve 1,065 (no 1,07); si no hay más de 2, como siempre. */
const fmtPrecio = (n) => (n == null || Math.abs(n * 100 - Math.round(n * 100)) < 1e-9 ? fmt(n)
  : Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
const fmtFecha = (f) => (f && /^\d{4}-\d{2}-\d{2}/.test(f)) ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : (f || '');
const prov = (s) => String(s || '').trim().toUpperCase();
const pedidoPorId = (id) => E.pedidos.find((p) => p.id === id);
const catalogoDe = (proveedor) => (E.catalogos[prov(proveedor)] || {}).items || null;
const esRepo = (p) => p.tipo === 'reposicion';
/** Nº de pedido con el cero delante (08, 09, 10) para que se lea en orden. Solo
 *  se ve así: lo guardado no cambia (las propuestas lo buscan tal cual). */
const nPed = (n) => { const s = String(n == null ? '' : n).trim(); return /^\d$/.test(s) ? '0' + s : s; };
/** Marca de «enviado al proveedor» (p.enviado). Los primeros envíos se guardaron
 *  en p.envio, que en reposición es el nombre del fichero subido: solo vale si es un objeto. */
const envioDe = (p) => p.enviado || (p.envio && typeof p.envio === 'object' ? p.envio : null);
const preciosAnteriores = (proveedor) => Object.fromEntries(Object.entries(E.historial[prov(proveedor)] || {}).map(([k, v]) => [k, v.neto]));
const fmtDtos = (d) => (CP.parseDtos(d).length ? CP.parseDtos(d).map((x) => fmt(x).replace(',00', '')).join('+') + ' %' : '');

// ── Navegación ───────────────────────────────────────────────────────────────
document.getElementById('nav').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-vista]');
  if (!b) return;
  vista = b.dataset.vista;
  pedidoAbierto = null;
  prefijoNuevo = null; // desde la pestaña, sin campaña impuesta
  pintar();
});

function pintarCuentas() {
  document.getElementById('cuentaRestos').textContent = E.restos.filter((r) => r.pendiente > 0 && !r.anulado).length;
  document.getElementById('cuentaNotas').textContent = E.notas.filter((n) => !n.resuelta).length;
}

function pintar() {
  if (pedidoAbierto && !pedidoPorId(pedidoAbierto)) pedidoAbierto = null; // lo borró otro dispositivo
  try { pintarNube(); } catch (e) { mostrarFallo('estado de la nube: ' + e.message); }
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('activa', b.dataset.vista === vista));
  const main = document.getElementById('main');
  const importar = document.getElementById('vistaImportar');
  main.classList.toggle('oculto', vista === 'importar');
  importar.classList.toggle('oculto', vista !== 'importar');
  if (vista === 'importar') {
    // El iframe se crea la primera vez y se conserva después.
    if (!importar.querySelector('iframe')) {
      const f = document.createElement('iframe');
      f.src = 'importacion-pedidos-proveedores.html';
      f.title = 'Importación Pedidos Proveedores';
      importar.appendChild(f);
    }
    pintarCuentas();
    return;
  }
  if (vista === 'pedidos') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaLista();
  else if (vista === 'nuevo') { main.innerHTML = vistaNuevo(); ponerCampanas(); }
  else if (vista === 'reposicion') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaReposicion();
  else if (vista === 'restos') main.innerHTML = vistaRestos();
  else if (vista === 'notas') main.innerHTML = vistaNotas();
  else main.innerHTML = vistaDatos();
  ponerEtiquetas(main);
  pintarCuentas();
}

/** Copia el título de cada columna a sus celdas (data-th) para que en el
 *  móvil, donde la tabla se ve como tarjetas, cada dato lleve su nombre. */
function ponerEtiquetas(raiz) {
  raiz.querySelectorAll('table').forEach((t) => {
    const cab = [...t.rows].find((f) => f.querySelector('th'));
    if (!cab) return;
    const nombres = [...cab.cells].map((c) => c.textContent.trim());
    for (const fila of t.rows) {
      if (fila === cab) continue;
      [...fila.cells].forEach((c, i) => { if (!c.hasAttribute('data-th')) c.setAttribute('data-th', nombres[i] || ''); });
    }
  });
}

// ── Estado de un pedido ──────────────────────────────────────────────────────
function comparar(p) {
  if (!p.propuesta) return null;
  // Reposición: precio NETO (tras todos los descuentos), 0,25 € informativo, y
  // si el pedido no trae precio se compara con el último aceptado.
  if (esRepo(p)) {
    return CP.compararPedido(p.lineas, p.propuesta.lineas, { catalogo: catalogoDe(p.proveedor), comparar: 'neto',
      tolerancia: CP.TOLERANCIA.reposicion, preciosAnteriores: preciosAnteriores(p.proveedor) });
  }
  // Comercial: tolerancia cero en precio. El comercial apunta siempre el precio
  // NETO (nunca descuentos): se compara con el neto de cada línea del proveedor
  // (tras sus descuentos, sin el global, que es entre el proveedor y nosotros).
  return CP.compararPedido(p.lineas, p.propuesta.lineas, { catalogo: catalogoDe(p.proveedor), comparar: 'neto', tolerancia: CP.TOLERANCIA.comercial });
}
/** Fotos del pedido (las antiguas, sin registro, se deducen de sus líneas). */
function fotosDe(p) {
  if (p.fotos && p.fotos.length) return p.fotos;
  return [...new Set(p.lineas.map((l) => l.foto).filter(Boolean))].map((nombre) => ({ nombre, hoja: '' }));
}
/** En el móvil, cada pedido de la campaña en dos líneas: nº y cliente, y debajo
 *  lo demás en pequeño (en vez de una ficha con una fila por dato). */
function filaMovil(p, e) {
  const r = CP.hojasDelPedido(fotosDe(p));
  const datos = [fmtFecha(p.fecha).slice(0, 5), p.lineas.length + ' lín.', esRepo(p) ? '' : r.fotos ? '📷 ' + r.fotos + (r.total ? '/' + r.total : '') : ''].filter(Boolean).join(' · ');
  return `<div class="m-tit">${esRepo(p) ? h(p.proveedor) + (p.numero ? ' · nº ' + h(p.numero) : '') : `nº ${h(nPed(p.numero))} · ${h(p.cliente)}`}</div>
    <div class="m-dat">${h(datos)}${r.faltan.length ? ` <span class="chip mal">falta hoja ${r.faltan.join(', ')}</span>` : ''}</div>
    <div class="m-est"><span class="chip ${e.chip}">${h(e.texto)}</span>${chipsFaltasSobras(p)}${chipFactura(p)}</div>`;
}
function celdaFotos(p) {
  const r = CP.hojasDelPedido(fotosDe(p));
  if (!r.fotos) return '—';
  return `${r.fotos}${r.total ? ` <span class="pequeno">(${r.hojas.length} de ${r.total} hojas)</span>` : ''}${r.faltan.length ? ` <span class="chip mal">falta hoja ${r.faltan.join(', ')}</span>` : ''}`;
}
function avisoFotos(p) {
  const fotos = fotosDe(p);
  const r = CP.hojasDelPedido(fotos);
  if (!r.fotos) return '';
  return `<div class="aviso-caja ${r.faltan.length ? 'mal' : 'info'}">📷 <b>${r.fotos} foto(s)</b>${r.total ? ` · hojas leídas ${r.hojas.join(', ')} de ${r.total}` : ''}
    ${r.faltan.length ? `<br><b>⚠️ Falta la hoja ${r.faltan.join(', ')} de ${r.total}:</b> súbela con «Hacer foto» o «Elegir de la galería».` : ''}
    <div class="pequeno" style="margin-top:4px">${fotos.map((f) => `<span style="display:inline-block;margin:2px 8px 2px 0">${h(f.nombre)}${f.hoja ? ` (hoja ${h(f.hoja)})` : ''}${f.lineas != null ? ` · ${f.lineas} línea(s)` : ''}
      <button class="btn peque peligro no-imprimir" style="padding:1px 6px" onclick="quitarFoto(${js(f.nombre)})" title="Quitar esta foto y sus líneas">quitar</button></span>`).join('')}</div></div>`;
}
function chipsFaltasSobras(p) {
  const filas = comparar(p);
  if (!filas) return '';
  const { sobran } = CP.faltasYSobras(filas);
  const faltan = CP.faltasPendientes(filas, p.decisiones);
  return ` <span class="chip ${faltan.length ? 'mal' : 'ok'}">${faltan.length} faltan</span> <span class="chip ${sobran.length ? 'aviso' : 'ok'}">${sobran.length} sobran</span>`;
}
function estadoPedido(p) {
  if (p.validado) return { chip: 'ok', texto: 'Validado' };
  if (!p.lineas.length) return { chip: 'gris', texto: 'Sin líneas' };
  if (!p.propuesta) return { chip: 'gris', texto: 'Sin propuesta' };
  const pend = CP.sinDecidir(comparar(p), p.decisiones).length;
  return pend ? { chip: 'aviso', texto: pend + ' por decidir' } : { chip: 'info', texto: 'Listo para validar' };
}

// ── Campañas ─────────────────────────────────────────────────────────────────
// Los pedidos del comercial se agrupan por proveedor + campaña; las
// reposiciones, por proveedor. La campaña se escribe a mano, así que se busca
// una ya existente que solo cambie en mayúsculas, tildes o espacios
// («agendas  2027» → «Agendas 2027»): si no, saldrían dos campañas distintas.
const claveTexto = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
function campanaCanonica(proveedor, texto) {
  const t = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  const igual = E.pedidos.find((p) => !esRepo(p) && p.campana && prov(p.proveedor) === prov(proveedor) && claveTexto(p.campana) === claveTexto(t));
  return igual ? igual.campana : t;
}
const campanasExistentes = () => [...new Set(E.pedidos.filter((p) => !esRepo(p) && p.campana).map((p) => p.campana))].sort((a, b) => a.localeCompare(b, 'es'));
const claveGrupo = (p) => esRepo(p) ? 'R|' + prov(p.proveedor) : 'C|' + prov(p.proveedor) + '|' + claveTexto(p.campana);
const nombreGrupo = (p) => esRepo(p) ? `Reposición · ${p.proveedor}` : `${p.proveedor} · ${p.campana || 'sin campaña'}`;
let gruposAbiertos = null; // claves de campaña desplegadas (por defecto, la más reciente)
const reclamaciones = {};  // texto de reclamación por campaña

// ── Vista: lista de pedidos ──────────────────────────────────────────────────
/** Grupos (campañas o reposiciones de un proveedor) de los pedidos dados. */
function agruparPedidos(lista) {
  const ps = lista.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  const grupos = new Map();
  for (const p of ps) {
    const k = claveGrupo(p);
    if (!grupos.has(k)) grupos.set(k, { clave: k, nombre: nombreGrupo(p), pedidos: [] });
    grupos.get(k).pedidos.push(p);
  }
  // Dentro de cada campaña, por nº de pedido (01, 02… 10), no por fecha.
  for (const g of grupos.values()) g.pedidos.sort((a, b) => String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }) || (a.fecha || '').localeCompare(b.fecha || ''));
  // Todas minimizadas por defecto; solo se despliega la que abre el usuario
  // (o la del pedido del que vuelve).
  gruposAbiertos = gruposAbiertos || new Set();
  return grupos;
}
/** Resultado de la última carga de propuestas o facturas (y las que hay que
 *  confirmar). Las cargas se lanzan desde cada campaña o grupo. */
function bloqueResultadosCarga() {
  return `
    <div id="progresoProps" class="progreso"></div>
    <div id="avisoCarga">${vistaSinAsignar()}</div>`;
}

    </div>

}

/** Una campaña (o las reposiciones de un proveedor): recuento, sus pedidos,
 *  sus faltas y sobras y la reclamación al proveedor. */
function vistaGrupo(g, i) {
  const comparados = g.pedidos.filter((p) => p.propuesta && p.lineas.length);
  const filasRes = [];
  const reclamar = [];
  for (const p of comparados) {
    const filas = comparar(p);
    const { sobran } = CP.faltasYSobras(filas);
    const faltan = CP.faltasPendientes(filas, p.decisiones);
    const aReclamar = faltan.filter((x) => x.pendiente === 'reclamar');
    if (aReclamar.length) reclamar.push({ numero: p.numero, cliente: esRepo(p) ? 'Reposición' : p.cliente, faltan: aReclamar });
    faltan.forEach((x) => filasRes.push({ p, x, tipo: 'falta' }));
    sobran.forEach((x) => filasRes.push({ p, x, tipo: 'sobra' }));
  }
  filasRes.sort((a, b) => (a.tipo === b.tipo ? String(a.p.numero).localeCompare(String(b.p.numero), 'es', { numeric: true }) : a.tipo === 'falta' ? -1 : 1));
  const nF = filasRes.filter((r) => r.tipo === 'falta').length;
  const nS = filasRes.length - nF;
  const validados = g.pedidos.filter((p) => p.validado).length;
  const hojasG = g.pedidos.filter((p) => !esRepo(p)).map((p) => CP.hojasDelPedido(fotosDe(p)));
  const nFotos = hojasG.reduce((s, x) => s + x.fotos, 0);
  const hojasFaltan = hojasG.reduce((s, x) => s + x.faltan.length, 0);
  const ej = g.pedidos[0];
  reclamaciones[g.clave] = reclamar.length ? CP.textoReclamacion(ej.proveedor, reclamar, { campana: esRepo(ej) ? '' : ej.campana }) : '';
  const abierto = Boolean(gruposAbiertos && gruposAbiertos.has(g.clave));
  return `
  <details class="grupo" ${abierto ? 'open' : ''} ontoggle="marcarGrupo(${js(g.clave)}, this.open)">
    <summary>
      <b>${h(g.nombre)}</b>
      <span class="resumen">
        <span class="chip gris">${g.pedidos.length} pedido(s)</span>
        ${nFotos ? `<span class="chip gris">📷 ${nFotos} foto(s)</span>` : ''}
        ${hojasFaltan ? `<span class="chip mal">⚠️ ${hojasFaltan} hoja(s) sin subir</span>` : ''}
        ${esRepo(ej) ? '' : chipEnvio(g.pedidos)}
        <span class="chip ${validados === g.pedidos.length ? 'ok' : 'info'}">${validados} validado(s)</span>
        ${comparados.length ? `<span class="chip ${nF ? 'mal' : 'ok'}">${nF} faltan</span><span class="chip ${nS ? 'aviso' : 'ok'}">${nS} sobran</span>` : ''}
      </span>
    </summary>
    <div class="tabla-scroll"><table class="lista-pedidos">
      <tr><th class="no-imprimir"><input type="checkbox" title="Seleccionar todos" onchange="this.closest('table').querySelectorAll('.selPed').forEach(c=>c.checked=this.checked)"></th>
        <th>Fecha</th><th>Nº</th><th>Cliente</th><th class="num">Líneas</th><th>Fotos</th><th>Propuesta</th><th>Estado</th><th class="c-movil"></th><th class="no-imprimir"></th></tr>
      ${g.pedidos.map((p) => { const e = estadoPedido(p); return `
      <tr class="clic" onclick="if(event.target.type!=='checkbox')abrirPedido('${p.id}')">
        <td class="no-imprimir c-sel"><input type="checkbox" class="selPed" value="${p.id}"></td>
        <td class="c-d">${h(fmtFecha(p.fecha))}</td><td class="c-d">${h(nPed(p.numero))}</td><td class="c-d">${h(esRepo(p) ? '—' : p.cliente)}</td>
        <td class="num c-d">${p.lineas.length}</td>
        <td class="c-d">${esRepo(p) ? '—' : celdaFotos(p)}</td>
        <td class="c-d">${p.propuesta ? `<span class="chip ok">Sí</span>` : `<span class="chip gris">No</span>`}</td>
        <td class="c-d"><span class="chip ${e.chip}">${h(e.texto)}</span>${chipsFaltasSobras(p)}${chipFactura(p)}${envioDe(p) ? ` <span class="chip info" title="Enviado a ${h(envioDe(p).para || '')}">📧 ${h(fmtFecha(String(envioDe(p).fecha).slice(0, 10)).slice(0, 5))}</span>` : ''}</td>
        <td class="c-movil">${filaMovil(p, e)}</td>
        <td class="no-imprimir c-borrar"><button class="btn peque peligro" title="Borrar este pedido" onclick="event.stopPropagation(); borrarPedido('${p.id}')">🗑️</button></td>
      </tr>`; }).join('')}
    </table></div>
    <div class="fila no-imprimir" style="margin-top:10px">
      ${esRepo(ej) ? '' : `<label class="btn primario" style="flex-direction:row;align-items:center;justify-content:center;gap:6px;color:#fff">📷 Añadir pedidos por foto a esta campaña
        <input type="file" accept="image/*" multiple class="oculto" onchange="subirFotosCampana(this.files, ${js(ej.proveedor)}, ${js(ej.campana || '')}); this.value=''"></label>

/** Guía para facturar a mano en nuestro sistema: un bloque por cliente con
 *  SOLO lo que se factura — lo validado a precio de cliente (lo que apuntó el
 *  comercial, sin el descuento de la propuesta), menos lo que no haya venido
 *  en la factura final — y sus notas de facturación. Nada de restos. Los
 *  pedidos sin validar no entran: se avisa arriba. */
function imprimirGuiaFacturacion(clave) {
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave)
    .sort((a, b) => String(a.cliente).localeCompare(String(b.cliente), 'es') || String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  if (!ps.length) return;
  const nombre = nombreGrupo(ps[0]);
  const validados = ps.filter((p) => p.validado && p.final);
  const sinValidar = ps.filter((p) => !(p.validado && p.final));
  if (!validados.length) { alert('Todavía no hay ningún pedido validado en esta campaña.'); return; }
  const pc = (l) => (l.precioCliente != null ? l.precioCliente : l.precio) || 0;
  let totalCampana = 0;
  const bloques = validados.map((p) => {
    // Si ya está la factura final, solo se factura al cliente lo que ha venido.
    const rf = revisarFactura(p);
    const noVino = new Map(((rf && rf.faltan) || []).map((x) => [CP.normRef(x.ref), x.cant]));
    const lineas = p.final.lineas.map((l) => {
      const menos = noVino.get(CP.normRef(l.ref)) || 0;
      if (!menos) return l;
      const quitar = Math.min(menos, l.cant);
      noVino.set(CP.normRef(l.ref), menos - quitar);
      return Object.assign({}, l, { cant: CP.red2(l.cant - quitar) });
    }).filter((l) => l.cant > 0);
    const total = CP.red2(lineas.reduce((s, l) => s + pc(l) * l.cant, 0));
    totalCampana += total;
    const notas = E.notas.filter((n) => n.pedidoId === p.id && !n.resuelta);
    return `<section>
      <h2><span class="caja"></span> ${h(p.cliente)} <small>· pedido nº ${h(nPed(p.numero))} · ${h(fmtFecha(p.fecha))}</small></h2>
      <table><tr><th class="n">Cant.</th><th>Referencia</th><th>Descripción</th><th class="n">Precio</th><th class="n">Importe</th></tr>
      ${lineas.map((l) => `<tr><td class="n">${l.cant}${l.exp ? ' EXP' : ''}</td><td>${h(l.ref)}</td><td>${h(l.desc)}</td><td class="n">${fmt(pc(l))}</td><td class="n">${fmt(CP.red2(pc(l) * l.cant))}</td></tr>`).join('')}
      <tr class="tot"><td colspan="4" class="n">Total (sin impuestos)</td><td class="n">${fmt(total)}</td></tr></table>
      ${notas.length ? `<p class="nota"><b>Notas de facturación:</b> ${notas.map((n) => `${h(n.ref)} — ${h(n.texto)}`).join(' · ')}</p>` : ''}
    </section>`;
  }).join('');
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Guía de facturación · ${h(nombre)}</title>
  <style>body{font-family:system-ui,sans-serif;margin:20px;color:#111;font-size:13px}h1{font-size:18px;margin:0 0 4px}
  section{break-inside:avoid;page-break-inside:avoid;border-top:2px solid #333;padding-top:6px;margin-top:16px}
  h2{font-size:15px;margin:0 0 6px}h2 small{font-weight:normal;color:#555}.caja{display:inline-block;width:12px;height:12px;border:1.5px solid #333;margin-right:4px;vertical-align:-1px}
  table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:3px 5px;text-align:left}td.n,th.n{text-align:right}
  tr.tot td{font-weight:bold;border-bottom:0}.nota{background:#eef4ff;padding:4px 6px}.resto{background:#fff6e0;padding:4px 6px}.aviso{background:#fde8e8;padding:6px}</style></head><body>
  <h1>Guía de facturación · ${h(nombre)}</h1>
  <p>${h(fmtFecha(hoy()))} · ${validados.length} cliente(s)${validados.some((p) => !p.factura) ? ' · <b>aún sin factura final del proveedor:</b> ' + validados.filter((p) => !p.factura).map((p) => 'nº ' + h(nPed(p.numero))).join(', ') : ''} · total ${fmt(CP.red2(totalCampana))} € sin impuestos · marca la casilla de cada cliente al facturarlo.</p>
  ${sinValidar.length ? `<p class="aviso"><b>Sin validar, no incluidos:</b> ${sinValidar.map((p) => `nº ${h(nPed(p.numero))} ${h(p.cliente)}`).join(', ')}</p>` : ''}
  ${bloques}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

function ponerCampanas() {
  const proveedor = document.getElementById('npProv').value;

    .sort((x, y) => x.localeCompare(y, 'es'));

  const nueva = !camps.length || (txt.value.trim() && !actual);

    + `<option value="${NUEVO}" ${nueva ? 'selected' : ''}>➕ Campaña nueva</option>`;

/** Nº del siguiente pedido a mano: correlativo dentro de su campaña (proveedor
 *  + campaña), el mayor nº que ya haya más uno. Los nº con letras (p. ej. los
 *  del proveedor, «MR23636») no cuentan. */
function siguienteNumero(proveedor, campana) {
  if (!prov(proveedor)) return '';
  const clave = claveTexto(campanaCanonica(proveedor, campana));
  const nums = E.pedidos.filter((x) => !esRepo(x) && prov(x.proveedor) === prov(proveedor) && claveTexto(x.campana) === clave)
    .map((x) => String(x.numero || '').trim()).filter((n) => /^\d{1,6}$/.test(n)).map(Number);
  return String((nums.length ? Math.max(...nums) : 0) + 1);
}

/** Reposición: nuestro pedido al proveedor. No pasa por «Pedido a mano». */
/** Nombre del proveedor tal como ya lo tenemos («Miquelrius, S.A.» →
 *  «MIQUELRIUS» si ya existe). Ofipapel nunca es el proveedor. */
function proveedorCanonico(texto) {
  const t = prov(texto).replace(/[.,]/g, ' ').replace(/\b(S\s*A\s*U|S\s*L\s*U|S\s*A|S\s*L)\b/g, '').replace(/\s+/g, ' ').trim();
  if (!t || /OFIPAPEL/.test(t)) return '';
  const conocidos = [...new Set(E.pedidos.map((x) => prov(x.proveedor)).concat(Object.keys(E.catalogos)))].filter(Boolean);
  return conocidos.find((c) => t === c || t.includes(c) || c.includes(t)) || t;
}
/** Un pedido nuestro al proveedor → un pedido de reposición, y se abre. */
async function subirEnvio(file) {
  if (!file) return;
  if (E.pedidos.some((x) => esRepo(x) && x.envio === file.name) && !confirm(`${file.name} ya está subido. ¿Crear otro pedido con él?`)) return;
  const caja = document.getElementById('progresoEnvios');
  if (caja) caja.textContent = `Leyendo ${file.name}${esPdf(file) || esImagen(file) ? '… puede tardar un minuto' : '…'}`;
  try {
    const doc = await leerFicheroProveedor(file);
    let proveedor = proveedorCanonico(doc.cabecera.proveedor);
    if (!proveedor) {
      const r = prompt('El documento no dice de qué proveedor es. Escríbelo:', '');
      if (r == null || !r.trim()) { if (caja) caja.textContent = ''; return; }
      proveedor = proveedorCanonico(r) || prov(r);
    }
    const p = { id: nuevoId(), tipo: 'reposicion', proveedor, campana: '', numero: String(doc.cabecera.numero || doc.cabecera.numeroPedido || ''),
      cliente: '', fecha: hoy(), notas: '',
      lineas: doc.lineas.map((l) => ({ ref: l.ref, desc: l.desc, ean: l.ean, cant: l.cant, precio: l.precio, dtos: l.dtos || [], udsCaja: l.udsCaja, importe: l.importe, duda: l.duda || '' })),
      envio: file.name, envioControl: doc.control || null, propuesta: null, decisiones: {}, validado: false, final: null };
    guardarCatalogo(proveedor, file.name, doc.catalogo);
    E.pedidos.push(p);
    guardar();
    abrirPedido(p.id);
  } catch (err) {
    if (caja) caja.textContent = '';
    alert(err.sinSaldo ? MSG_SIN_SALDO : 'No he podido leer el pedido: ' + err.message);
  }
}

}

function crearPedido() {
  const v = (id) => document.getElementById(id).value.trim();
  const tipo = 'comercial'; // los pedidos a mano son siempre del comercial
  if (!v('npProv') || !v('npCamp') || !v('npCli')) { alert('Proveedor, campaña y cliente son obligatorios.'); return; }
  // El nº se calcula aquí, al crear (no el que se veía), por si entretanto llegó otro de la nube.
  const p = { id: nuevoId(), tipo, proveedor: prov(v('npProv')), campana: campanaCanonica(v('npProv'), v('npCamp')), numero: siguienteNumero(v('npProv'), v('npCamp')),
    cliente: v('npCli').toUpperCase(),
    fecha: v('npFecha') || hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null };
  if (E.pedidos.some((x) => x.proveedor === p.proveedor && String(x.numero) === String(p.numero) && x.campana === p.campana)) {
    if (!confirm(`Ya hay un pedido ${p.proveedor} nº ${p.numero}. ¿Crear otro igualmente?`)) return;
  }
  prefijoNuevo = null;
  E.pedidos.push(p);
  guardar();
  abrirPedido(p.id);
  const c = document.getElementById('qaCant'); if (c) c.focus();
}
/** Pedido del comercial empezando por las fotos: se crea con lo que haya
 *  escrito en el formulario y el resto (nº, cliente, proveedor) lo completa la
 *  lectura. Si la lectura falla, el pedido queda creado y se puede rellenar. */
/** Fotos de una campaña entera: cada hoja va a su pedido por el nº leído. */
function subirCampana(files) {
  if (!files || !files.length) return;
  const v = (id) => document.getElementById(id).value.trim();
  leerFotos(files, null, { proveedor: prov(v('lotProv')), campana: campanaCanonica(v('lotProv'), v('lotCamp')), fecha: hoy(), soloNuevos: true });
}
/** Antes de abrir la galería o la cámara: proveedor y campaña escritos, y
 *  confirmación de a qué campaña van. Sin valores por defecto, para que las
 *  fotos no acaben en FINOCAM (o en otra campaña) sin querer. */
function pedirFotosNuevas(idInput) {
  const v = (id) => document.getElementById(id).value.trim();
  if (!v('lotProv') || !v('lotCamp')) { alert('Escribe primero el proveedor y la campaña de estas fotos.'); (v('lotProv') ? document.getElementById('lotCamp') : document.getElementById('lotProv')).focus(); return; }
  const proveedor = prov(v('lotProv'));
  const campana = campanaCanonica(proveedor, v('lotCamp'));
  const ya = E.pedidos.filter((p) => !esRepo(p) && p.proveedor === proveedor && claveTexto(p.campana) === claveTexto(campana)).length;
  const texto = ya
    ? `Las fotos irán a la campaña «${proveedor} · ${campana}», que ya tiene ${ya} pedido(s), como pedidos NUEVOS.\n\nPara completar un pedido que ya existe, ábrelo y usa «Hacer foto».\n\n¿Seguir?`
    : `Se creará la campaña nueva «${proveedor} · ${campana}». ¿Seguir?`;
  if (!confirm(texto)) return;
  document.getElementById(idInput).click();
}
/** Quita una foto del pedido junto con las líneas que se leyeron de ella
 *  (p. ej. si se subió al pedido equivocado). */
function quitarFoto(nombre) {
  const p = pedidoActual();
  const n = p.lineas.filter((l) => l.foto === nombre).length;
  if (!confirm(`¿Quitar la foto ${nombre} y sus ${n} línea(s) de este pedido?`)) return;
  p.lineas = p.lineas.filter((l) => l.foto !== nombre);
  p.fotos = (p.fotos || []).filter((f) => f.nombre !== nombre);
  invalidar(p); guardar(); pintar();
}
function abrirPedido(id) {
  // Al volver a la lista, la campaña de este pedido queda desplegada.
  const p = pedidoPorId(id);
  if (p) (gruposAbiertos = gruposAbiertos || new Set()).add(claveGrupo(p));
  pedidoAbierto = id; vista = p && esRepo(p) ? 'reposicion' : 'pedidos'; pintar(); window.scrollTo(0, 0); }

/** Precio en la comparación: en reposición, el neto con el base y los descuentos debajo. */
function celdaPrecio(p, base, dtos, neto) {
  if (!esRepo(p)) return base == null ? '—' : fmt(base);
  if (neto == null) return '—';
  const det = base != null && (CP.parseDtos(dtos).length || CP.red2(base) !== CP.red2(neto)) ? `<div class="pequeno">${fmt(base)}${dtos && CP.parseDtos(dtos).length ? ' − ' + fmtDtos(dtos) : ''}</div>` : '';
  return fmt(neto) + det;
}

/** Las líneas de la propuesta, plegadas salvo que haya algo que revisar
 *  (dudas de lectura o un documento que no cuadra con su base). */
function tablaPropuesta(p, cat) {
  const pr = p.propuesta;
  const revisar = pr.lineas.some((l) => l.duda) || (pr.control && pr.control.cuadra === false);
  return `<details ${revisar ? 'open' : ''} style="margin-top:8px"><summary class="pequeno" style="cursor:pointer">Ver y corregir las ${pr.lineas.length} líneas de la propuesta</summary>
    ${tablaLineasRepo(p, cat, 'propuesta')}</details>`;
}

function tablaLineasRepo(p, cat, lado) {
  const arr = lado === 'propuesta' ? p.propuesta.lineas : p.lineas;
  const L = lado === 'propuesta' ? ",'propuesta'" : '';
  if (!arr.length) return `<div class="vacio">Sin líneas. Súbelo en PDF, Excel o foto, pégalas o añádelas a mano.</div>`;
  const fueraCat = cat ? arr.filter((l) => l.ref && !cat[CP.normRef(l.ref)]).length : 0;
  return `
  <div class="resumen">
    <span class="chip gris">${arr.length} líneas</span>

  </div>

    <tr><th class="num">Cant.</th><th>Referencia</th><th>Descripción</th><th class="num">Precio base</th><th>Descuentos</th><th class="num">Importe</th><th class="num">Neto</th><th>Duda</th><th></th></tr>
    ${arr.map((l, i) => {
      const fuera = cat && l.ref && !cat[CP.normRef(l.ref)];
      const neto = CP.precioNeto({ cant: l.cant, precio: l.precio, dtos: l.dtos, importe: l.importe });
      return `<tr class="${fuera ? 'fuera-catalogo' : ''} ${l.duda ? 'duda' : ''}">
        <td class="c-cant"><input class="cant" inputmode="decimal" value="${h(l.cant)}" onchange="cambiaLinea(${i},'cant',this.value${L})"></td>
        <td class="c-ref"><input class="ref" value="${h(l.ref)}" onchange="cambiaLinea(${i},'ref',this.value${L})"></td>
        <td class="c-desc"><input value="${h(l.desc)}" onchange="cambiaLinea(${i},'desc',this.value${L})"></td>
        <td class="c-precio"><input class="precio" inputmode="decimal" value="${l.precio == null ? '' : h(fmtPrecio(l.precio))}" onchange="cambiaLinea(${i},'precio',this.value${L})"></td>
        <td class="c-dtos"><input class="precio" inputmode="decimal" value="${h(Array.isArray(l.dtos) ? l.dtos.join('+') : l.dtos)}" placeholder="—" title="Descuentos encadenados, p. ej. 10+5" onchange="cambiaLinea(${i},'dtos',this.value${L})"></td>
        <td class="num c-imp">${l.importe == null ? '—' : fmt(l.importe)}</td>

        <td class="c-duda${l.duda ? '' : ' vacia'}"><input value="${h(l.duda)}" placeholder="—" onchange="cambiaLinea(${i},'duda',this.value${L})">${l.duda ? `<button class="btn peque" title="La he revisado: quitar la duda" onclick="cambiaLinea(${i},'duda',''${L})">✓ Está bien</button>` : ''}</td>
        <td class="c-x"><button class="btn peque peligro" onclick="borrarLinea(${i}${L})" title="Borrar la línea entera">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  <div class="pequeno" style="margin-top:6px">Sin precio en una línea, se compara con el último precio neto aceptado de ese proveedor (si lo hay).</div>`;
}

async function cargarEnvio(file) {
  if (!file) return;
  const p = pedidoActual();
  try {
    const prop = await leerFicheroProveedor(file, 'progresoEnvio');
    if (p.lineas.length && !confirm(`El pedido ya tiene ${p.lineas.length} líneas. ¿Sustituirlas por las ${prop.lineas.length} del Excel?`)) return;
    p.lineas = prop.lineas.map((l) => ({ ref: l.ref, desc: l.desc, ean: l.ean, cant: l.cant, precio: l.precio, dtos: l.dtos || [], udsCaja: l.udsCaja, importe: l.importe, duda: l.duda || '' }));
    p.envio = file.name;
    p.envioControl = prop.control || null;
    guardarCatalogo(p.proveedor, file.name, prop.catalogo);
    invalidar(p); guardar(); pintar();
  } catch (err) { alert('No he podido leer el pedido: ' + err.message); }
}
function quitarPropuesta() {
  const p = pedidoActual();
  if (!confirm('¿Quitar la propuesta y sus decisiones?')) return;
  p.propuesta = null; p.decisiones = {}; invalidar(p); guardar(); pintar();
}

  <div class="resumen">

    ${dudas ? `<span class="chip aviso">${dudas} con dudas de lectura</span>` : ''}

  </div>
  <div class="tabla-scroll"><table class="t-lineas">
    <tr><th class="num">Cant.</th><th>Exp.</th><th>Referencia</th><th>Descripción</th><th class="num">Precio</th><th>Duda de lectura</th><th></th></tr>

      const ref = CP.normRef(l.ref);

        <td class="c-ref"><input class="ref" value="${h(l.ref)}" onchange="cambiaLinea(${i},'ref',this.value)">
          ${fuera ? `<div class="sugerencia">No está en el catálogo.${sug.length ? ' ¿Quizá…? ' + sug.map((s) => `<button onclick="cambiaLinea(${i},'ref',${js(s.ref)})" title="${h(s.desc)}">${h(s.ref)} · ${h(s.desc.slice(0, 24))}${s.precio != null ? ' · ' + fmt(s.precio) : ''}</button>`).join('') : ''}</div>` : ''}</td>
        <td class="c-desc"><input value="${h(l.desc)}" onchange="cambiaLinea(${i},'desc',this.value)">${enCat && enCat.d ? `<div class="pequeno">${h(enCat.d)}</div>` : ''}</td>
        <td class="c-precio"><input class="precio" inputmode="decimal" value="${l.precio == null ? '' : h(fmtPrecio(l.precio))}" onchange="cambiaLinea(${i},'precio',this.value)">

        <td class="c-x"><button class="btn peque peligro" onclick="borrarLinea(${i})" title="Borrar la línea entera">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  ${dudas ? `<div class="pequeno" style="margin-top:6px">Las filas en ámbar tienen una duda de lectura: compruébalas con la foto y borra el texto de la duda cuando estén bien.</div>` : ''}`;
}

function vistaComparacion(p, filas) {
  const pend = CP.sinDecidir(filas, p.decisiones);
  const n = {
    ok: filas.filter((f) => f.estado === 'ok').length,
    info: filas.filter((f) => !f.revisar && f.motivos.some((m) => m.informativo)).length,
    revisar: filas.filter((f) => f.revisar).length,
  };
  // Lo esencial primero: lo que falta, luego lo que sobra, luego el resto.
  const peso = (f) => (f.cantPropuesta < f.cantPedida ? 0 : f.cantPropuesta > f.cantPedida ? 1 : 2);
  const mostrar = (soloDiscordancias ? filas.filter((f) => f.motivos.length) : filas).slice().sort((a, b) => peso(a) - peso(b));
  const nombres = { reclamar: '✉️ Reclamar al proveedor (esperar respuesta)', resto: 'Sin stock: dejar en restos', anular: 'Descartar (descatalogado o ya no lo quiere)', aceptar: 'Aceptar propuesta', mantener: 'Mantener lo pedido', manual: 'Cantidad/precio a mano', excluir: 'Excluir línea' };
  return `
  <div class="tarjeta">
    <h2>3 · Comparación y decisiones</h2>
    ${bloqueFaltasSobras(p, filas)}
    <h3 style="margin-top:16px">Todas las diferencias</h3>
    ${esRepo(p) ? '' : `<div class="pequeno" style="margin-bottom:6px">En un cambio de precio, tu decisión fija el <b>precio al cliente</b> (listado imprimible): «Mantener lo pedido» = el que apuntó el comercial. El Excel de Géminis lleva siempre el <b>coste que factura el proveedor</b>.</div>`}
    <div class="resumen">
      <span class="chip ok">${n.ok} cuadran</span>
      ${n.info ? `<span class="chip info">${n.info} con cambio de precio informativo</span>` : ''}
      <span class="chip ${n.revisar ? 'mal' : 'ok'}">${n.revisar} discordancias</span>
      ${pend.length ? `<span class="chip aviso">${pend.length} sin decidir</span>` : ''}
    </div>
    <label class="no-imprimir" style="flex-direction:row;align-items:center;gap:6px;margin:6px 0">
      <input type="checkbox" ${soloDiscordancias ? 'checked' : ''} onchange="soloDiscordancias=this.checked;pintar()"> Ver solo lo que no cuadra
    </label>
    ${mostrar.length ? `<div class="tabla-scroll"><table>
      <tr><th>Referencia</th><th>Descripción</th><th class="num">Pedido</th><th class="num">Propuesta</th><th class="num">${esRepo(p) ? 'Neto pedido' : 'Precio pedido'}</th><th class="num">${esRepo(p) ? 'Neto propuesta' : 'Precio propuesta'}</th><th>Qué pasa</th><th>Decisión</th></tr>
      ${mostrar.map((f) => {
        const d = p.decisiones[f.ref] || {};
        const acciones = CP.accionesPara(f, p.tipo);
        return `<tr>
          <td><b>${h(f.ref)}</b>${f.sugerencias.length ? `<div class="sugerencia">¿Quizá ${f.sugerencias.map((s) => h(s.ref)).join(', ')}? Corrígela arriba.</div>` : ''}</td>
          <td>${h(f.desc)}</td>
          <td class="num">${f.cantPedida || '—'}</td><td class="num">${f.cantPropuesta || '—'}</td>
          <td class="num">${f.precioDeHistorial ? fmt(f.precioReferencia) + '<div class="pequeno">(último aceptado)</div>' : celdaPrecio(p, f.precioPedido, f.dtosPedido, f.netoPedido)}</td>
          <td class="num">${celdaPrecio(p, f.precioPropuesta, f.dtosPropuesta, f.netoPropuesta)}${f.difPrecio != null ? `<div class="motivo ${Math.abs(f.difPrecio) > (esRepo(p) ? CP.TOLERANCIA.reposicion : CP.TOLERANCIA.comercial) ? 'revisar' : ''}">${f.difPrecio > 0 ? '+' : ''}${fmt(f.difPrecio)} € (${f.difPrecioPct > 0 ? '+' : ''}${fmt(f.difPrecioPct)} %)</div>` : ''}</td>
          <td>${f.motivos.length ? f.motivos.map((m) => `<div class="motivo ${m.revisar ? 'revisar' : ''}">${h(m.texto)}</div>`).join('') : '<span class="chip ok">Cuadra</span>'}</td>
          <td class="no-imprimir">${f.revisar ? `
            <select onchange="decide(${js(f.ref)},'accion',this.value)">
              <option value="">— decidir —</option>
              ${acciones.map((a) => `<option value="${a}" ${d.accion === a ? 'selected' : ''}>${nombres[a]}</option>`).join('')}
            </select>
            ${d.accion === 'manual' ? `<div class="fila" style="margin-top:4px"><input class="cant" placeholder="Cant." value="${h(d.cant)}" onchange="decide(${js(f.ref)},'cant',this.value)"><input class="precio" placeholder="${esRepo(p) ? 'Neto' : 'Precio'}" value="${h(d.precio)}" onchange="decide(${js(f.ref)},'precio',this.value)"></div>` : ''}
            <input style="margin-top:4px" placeholder="Nota de facturación (opcional)" value="${h(d.nota)}" onchange="decide(${js(f.ref)},'nota',this.value)">
          ` : ''}</td>
        </tr>`;
      }).join('')}
    </table></div>` : `<div class="aviso-caja ok">Todo cuadra.</div>`}
    <div class="fila no-imprimir" style="margin-top:14px">
      <button class="btn primario" ${pend.length ? 'disabled' : ''} onclick="validarPedido()">Validar pedido</button>
      ${pend.length ? `<span class="pequeno">Decide las ${pend.length} discordancias pendientes para poder validar.</span>` : (esRepo(p) ? `<span class="pequeno">Al validar se guardan los precios netos aceptados para comparar los próximos pedidos. Las faltas de reposición no van a Restos.</span>`
        : `<span class="pequeno">Al validar, lo que no llega pasa a Restos y las notas a Notas de facturación.</span>`)}
    </div>
    ${p.validado ? `<div class="fila no-imprimir" style="margin-top:10px">
      ${esRepo(p) ? `<button class="btn" onclick="window.print()">Imprimir comparación</button>` : `<button class="btn" onclick="imprimirListado('${p.id}')">Imprimir listado del cliente</button>`}
      <button class="btn" onclick="exportarPedidos(['${p.id}'])">📥 Excel de la compra al proveedor (Géminis)</button>
    </div>` : ''}
  </div>`;
}

/** Lo que de verdad importa de un pedido: qué falta y qué sobra. */
function bloqueFaltasSobras(p, filas) {
  const { faltan, sobran } = CP.faltasYSobras(filas);
  const pendientes = CP.faltasPendientes(filas, p.decisiones);
  const pend = new Set(pendientes.map((x) => x.ref));
  const doc = esRepo(p) ? 'la factura/propuesta' : 'la propuesta';
  const decidido = { reclamar: '✉️ reclamada, esperando respuesta del proveedor', resto: 'sin stock: en restos', anular: 'descartada definitivamente', excluir: 'descartada', aceptar: 'aceptada la propuesta', mantener: 'se mantiene lo pedido', manual: 'a mano' };
  const linea = (x, signo, falta) => {
    const acc = falta && (p.decisiones[x.ref] || {}).accion;
    const fuera = falta && !pend.has(x.ref);
    return `<li${fuera ? ' class="descartada"' : ''}><b>${h(x.ref)}</b> ${h(x.desc)} — ${signo}${x.cant}${x.total ? '' : ` de ${x.de}`} ud.${x.total ? '' : ' (parcial)'}${x.sustitucion ? ` <span class="pequeno">¿sustitución ${h(x.sustitucion)}?</span>` : ''}${acc ? ` <span class="pequeno">· ${h(decidido[acc] || acc)}</span>` : ''}</li>`;
  };
  return `
    <div class="aviso-caja ${pendientes.length ? 'mal' : 'ok'}" style="margin-top:0">
      <b>${pendientes.length ? `❌ Faltan ${pendientes.length} referencia(s)` : faltan.length ? '✅ Ninguna falta pendiente' : '✅ No falta nada'}</b> — pedido que no viene en ${doc}${faltan.length > pendientes.length ? ` <span class="pequeno">(${faltan.length - pendientes.length} ya decidida(s): no cuentan)</span>` : ''}
      ${faltan.length ? `<ul style="margin:6px 0 0;padding-left:18px">${faltan.map((x) => linea(x, '', true)).join('')}</ul>` : ''}
    </div>
    <div class="aviso-caja ${sobran.length ? 'aviso' : 'ok'}">
      <b>${sobran.length ? `⚠️ Sobran ${sobran.length} referencia(s)` : '✅ No sobra nada'}</b> — vienen en ${doc} sin haberse pedido (o de más)
      ${sobran.length ? `<ul style="margin:6px 0 0;padding-left:18px">${sobran.map((x) => linea(x, '+')).join('')}</ul>` : ''}
    </div>`;
}

/** Si la propuesta trae algo que otro cliente tiene pendiente en restos, se avisa. */
function avisoRestosEnPropuesta(p) {
  if (!p.propuesta) return '';
  const refs = new Set(p.propuesta.lineas.map((l) => CP.normRef(l.ref)));
  const r = E.restos.filter((x) => x.pendiente > 0 && !x.anulado && x.pedidoId !== p.id && x.proveedor === p.proveedor && refs.has(CP.normRef(x.ref)));
  if (!r.length) return '';
  return `<div class="aviso-caja info"><b>Esta propuesta trae artículos que están en restos de otros clientes:</b><br>${r.map((x) =>
    `${h(x.ref)} ${h(x.desc)} — ${x.pendiente} ud. de <b>${h(x.cliente)}</b> (pedido ${h(x.numero)}, ${h(fmtFecha(x.fecha))})`).join('<br>')}
    <br><span class="pequeno">Cuando llegue la mercancía, regístralo en «Restos → Registrar llegada» para asignárselo.</span></div>`;
}

// ── Edición ──────────────────────────────────────────────────────────────────
function pedidoActual() { return pedidoPorId(pedidoAbierto); }
function invalidar(p) { p.validado = false; }
function cambiaCampo(campo, valor) {
  const p = pedidoActual();
  p[campo] = campo === 'campana' ? campanaCanonica(p.proveedor, valor) : valor;
  invalidar(p); guardar(); pintar();
}
function cambiaLinea(i, campo, valor, lado) {
  const p = pedidoActual();
  const l = (lado === 'propuesta' ? p.propuesta.lineas : p.lineas)[i];
  if (campo === 'precio') l.precio = CP.parseNum(valor);
  else if (campo === 'cant') l.cant = CP.parseNum(valor) || 0;
  else if (campo === 'ref') l.ref = CP.normRef(valor);
  else if (campo === 'dtos') l.dtos = CP.parseDtos(valor);
  else if (campo === 'udsCaja') l.udsCaja = CP.parseNum(valor);
  else l[campo] = valor;
  if (['cant', 'precio', 'dtos'].includes(campo)) l.importe = null; // el importe del Excel ya no vale
  if (campo !== 'duda') invalidar(p); // quitar o anotar una duda no cambia el pedido
  guardar(); pintar();
}
function borrarLinea(i, lado) {
  const p = pedidoActual();
  const lista = lado === 'propuesta' ? p.propuesta.lineas : p.lineas;
  if (lado !== 'propuesta' && p.registro && p.registro.length) apuntar(p, 'baja', lista[i]);
  lista.splice(i, 1); invalidar(p); guardar(); pintar();
}
/** Bloc del pedido: queda constancia, con la hora, de cada artículo que se
 *  mete a mano casilla a casilla (y de los que se borran después). */
const textoLinea = (l) => `${fmt(l.cant).replace(',00', '')}${l.exp ? ' EXP' : ''} × ${l.ref}${l.desc ? ' ' + l.desc : ''}${l.precio != null ? ' · ' + fmt(l.precio) + ' €' : ''}`;
function apuntar(p, accion, l) {
  const reg = (p.registro = p.registro || []);
  const ahora = new Date().toISOString();
  const texto = textoLinea(l);
  // Al borrar, se tacha la apuntada (no se apunta otra vez).
  const previa = accion === 'baja' && [...reg].reverse().find((x) => x.accion === 'alta' && !x.borrada && x.texto === texto);
  if (previa) previa.borrada = ahora;
  else reg.push({ hora: ahora, accion, texto, quien: nube.usuario || '', cant: l.cant, exp: !!l.exp, ref: l.ref, desc: l.desc || '', precio: l.precio == null ? null : l.precio });
}
function copiarBloc() {
  const p = pedidoActual();
  const t = [`Pedido ${p.proveedor} nº ${p.numero}${p.cliente ? ' · ' + p.cliente : ''}`]
    .concat((p.registro || []).map((x, i) => `${i + 1}. ${x.texto}${x.borrada || x.accion === 'baja' ? ' (borrada)' : ''}`)).join('\n');
  const hecho = () => alert('Bloc copiado.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(hecho, () => prompt('Copia el texto:', t));
  else prompt('Copia el texto:', t);
}
function anadirLinea() { const p = pedidoActual(); p.lineas.push({ ref: '', desc: '', cant: 1, precio: null, exp: false, duda: '' }); guardar(); pintar(); }
/** Entrada de artículos casilla a casilla, pensada para tableta: Enter pasa a
 *  la siguiente (cantidad → referencia → descripción → precio) y en el precio
 *  añade la línea y vuelve a la cantidad. Si la referencia está en el
 *  catálogo del proveedor, rellena descripción y precio (se pueden cambiar). */
const CAMPOS_RAPIDA = ['qaCant', 'qaRef', 'qaDesc', 'qaPrecio'];
/** El bloc del pedido como una hoja de libreta (como los talonarios de las
 *  fotos): renglones, margen rojo y columnas Cantidad · Referencia ·
 *  Descripción · Precio. Arriba, lo apuntado a mano (lo borrado, tachado);
 *  el último renglón es donde se escribe. */
function libreta(p) {
  const reg = p.registro || [];
  const hora = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${fmtFecha(iso.slice(0, 10))} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const borradas = reg.filter((x) => x.borrada || x.accion === 'baja').length;
  const escritas = reg.map((x, n) => {
    const tachada = x.borrada || x.accion === 'baja';
    const titulo = `${hora(x.hora)}${x.quien ? ' · ' + x.quien : ''}${x.borrada ? ' · borrada ' + hora(x.borrada) : ''}`;
    const celdas = x.ref != null
      ? `<span class="l-cant">${h(fmt(x.cant).replace(',00', ''))}${x.exp ? ' <small>EXP</small>' : ''}</span><span class="l-ref">${h(x.ref)}</span><span class="l-desc">${h(x.desc)}</span><span class="l-precio">${x.precio == null ? '' : h(fmtPrecio(x.precio))}</span>`
      : `<span class="l-todo">${h(x.texto)}</span>`; // apuntes de antes, sin columnas
    return `<div class="renglon escrito${tachada ? ' tachado' : ''}" title="${h(titulo)}"><span class="l-num">${n + 1}</span>${celdas}</div>`;
  }).join('');
  const campo = (id, extra) => `<input id="${id}" autocomplete="off" autocapitalize="characters" onkeydown="teclaRapida(event, '${id}')" ${extra}>`;
  return `
    <div class="libreta no-imprimir">
      <div class="libreta-cab"><b>📝 Bloc del pedido</b>${reg.length ? ` · ${reg.length} apuntado(s)${borradas ? ` · ${borradas} tachado(s)` : ''}` : ''}
        <span class="pequeno">· escribe y pulsa <b>Enter</b>: cantidad → referencia → descripción → precio; en el precio, Enter apunta la línea. <b>ud</b>/<b>EXP</b>: unidades o expositores. <b>ABC</b>: teclado de letras para la referencia.</span></div>
      <div class="hoja" id="hojaLibreta">
        <div class="renglon titulos"><span class="l-num"></span><span class="l-cant">Cant.</span><span class="l-ref"><span class="t-largo">Referencia</span><span class="t-corto">Ref.</span> <button type="button" id="qaRefModo" class="exp-toggle" title="Teclado de letras o de números para la referencia" onclick="modoRef()">ABC</button></span><span class="l-desc">Descripción</span><span class="l-precio">Precio</span></div>
        ${escritas}
        <form class="renglon nuevo" onsubmit="event.preventDefault(); envioRapida()">
          <span class="l-num">${reg.length + 1}</span>
          <span class="l-cant">${campo('qaCant', 'inputmode="decimal" enterkeyhint="next" placeholder="1" aria-label="Cantidad"')}<button type="button" id="qaExp" class="exp-toggle" aria-pressed="false" title="Unidades o expositor: toca para cambiar" onclick="alternarExp(this)">ud</button></span>
          <span class="l-ref">${campo('qaRef', 'inputmode="decimal" enterkeyhint="next" aria-label="Referencia"')}</span>
          <span class="l-desc">${campo('qaDesc', 'enterkeyhint="next" aria-label="Descripción"')}</span>
          <span class="l-precio">${campo('qaPrecio', 'inputmode="decimal" enterkeyhint="done" aria-label="Precio"')}</span>
          <button type="submit" class="oculto" tabindex="-1">Apuntar</button>
        </form>
        <div class="renglon"></div><div class="renglon"></div>
      </div>
      <div class="fila" style="margin-top:8px">
        <button class="btn primario" onclick="anadirRapida()">Apuntar línea</button>
        ${reg.length ? '<button class="btn peque" onclick="copiarBloc()">Copiar el bloc</button>' : ''}
      </div>
    </div>`;
}
/** Teclado de números ↔ de letras para la referencia del renglón (en cada línea nueva vuelve a números). */
function modoRef() {
  const i = document.getElementById('qaRef');
  const b = document.getElementById('qaRefModo');
  const letras = i.getAttribute('inputmode') !== 'text';
  i.setAttribute('inputmode', letras ? 'text' : 'decimal');
  b.textContent = letras ? '123' : 'ABC';
  b.setAttribute('aria-pressed', String(letras));
  i.blur(); setTimeout(() => i.focus(), 0); // Android solo cambia de teclado al volver a enfocar
}
/** Unidades ↔ expositor de la línea que se está escribiendo (vuelve a «ud» en cada línea nueva). */
function alternarExp(b) {
  const exp = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', String(exp));
  b.textContent = exp ? 'EXP' : 'ud';
}
/** Si el teclado (Android) no manda la tecla Enter, el formulario se envía igual: se sigue por aquí. */
function envioRapida() {
  const id = document.activeElement && document.activeElement.id;
  if (CAMPOS_RAPIDA.includes(id)) teclaRapida({ key: 'Enter', preventDefault() {} }, id);
  else anadirRapida();
}
function teclaRapida(ev, id) {
  if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
  ev.preventDefault();
  if (id === 'qaRef') completarDesdeCatalogo();
  if (id === 'qaPrecio') { anadirRapida(); return; }
  const sig = document.getElementById(CAMPOS_RAPIDA[CAMPOS_RAPIDA.indexOf(id) + 1]);
  sig.focus(); sig.select();
}
function completarDesdeCatalogo() {
  const cat = catalogoDe(pedidoActual().proveedor);
  const ref = CP.normRef(document.getElementById('qaRef').value);
  const it = cat && ref && cat[ref];
  if (!it) return;
  const desc = document.getElementById('qaDesc');
  const precio = document.getElementById('qaPrecio');
  if (!desc.value.trim() && it.d) desc.value = it.d;
  if (!precio.value.trim() && it.p != null) precio.value = fmt(it.p);
}
function anadirRapida() {
  const v = (id) => document.getElementById(id).value.trim();
  // «1EXP» o «1 exp» en la cantidad también marca expositor.
  const mc = v('qaCant').match(/^(\d+(?:[.,]\d+)?)\s*(EXP\.?|EX\.?)?$/i);
  if (!mc) { const c = document.getElementById('qaCant'); c.focus(); c.select(); return; }
  if (!v('qaRef')) { document.getElementById('qaRef').focus(); return; }
  const p = pedidoActual();
  const l = { cant: CP.parseNum(mc[1]), exp: Boolean(mc[2]) || document.getElementById('qaExp').getAttribute('aria-pressed') === 'true', ref: CP.normRef(v('qaRef')),
    desc: v('qaDesc').toUpperCase(), precio: v('qaPrecio') ? CP.parseNum(v('qaPrecio')) : null, dtos: [], duda: '' };
  p.lineas.push(l);
  apuntar(p, 'alta', l);
  invalidar(p); guardar(); pintar();
  const hoja = document.getElementById('hojaLibreta'); if (hoja) hoja.scrollTop = hoja.scrollHeight;
  document.getElementById('qaCant').focus();
}
function borrarPedido(id) {
  const p = id ? pedidoPorId(id) : pedidoActual();
  if (!p) return;
  const asignados = E.restos.some((r) => r.pedidoId === p.id && r.asignaciones.length);
  const quien = esRepo(p) ? `la reposición de ${p.proveedor}${p.numero ? ' nº ' + p.numero : ''}` : `el pedido nº ${p.numero} de ${p.cliente}`;
  if (!confirm(`¿Borrar ${quien}? Se borra para todos los dispositivos.` + (asignados ? '\nSus restos con llegadas registradas se conservan.' : ''))) return;
  quitarPedidos([p.id]);
  pedidoAbierto = null; guardar(); pintar();
}
function quitarPedidos(ids) {
  const fuera = new Set(ids);
  E.pedidos = E.pedidos.filter((x) => !fuera.has(x.id));
  E.restos = E.restos.filter((r) => !fuera.has(r.pedidoId) || r.asignaciones.length);
  E.notas = E.notas.filter((n) => !fuera.has(n.pedidoId));
}
/** Una campaña entera (o todas las reposiciones de un proveedor), con doble confirmación. */
function borrarCampana(clave) {
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave);
  if (!ps.length) return;
  const nombre = nombreGrupo(ps[0]);
  if (!confirm(`¿Borrar «${nombre}» entera? Son ${ps.length} pedido(s), con sus restos y notas. Se borra para todos los dispositivos y no se puede deshacer.`)) return;
  const r = prompt(`Para confirmar, escribe BORRAR:`);
  if (r == null || r.trim().toUpperCase() !== 'BORRAR') { alert('No se ha borrado nada.'); return; }
  quitarPedidos(ps.map((p) => p.id));
  pedidoAbierto = null; guardar(); pintar();
}
function decide(ref, campo, valor) {
  const p = pedidoActual();
  p.decisiones[ref] = Object.assign({}, p.decisiones[ref], { [campo]: valor });
  invalidar(p); guardar(); pintar();
}

/** «4 780100027 3,25 CALENDARIO» · «1EXP 883840127 180,14» · también separado por tabuladores (copiado de Excel). */
function pegarLineas(destino) {
  const p = pedidoActual();
  const aPropuesta = destino === 'propuesta';
  const txt = document.getElementById(aPropuesta ? 'txtPegarProp' : 'txtPegar').value;
  const nuevas = [];
  const malas = [];
  for (const crudo of txt.split(/\r?\n/)) {
    const linea = crudo.trim();
    if (!linea) continue;
    const m = linea.match(/^(\d+(?:[.,]\d+)?)\s*(EXP\.?|EX\.?)?\s+(\S+)\s*(.*)$/i);
    if (!m) { malas.push(linea); continue; }
    let resto = m[4].trim();
    let precio = null;
    const mp = resto.match(/(?:^|\s)(\d+(?:[.,']\d{1,2})?)\s*€?\s*(.*)$/);
    if (mp) { precio = CP.parseNum(mp[1]); resto = (resto.slice(0, mp.index) + ' ' + mp[2]).trim(); }
    // Descuentos justo tras el precio, solo si llevan % o + (un número suelto
    // podría ser el principio de la descripción): «10%», «10+5», «10%+5%».
    let dtos = [];
    const md = resto.match(/^(\d+(?:[.,]\d+)?%(?:\s*\+\s*\d+(?:[.,]\d+)?%?)*|\d+(?:[.,]\d+)?(?:\s*\+\s*\d+(?:[.,]\d+)?%?)+)\s*(.*)$/);
    if (md) { dtos = CP.parseDtos(md[1].replace(/\s+/g, '')); resto = md[2].trim(); }
    nuevas.push({ cant: CP.parseNum(m[1]), exp: Boolean(m[2]), ref: CP.normRef(m[3]), precio, dtos, desc: resto, duda: '' });
  }
  if (aPropuesta) {
    if (p.propuesta && !confirm('¿Sustituir la propuesta actual por estas líneas?')) return;
    p.propuesta = { archivo: 'Líneas pegadas', fecha: hoy(), cabecera: {}, lineas: nuevas };
  } else {
    p.lineas.push(...nuevas);
  }
  invalidar(p); guardar(); pintar();
  if (malas.length) alert(`Añadidas ${nuevas.length}. No he entendido ${malas.length}:\n` + malas.slice(0, 8).join('\n'));
}
