<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Pedidos · Ofipapel</title>
<meta name="theme-color" content="#1e7d32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-pedidos.json">
<link rel="icon" type="image/png" href="icon-ofipapel-192.png">
<link rel="apple-touch-icon" href="icon-ofipapel-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="control-pedidos-logica.js"></script>
<!--
  Control de pedidos del comercial: compara lo que el comercial apuntó a mano
  con la propuesta que manda el proveedor, obliga a decidir cada discordancia,
  deja en RESTOS lo que el cliente pidió y no llega, y reconoce esos restos
  cuando aparecen en un pedido posterior. Exporta el Excel 5.0/95 para Géminis.

  Las reglas viven en control-pedidos-logica.js (con pruebas en
  scripts/probar-control-pedidos.js); aquí solo hay interfaz.

  Los datos se guardan en este navegador (localStorage). Es una app de un solo
  usuario por ahora: si se borra el navegador se pierde todo, así que la
  pestaña «Datos» descarga una copia de seguridad. Pasar a una base de datos
  compartida es el siguiente paso cuando haga falta usarla desde dos equipos.
-->
<style>
:root{
  --verde-oscuro:#145c26; --verde:#1e7d32; --verde-claro:#eaf7ec; --acento:#8bc34a;
  --texto:#1c2b1f; --texto2:#5d6b5f; --borde:#dfe8e1; --fondo:#f6f9f7; --tarjeta:#fff;
  --rojo:#b3261e; --rojo-claro:#fdecea; --ambar:#8a5a00; --ambar-claro:#fff4dc; --azul-claro:#e8f0fe; --azul:#1a56b0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:var(--texto);background:var(--fondo);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));color:#fff;padding:18px 16px 0}
header h1{margin:0 0 4px;font-size:22px}
header p{margin:0 0 14px;opacity:.85;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.75;padding:10px 14px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0}
nav button.activa{background:var(--fondo);color:var(--verde-oscuro);opacity:1;font-weight:600}
nav .cuenta{background:#fff3;border-radius:10px;padding:1px 7px;margin-left:4px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:14px}
.tarjeta h2{margin:0 0 12px;font-size:17px;color:var(--verde-oscuro)}
.tarjeta h3{margin:14px 0 8px;font-size:15px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--texto2);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c8d4cb;border-radius:8px;background:#fff;color:var(--texto)}
input[type=number]{width:80px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.btn{font:inherit;border:1px solid var(--verde);background:#fff;color:var(--verde-oscuro);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--verde-claro)}
.btn.primario{background:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-oscuro)}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn.peque{padding:4px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabla-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--texto2);font-weight:600;border-bottom:2px solid var(--borde);padding:6px}
td{border-bottom:1px solid var(--borde);padding:5px 6px;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clic{cursor:pointer} tr.clic:hover{background:var(--verde-claro)}
td input{padding:4px 6px;width:100%} td input.cant{width:64px} td input.precio{width:82px}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
/* Un nombre de fichero o una referencia muy larga sin espacios no puede
   ensanchar la página: en Android eso hace que Chrome la aleje entera. */
main{overflow-wrap:anywhere}
.chip.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.chip.mal{background:var(--rojo-claro);color:var(--rojo)}
.chip.aviso{background:var(--ambar-claro);color:var(--ambar)}
.chip.info{background:var(--azul-claro);color:var(--azul)}
.chip.gris{background:#eef0ef;color:var(--texto2)}
.motivo{font-size:12px;color:var(--texto2)}
.motivo.revisar{color:var(--rojo)}
.duda{background:var(--ambar-claro)}
.fuera-catalogo input.ref{border-color:var(--rojo);background:var(--rojo-claro)}
.sugerencia{font-size:12px;margin-top:3px}
.sugerencia button{font-size:12px;border:1px dashed var(--azul);background:var(--azul-claro);color:var(--azul);border-radius:6px;padding:1px 6px;cursor:pointer;margin:2px 3px 0 0}
.aviso-caja{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.aviso-caja.mal{background:var(--rojo-claro);color:var(--rojo)}
.aviso-caja.aviso{background:var(--ambar-claro);color:var(--ambar)}
.aviso-caja.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.aviso-caja.info{background:var(--azul-claro);color:var(--azul)}
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.vacio{color:var(--texto2);font-style:italic;padding:8px 0}
li.descartada{text-decoration:line-through;opacity:.65}
.entrada-rapida{background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin:10px 0}
.entrada-rapida input{font-size:17px}
details.bloc{background:#fffdf3;border:1px solid #eadfa8;border-radius:10px;padding:8px 12px;margin:0 0 10px}
details.bloc summary{cursor:pointer}
details.bloc ol{margin:8px 0;padding-left:26px;max-height:260px;overflow:auto;font-size:15px;line-height:1.6}
details.bloc .baja{text-decoration:line-through;color:var(--texto2)}
details.bloc .hora{color:var(--texto2);font-size:12px;margin-right:4px}
.casilla{flex-direction:row!important;align-items:center;gap:6px;align-self:flex-end;padding-bottom:8px}
details.grupo{border:1px solid var(--borde,#ddd);border-radius:10px;padding:10px 12px;margin-top:12px}
details.grupo>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px}
details.grupo>summary .resumen{margin:0}
details.grupo>summary::before{content:"▸";color:var(--texto2)}
details.grupo[open]>summary::before{content:"▾"}
.pequeno{font-size:12px;color:var(--texto2)}
.oculto{display:none!important}
.progreso{font-size:13px;color:var(--texto2);margin-top:6px}
/* ── Móvil (Android) ──────────────────────────────────────────────────────
   Por debajo de 700px las tablas se convierten en tarjetas: cada fila es una
   tarjeta y cada celda lleva delante el nombre de su columna (data-th, que
   pone ponerEtiquetas() al pintar). Controles de al menos 44px para el dedo y
   letra de 16px en los campos para que el navegador no haga zoom al tocarlos. */
@media (max-width:700px){
  html,body{font-size:15px}
  header{padding:12px 12px 0}
  header h1{font-size:19px} header p{font-size:12px;margin-bottom:8px}
  nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav button{flex:0 0 auto;padding:10px 12px}
  main{padding:10px}
  .tarjeta{padding:12px;border-radius:10px}
  .fila{gap:8px}
  .fila > label{flex:1 1 140px}
  .fila > .btn{flex:1 1 auto}
  input,select,textarea{font-size:16px;min-height:44px}
  input[type=checkbox]{min-height:0;width:22px;height:22px}
  input[type=file]{min-height:0;font-size:14px;max-width:100%}
  .btn{min-height:44px;padding:10px 14px}
  .btn.peque{min-height:40px;font-size:14px}
  .tabla-scroll{overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  tr:has(> th){display:none}
  tr{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
  tr.duda{background:var(--ambar-claro)}
  td{border:0;padding:4px 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;text-align:right}
  td::before{content:attr(data-th);font-size:12px;color:var(--texto2);text-align:left;flex:0 0 34%}
  td[data-th=""]::before{display:none}
  td[data-th=""]{justify-content:flex-end}
  td input,td select{flex:1 1 55%;width:auto;min-width:0}
  td input.cant,td input.precio{flex:0 1 120px}
  td > div,td .fila{flex:1 1 100%;text-align:left}
  td.num{text-align:right}
  .resumen{gap:6px}
  .chip{font-size:12px}
  .sugerencia button{padding:6px 8px;margin:4px 4px 0 0}
}
@media print{header,nav,.no-imprimir{display:none!important}body{background:#fff}.tarjeta{border:0}}
</style>
</head>
<body>
<header>
  <h1>Control de Pedidos</h1>
  <p>Pedidos del comercial y de reposición ↔ propuesta del proveedor · restos pendientes · Excel para Géminis</p>
  <nav id="nav">
    <button data-vista="pedidos" class="activa">Pedidos</button>
    <button data-vista="nuevo">✍️ Pedido a mano</button>
    <button data-vista="reposicion">🔄 Reposición</button>
    <button data-vista="restos">Restos <span class="cuenta" id="cuentaRestos">0</span></button>
    <button data-vista="notas">Notas de facturación <span class="cuenta" id="cuentaNotas">0</span></button>
    <button data-vista="datos">Datos</button>
  </nav>
</header>
<main id="main"></main>

<script>
'use strict';
const CP = window.ControlPedidos;
const CLAVE = 'ofipapel.controlPedidos.v1';
const OCR_TOKEN = 'ofipapel-ocr-2026'; // el mismo que leer-reserva-airbnb; no es un secreto (ver la función)
const FN = '/.netlify/functions/';

// ── Estado ───────────────────────────────────────────────────────────────────
// pedidos:  [{id, tipo:'comercial'|'reposicion', proveedor, campana, numero, cliente, fecha, notas,
//             lineas:[{ref,desc,cant,precio,exp,duda, dtos,udsCaja,importe (reposición)}],
//             propuesta:{archivo,fecha,cabecera,lineas}, decisiones:{ref:{accion,cant,precio,nota}}, validado, final}]
// restos:   [{id, pedidoId, proveedor, cliente, numero, ref, desc, ean, precio, cant, pendiente, fecha, asignaciones:[{fecha,cant,origen}], anulado}]
// notas:    [{id, pedidoId, cliente, numero, proveedor, ref, desc, texto, fecha, resuelta}]
// catalogos:{PROVEEDOR: {fecha, archivo, items:{ref:{d,p,ean}}}}
// historial:{PROVEEDOR: {REF: {neto, fecha}}}  último precio neto aceptado en una reposición validada
let E = cargar();
let vista = 'pedidos';
let pedidoAbierto = null;
let soloDiscordancias = true;

function cargar() {
  const base = { pedidos: [], restos: [], notas: [], catalogos: {}, historial: {} };
  try {
    const raw = localStorage.getItem(CLAVE);
    return raw ? Object.assign(base, JSON.parse(raw)) : base;
  } catch { return base; }
}
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(E)); }
  catch (e) { alert('No se han podido guardar los cambios en este navegador (' + e.message + '). Descarga una copia en «Datos».'); }
  pintarCuentas();
}

const h = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Valor seguro dentro de un onclick="…": literal JSON escapado para atributo. */
const js = (v) => h(JSON.stringify(String(v == null ? '' : v)));
const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const hoy = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => CP.fmt(n);
const fmtFecha = (f) => (f && /^\d{4}-\d{2}-\d{2}/.test(f)) ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : (f || '');
const prov = (s) => String(s || '').trim().toUpperCase();
const pedidoPorId = (id) => E.pedidos.find((p) => p.id === id);
const catalogoDe = (proveedor) => (E.catalogos[prov(proveedor)] || {}).items || null;
const esRepo = (p) => p.tipo === 'reposicion';
const preciosAnteriores = (proveedor) => Object.fromEntries(Object.entries(E.historial[prov(proveedor)] || {}).map(([k, v]) => [k, v.neto]));
const fmtDtos = (d) => (CP.parseDtos(d).length ? CP.parseDtos(d).map((x) => fmt(x).replace(',00', '')).join('+') + ' %' : '');

// ── Navegación ───────────────────────────────────────────────────────────────
document.getElementById('nav').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-vista]');
  if (!b) return;
  vista = b.dataset.vista;
  pedidoAbierto = null;
  prefijoNuevo = null; // desde la pestaña, sin campaña impuesta
  pintar();
});

function pintarCuentas() {
  document.getElementById('cuentaRestos').textContent = E.restos.filter((r) => r.pendiente > 0 && !r.anulado).length;
  document.getElementById('cuentaNotas').textContent = E.notas.filter((n) => !n.resuelta).length;
}

function pintar() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('activa', b.dataset.vista === vista));
  const main = document.getElementById('main');
  if (vista === 'pedidos') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaLista();
  else if (vista === 'nuevo') main.innerHTML = vistaNuevo();
  else if (vista === 'reposicion') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaReposicion();
  else if (vista === 'restos') main.innerHTML = vistaRestos();
  else if (vista === 'notas') main.innerHTML = vistaNotas();
  else main.innerHTML = vistaDatos();
  ponerEtiquetas(main);
  pintarCuentas();
}

/** Copia el título de cada columna a sus celdas (data-th) para que en el
 *  móvil, donde la tabla se ve como tarjetas, cada dato lleve su nombre. */
function ponerEtiquetas(raiz) {
  raiz.querySelectorAll('table').forEach((t) => {
    const cab = [...t.rows].find((f) => f.querySelector('th'));
    if (!cab) return;
    const nombres = [...cab.cells].map((c) => c.textContent.trim());
    for (const fila of t.rows) {
      if (fila === cab) continue;
      [...fila.cells].forEach((c, i) => { if (!c.hasAttribute('data-th')) c.setAttribute('data-th', nombres[i] || ''); });
    }
  });
}

// ── Estado de un pedido ──────────────────────────────────────────────────────
function comparar(p) {
  if (!p.propuesta) return null;
  // Reposición: precio NETO (tras todos los descuentos), 0,25 € informativo, y
  // si el pedido no trae precio se compara con el último aceptado.
  if (esRepo(p)) {
    return CP.compararPedido(p.lineas, p.propuesta.lineas, { catalogo: catalogoDe(p.proveedor), comparar: 'neto',
      tolerancia: CP.TOLERANCIA.reposicion, preciosAnteriores: preciosAnteriores(p.proveedor) });
  }
  // Comercial: tolerancia cero en precio.
  return CP.compararPedido(p.lineas, p.propuesta.lineas, { catalogo: catalogoDe(p.proveedor), tolerancia: CP.TOLERANCIA.comercial });
}
/** Fotos del pedido (las antiguas, sin registro, se deducen de sus líneas). */
function fotosDe(p) {
  if (p.fotos && p.fotos.length) return p.fotos;
  return [...new Set(p.lineas.map((l) => l.foto).filter(Boolean))].map((nombre) => ({ nombre, hoja: '' }));
}
function celdaFotos(p) {
  const r = CP.hojasDelPedido(fotosDe(p));
  if (!r.fotos) return '—';
  return `${r.fotos}${r.total ? ` <span class="pequeno">(${r.hojas.length} de ${r.total} hojas)</span>` : ''}${r.faltan.length ? ` <span class="chip mal">falta hoja ${r.faltan.join(', ')}</span>` : ''}`;
}
function avisoFotos(p) {
  const fotos = fotosDe(p);
  const r = CP.hojasDelPedido(fotos);
  if (!r.fotos) return '';
  return `<div class="aviso-caja ${r.faltan.length ? 'mal' : 'info'}">📷 <b>${r.fotos} foto(s)</b>${r.total ? ` · hojas leídas ${r.hojas.join(', ')} de ${r.total}` : ''}
    ${r.faltan.length ? `<br><b>⚠️ Falta la hoja ${r.faltan.join(', ')} de ${r.total}:</b> súbela con «Hacer foto» o «Elegir de la galería».` : ''}
    <div class="pequeno" style="margin-top:4px">${fotos.map((f) => `<span style="display:inline-block;margin:2px 8px 2px 0">${h(f.nombre)}${f.hoja ? ` (hoja ${h(f.hoja)})` : ''}${f.lineas != null ? ` · ${f.lineas} línea(s)` : ''}
      <button class="btn peque peligro no-imprimir" style="padding:1px 6px" onclick="quitarFoto(${js(f.nombre)})" title="Quitar esta foto y sus líneas">quitar</button></span>`).join('')}</div></div>`;
}
function chipsFaltasSobras(p) {
  const filas = comparar(p);
  if (!filas) return '';
  const { sobran } = CP.faltasYSobras(filas);
  const faltan = CP.faltasPendientes(filas, p.decisiones);
  return ` <span class="chip ${faltan.length ? 'mal' : 'ok'}">${faltan.length} faltan</span> <span class="chip ${sobran.length ? 'aviso' : 'ok'}">${sobran.length} sobran</span>`;
}
function estadoPedido(p) {
  if (p.validado) return { chip: 'ok', texto: 'Validado' };
  if (!p.lineas.length) return { chip: 'gris', texto: 'Sin líneas' };
  if (!p.propuesta) return { chip: 'gris', texto: 'Sin propuesta' };
  const pend = CP.sinDecidir(comparar(p), p.decisiones).length;
  return pend ? { chip: 'aviso', texto: pend + ' por decidir' } : { chip: 'info', texto: 'Listo para validar' };
}

// ── Campañas ─────────────────────────────────────────────────────────────────
// Los pedidos del comercial se agrupan por proveedor + campaña; las
// reposiciones, por proveedor. La campaña se escribe a mano, así que se busca
// una ya existente que solo cambie en mayúsculas, tildes o espacios
// («agendas  2027» → «Agendas 2027»): si no, saldrían dos campañas distintas.
const claveTexto = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
function campanaCanonica(proveedor, texto) {
  const t = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  const igual = E.pedidos.find((p) => !esRepo(p) && p.campana && prov(p.proveedor) === prov(proveedor) && claveTexto(p.campana) === claveTexto(t));
  return igual ? igual.campana : t;
}
const campanasExistentes = () => [...new Set(E.pedidos.filter((p) => !esRepo(p) && p.campana).map((p) => p.campana))].sort((a, b) => a.localeCompare(b, 'es'));
const claveGrupo = (p) => esRepo(p) ? 'R|' + prov(p.proveedor) : 'C|' + prov(p.proveedor) + '|' + claveTexto(p.campana);
const nombreGrupo = (p) => esRepo(p) ? `Reposición · ${p.proveedor}` : `${p.proveedor} · ${p.campana || 'sin campaña'}`;
let gruposAbiertos = null; // claves de campaña desplegadas (por defecto, la más reciente)
const reclamaciones = {};  // texto de reclamación por campaña

// ── Vista: lista de pedidos ──────────────────────────────────────────────────
/** Grupos (campañas o reposiciones de un proveedor) de los pedidos dados. */
function agruparPedidos(lista) {
  const ps = lista.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  const grupos = new Map();
  for (const p of ps) {
    const k = claveGrupo(p);
    if (!grupos.has(k)) grupos.set(k, { clave: k, nombre: nombreGrupo(p), pedidos: [] });
    grupos.get(k).pedidos.push(p);
  }
  if (grupos.size) {
    gruposAbiertos = gruposAbiertos || new Set();
    // la más reciente de esta pestaña, desplegada la primera vez
    if (![...grupos.keys()].some((k) => gruposAbiertos.has(k))) gruposAbiertos.add(grupos.keys().next().value);
  }
  return grupos;
}
/** Carga de propuestas/facturas varias, común a Pedidos y Reposición. */
function bloqueCargaDocumentos() {
  return `
    <div class="fila no-imprimir" style="margin-bottom:10px">
      <label class="btn" style="flex-direction:row;align-items:center;justify-content:center;gap:6px">📄 Cargar propuestas o facturas del proveedor (varias a la vez)
        <input type="file" multiple class="oculto" onchange="cargarPropuestasVarias(this.files); this.value=''">
      </label>
      <span class="pequeno" style="max-width:460px">PDF, Excel o foto, todas de golpe. Cada una se asigna a su pedido por el nº de pedido, el cliente o las referencias que coinciden; las que no, te las pregunto.</span>
    </div>
    <div id="progresoProps" class="progreso"></div>
    <div id="avisoCarga">${vistaSinAsignar()}</div>`;

/** Una campaña (o las reposiciones de un proveedor): recuento, sus pedidos,
 *  sus faltas y sobras y la reclamación al proveedor. */
function vistaGrupo(g, i) {
  const comparados = g.pedidos.filter((p) => p.propuesta && p.lineas.length);
  const filasRes = [];
  const reclamar = [];
  for (const p of comparados) {
    const filas = comparar(p);
    const { sobran } = CP.faltasYSobras(filas);
    const faltan = CP.faltasPendientes(filas, p.decisiones);
    const aReclamar = faltan.filter((x) => x.pendiente === 'reclamar');
    if (aReclamar.length) reclamar.push({ numero: p.numero, cliente: esRepo(p) ? 'Reposición' : p.cliente, faltan: aReclamar });
    faltan.forEach((x) => filasRes.push({ p, x, tipo: 'falta' }));
    sobran.forEach((x) => filasRes.push({ p, x, tipo: 'sobra' }));
  }
  filasRes.sort((a, b) => (a.tipo === b.tipo ? String(a.p.numero).localeCompare(String(b.p.numero), 'es', { numeric: true }) : a.tipo === 'falta' ? -1 : 1));
  const nF = filasRes.filter((r) => r.tipo === 'falta').length;
  const nS = filasRes.length - nF;
  const validados = g.pedidos.filter((p) => p.validado).length;
  const hojasG = g.pedidos.filter((p) => !esRepo(p)).map((p) => CP.hojasDelPedido(fotosDe(p)));
  const nFotos = hojasG.reduce((s, x) => s + x.fotos, 0);
  const hojasFaltan = hojasG.reduce((s, x) => s + x.faltan.length, 0);
  const ej = g.pedidos[0];
  reclamaciones[g.clave] = reclamar.length ? CP.textoReclamacion(ej.proveedor, reclamar, { campana: esRepo(ej) ? '' : ej.campana }) : '';
  const abierto = Boolean(gruposAbiertos && gruposAbiertos.has(g.clave));
  return `
  <details class="grupo" ${abierto ? 'open' : ''} ontoggle="marcarGrupo(${js(g.clave)}, this.open)">
    <summary>
      <b>${h(g.nombre)}</b>
      <span class="resumen">
        <span class="chip gris">${g.pedidos.length} pedido(s)</span>
        ${nFotos ? `<span class="chip gris">📷 ${nFotos} foto(s)</span>` : ''}
        ${hojasFaltan ? `<span class="chip mal">⚠️ ${hojasFaltan} hoja(s) sin subir</span>` : ''}
        <span class="chip ${validados === g.pedidos.length ? 'ok' : 'info'}">${validados} validado(s)</span>
        ${comparados.length ? `<span class="chip ${nF ? 'mal' : 'ok'}">${nF} faltan</span><span class="chip ${nS ? 'aviso' : 'ok'}">${nS} sobran</span>` : ''}
      </span>
    </summary>
    <div class="tabla-scroll"><table>
      <tr><th class="no-imprimir"><input type="checkbox" title="Seleccionar todos" onchange="this.closest('table').querySelectorAll('.selPed').forEach(c=>c.checked=this.checked)"></th>
        <th>Fecha</th><th>Nº</th><th>Cliente</th><th class="num">Líneas</th><th>Fotos</th><th>Propuesta</th><th>Estado</th></tr>
      ${g.pedidos.map((p) => { const e = estadoPedido(p); return `
      <tr class="clic" onclick="if(event.target.type!=='checkbox')abrirPedido('${p.id}')">
        <td class="no-imprimir"><input type="checkbox" class="selPed" value="${p.id}"></td>
        <td>${h(fmtFecha(p.fecha))}</td><td>${h(p.numero)}</td><td>${h(esRepo(p) ? '—' : p.cliente)}</td>
        <td class="num">${p.lineas.length}</td>
        <td>${esRepo(p) ? '—' : celdaFotos(p)}</td>
        <td>${p.propuesta ? `<span class="chip ok">Sí</span>` : `<span class="chip gris">No</span>`}</td>
        <td><span class="chip ${e.chip}">${h(e.texto)}</span>${chipsFaltasSobras(p)}${chipFactura(p)}</td>
      </tr>`; }).join('')}
    </table></div>
    <div class="fila no-imprimir" style="margin-top:10px">
      ${esRepo(ej) ? '' : `<label class="btn primario" style="flex-direction:row;align-items:center;justify-content:center;gap:6px;color:#fff">📷 Añadir pedidos por foto a esta campaña
        <input type="file" accept="image/*" multiple class="oculto" onchange="subirFotosCampana(this.files, ${js(ej.proveedor)}, ${js(ej.campana || '')}); this.value=''"></label>
      <button class="btn" onclick="otroPedidoCampana(${js(ej.proveedor)}, ${js(ej.campana || '')})">✍️ Añadir pedido a mano a esta campaña</button>
      <button class="btn peque" onclick="renombrarCampana(${js(g.clave)})">✏️ ${ej.campana ? 'Renombrar' : 'Poner nombre a'} la campaña</button>`}
      <button class="btn" onclick="exportarSeleccionados(this.closest('details'))">Excel Géminis de los seleccionados</button>
      ${esRepo(ej) ? '' : `<label class="btn" style="flex-direction:row;align-items:center;justify-content:center;gap:6px">🔎 Último control: subir facturas finales
        <input type="file" multiple class="oculto" onchange="cargarFacturasVarias(this.files, ${js(g.clave)}); this.value=''"></label>
      <button class="btn" onclick="imprimirGuiaFacturacion(${js(g.clave)})">🧾 Imprimir guía de facturación</button>`}
      <span class="pequeno">Solo pedidos validados. Varias selecciones se suman por referencia en un único pedido.</span>
    </div>
    ${comparados.length ? `
    <h3 style="margin-top:14px">Faltas y sobras</h3>
    ${filasRes.length ? `<div class="tabla-scroll" id="tablaResumen${i}"><table>
      <tr><th>Qué pasa</th><th>Pedido</th><th>Cliente</th><th>Referencia</th><th>Descripción</th><th class="num">Uds.</th></tr>
      ${filasRes.map(({ p, x, tipo }) => `<tr class="clic" onclick="abrirPedido('${p.id}')">
        <td>${tipo === 'falta' ? '<span class="chip mal">Falta</span>' : '<span class="chip aviso">Sobra</span>'}${x.total ? '' : ' <span class="pequeno">parcial</span>'}${x.pendiente === 'reclamar' ? ' <span class="chip info">✉️ a reclamar</span>' : x.pendiente === 'decidir' ? ' <span class="pequeno">por decidir</span>' : ''}</td>
        <td>${h(p.numero)}</td><td>${h(esRepo(p) ? '—' : p.cliente)}</td><td><b>${h(x.ref)}</b></td><td>${h(x.desc)}</td>
        <td class="num">${tipo === 'falta' ? '−' : '+'}${x.cant}${x.total ? '' : ' de ' + x.de}</td></tr>`).join('')}
    </table></div>
    <div class="fila no-imprimir" style="margin-top:6px"><button class="btn peque" onclick="imprimirResumen(${i}, ${js(g.nombre)})">Imprimir faltas y sobras</button></div>`
    : `<div class="aviso-caja ok">En los pedidos comparados no falta ni sobra ninguna referencia.</div>`}
    ${reclamar.length ? vistaReclamacion(g.clave, i, reclamar)
      : nF ? `<div class="pequeno no-imprimir" style="margin-top:8px">Para reclamar una falta al proveedor, abre el pedido y elige «✉️ Reclamar al proveedor» en su decisión. Si luego el proveedor la añade, carga su propuesta nueva y vuelve a validar; si está descatalogada, cambia la decisión a «Descartar».</div>` : ''}` : ''}
  </details>`;
}
/** Guía para facturar a mano en nuestro sistema: un bloque por cliente con
 *  SOLO lo que se factura — lo validado a precio de cliente (lo que apuntó el
 *  comercial, sin el descuento de la propuesta), menos lo que no haya venido
 *  en la factura final — y sus notas de facturación. Nada de restos. Los
 *  pedidos sin validar no entran: se avisa arriba. */
function imprimirGuiaFacturacion(clave) {
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave)
    .sort((a, b) => String(a.cliente).localeCompare(String(b.cliente), 'es') || String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  if (!ps.length) return;
  const nombre = nombreGrupo(ps[0]);
  const validados = ps.filter((p) => p.validado && p.final);
  const sinValidar = ps.filter((p) => !(p.validado && p.final));
  if (!validados.length) { alert('Todavía no hay ningún pedido validado en esta campaña.'); return; }
  const pc = (l) => (l.precioCliente != null ? l.precioCliente : l.precio) || 0;
  let totalCampana = 0;
  const bloques = validados.map((p) => {
    // Si ya está la factura final, solo se factura al cliente lo que ha venido.
    const rf = revisarFactura(p);
    const noVino = new Map(((rf && rf.faltan) || []).map((x) => [CP.normRef(x.ref), x.cant]));
    const lineas = p.final.lineas.map((l) => {
      const menos = noVino.get(CP.normRef(l.ref)) || 0;
      if (!menos) return l;
      const quitar = Math.min(menos, l.cant);
      noVino.set(CP.normRef(l.ref), menos - quitar);
      return Object.assign({}, l, { cant: CP.red2(l.cant - quitar) });
    }).filter((l) => l.cant > 0);
    const total = CP.red2(lineas.reduce((s, l) => s + pc(l) * l.cant, 0));
    totalCampana += total;
    const notas = E.notas.filter((n) => n.pedidoId === p.id && !n.resuelta);
    return `<section>
      <h2><span class="caja"></span> ${h(p.cliente)} <small>· pedido nº ${h(p.numero)} · ${h(fmtFecha(p.fecha))}</small></h2>
      <table><tr><th class="n">Cant.</th><th>Referencia</th><th>Descripción</th><th class="n">Precio</th><th class="n">Importe</th></tr>
      ${lineas.map((l) => `<tr><td class="n">${l.cant}${l.exp ? ' EXP' : ''}</td><td>${h(l.ref)}</td><td>${h(l.desc)}</td><td class="n">${fmt(pc(l))}</td><td class="n">${fmt(CP.red2(pc(l) * l.cant))}</td></tr>`).join('')}
      <tr class="tot"><td colspan="4" class="n">Total (sin impuestos)</td><td class="n">${fmt(total)}</td></tr></table>
      ${notas.length ? `<p class="nota"><b>Notas de facturación:</b> ${notas.map((n) => `${h(n.ref)} — ${h(n.texto)}`).join(' · ')}</p>` : ''}
    </section>`;
  }).join('');
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Guía de facturación · ${h(nombre)}</title>
  <style>body{font-family:system-ui,sans-serif;margin:20px;color:#111;font-size:13px}h1{font-size:18px;margin:0 0 4px}
  section{break-inside:avoid;page-break-inside:avoid;border-top:2px solid #333;padding-top:6px;margin-top:16px}
  h2{font-size:15px;margin:0 0 6px}h2 small{font-weight:normal;color:#555}.caja{display:inline-block;width:12px;height:12px;border:1.5px solid #333;margin-right:4px;vertical-align:-1px}
  table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:3px 5px;text-align:left}td.n,th.n{text-align:right}
  tr.tot td{font-weight:bold;border-bottom:0}.nota{background:#eef4ff;padding:4px 6px}.resto{background:#fff6e0;padding:4px 6px}.aviso{background:#fde8e8;padding:6px}</style></head><body>
  <h1>Guía de facturación · ${h(nombre)}</h1>
  <p>${h(fmtFecha(hoy()))} · ${validados.length} cliente(s)${validados.some((p) => !p.factura) ? ' · <b>aún sin factura final del proveedor:</b> ' + validados.filter((p) => !p.factura).map((p) => 'nº ' + h(p.numero)).join(', ') : ''} · total ${fmt(CP.red2(totalCampana))} € sin impuestos · marca la casilla de cada cliente al facturarlo.</p>
  ${sinValidar.length ? `<p class="aviso"><b>Sin validar, no incluidos:</b> ${sinValidar.map((p) => `nº ${h(p.numero)} ${h(p.cliente)}`).join(', ')}</p>` : ''}
  ${bloques}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/** Reclamación de faltas al proveedor, separada por cliente. De momento no se

function vistaReclamacion(clave, i, grupos) {
  const n = grupos.reduce((s, g) => s + g.faltan.length, 0);

    <details class="no-imprimir" style="margin-top:12px">

      </div>

function copiarReclamacion(clave, i) {
  const t = reclamaciones[clave];
  const hecho = () => alert('Texto copiado. Pégalo en el correo al proveedor.');
  const copiarAntiguo = () => { const el = document.getElementById('txtReclamacion' + i); el.select(); document.execCommand('copy'); hecho(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(hecho, copiarAntiguo);
  else copiarAntiguo();
}
function imprimirReclamacion(clave) {
  const ej = E.pedidos.find((p) => claveGrupo(p) === clave);
  const nombre = ej ? nombreGrupo(ej) : '';

}

/** Desde un pedido (o una campaña): crear el siguiente de la misma campaña. */
/** Fotos de pedidos nuevos directamente a una campaña ya creada. */
function subirFotosCampana(files, proveedor, campana) {
  if (!files || !files.length) return;
  (gruposAbiertos = gruposAbiertos || new Set()).add('C|' + prov(proveedor) + '|' + claveTexto(campana));
  vista = 'pedidos'; pedidoAbierto = null; pintar(); window.scrollTo(0, 0);

}

 *  «sin campaña» o «2027» → «Agendas todo año 2027»). Si el nombre nuevo ya
 *  existe para ese proveedor, las dos campañas se juntan. */
function renombrarCampana(clave) {
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave);
  if (!ps.length) return;
  const nuevo = prompt(`Nombre de la campaña (${ps.length} pedido(s) de ${ps[0].proveedor}):`, ps[0].campana || '');
  if (nuevo == null || !nuevo.trim()) return;
  const nombre = campanaCanonica(ps[0].proveedor, nuevo);
  ps.forEach((p) => { p.campana = nombre; });
  gruposAbiertos = gruposAbiertos || new Set();
  gruposAbiertos.add(claveGrupo(ps[0]));
  guardar(); pintar();
}

/** Reposición: nuestro pedido al proveedor. No pasa por «Pedido a mano». */
function vistaNuevaReposicion() {
  const proveedores = [...new Set(E.pedidos.map((p) => prov(p.proveedor)).concat(Object.keys(E.catalogos)))].filter(Boolean);
  return `
    <div class="tarjeta no-imprimir">
      <h2>🔄 Nueva reposición</h2>
      <p class="pequeno" style="margin:0 0 10px">Nuestro pedido al proveedor: créalo, mete sus líneas (pegadas, a mano, PDF, Excel o foto) y compáralo con su propuesta, albarán o factura.</p>
      <div class="fila">
        <label>Proveedor<input id="rpProv" list="listaProv" placeholder="PROVEEDOR" value="${h(proveedores[0] || '')}"></label>
        <label>Nº pedido<input id="rpNum" style="width:110px"></label>
        <label>Fecha<input id="rpFecha" type="date" value="${hoy()}"></label>
        <button class="btn primario" onclick="crearReposicion()">Crear</button>
      </div>
    </div>`;
}
function crearReposicion() {
  const v = (id) => document.getElementById(id).value.trim();
  if (!v('rpProv') || !v('rpNum')) { alert('Proveedor y nº de pedido son obligatorios.'); return; }
  const p = { id: nuevoId(), tipo: 'reposicion', proveedor: prov(v('rpProv')), campana: '', numero: v('rpNum'), cliente: '',
    fecha: v('rpFecha') || hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null };
  if (E.pedidos.some((x) => esRepo(x) && x.proveedor === p.proveedor && String(x.numero) === String(p.numero))) {
    if (!confirm(`Ya hay una reposición ${p.proveedor} nº ${p.numero}. ¿Crear otra igualmente?`)) return;
  }
  E.pedidos.push(p); guardar(); abrirPedido(p.id);
}

function crearPedido() {
  const v = (id) => document.getElementById(id).value.trim();
  const tipo = 'comercial'; // los pedidos a mano son siempre del comercial
  if (!v('npProv') || !v('npNum') || !v('npCli')) { alert('Proveedor, nº de pedido y cliente son obligatorios.'); return; }
  const p = { id: nuevoId(), tipo, proveedor: prov(v('npProv')), campana: campanaCanonica(v('npProv'), v('npCamp')), numero: v('npNum'),
    cliente: v('npCli').toUpperCase(),
    fecha: v('npFecha') || hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null };
  if (E.pedidos.some((x) => x.proveedor === p.proveedor && String(x.numero) === String(p.numero) && x.campana === p.campana)) {
    if (!confirm(`Ya hay un pedido ${p.proveedor} nº ${p.numero}. ¿Crear otro igualmente?`)) return;
  }
  prefijoNuevo = null;
  E.pedidos.push(p);
  guardar();
  abrirPedido(p.id);
  const c = document.getElementById('qaCant'); if (c) c.focus();
}
/** Pedido del comercial empezando por las fotos: se crea con lo que haya
 *  escrito en el formulario y el resto (nº, cliente, proveedor) lo completa la
 *  lectura. Si la lectura falla, el pedido queda creado y se puede rellenar. */
function ultimaCampana() {
  const c = E.pedidos.filter((p) => !esRepo(p) && p.campana).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))[0];
  return c ? c.campana : '';
}
/** Fotos de una campaña entera: cada hoja va a su pedido por el nº leído. */
function subirCampana(files) {
  if (!files || !files.length) return;
  const v = (id) => document.getElementById(id).value.trim();
  leerFotos(files, null, { proveedor: prov(v('lotProv')), campana: campanaCanonica(v('lotProv'), v('lotCamp')), fecha: hoy(), soloNuevos: true });
}
/** Antes de abrir la galería o la cámara: proveedor y campaña escritos, y
 *  confirmación de a qué campaña van. Sin valores por defecto, para que las
 *  fotos no acaben en FINOCAM (o en otra campaña) sin querer. */
function pedirFotosNuevas(idInput) {
  const v = (id) => document.getElementById(id).value.trim();
  if (!v('lotProv') || !v('lotCamp')) { alert('Escribe primero el proveedor y la campaña de estas fotos.'); (v('lotProv') ? document.getElementById('lotCamp') : document.getElementById('lotProv')).focus(); return; }
  const proveedor = prov(v('lotProv'));
  const campana = campanaCanonica(proveedor, v('lotCamp'));
  const ya = E.pedidos.filter((p) => !esRepo(p) && p.proveedor === proveedor && claveTexto(p.campana) === claveTexto(campana)).length;
  const texto = ya
    ? `Las fotos irán a la campaña «${proveedor} · ${campana}», que ya tiene ${ya} pedido(s), como pedidos NUEVOS.\n\nPara completar un pedido que ya existe, ábrelo y usa «Hacer foto».\n\n¿Seguir?`
    : `Se creará la campaña nueva «${proveedor} · ${campana}». ¿Seguir?`;
  if (!confirm(texto)) return;
  document.getElementById(idInput).click();
}
/** Quita una foto del pedido junto con las líneas que se leyeron de ella
 *  (p. ej. si se subió al pedido equivocado). */
function quitarFoto(nombre) {
  const p = pedidoActual();
  const n = p.lineas.filter((l) => l.foto === nombre).length;
  if (!confirm(`¿Quitar la foto ${nombre} y sus ${n} línea(s) de este pedido?`)) return;
  p.lineas = p.lineas.filter((l) => l.foto !== nombre);
  p.fotos = (p.fotos || []).filter((f) => f.nombre !== nombre);
  invalidar(p); guardar(); pintar();
}
function abrirPedido(id) {
  // Al volver a la lista, la campaña de este pedido queda desplegada.
  const p = pedidoPorId(id);
  if (p) (gruposAbiertos = gruposAbiertos || new Set()).add(claveGrupo(p));
  pedidoAbierto = id; vista = p && esRepo(p) ? 'reposicion' : 'pedidos'; pintar(); window.scrollTo(0, 0); }

// ── Vista: detalle de un pedido ──────────────────────────────────────────────
function vistaDetalle(p) {
  if (!p) { pedidoAbierto = null; return vista === 'reposicion' ? vistaReposicion() : vistaLista(); }
  if (esRepo(p)) return vistaDetalleRepo(p);
  const cat = catalogoDe(p.proveedor);
  const filas = comparar(p);
  return `
  <div class="no-imprimir" style="margin-bottom:10px"><button class="btn peque" onclick="pedidoAbierto=null;pintar()">← Todos los pedidos</button></div>
  <div class="tarjeta">
    <h2>Pedido ${h(p.proveedor)} nº ${h(p.numero)} · ${h(p.cliente)}</h2>
    <div class="fila">
      <label>Proveedor<input value="${h(p.proveedor)}" onchange="cambiaCampo('proveedor', this.value.trim().toUpperCase())"></label>
      <label>Campaña<input value="${h(p.campana)}" onchange="cambiaCampo('campana', this.value.trim())"></label>
      <label>Nº<input value="${h(p.numero)}" style="width:80px" onchange="cambiaCampo('numero', this.value.trim())"></label>
      <label>Cliente<input value="${h(p.cliente)}" onchange="cambiaCampo('cliente', this.value.trim().toUpperCase())"></label>
      <label>Fecha<input type="date" value="${h(p.fecha)}" onchange="cambiaCampo('fecha', this.value)"></label>
      <button class="btn primario" onclick="otroPedidoCampana(${js(p.proveedor)}, ${js(p.campana || '')})">➕ Otro pedido de esta campaña</button>
      <button class="btn peque peligro" onclick="borrarPedido()">Borrar pedido</button>
    </div>
    ${p.notas ? `<div class="aviso-caja info">Notas: ${h(p.notas)}</div>` : ''}
    ${p.validado ? `<div class="aviso-caja ok">Validado el ${h(fmtFecha(p.final && p.final.fecha))}. Si cambias líneas o propuesta tendrás que volver a validar.</div>` : ''}
  </div>

  <div class="tarjeta">
    <h2>1 · Lo que pidió el comercial</h2>
    <div class="fila no-imprimir">
      <label class="btn primario" style="flex-direction:row;align-items:center;justify-content:center;gap:6px;color:#fff">📷 Hacer foto
        <input type="file" accept="image/*" capture="environment" class="oculto" onchange="leerFotos(this.files, pedidoActual()); this.value=''">
      </label>
      <label class="btn" style="flex-direction:row;align-items:center;justify-content:center;gap:6px">🖼️ Elegir de la galería
        <input type="file" accept="image/*" multiple class="oculto" onchange="leerFotos(this.files, pedidoActual()); this.value=''">
      </label>
      <button class="btn peque" onclick="document.getElementById('pegar').classList.toggle('oculto')">Pegar o escribir líneas</button>
      <button class="btn peque" onclick="anadirLinea()">+ Línea</button>
    </div>
    <div id="progresoFotos" class="progreso"></div>
    ${fotosFallidas && fotosFallidas.destinoId === p.id ? vistaFallidas() : ''}
    ${avisoFotos(p)}
    <div id="pegar" class="oculto" style="margin-top:10px">
      <textarea id="txtPegar" placeholder="Una línea por artículo: cantidad  referencia  precio  (descripción opcional)&#10;4  780100027  3,25  CALENDARIO&#10;1EXP 883840127 180,14"></textarea>
      <button class="btn peque" onclick="pegarLineas('pedido')">Añadir estas líneas</button>
    </div>
    ${entradaRapida()}
    ${vistaBloc(p)}
    ${!cat ? `<div class="aviso-caja aviso">Aún no hay catálogo de ${h(p.proveedor)}: carga una propuesta suya para poder comprobar que cada referencia existe.</div>` : ''}
    ${tablaLineas(p, cat)}
  </div>

  <div class="tarjeta">
    <h2>2 · Propuesta del proveedor</h2>
    <div class="fila no-imprimir">
      <label>Propuesta del proveedor (PDF, Excel o foto)<input type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv,image/*" onchange="cargarPropuestaEn('${p.id}', this.files[0]); this.value=''"></label>
    </div>
    <div id="progresoProp" class="progreso"></div>
    ${p.propuesta ? `<div class="resumen">
        <span class="chip info" title="${h(p.propuesta.archivo)}">${h(p.propuesta.archivo)}</span>
        <span class="chip gris">${p.propuesta.lineas.length} líneas</span>
        ${p.propuesta.cabecera.dtoGlobal != null ? `<span class="chip gris">Dto. global ${h(p.propuesta.cabecera.dtoGlobal)} %</span>` : ''}
        ${p.propuesta.cabecera.importeNeto != null ? `<span class="chip gris">Neto ${fmt(p.propuesta.cabecera.importeNeto)} €</span>` : ''}
        ${p.propuesta.cabecera.observaciones ? `<span class="chip gris">${h(p.propuesta.cabecera.observaciones)}</span>` : ''}
      </div>` : `<div class="vacio">Sin propuesta todavía.</div>`}
    ${p.propuesta && p.propuesta.control ? avisoControl(p.propuesta) : ''}
    ${p.propuesta ? tablaPropuesta(p, cat) : ''}
    ${avisoRestosEnPropuesta(p)}
  </div>

  ${filas ? vistaComparacion(p, filas) : ''}
  ${vistaFacturaFinal(p)}`;

/** Precio en la comparación: en reposición, el neto con el base y los descuentos debajo. */
function celdaPrecio(p, base, dtos, neto) {
  if (!esRepo(p)) return base == null ? '—' : fmt(base);
  if (neto == null) return '—';
  const det = base != null && (CP.parseDtos(dtos).length || CP.red2(base) !== CP.red2(neto)) ? `<div class="pequeno">${fmt(base)}${dtos && CP.parseDtos(dtos).length ? ' − ' + fmtDtos(dtos) : ''}</div>` : '';
  return fmt(neto) + det;
}

// ── Vista: detalle de una REPOSICIÓN ─────────────────────────────────────────
// Nuestro pedido al proveedor ↔ su propuesta, albarán o factura. Se compara el
// precio neto (después de todos los descuentos) con 0,25 € de tolerancia
// informativa, y las faltas NO van a Restos: eso es solo del comercial.
function vistaDetalleRepo(p) {
  const cat = catalogoDe(p.proveedor);
  const filas = comparar(p);
  const ayudaPdf = `<div class="pequeno" style="margin-top:6px">El PDF o la foto se leen con IA, de cualquier proveedor: la app comprueba que las líneas sumen la base imponible del documento y marca en ámbar lo dudoso. Revísalo siempre antes de comparar.</div>`;
  return `
  <div class="no-imprimir" style="margin-bottom:10px"><button class="btn peque" onclick="pedidoAbierto=null;pintar()">← Todos los pedidos</button></div>
  <div class="tarjeta">
    <h2>Reposición ${h(p.proveedor)} nº ${h(p.numero)}</h2>
    <div class="fila">
      <label>Proveedor<input value="${h(p.proveedor)}" onchange="cambiaCampo('proveedor', this.value.trim().toUpperCase())"></label>
      <label>Nº<input value="${h(p.numero)}" style="width:100px" onchange="cambiaCampo('numero', this.value.trim())"></label>
      <label>Fecha<input type="date" value="${h(p.fecha)}" onchange="cambiaCampo('fecha', this.value)"></label>
      <button class="btn peque peligro" onclick="borrarPedido()">Borrar pedido</button>
    </div>
    ${p.notas ? `<div class="aviso-caja info">Notas: ${h(p.notas)}</div>` : ''}
    ${p.validado ? `<div class="aviso-caja ok">Validado el ${h(fmtFecha(p.final && p.final.fecha))}. Si cambias líneas o propuesta tendrás que volver a validar.</div>` : ''}
  </div>

  <div class="tarjeta">
    <h2>1 · El pedido que enviamos al proveedor</h2>
    <div class="fila no-imprimir">
      <label>Nuestro pedido (PDF, Excel o foto)<input type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv,image/*" onchange="cargarEnvio(this.files[0]); this.value=''"></label>
      <button class="btn peque" onclick="document.getElementById('pegar').classList.toggle('oculto')">Pegar o escribir líneas</button>
      <button class="btn peque" onclick="anadirLinea()">+ Línea</button>
    </div>
    <div id="pegar" class="oculto" style="margin-top:10px">
      <textarea id="txtPegar" placeholder="Una línea por artículo: cantidad  referencia  precio  descuentos  (descripción opcional)&#10;Los descuentos con % o con +:  10%   ·   10+5&#10;12  01234  5,50  10+5  ETIQUETAS A4"></textarea>
      <button class="btn peque" onclick="pegarLineas('pedido')">Añadir estas líneas</button>
    </div>
    <div id="progresoEnvio" class="progreso"></div>
    ${p.envioControl ? avisoControl({ control: p.envioControl, lineas: p.lineas }) : ''}
    ${tablaLineasRepo(p, cat, 'pedido')}
  </div>

  <div class="tarjeta">
    <h2>2 · Propuesta, albarán o factura del proveedor</h2>
    <div class="fila no-imprimir">
      <label>Factura, albarán o propuesta (PDF, Excel o foto)<input type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv,image/*" onchange="cargarPropuestaEn('${p.id}', this.files[0]); this.value=''"></label>
      <button class="btn peque" onclick="document.getElementById('pegarProp').classList.toggle('oculto')">Pegar o escribir líneas</button>
      ${p.propuesta ? `<button class="btn peque peligro" onclick="quitarPropuesta()">Quitar</button>` : ''}
    </div>
    <div id="pegarProp" class="oculto" style="margin-top:10px">
      <textarea id="txtPegarProp" placeholder="Mismo formato: cantidad  referencia  precio  descuentos  (descripción)"></textarea>
      <button class="btn peque" onclick="pegarLineas('propuesta')">Usar estas líneas como propuesta</button>
    </div>
    <div id="progresoProp" class="progreso"></div>
    ${ayudaPdf}
    ${p.propuesta ? `<div class="resumen">
        <span class="chip info" title="${h(p.propuesta.archivo)}">${h(p.propuesta.archivo)}</span>
        <span class="chip gris">${p.propuesta.lineas.length} líneas</span>
        ${p.propuesta.cabecera && p.propuesta.cabecera.dtoGlobal != null ? `<span class="chip gris">Dto. global ${h(p.propuesta.cabecera.dtoGlobal)} %</span>` : ''}
      </div>` : `<div class="vacio">Sin propuesta todavía.</div>`}
    ${p.propuesta && p.propuesta.control ? avisoControl(p.propuesta) : ''}
    ${p.propuesta ? tablaPropuesta(p, cat) : ''}
    ${avisoRestosEnPropuesta(p)}
  </div>

  ${filas ? vistaComparacion(p, filas) : ''}`;
}

/** Las líneas de la propuesta, plegadas salvo que haya algo que revisar
 *  (dudas de lectura o un documento que no cuadra con su base). */
function tablaPropuesta(p, cat) {
  const pr = p.propuesta;
  const revisar = pr.lineas.some((l) => l.duda) || (pr.control && pr.control.cuadra === false);
  return `<details ${revisar ? 'open' : ''} style="margin-top:8px"><summary class="pequeno" style="cursor:pointer">Ver y corregir las ${pr.lineas.length} líneas de la propuesta</summary>
    ${tablaLineasRepo(p, cat, 'propuesta')}</details>`;
}

function tablaLineasRepo(p, cat, lado) {
  const arr = lado === 'propuesta' ? p.propuesta.lineas : p.lineas;
  const L = lado === 'propuesta' ? ",'propuesta'" : '';
  if (!arr.length) return `<div class="vacio">Sin líneas. Súbelo en PDF, Excel o foto, pégalas o añádelas a mano.</div>`;
  const fueraCat = cat ? arr.filter((l) => l.ref && !cat[CP.normRef(l.ref)]).length : 0;
  return `
  <div class="resumen">
    <span class="chip gris">${arr.length} líneas</span>
    ${cat && fueraCat ? `<span class="chip mal">${fueraCat} referencias no existen en el catálogo</span>` : ''}
  </div>
  <div class="tabla-scroll"><table>
    <tr><th class="num">Cant.</th><th>Referencia</th><th>Descripción</th><th class="num">Precio base</th><th>Descuentos</th><th class="num">Uds/caja</th><th class="num">Importe</th><th class="num">Neto</th><th>Duda</th><th></th></tr>
    ${arr.map((l, i) => {
      const fuera = cat && l.ref && !cat[CP.normRef(l.ref)];
      const neto = CP.precioNeto({ cant: l.cant, precio: l.precio, dtos: l.dtos, importe: l.importe });
      return `<tr class="${fuera ? 'fuera-catalogo' : ''} ${l.duda ? 'duda' : ''}">
        <td><input class="cant" value="${h(l.cant)}" onchange="cambiaLinea(${i},'cant',this.value${L})"></td>
        <td><input class="ref" value="${h(l.ref)}" onchange="cambiaLinea(${i},'ref',this.value${L})"></td>
        <td><input value="${h(l.desc)}" onchange="cambiaLinea(${i},'desc',this.value${L})"></td>
        <td><input class="precio" value="${l.precio == null ? '' : h(fmt(l.precio))}" onchange="cambiaLinea(${i},'precio',this.value${L})"></td>
        <td><input class="precio" value="${h(Array.isArray(l.dtos) ? l.dtos.join('+') : l.dtos)}" placeholder="—" title="Descuentos encadenados, p. ej. 10+5" onchange="cambiaLinea(${i},'dtos',this.value${L})"></td>
        <td><input class="cant" value="${h(l.udsCaja)}" onchange="cambiaLinea(${i},'udsCaja',this.value${L})"></td>
        <td class="num">${l.importe == null ? '—' : fmt(l.importe)}</td>
        <td class="num">${neto == null ? '—' : fmt(neto)}</td>
        <td><input value="${h(l.duda)}" placeholder="—" onchange="cambiaLinea(${i},'duda',this.value${L})"></td>
        <td><button class="btn peque peligro" onclick="borrarLinea(${i}${L})" title="Quitar línea">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  <div class="pequeno" style="margin-top:6px">Sin precio en una línea, se compara con el último precio neto aceptado de ese proveedor (si lo hay).</div>`;
}

async function cargarEnvio(file) {
  if (!file) return;
  const p = pedidoActual();
  try {
    const prop = await leerFicheroProveedor(file, 'progresoEnvio');
    if (p.lineas.length && !confirm(`El pedido ya tiene ${p.lineas.length} líneas. ¿Sustituirlas por las ${prop.lineas.length} del Excel?`)) return;
    p.lineas = prop.lineas.map((l) => ({ ref: l.ref, desc: l.desc, ean: l.ean, cant: l.cant, precio: l.precio, dtos: l.dtos || [], udsCaja: l.udsCaja, importe: l.importe, duda: l.duda || '' }));
    p.envio = file.name;
    p.envioControl = prop.control || null;
    guardarCatalogo(p.proveedor, file.name, prop.catalogo);
    invalidar(p); guardar(); pintar();
  } catch (err) { alert('No he podido leer el pedido: ' + err.message); }
}
function quitarPropuesta() {
  const p = pedidoActual();
  if (!confirm('¿Quitar la propuesta y sus decisiones?')) return;
  p.propuesta = null; p.decisiones = {}; invalidar(p); guardar(); pintar();
}

function tablaLineas(p, cat) {
  if (!p.lineas.length) return `<div class="vacio">Sin líneas. Lee las fotos, pégalas o añádelas a mano.</div>`;
  const fueraCat = cat ? p.lineas.filter((l) => l.ref && !cat[CP.normRef(l.ref)]).length : 0;
  const dudas = p.lineas.filter((l) => l.duda).length;
  return `
  <div class="resumen">
    <span class="chip gris">${p.lineas.length} líneas</span>
    ${dudas ? `<span class="chip aviso">${dudas} con dudas de lectura</span>` : ''}
    ${cat ? (fueraCat ? `<span class="chip mal">${fueraCat} referencias no existen en el catálogo</span>` : `<span class="chip ok">Todas las referencias existen en el catálogo</span>`) : ''}
  </div>
  <div class="tabla-scroll"><table>
    <tr><th class="num">Cant.</th><th>Exp.</th><th>Referencia</th><th>Descripción</th><th class="num">Precio</th><th>Duda de lectura</th><th></th></tr>
    ${p.lineas.map((l, i) => {
      const ref = CP.normRef(l.ref);
      const fuera = cat && ref && !cat[ref];
      const sug = fuera ? CP.sugerenciasCatalogo(ref, cat, 4) : [];
      const enCat = cat && cat[ref];
      return `<tr class="${fuera ? 'fuera-catalogo' : ''} ${l.duda ? 'duda' : ''}">
        <td><input class="cant" value="${h(l.cant)}" onchange="cambiaLinea(${i},'cant',this.value)"></td>
        <td><input type="checkbox" ${l.exp ? 'checked' : ''} onchange="cambiaLinea(${i},'exp',this.checked)"></td>
        <td><input class="ref" value="${h(l.ref)}" onchange="cambiaLinea(${i},'ref',this.value)">
          ${fuera ? `<div class="sugerencia">No está en el catálogo.${sug.length ? ' ¿Quizá…? ' + sug.map((s) => `<button onclick="cambiaLinea(${i},'ref',${js(s.ref)})" title="${h(s.desc)}">${h(s.ref)} · ${h(s.desc.slice(0, 24))}${s.precio != null ? ' · ' + fmt(s.precio) : ''}</button>`).join('') : ''}</div>` : ''}</td>
        <td><input value="${h(l.desc)}" onchange="cambiaLinea(${i},'desc',this.value)">${enCat && enCat.d ? `<div class="pequeno">${h(enCat.d)}</div>` : ''}</td>
        <td><input class="precio" value="${l.precio == null ? '' : h(fmt(l.precio))}" onchange="cambiaLinea(${i},'precio',this.value)">
          ${enCat && enCat.p != null && l.precio != null && CP.red2(enCat.p) !== CP.red2(l.precio) ? `<div class="pequeno">Tarifa ${fmt(enCat.p)}</div>` : ''}</td>
        <td><input value="${h(l.duda)}" onchange="cambiaLinea(${i},'duda',this.value)" placeholder="—"></td>
        <td><button class="btn peque peligro" onclick="borrarLinea(${i})" title="Quitar línea">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  ${dudas ? `<div class="pequeno" style="margin-top:6px">Las filas en ámbar tienen una duda de lectura: compruébalas con la foto y borra el texto de la duda cuando estén bien.</div>` : ''}`;
}

function vistaComparacion(p, filas) {
  const pend = CP.sinDecidir(filas, p.decisiones);
  const n = {
    ok: filas.filter((f) => f.estado === 'ok').length,
    info: filas.filter((f) => !f.revisar && f.motivos.some((m) => m.informativo)).length,
    revisar: filas.filter((f) => f.revisar).length,
  };
  // Lo esencial primero: lo que falta, luego lo que sobra, luego el resto.
  const peso = (f) => (f.cantPropuesta < f.cantPedida ? 0 : f.cantPropuesta > f.cantPedida ? 1 : 2);
  const mostrar = (soloDiscordancias ? filas.filter((f) => f.motivos.length) : filas).slice().sort((a, b) => peso(a) - peso(b));
  const nombres = { reclamar: '✉️ Reclamar al proveedor (esperar respuesta)', resto: 'Sin stock: dejar en restos', anular: 'Descartar (descatalogado o ya no lo quiere)', aceptar: 'Aceptar propuesta', mantener: 'Mantener lo pedido', manual: 'Cantidad/precio a mano', excluir: 'Excluir línea' };
  return `
  <div class="tarjeta">
    <h2>3 · Comparación y decisiones</h2>
    ${bloqueFaltasSobras(p, filas)}
    <h3 style="margin-top:16px">Todas las diferencias</h3>
    ${esRepo(p) ? '' : `<div class="pequeno" style="margin-bottom:6px">En un cambio de precio, tu decisión fija el <b>precio al cliente</b> (listado imprimible): «Mantener lo pedido» = el que apuntó el comercial. El Excel de Géminis lleva siempre el <b>coste que factura el proveedor</b>.</div>`}
    <div class="resumen">
      <span class="chip ok">${n.ok} cuadran</span>
      ${n.info ? `<span class="chip info">${n.info} con cambio de precio informativo</span>` : ''}
      <span class="chip ${n.revisar ? 'mal' : 'ok'}">${n.revisar} discordancias</span>
      ${pend.length ? `<span class="chip aviso">${pend.length} sin decidir</span>` : ''}
    </div>
    <label class="no-imprimir" style="flex-direction:row;align-items:center;gap:6px;margin:6px 0">
      <input type="checkbox" ${soloDiscordancias ? 'checked' : ''} onchange="soloDiscordancias=this.checked;pintar()"> Ver solo lo que no cuadra
    </label>
    ${mostrar.length ? `<div class="tabla-scroll"><table>
      <tr><th>Referencia</th><th>Descripción</th><th class="num">Pedido</th><th class="num">Propuesta</th><th class="num">${esRepo(p) ? 'Neto pedido' : 'Precio pedido'}</th><th class="num">${esRepo(p) ? 'Neto propuesta' : 'Precio propuesta'}</th><th>Qué pasa</th><th>Decisión</th></tr>
      ${mostrar.map((f) => {
        const d = p.decisiones[f.ref] || {};
        const acciones = CP.accionesPara(f, p.tipo);
        return `<tr>
          <td><b>${h(f.ref)}</b>${f.sugerencias.length ? `<div class="sugerencia">¿Quizá ${f.sugerencias.map((s) => h(s.ref)).join(', ')}? Corrígela arriba.</div>` : ''}</td>
          <td>${h(f.desc)}</td>
          <td class="num">${f.cantPedida || '—'}</td><td class="num">${f.cantPropuesta || '—'}</td>
          <td class="num">${f.precioDeHistorial ? fmt(f.precioReferencia) + '<div class="pequeno">(último aceptado)</div>' : celdaPrecio(p, f.precioPedido, f.dtosPedido, f.netoPedido)}</td>
          <td class="num">${celdaPrecio(p, f.precioPropuesta, f.dtosPropuesta, f.netoPropuesta)}${f.difPrecio != null ? `<div class="motivo ${Math.abs(f.difPrecio) > (esRepo(p) ? CP.TOLERANCIA.reposicion : CP.TOLERANCIA.comercial) ? 'revisar' : ''}">${f.difPrecio > 0 ? '+' : ''}${fmt(f.difPrecio)} € (${f.difPrecioPct > 0 ? '+' : ''}${fmt(f.difPrecioPct)} %)</div>` : ''}</td>
          <td>${f.motivos.length ? f.motivos.map((m) => `<div class="motivo ${m.revisar ? 'revisar' : ''}">${h(m.texto)}</div>`).join('') : '<span class="chip ok">Cuadra</span>'}</td>
          <td class="no-imprimir">${f.revisar ? `
            <select onchange="decide(${js(f.ref)},'accion',this.value)">
              <option value="">— decidir —</option>
              ${acciones.map((a) => `<option value="${a}" ${d.accion === a ? 'selected' : ''}>${nombres[a]}</option>`).join('')}
            </select>
            ${d.accion === 'manual' ? `<div class="fila" style="margin-top:4px"><input class="cant" placeholder="Cant." value="${h(d.cant)}" onchange="decide(${js(f.ref)},'cant',this.value)"><input class="precio" placeholder="${esRepo(p) ? 'Neto' : 'Precio'}" value="${h(d.precio)}" onchange="decide(${js(f.ref)},'precio',this.value)"></div>` : ''}
            <input style="margin-top:4px" placeholder="Nota de facturación (opcional)" value="${h(d.nota)}" onchange="decide(${js(f.ref)},'nota',this.value)">
          ` : ''}</td>

    </table></div>` : `<div class="aviso-caja ok">Todo cuadra.</div>`}
    <div class="fila no-imprimir" style="margin-top:14px">
      <button class="btn primario" ${pend.length ? 'disabled' : ''} onclick="validarPedido()">Validar pedido</button>
