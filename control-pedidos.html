/** Tarifa completa de un proveedor (Excel, todas las hojas) → su catálogo. */
async function subirTarifa(file) {
  if (!file) return;
  const campo = document.getElementById('tarProv');
  const proveedor = prov(proveedorCanonico(campo.value) || campo.value);
  if (!proveedor) { alert('Escribe primero de qué proveedor es la tarifa.'); campo.focus(); return; }
  if (esPdf(file) || esImagen(file)) { alert('La tarifa tiene que ir en Excel (o CSV). Un PDF o una foto de miles de líneas no se lee con fiabilidad.'); return; }
  const caja = document.getElementById('progresoTarifa');
  if (caja) caja.textContent = `Leyendo ${file.name}…`;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const items = {};
    const errores = [];
    for (const nombre of wb.SheetNames) {
      try { Object.assign(items, CP.leerTarifa(XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, defval: '', raw: true })).items); }
      catch (e) { errores.push(nombre); }
    }
    const n = Object.keys(items).length;
    if (!n) throw new Error('no he encontrado artículos. Hace falta una columna «Referencia» (o «Código») y otra de «Descripción» o «Precio»');
    const conPrecio = Object.values(items).filter((x) => x.p != null).length;
    const antes = E.catalogos[proveedor];
    if (!confirm(`${proveedor}: ${n} artículos (${conPrecio} con precio) en ${file.name}.` + (antes ? `\nSustituye al catálogo actual (${Object.keys(antes.items || {}).length} referencias).` : '') + '\n\n¿Guardar la tarifa?')) return;
    E.catalogos[proveedor] = Object.assign({ fecha: hoy(), archivo: file.name, items, tarifa: true }, antes && antes.ajuste ? { ajuste: antes.ajuste } : {});
    guardar(); pintar();
    if (errores.length && errores.length < wb.SheetNames.length) alert(`Hojas sin artículos reconocibles (no se han usado): ${errores.join(', ')}`);
  } catch (err) {
    alert('No he podido leer la tarifa: ' + err.message);
  } finally {
    const c = document.getElementById('progresoTarifa');
    if (c) c.textContent = '';
  }
}
function textoAjuste(aj) {
  const pct = CP.parseNum(aj && aj.pct);
  if (aj && aj.modo === 'tarifa') return 'Tarifa del proveedor, sin descuentos';
  if (!aj || !aj.modo || aj.modo === 'ninguno' || !pct) return 'El de la tarifa';
  return aj.modo === 'beneficio' ? `${fmt(pct).replace(',00', '')} % de beneficio` : `+${fmt(pct).replace(',00', '')} % sobre coste`;
}
function cambiarAjuste(proveedor, campo, valor) {
  // Sin tarifa subida, se guarda solo el ajuste (un catálogo vacío).
  const c = E.catalogos[proveedor] = E.catalogos[proveedor] || { fecha: hoy(), archivo: '', items: {} };
  const aj = Object.assign({ modo: 'ninguno' }, c.ajuste);
  if (campo === 'modo') aj.modo = valor;
  else aj.pct = CP.parseNum(valor);
  if (aj.modo === 'beneficio' && aj.pct != null && aj.pct >= 100) { alert('El beneficio sobre la venta tiene que ser menor que 100 %.'); pintar(); return; }
  c.ajuste = aj;
  guardar(); pintar();
}
/** La tarifa de un proveedor con el precio de venta (lo que vende el comercial),
 *  en PDF o Excel, para mandársela. No lleva el coste ni el margen. */
async function exportarTarifa(proveedor, formato) {
  const c = E.catalogos[proveedor];
  if (!c) return;
  const aj = c.ajuste || null;
  const filas = Object.entries(c.items || {}).map(([ref, it]) => ({ ref, desc: it.d || '', ean: it.ean || '', venta: CP.precioVenta(it.p, aj) }));
  if (!filas.length) { alert('Esa tarifa no tiene artículos.'); return; }
  if (aj && aj.modo && aj.modo !== 'ninguno' && !CP.parseNum(aj.pct) && !confirm('Has elegido un ajuste pero sin porcentaje: los precios saldrán igual que en la tarifa. ¿Seguir?')) return;
  const limpio = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const base = `Tarifa_${limpio(proveedor)}_${hoy()}`;
  if (formato === 'xlsx') {
    const aoa = [[`Tarifa ${proveedor} · precios de venta · ${fmtFecha(hoy())}`], [], ['Referencia', 'Descripción', 'EAN', 'Precio']]
      .concat(filas.map((f) => [f.ref, f.desc, f.ean, f.venta]));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 16 }, { wch: 60 }, { wch: 15 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Tarifa');
    XLSX.writeFile(wb, base + '.xlsx');
    return;
  }
  if (!window.jspdf) await cargarScript(JSPDF);
  if (!window.jspdf.jsPDF.API.autoTable) await cargarScript(JSPDF_TABLA);
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const ancho = doc.internal.pageSize.getWidth();
  const alto = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(`Tarifa ${proveedor}`, 14, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(`Ofipapel, S.L. · precios de venta · ${fmtFecha(hoy())} · ${filas.length} artículos`, 14, 25);
  doc.autoTable({
    startY: 30, margin: { left: 14, right: 14 },
    head: [['Referencia', 'Descripción', 'Precio']],
    body: filas.map((f) => [f.ref, f.desc, f.venta == null ? '' : fmt(f.venta) + ' €']),
    styles: { fontSize: 9, cellPadding: 1.5 }, headStyles: { fillColor: [30, 125, 50], textColor: 255 },
    columnStyles: { 0: { cellWidth: 34 }, 2: { cellWidth: 24, halign: 'right' } },
  });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Tarifa ${proveedor} · página ${i} de ${n}`, ancho / 2, alto - 8, { align: 'center' });
  }
  doc.save(base + '.pdf');
}
function quitarCatalogo(proveedor) {
  if (!confirm(`¿Quitar el catálogo de ${proveedor}? Los pedidos no cambian; solo deja de rellenar y comprobar referencias.`)) return;
  delete E.catalogos[proveedor];
  guardar(); pintar();
}
function descargarCopia() {
  const blob = new Blob([JSON.stringify(E, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `control-pedidos-copia-${hoy()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function restaurarCopia(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.pedidos) || !Array.isArray(d.restos)) throw new Error('no parece una copia de esta app');
    if (!confirm(`La copia tiene ${d.pedidos.length} pedidos y ${d.restos.length} restos. Sustituye TODO lo que hay ahora, también en la nube para todos los dispositivos. ¿Seguir?`)) return;
    E = Object.assign({ pedidos: [], restos: [], notas: [], catalogos: {}, historial: {} }, d);
    guardar(); pintar();
  } catch (err) { alert('No he podido restaurar: ' + err.message); }
}

// ── Salidas: listado imprimible y Excel ──────────────────────────────────────
function imprimirListado(id) {
  const p = pedidoPorId(id);
  const lineas = p.final.lineas;
  // El cliente paga lo que apuntó el comercial, tal cual: sin el descuento
  // global de la propuesta (ese es entre el proveedor y nosotros).
  const dto = esRepo(p) ? (p.final.dto || 0) : 0;
  const restos = E.restos.filter((r) => r.pedidoId === p.id && r.pendiente > 0 && !r.anulado);
  const pc = (l) => (l.precioCliente != null ? l.precioCliente : l.precio) || 0; // precio al cliente, no el coste
  const bruto = lineas.reduce((s, l) => s + pc(l) * l.cant, 0);
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Pedido ${h(p.numero)} ${h(p.cliente)}</title>
  <style>${CSS_HOJA}body{font-family:system-ui,sans-serif;color:#111}td{overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border-bottom:1px solid #ccc;padding:5px;text-align:left}td.n,th.n{text-align:right}h1{font-size:20px;margin:0}h2{font-size:15px;margin-top:24px}</style></head><body>
  <h1>${h(p.cliente)}</h1><p>${h(p.proveedor)} · pedido nº ${h(nPed(p.numero))} · ${h(fmtFecha(p.fecha))}${p.campana ? ' · campaña ' + h(p.campana) : ''}</p>
  <table><tr><th>Cant.</th><th>Referencia</th><th>Descripción</th><th class="n">Precio</th><th class="n">Importe</th></tr>
  ${lineas.map((l) => `<tr><td>${l.cant}</td><td>${h(l.ref)}</td><td>${h(l.desc)}</td><td class="n">${fmt(pc(l))}</td><td class="n">${fmt(CP.red2(pc(l) * l.cant))}</td></tr>`).join('')}
  <tr><td colspan="4" class="n"><b>Total bruto</b></td><td class="n"><b>${fmt(CP.red2(bruto))}</b></td></tr>
  ${dto ? `<tr><td colspan="4" class="n">Dto. ${h(dto)} %</td><td class="n">${fmt(CP.red2(bruto * (1 - dto / 100)))}</td></tr>` : ''}</table>
  ${restos.length ? `<h2>Pendiente de recibir</h2><table><tr><th>Cant.</th><th>Referencia</th><th>Descripción</th></tr>
  ${restos.map((r) => `<tr><td>${r.pendiente}</td><td>${h(r.ref)}</td><td>${h(r.desc)}</td></tr>`).join('')}</table>` : ''}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

// ── Enviar los pedidos de una campaña al proveedor ───────────────────────────
// Un PDF sin precios con un bloque por pedido (nº y cliente) y el correo listo

// Sin servidor de correo: en móvil/tableta el PDF se adjunta solo (compartir);
// donde no se puede, se descarga y se abre el correo para adjuntarlo a mano.
const MENSAJE_ENVIO = 'Hola, muy buenas\n\nAdjunto un nuevo pedido para valorar indicando posibles faltas de stock\n\nSaludos';
const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const JSPDF_TABLA = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
let envio = null; // {ids, proveedor, campana, file, nombre}
const cargarScript = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('no se pudo cargar ' + src.split('/').pop())); document.head.appendChild(s); });
// ── Aviso a compras: el comercial dice «ya están» cuando termina ────────────
// Sale de su propio programa de correo (como el envío al proveedor): sin

// campaña entera. No se apunta nada en los pedidos (decisión del propietario).
const CORREO_COMPRAS = 'compras@ofipapelsl.com';
function avisarCompras(clave) {
  const delGrupo = E.pedidos.filter((p) => claveGrupo(p) === clave && !esRepo(p));
  if (!delGrupo.length) return;
  const marcados = delGrupo.filter((p) => seleccionados.has(p.id));
  const ps = (marcados.length ? marcados : delGrupo.slice())
    .sort((a, b) => String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  const ej = ps[0];
  const campana = `${ej.proveedor} · ${ej.campana || 'sin campaña'}`;
  const lista = ps.map((p) => `  - nº ${nPed(p.numero)} · ${p.cliente || ''} (${p.lineas.length} línea${p.lineas.length === 1 ? '' : 's'})`).join('\n');
  const mensaje = `Hola,\n\nYa están listos para procesar ${ps.length === 1 ? 'este pedido' : `estos ${ps.length} pedidos`} de la campaña ${campana}:\n\n${lista}\n\nControl de Pedidos: ${location.origin}${location.pathname}\n\n${nube.usuario || ''}`;
  const dlg = document.getElementById('dlgEnvio');
  dlg.innerHTML = `

    <label>Para<input id="avPara" type="email" value="${h(CORREO_COMPRAS)}"></label>
    <label>Asunto<input id="avAsunto" value="${h(`Pedidos listos · ${campana}`)}"></label>
    <label>Mensaje<textarea id="avMensaje" rows="10">${h(mensaje)}</textarea></label>
    <div class="fila" style="margin-top:10px">

      <button class="btn peque" onclick="document.getElementById('dlgEnvio').close()">Cerrar</button>

function abrirCorreoAviso() {

function chipEnvio(ps) {
  const env = ps.filter(envioDe);
  if (!env.length) return '';
  const ult = env.map((p) => String(envioDe(p).fecha)).sort().pop();
  return env.length === ps.length
    ? `<span class="chip ok">📧 enviada ${h(fmtFecha(ult.slice(0, 10)).slice(0, 5))}</span>`
    : `<span class="chip aviso">📧 ${env.length} de ${ps.length} enviados</span>`;
}
function correoProveedor(proveedor) {

    .sort((a, b) => String(envioDe(b).fecha).localeCompare(String(envioDe(a).fecha)));
  return conEnvio.length ? envioDe(conEnvio[0]).para : '';
}
async function prepararEnvio(clave, raiz) {
  const delGrupo = E.pedidos.filter((p) => claveGrupo(p) === clave);
  let ps = delGrupo.filter((p) => seleccionados.has(p.id));

async function pdfPedidosProveedor(proveedor, campana, bloques) {
  if (!window.jspdf) await cargarScript(JSPDF);
  if (!window.jspdf.jsPDF.API.autoTable) await cargarScript(JSPDF_TABLA);
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const ancho = doc.internal.pageSize.getWidth();
  const alto = doc.internal.pageSize.getHeight();
  const nLineas = bloques.reduce((s, b) => s + b.lineas.length, 0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(`Pedido · ${proveedor}`, 14, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(`OFIPAPEL, S.L. · ${campana ? 'Campaña: ' + campana + ' · ' : ''}${fmtFecha(hoy())}`, 14, 25);
  doc.text(`${bloques.length} pedido(s) · ${nLineas} línea(s) · Rogamos indiquen las posibles faltas de stock.`, 14, 31);
  let y = 38;
  for (const b of bloques) {
    if (y > alto - 40) { doc.addPage(); y = 18; }
    doc.setFillColor(30, 125, 50); doc.rect(14, y, ancho - 28, 8, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text(`Pedido nº ${nPed(b.numero) || '—'}${b.cliente ? ' — ' + b.cliente : ''}`, 16, y + 5.5);
    doc.setTextColor(0);
    doc.autoTable({
      startY: y + 8, margin: { left: 14, right: 14 },
      head: [['Cant.', 'Referencia', 'Descripción']],
      body: b.lineas.map((l) => [fmt(l.cant).replace(',00', '') + (l.exp ? ' EXP' : ''), l.ref, l.desc]),
      styles: { fontSize: 10, cellPadding: 1.8 }, headStyles: { fillColor: [234, 247, 236], textColor: 20 },
      columnStyles: { 0: { cellWidth: 22, halign: 'right' }, 1: { cellWidth: 42 } },
    });
    y = doc.lastAutoTable.finalY + 8;
  }
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Ofipapel, S.L. · compras@ofipapelsl.com · página ${i} de ${n}`, ancho / 2, alto - 8, { align: 'center' });
  }
  const limpio = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
  const nombre = `Pedido_Ofipapel_${limpio(proveedor)}${campana ? '_' + limpio(campana) : ''}_${hoy()}.pdf`;
  return new File([doc.output('blob')], nombre, { type: 'application/pdf' });
}

function exportarPedidos(ids, opciones) {
  const soloFactura = opciones && opciones.soloFactura;
  const ps = ids.map(pedidoPorId).filter(Boolean);
  const sinValidar = ps.filter((p) => !p.validado);
  if (sinValidar.length) { alert('No se puede exportar con discordancias sin resolver. Sin validar: ' + sinValidar.map((p) => 'nº ' + p.numero).join(', ')); return; }
  const provs = [...new Set(ps.map((p) => p.proveedor))];
  if (provs.length > 1) { alert('Exporta los pedidos de un proveedor cada vez.'); return; }
  // La marca de la campaña es obligatoria: sin ella Géminis no sabe la EDITORIAL.
  const grupos = [...new Set(ps.map(claveGrupo))];
  let marca = marcaDe(ps) || marcaDe(E.pedidos.filter((p) => grupos.includes(claveGrupo(p))));
  if (!marca) marca = elegirMarca(grupos[0]);
  if (!marca) { alert('Elige la marca de la campaña para exportar el Excel de Géminis.'); return; }
  // Cada línea con un único descuento equivalente (encadenados + global del
  // pedido) sin tocar el precio base. Varias selecciones se suman por
  // referencia, precio y descuento.
  const decimales = CP.parseNum(localStorage.getItem('cp.decimales') || '2');
  const suma = new Map();
  // Con factura final en todos, el Excel es la factura tal cual: una fila por
  // línea, en su orden (por subida y posición), sin juntar referencias.
  // (las facturas subidas antes del 23/10/2026 no guardan la posición: esas, como antes).
  const comoFactura = Boolean(soloFactura) || ps.every((p) => p.factura && p.factura.lineas.length && p.factura.lineas.every((l) => l.pos != null));
  const filas = [];
  for (const p of ps) {
    // La factura final manda: si está, el Excel es ella tal cual (su orden,
    // precio y descuento). Si no, lo validado en el orden de la propuesta.
    const lineasFra = !p.factura ? [] : soloFactura
      ? p.factura.lineas.filter((l) => CP.facturaDeLinea(l, l.origen || (p.factura.cabecera || {}).numero || p.factura.archivo) === soloFactura)
      : p.factura.lineas;
    const enOrden = p.factura ? CP.fusionarAltas(lineasFra, p.final.lineas) : CP.ordenarComoPropuesta(p.final.lineas, p.propuesta && p.propuesta.lineas);
    const dtoGlobal = p.factura ? (p.factura.cabecera || {}).dtoGlobal : p.final.dto;
    for (const l0 of CP.lineasParaGeminis(enOrden, { dtoGlobal, decimales })) {
      // Géminis guarda las referencias de Finocam sin el año del final.
      const l = Object.assign({}, l0, { ref: l0.alta ? l0.ref : CP.refParaGeminis(l0.ref, p.proveedor) });
      if (comoFactura) { filas.push(Object.assign(l, { _fra: CP.facturaDeLinea(l0, l0.origen || (p.factura.cabecera || {}).numero || p.factura.archivo), _ped: p })); continue; }
      const k = [l.ref, l.precio, l.dto].join('|');
      if (!suma.has(k)) { suma.set(k, Object.assign({}, l)); continue; }
      const g = suma.get(k);
      g.cant += l.cant; g.total = CP.red2(g.total + l.total); g.residuo = CP.red2(g.residuo + l.residuo);
    }
  }
  if (comoFactura) {
    const orden = (l) => [l.subida != null ? l.subida : Infinity, l.pos != null ? l.pos : Infinity];
    filas.forEach((l, i) => { l._i = i; });
    filas.sort((a, b) => { const x = orden(a), y = orden(b); return x[0] - y[0] || x[1] - y[1] || a._i - b._i; });
    filas.forEach((l) => delete l._i);
    // Una línea de la factura repartida entre varios clientes vuelve a ser una sola fila.
    for (let i = filas.length - 1; i > 0; i--) {
      const a = filas[i - 1], b = filas[i];
      if (a._fra === b._fra && a.subida === b.subida && a.pos === b.pos && a.ref === b.ref && a.precio === b.precio && a.dto === b.dto) {
        a.cant += b.cant; a.total = CP.red2(a.total + b.total); a.residuo = CP.red2((a.residuo || 0) + (b.residuo || 0));
        filas.splice(i, 1);
      }
    }
  }
  if (comoFactura) {
    // Un Excel por cada factura del proveedor (en Géminis, una compra por factura),
    // cada uno en el orden exacto de su factura.
    const porFactura = new Map();
    for (const l of filas) {
      if (!porFactura.has(l._fra)) porFactura.set(l._fra, []);
      porFactura.get(l._fra).push(l);
    }
    if (soloFactura) {
      for (const k of [...porFactura.keys()]) if (k !== soloFactura) porFactura.delete(k);
      if (!porFactura.size) { alert(`No encuentro las líneas de la factura ${soloFactura} en esos pedidos.`); return; }
    }
    if (porFactura.size > 1) alert(`Estos pedidos vienen en ${porFactura.size} facturas del proveedor (${[...porFactura.keys()].join(', ')}): se descarga un Excel de Géminis por factura, cada uno en su orden.`);
    for (const [fra, ls] of porFactura) {
      const peds = [...new Set(ls.map((l) => l._ped))];
      ls.forEach((l) => { delete l._fra; delete l._ped; });
      descargarGeminis(ls, { proveedor: provs[0], numero: soloFactura || porFactura.size > 1 || peds.length > 1 ? `FRA ${fra}` : peds[0].numero,
        observaciones: `Factura ${fra}: ` + peds.map((p) => `${p.numero} ${p.cliente || ''}`.trim()).join(', '), decimales, marca });
    }
    return;
  }
  descargarGeminis([...suma.values()], { proveedor: provs[0], numero: ps.length === 1 ? ps[0].numero : ps.map((p) => p.numero).join('+'),
    observaciones: ps.map((p) => `${p.numero} ${p.cliente || ''}`.trim()).join(', '), decimales, marca });
}
/** Escribe el Excel 5.0/95 de Géminis (artículos desde la fila 11) con líneas ya pasadas por lineasParaGeminis. */
function descargarGeminis(lineas, o) {
  const decimales = o.decimales;
  const suma = new Map(lineas.map((l, i) => [i, l]));
  const provs = [o.proveedor];
  const numero = o.numero || '';
  const descuadres = [...suma.values()].filter((l) => l.residuo);
  if (descuadres.length && !confirm(`Con ${decimales} decimales en el descuento, ${descuadres.length} línea(s) no cuadran al céntimo con el importe del proveedor:\n` +
    descuadres.slice(0, 8).map((l) => `${l.ref}: ${l.residuo > 0 ? '+' : ''}${fmt(l.residuo)} €`).join('\n') +
    '\n\nPuedes subir los decimales en «Datos». ¿Exportar igualmente?')) return;
  const quitar = (v) => typeof v === 'string' ? v.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[Ññ]/g, (m) => (m === 'Ñ' ? 'N' : 'n')) : v;
  // Plantilla «Luis» (la oficial de Gestión, la de «PDF a Excel») por defecto:
  // con la «Rober» Géminis no reconocía las referencias (20/10/2026).
  const rober = (localStorage.getItem('cp.plantilla') || 'luis') === 'rober';
  const cab = { proveedor: provs[0], fecha: fmtFecha(hoy()), numero, almacen: localStorage.getItem('cp.almacen') || '', observaciones: o.observaciones || '', marca: o.marca || '' };
  const opc = { igic: CP.parseNum(localStorage.getItem('cp.igic') || '7') };
  const aoa = (rober ? CP.filasGeminis([...suma.values()], cab, opc) : CP.filasGeminisLuis([...suma.values()], cab, opc)).map((f) => f.map(quitar));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = rober
    ? [{ wch: 15 }, { wch: 38 }, { wch: 14 }, { wch: 6 }, { wch: 8 }, { wch: 8 }, { wch: 9 }, { wch: 7 }, { wch: 6 }, { wch: 10 }, { wch: 9 }, { wch: 9 }, { wch: 12 }, { wch: 14 }]
    : [{ wch: 14 }, { wch: 16 }, { wch: 16 }, { wch: 40 }, { wch: 7 }, { wch: 9 }, { wch: 8 }, { wch: 10 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 2 }, { wch: 12 }, { wch: 10 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'fichero');
  XLSX.writeFile(wb, `PEDIDO_${quitar(provs[0]).replace(/\W+/g, '_')}${numero ? '_' + String(numero).replace(/\W+/g, '_') : ''}${rober ? '_ROBER' : ''}.xls`, { bookType: 'biff5' });
  // El total, para cuadrarlo con la factura en la mano (en el Excel no va: la
  // plantilla de Géminis no lleva fila de total y la importaría como artículo).
  const total = CP.red2([...suma.values()].reduce((t, l) => t + (CP.parseNum(l.total) || 0), 0));
  alert(`Excel de Géminis: ${suma.size} líneas · total ${fmt(total)} € (sin impuestos).`);
}

/** No repinta mientras se escribe en una casilla (perdería el foco y lo tecleado). */
function editando() {
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#main'));
}
function repintarCuandoSePueda() {
  if (editando()) { nube.repintar = true; return; }
  nube.repintar = false;
  pintar();
}
document.addEventListener('focusout', () => setTimeout(() => { if (nube.repintar && !editando()) repintarCuandoSePueda(); }, 250));

async function sincronizar() {
  if (!nube.cli || !nube.usuario) return;
  if (nube.ocupada) { nube.otraVez = true; return; }
  if (!navigator.onLine) { nube.estado = 'offline'; pintarNube(); return; }
  nube.ocupada = true;
  nube.estado = 'sincronizando';
  pintarNube();
  const conflictos = [];
  let cambiado = false;
  try {
    // 1) Bajar lo que han cambiado los demás (con 2 minutos de margen: el
    //    orden de llegada no es exacto; lo repetido se descarta por versión).
    const margen = nube.meta.desde ? new Date(new Date(nube.meta.desde).getTime() - 120000).toISOString() : null;
    let desde = nube.meta.desde;
    for (let off = 0; ; off += 500) {
      let q = nube.cli.from('cp_docs').select('coleccion,id,datos,borrado,version,actualizado,autor')
        .order('actualizado').order('coleccion').order('id').range(off, off + 499);
      if (margen) q = q.gte('actualizado', margen);
      const { data, error } = await q;
      if (error) throw error;
      const filas = (data || []).map((r) => Object.assign(r, { autor: String(r.autor || '').replace(DOMINIO, '') }));
      const teniamos = new Set(E.pedidos.map((p) => String(p.id)));
      const r = CP.integrarBajada(E, nube.meta.docs, filas);
      // Pedidos nuevos de otra persona → campana (no en la primera sincronización).
      if (nube.meta.desde) {
        for (const f of filas) {
          if (f.coleccion !== 'pedidos' || f.borrado || teniamos.has(f.id) || !f.autor || f.autor === nube.usuario) continue;
          const p = E.pedidos.find((x) => String(x.id) === f.id);
          if (!p || avisos.some((a) => a.id === p.id) || (esComercial() && esRepo(p))) continue;
          avisos.push({ id: p.id, autor: f.autor, cuando: f.actualizado });
        }
        guardarAvisos();
      }
      cambiado = cambiado || r.cambiado;
      conflictos.push(...r.conflictos);
      for (const f of filas) if (!desde || f.actualizado > desde) desde = f.actualizado;
      if (filas.length < 500) break;
    }
    nube.meta.desde = desde;
    // 2) Subir lo nuestro, por tandas.
    const pendientes = CP.cambiosPendientes(E, nube.meta.docs);
    for (let i = 0; i < pendientes.length; i += 100) {
      const tanda = pendientes.slice(i, i + 100);
      const { data, error } = await nube.cli.rpc('cp_guardar_lote', {
        p_docs: tanda.map((d) => ({ coleccion: d.coleccion, id: d.id, datos: d.datos, version: d.version, borrado: d.borrado })),
      });
      if (error) throw error;
      const r = CP.integrarSubida(E, nube.meta.docs, tanda, (data || []).map((x) => Object.assign(x, { autor: String(x.autor || '').replace(DOMINIO, '') })));
      cambiado = cambiado || r.cambiado;
      conflictos.push(...r.conflictos);
      for (const x of data || []) if (x.ok && x.actualizado && (!nube.meta.desde || x.actualizado > nube.meta.desde)) nube.meta.desde = x.actualizado;
    }
    nube.estado = 'ok';
    nube.error = '';
    nube.ultima = new Date();
    irAWebBuenaSiSePuede();
  } catch (err) {
    const msg = String((err && (err.message || err.msg)) || err);
    nube.estado = navigator.onLine && !/fetch|network|Load failed/i.test(msg) ? 'error' : 'offline';
    nube.error = msg;
    if (/JWT|token|42501|permission|no tiene acceso/i.test(msg)) {
      const { data } = await nube.cli.auth.getSession().catch(() => ({ data: {} }));
      if (!data || !data.session) { nube.usuario = null; mostrarLogin('La sesión ha caducado: vuelve a entrar.'); }
    }
  } finally {
    try { localStorage.setItem(CLAVE_NUBE, JSON.stringify(nube.meta)); } catch { /* el siguiente intento lo reescribe */ }
    if (cambiado) { guardarLocal(); repintarCuandoSePueda(); }
    apartarConflictos(conflictos);
    nube.ocupada = false;
    pintarNube();
    pintarCampana();
    if (vista === 'datos' && !editando()) pintar();
    if (nube.otraVez) { nube.otraVez = false; programarSubida(300); }
  }
}

function mostrarLogin(mensaje) {
  document.getElementById('login').classList.remove('oculto');
  document.getElementById('loginError').textContent = mensaje || '';
  setTimeout(() => document.getElementById('loginUsuario').focus(), 50);
}
async function entrarConUsuario() {
  const u = document.getElementById('loginUsuario').value.trim().toLowerCase().replace(DOMINIO, '');
  const clave = document.getElementById('loginClave').value;
  const error = document.getElementById('loginError');
  const boton = document.getElementById('loginBoton');
  if (!u || !clave) { error.textContent = 'Escribe usuario y contraseña.'; return; }
  boton.disabled = true; boton.textContent = 'Entrando…'; error.textContent = '';
  try {
    const { error: e } = await nube.cli.auth.signInWithPassword({ email: u + DOMINIO, password: clave });
    if (e) { error.textContent = /fetch|network/i.test(e.message) ? 'Sin conexión: hace falta cobertura para entrar la primera vez.' : 'Usuario o contraseña incorrectos.'; return; }
    await empezarSesion(true);
  } catch (e) {
    error.textContent = 'Sin conexión: hace falta cobertura para entrar la primera vez.';
  } finally { boton.disabled = false; boton.textContent = 'Entrar'; }
}
/** Con sesión: comprueba (si hay red) que la cuenta es de Control de Pedidos y arranca. */
async function empezarSesion(recienEntrado) {
  const { data } = await nube.cli.auth.getSession();
  const s = data && data.session;
  if (!s) { mostrarLogin(); return; }
  if (navigator.onLine) {
    const { data: miembro, error } = await nube.cli.rpc('cp_es_miembro');
    if (!error && miembro === false) {
      await nube.cli.auth.signOut();
      mostrarLogin('Esta cuenta no tiene acceso a Control de Pedidos.');
      return;
    }
  }
  nube.usuario = String(s.user.email || '').replace(DOMINIO, '');
  try { localStorage.setItem(CLAVE_ULTIMO_USUARIO, nube.usuario); } catch { /* solo afecta a la pestaña de arranque */ }
  document.getElementById('login').classList.add('oculto');
  document.getElementById('loginClave').value = '';
  pintar();
  if (recienEntrado || true) sincronizar();
}
async function salir() {
  const pend = CP.cambiosPendientes(E, nube.meta.docs).length;
  if (!confirm(pend ? `Hay ${pend} cambio(s) sin subir a la nube. Si cierras la sesión, se suben cuando alguien vuelva a entrar en este dispositivo. ¿Cerrar sesión?` : '¿Cerrar la sesión en este dispositivo?')) return;
  try { await nube.cli.auth.signOut(); } catch { /* sin red: la sesión local se borra igual */ }
  nube.usuario = null;
  nube.estado = 'local';
  pintar();
  mostrarLogin();
}

/** Fuera de Netlify (la copia de GitHub) las fotos no se pueden leer: en cuanto
 *  no queda nada sin subir a la nube, se pasa sola a la web buena. Con cambios
 *  sin subir no se va (se perderían): se queda el aviso con el botón. */
function irAWebBuenaSiSePuede() {
  if (EN_NETLIFY) return;
  if (CP.cambiosPendientes(E, nube.meta.docs).length) return;
  location.replace(WEB_BUENA);
}
async function arrancar() {
  if (!EN_NETLIFY) {
    document.getElementById('avisoWeb').innerHTML = `<div class="aviso-caja aviso" style="margin:0"><b>Esta es una copia de la app que no puede leer fotos ni PDF.</b> Usa la de siempre: tus datos ya están en la nube y salen igual.
      <div class="fila" style="margin-top:8px"><a class="btn primario" href="${WEB_BUENA}">Abrir en ofipapel.netlify.app</a></div></div>`;
  }
  if (typeof CP.cambiosPendientes !== 'function') {
    // Lógica vieja con HTML nuevo: no se sincroniza (no se arriesga nada) y se avisa.
    nube.estado = 'error';
    mostrarFallo('se ha cargado una versión vieja de la app. Recarga la página (sin borrar los datos del navegador)');
    pintar();
    return;
  }
  if (!window.supabase || !window.supabase.createClient) {
    // Sin la librería (sin cobertura al abrir): se trabaja en local.
    nube.estado = 'sin-libreria';
    pintar();
    return;
  }
  nube.cli = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
    auth: { storageKey: 'ofipapel-control-pedidos-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  nube.cli.auth.onAuthStateChange((evento) => {
    if (evento === 'SIGNED_OUT' && nube.usuario) { nube.usuario = null; nube.estado = 'local'; pintar(); mostrarLogin('La sesión se ha cerrado: vuelve a entrar.'); }
  });
  pintar();
  if (!EN_NETLIFY && !E.pedidos.length && !E.restos.length && !E.notas.length) { location.replace(WEB_BUENA); return; }
  try { await empezarSesion(false); } catch (e) { nube.estado = 'offline'; pintar(); }
  setInterval(() => { if (nube.usuario && document.visibilityState === 'visible') sincronizar(); }, 20000);
  window.addEventListener('online', () => sincronizar());
  window.addEventListener('offline', () => { nube.estado = 'offline'; pintarNube(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
}

arrancar();

// El mismo service worker del resto del ecosistema: sirve el HTML siempre
// fresco desde la red (no deja la app atascada en una versión vieja) y basta
// para que Android ofrezca instalarla como app.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
