        : `<span class="pequeno">Al validar, lo que no llega pasa a Restos y las notas a Notas de facturación.</span>`)}
    </div>
    ${p.validado ? `<div class="fila no-imprimir" style="margin-top:10px">
      ${esRepo(p) ? `<button class="btn" onclick="window.print()">Imprimir comparación</button>` : `<button class="btn" onclick="imprimirListado('${p.id}')">Imprimir listado del cliente</button>`}
      <button class="btn" onclick="exportarPedidos(['${p.id}'])">Excel Géminis de este pedido</button>
    </div>` : ''}
  </div>`;
}

/** Lo que de verdad importa de un pedido: qué falta y qué sobra. */
function bloqueFaltasSobras(p, filas) {
  const { faltan, sobran } = CP.faltasYSobras(filas);
  const pendientes = esRepo(p) ? faltan : CP.faltasPendientes(filas, p.decisiones);
  const pend = new Set(pendientes.map((x) => x.ref));
  const doc = esRepo(p) ? 'la factura/propuesta' : 'la propuesta';
  const decidido = { reclamar: '✉️ reclamada, esperando respuesta del proveedor', resto: 'sin stock: en restos', anular: 'descartada definitivamente', excluir: 'descartada', aceptar: 'aceptada la propuesta', mantener: 'se mantiene lo pedido', manual: 'a mano' };
  const linea = (x, signo, falta) => {
    const acc = falta && !esRepo(p) && (p.decisiones[x.ref] || {}).accion;
    const fuera = falta && !esRepo(p) && !pend.has(x.ref);
    return `<li${fuera ? ' class="descartada"' : ''}><b>${h(x.ref)}</b> ${h(x.desc)} — ${signo}${x.cant}${x.total ? '' : ` de ${x.de}`} ud.${x.total ? '' : ' (parcial)'}${x.sustitucion ? ` <span class="pequeno">¿sustitución ${h(x.sustitucion)}?</span>` : ''}${acc ? ` <span class="pequeno">· ${h(decidido[acc] || acc)}</span>` : ''}</li>`;
  };
  return `
    <div class="aviso-caja ${pendientes.length ? 'mal' : 'ok'}" style="margin-top:0">
      <b>${pendientes.length ? `❌ Faltan ${pendientes.length} referencia(s)` : faltan.length ? '✅ Ninguna falta pendiente' : '✅ No falta nada'}</b> — pedido que no viene en ${doc}${faltan.length > pendientes.length ? ` <span class="pequeno">(${faltan.length - pendientes.length} ya decidida(s): no cuentan)</span>` : ''}
      ${faltan.length ? `<ul style="margin:6px 0 0;padding-left:18px">${faltan.map((x) => linea(x, '', true)).join('')}</ul>` : ''}
    </div>
    <div class="aviso-caja ${sobran.length ? 'aviso' : 'ok'}">
      <b>${sobran.length ? `⚠️ Sobran ${sobran.length} referencia(s)` : '✅ No sobra nada'}</b> — vienen en ${doc} sin haberse pedido (o de más)
      ${sobran.length ? `<ul style="margin:6px 0 0;padding-left:18px">${sobran.map((x) => linea(x, '+')).join('')}</ul>` : ''}
    </div>`;
}

/** Si la propuesta trae algo que otro cliente tiene pendiente en restos, se avisa. */
function avisoRestosEnPropuesta(p) {
  if (!p.propuesta) return '';
  const refs = new Set(p.propuesta.lineas.map((l) => CP.normRef(l.ref)));
  const r = E.restos.filter((x) => x.pendiente > 0 && !x.anulado && x.pedidoId !== p.id && x.proveedor === p.proveedor && refs.has(CP.normRef(x.ref)));
  if (!r.length) return '';
  return `<div class="aviso-caja info"><b>Esta propuesta trae artículos que están en restos de otros clientes:</b><br>${r.map((x) =>
    `${h(x.ref)} ${h(x.desc)} — ${x.pendiente} ud. de <b>${h(x.cliente)}</b> (pedido ${h(x.numero)}, ${h(fmtFecha(x.fecha))})`).join('<br>')}
    <br><span class="pequeno">Cuando llegue la mercancía, regístralo en «Restos → Registrar llegada» para asignárselo.</span></div>`;
}

// ── Edición ──────────────────────────────────────────────────────────────────
function pedidoActual() { return pedidoPorId(pedidoAbierto); }
function invalidar(p) { p.validado = false; }
function cambiaCampo(campo, valor) {
  const p = pedidoActual();
  p[campo] = campo === 'campana' ? campanaCanonica(p.proveedor, valor) : valor;
  invalidar(p); guardar(); pintar();
}
function cambiaLinea(i, campo, valor, lado) {
  const p = pedidoActual();
  const l = (lado === 'propuesta' ? p.propuesta.lineas : p.lineas)[i];
  if (campo === 'precio') l.precio = CP.parseNum(valor);
  else if (campo === 'cant') l.cant = CP.parseNum(valor) || 0;
  else if (campo === 'ref') l.ref = CP.normRef(valor);
  else if (campo === 'dtos') l.dtos = CP.parseDtos(valor);
  else if (campo === 'udsCaja') l.udsCaja = CP.parseNum(valor);
  else l[campo] = valor;
  if (['cant', 'precio', 'dtos'].includes(campo)) l.importe = null; // el importe del Excel ya no vale
  invalidar(p); guardar(); pintar();
}
function borrarLinea(i, lado) {
  const p = pedidoActual();
  const lista = lado === 'propuesta' ? p.propuesta.lineas : p.lineas;
  if (lado !== 'propuesta' && p.registro && p.registro.length) apuntar(p, 'baja', lista[i]);
  lista.splice(i, 1); invalidar(p); guardar(); pintar();
}
/** Bloc del pedido: queda constancia, con la hora, de cada artículo que se
 *  mete a mano casilla a casilla (y de los que se borran después). */
const textoLinea = (l) => `${fmt(l.cant).replace(',00', '')}${l.exp ? ' EXP' : ''} × ${l.ref}${l.desc ? ' ' + l.desc : ''}${l.precio != null ? ' · ' + fmt(l.precio) + ' €' : ''}`;
function apuntar(p, accion, l) {
  const reg = (p.registro = p.registro || []);
  const ahora = new Date().toISOString();
  const texto = textoLinea(l);
  // Al borrar, se tacha la apuntada (no se apunta otra vez).
  const previa = accion === 'baja' && [...reg].reverse().find((x) => x.accion === 'alta' && !x.borrada && x.texto === texto);
  if (previa) previa.borrada = ahora;
  else reg.push({ hora: ahora, accion, texto });
}
function vistaBloc(p) {
  const reg = p.registro || [];
  if (!reg.length) return '';
  const hora = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${fmtFecha(iso.slice(0, 10))} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const borradas = reg.filter((x) => x.borrada || x.accion === 'baja').length;
  return `
    <details class="bloc no-imprimir" open>
      <summary><b>📝 Bloc del pedido</b> · ${reg.length} artículo(s) apuntado(s)${borradas ? ` · ${borradas} borrado(s)` : ''}</summary>
      <ol>${reg.map((x) => `<li><span class="hora">${h(hora(x.hora))}</span> <span class="${x.borrada || x.accion === 'baja' ? 'baja' : ''}">${h(x.texto)}</span>${x.borrada ? ` <span class="pequeno">borrada ${h(hora(x.borrada))}</span>` : x.accion === 'baja' ? ' <span class="pequeno">(borrada)</span>' : ''}</li>`).join('')}</ol>
      <button class="btn peque" onclick="copiarBloc()">Copiar el bloc</button>
    </details>`;
}
function copiarBloc() {
  const p = pedidoActual();
  const t = [`Pedido ${p.proveedor} nº ${p.numero}${p.cliente ? ' · ' + p.cliente : ''}`]
    .concat((p.registro || []).map((x, i) => `${i + 1}. ${x.texto}${x.borrada || x.accion === 'baja' ? ' (borrada)' : ''}`)).join('\n');
  const hecho = () => alert('Bloc copiado.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(hecho, () => prompt('Copia el texto:', t));
  else prompt('Copia el texto:', t);
}
function anadirLinea() { const p = pedidoActual(); p.lineas.push({ ref: '', desc: '', cant: 1, precio: null, exp: false, duda: '' }); guardar(); pintar(); }
/** Entrada de artículos casilla a casilla, pensada para tableta: Enter pasa a
 *  la siguiente (cantidad → referencia → descripción → precio) y en el precio
 *  añade la línea y vuelve a la cantidad. Si la referencia está en el
 *  catálogo del proveedor, rellena descripción y precio (se pueden cambiar). */
const CAMPOS_RAPIDA = ['qaCant', 'qaRef', 'qaDesc', 'qaPrecio'];
function entradaRapida() {
  const campo = (id, etiqueta, extra, estiloEtiqueta) => `<label${estiloEtiqueta ? ` style="${estiloEtiqueta}"` : ''}>${etiqueta}<input id="${id}" autocomplete="off" onkeydown="teclaRapida(event, '${id}')" ${extra}></label>`;
  return `
    <div class="entrada-rapida no-imprimir">
      <div class="pequeno" style="margin-bottom:6px"><b>Añadir artículo</b> · escribe y pulsa <b>Enter</b> para pasar a la siguiente casilla; en el precio, Enter añade la línea.</div>
      <div class="fila">
        ${campo('qaCant', 'Cantidad', 'style="width:80px" inputmode="decimal" enterkeyhint="next" placeholder="1"')}
        <label class="casilla"><input type="checkbox" id="qaExp"> Expositor</label>
        ${campo('qaRef', 'Referencia', 'style="width:140px" enterkeyhint="next"')}
        ${campo('qaDesc', 'Descripción', 'enterkeyhint="next"', 'flex:1 1 200px')}
        ${campo('qaPrecio', 'Precio', 'style="width:90px" inputmode="decimal" enterkeyhint="done"')}
        <button class="btn primario" onclick="anadirRapida()">Añadir</button>
      </div>
    </div>`;
}
function teclaRapida(ev, id) {
  if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
  ev.preventDefault();
  if (id === 'qaRef') completarDesdeCatalogo();
  if (id === 'qaPrecio') { anadirRapida(); return; }
  const sig = document.getElementById(CAMPOS_RAPIDA[CAMPOS_RAPIDA.indexOf(id) + 1]);
  sig.focus(); sig.select();
}
function completarDesdeCatalogo() {
  const cat = catalogoDe(pedidoActual().proveedor);
  const ref = CP.normRef(document.getElementById('qaRef').value);
  const it = cat && ref && cat[ref];
  if (!it) return;
  const desc = document.getElementById('qaDesc');
  const precio = document.getElementById('qaPrecio');
  if (!desc.value.trim() && it.d) desc.value = it.d;
  if (!precio.value.trim() && it.p != null) precio.value = fmt(it.p);
}
function anadirRapida() {
  const v = (id) => document.getElementById(id).value.trim();
  // «1EXP» o «1 exp» en la cantidad también marca expositor.
  const mc = v('qaCant').match(/^(\d+(?:[.,]\d+)?)\s*(EXP\.?|EX\.?)?$/i);
  if (!mc) { const c = document.getElementById('qaCant'); c.focus(); c.select(); return; }
  if (!v('qaRef')) { document.getElementById('qaRef').focus(); return; }
  const p = pedidoActual();
  const l = { cant: CP.parseNum(mc[1]), exp: Boolean(mc[2]) || document.getElementById('qaExp').checked, ref: CP.normRef(v('qaRef')),
    desc: v('qaDesc').toUpperCase(), precio: v('qaPrecio') ? CP.parseNum(v('qaPrecio')) : null, dtos: [], duda: '' };
  p.lineas.push(l);
  apuntar(p, 'alta', l);
  invalidar(p); guardar(); pintar();
  const ol = document.querySelector('details.bloc ol'); if (ol) ol.scrollTop = ol.scrollHeight;
  document.getElementById('qaCant').focus();
}
function borrarPedido() {
  const p = pedidoActual();
  const asignados = E.restos.some((r) => r.pedidoId === p.id && r.asignaciones.length);
  if (!confirm(`¿Borrar el pedido nº ${p.numero} de ${p.cliente}?` + (asignados ? '\nSus restos con llegadas registradas se conservan.' : ''))) return;
  E.pedidos = E.pedidos.filter((x) => x.id !== p.id);
  E.restos = E.restos.filter((r) => r.pedidoId !== p.id || r.asignaciones.length);
  E.notas = E.notas.filter((n) => n.pedidoId !== p.id);
  pedidoAbierto = null; guardar(); pintar();
}
function decide(ref, campo, valor) {
  const p = pedidoActual();
  p.decisiones[ref] = Object.assign({}, p.decisiones[ref], { [campo]: valor });
  invalidar(p); guardar(); pintar();
}

/** «4 780100027 3,25 CALENDARIO» · «1EXP 883840127 180,14» · también separado por tabuladores (copiado de Excel). */
function pegarLineas(destino) {
  const p = pedidoActual();
  const aPropuesta = destino === 'propuesta';
  const txt = document.getElementById(aPropuesta ? 'txtPegarProp' : 'txtPegar').value;
  const nuevas = [];
  const malas = [];
  for (const crudo of txt.split(/\r?\n/)) {
    const linea = crudo.trim();
    if (!linea) continue;
    const m = linea.match(/^(\d+(?:[.,]\d+)?)\s*(EXP\.?|EX\.?)?\s+(\S+)\s*(.*)$/i);
    if (!m) { malas.push(linea); continue; }
    let resto = m[4].trim();
    let precio = null;
    const mp = resto.match(/(?:^|\s)(\d+(?:[.,']\d{1,2})?)\s*€?\s*(.*)$/);
    if (mp) { precio = CP.parseNum(mp[1]); resto = (resto.slice(0, mp.index) + ' ' + mp[2]).trim(); }
    // Descuentos justo tras el precio, solo si llevan % o + (un número suelto
    // podría ser el principio de la descripción): «10%», «10+5», «10%+5%».
    let dtos = [];
    const md = resto.match(/^(\d+(?:[.,]\d+)?%(?:\s*\+\s*\d+(?:[.,]\d+)?%?)*|\d+(?:[.,]\d+)?(?:\s*\+\s*\d+(?:[.,]\d+)?%?)+)\s*(.*)$/);
    if (md) { dtos = CP.parseDtos(md[1].replace(/\s+/g, '')); resto = md[2].trim(); }
    nuevas.push({ cant: CP.parseNum(m[1]), exp: Boolean(m[2]), ref: CP.normRef(m[3]), precio, dtos, desc: resto, duda: '' });
  }
  if (aPropuesta) {
    if (p.propuesta && !confirm('¿Sustituir la propuesta actual por estas líneas?')) return;
    p.propuesta = { archivo: 'Líneas pegadas', fecha: hoy(), cabecera: {}, lineas: nuevas };
  } else {
    p.lineas.push(...nuevas);
  }
  invalidar(p); guardar(); pintar();
  if (malas.length) alert(`Añadidas ${nuevas.length}. No he entendido ${malas.length}:\n` + malas.slice(0, 8).join('\n'));
}

// ── Fotos → lectura con IA ───────────────────────────────────────────────────
/** Abre la imagen para reducirla. createImageBitmap falla en algunos móviles
 *  («The source image could not be decoded»): se prueba con <img>, y si
 *  tampoco, un JPEG no muy grande se manda tal cual. */
function imagenPorImg(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('no decodifica')); };
    img.src = url;
  });
}
async function reducirImagen(file) {
  let src;
  try { src = await createImageBitmap(file); } catch {
    try { src = await imagenPorImg(file); } catch {
      if (/jpe?g/i.test(file.type || file.name) && file.size && file.size < 3 * 1024 * 1024) return base64DeFichero(file);
      throw new Error('el móvil no puede abrir esta imagen. Si está solo en la nube (Google Fotos), ábrela antes en la galería para que se descargue, o hazle una captura y sube la captura');
    }
  }
  const ancho = src.width || src.naturalWidth;
  const alto = src.height || src.naturalHeight;
  const lado = 1600;
  const k = Math.min(1, lado / Math.max(ancho, alto));
  const c = document.createElement('canvas');
  c.width = Math.round(ancho * k); c.height = Math.round(alto * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

const esPdf = (f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const esImagen = (f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name);
function base64DeFichero(file) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => mal(new Error('No se ha podido leer el fichero'));
    fr.readAsDataURL(file);
  });
}
const leerUnaFoto = (file) => leerConIA(file, 'manuscrito');

/** Manda una foto (reducida) o un PDF (tal cual) a la función de lectura y
 *  espera el resultado. modo: 'manuscrito' | 'documento'. */
/** Sin saldo en la cuenta de la API no se lee nada: se avisa en claro y los
 *  bucles de varias fotos/documentos se paran en vez de fallar uno a uno. */
const MSG_SIN_SALDO = 'Se ha acabado el saldo de la cuenta de la IA (Anthropic). Hay que recargarlo en console.anthropic.com → Plans & Billing; las fotos no se han perdido, súbelas otra vez después.';
function errorDeLectura(msg) {
  const e = new Error(/credit balance|billing|purchase credits/i.test(String(msg)) ? MSG_SIN_SALDO : msg);
  if (e.message === MSG_SIN_SALDO) e.sinSaldo = true;
  return e;
}
async function leerConIA(file, modo) {
  const jobId = nuevoId();
  const pdf = esPdf(file);
  const imagenBase64 = pdf ? await base64DeFichero(file) : await reducirImagen(file);
  if (imagenBase64.length > 4 * 1024 * 1024) throw new Error('El PDF es demasiado grande (máximo unos 3 MB). Si es un escaneado, prueba a reducirlo o haz una foto de cada página.');
  // 1) Subida (función normal, admite hasta 6 MB). 2) Lectura en segundo plano,
  // que solo recibe el jobId: Netlify corta a 256 KB lo que se le manda a una
  // Background Function, y una foto o un PDF pasan de eso (error 413).
  const cab = { 'content-type': 'application/json', 'x-ocr-token': OCR_TOKEN };
  const sub = await fetch(FN + 'leer-pedido-manuscrito-subir', {
    method: 'POST', headers: cab,
    body: JSON.stringify({ jobId, imagenBase64, mediaType: pdf ? 'application/pdf' : 'image/jpeg' }),
  });
  if (!sub.ok) {
    const e = await sub.json().catch(() => ({}));
    throw new Error(e.error || 'No se ha podido subir (' + sub.status + '). ¿Estás en la web de Netlify?');
  }
  const r = await fetch(FN + 'leer-pedido-manuscrito-background', { method: 'POST', headers: cab, body: JSON.stringify({ jobId, modo }) });
  if (r.status !== 202 && !r.ok) throw new Error('El lector no responde (' + r.status + '). ¿Estás en la web de Netlify?');
  const limite = Date.now() + 5 * 60 * 1000;
  while (Date.now() < limite) {
    await espera(3000);
    const e = await fetch(FN + 'leer-pedido-manuscrito-estado?jobId=' + encodeURIComponent(jobId), { headers: { 'x-ocr-token': OCR_TOKEN } });
    if (e.status === 202) continue;
    const data = await e.json().catch(() => ({}));
    if (!e.ok) throw new Error(data.error || 'Error consultando la lectura');
    if (data.status === 'error') throw errorDeLectura(data.error);
    if (data.status === 'done') return data.resultado;
  }
  throw new Error('La lectura ha tardado más de 5 minutos');
}

/** Nº de pedido de una hoja: el que pone «añadir al pedido nº 4» en las notas
 *  manda sobre el del encabezado (es una hoja suelta que va a otro pedido). */
function numeroDeHoja(res) {
  const nota = String(res.notas || '').match(/pedido\s*n\S*\s*(\d+)/i);
  if (nota) return nota[1];
  const crudo = String(res.numeroPedido || '');
  // «1/4» es la hoja del talonario, no el pedido; y de «Pedido Nº 12» vale el
  // primer número entero (antes se pegaban todas las cifras: «1/4» → «14»).
  if (/\d\s*\/\s*\d/.test(crudo)) return '';
  const m = crudo.match(/\d+/);
  return m ? m[0] : '';
}
const claveCliente = (c) => String(c || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]/g, '');

function anadirLecturaA(p, res, nombre) {
  let descAnterior = '';
  let n = 0;
  for (const l of res.lineas || []) {
    const desc = (l.descripcion || '').trim();
    descAnterior = desc && !/^[-–"'`,.~]+$/.test(desc) ? desc : descAnterior;
    p.lineas.push({ cant: CP.parseNum(l.cantidad) || 0, exp: Boolean(l.esExpositor), ref: CP.normRef(l.referencia),
      precio: CP.parseNum(l.precio), desc: descAnterior, duda: (l.duda || '').trim(), foto: nombre });
    n++;
  }
  (p.fotos = p.fotos || []).push({ nombre, hoja: (res.hoja || '').trim(), lineas: n, fecha: new Date().toISOString() });
  if (!p.cliente && res.cliente) p.cliente = res.cliente.toUpperCase();
  if (!p.numero && numeroDeHoja(res)) p.numero = numeroDeHoja(res);
  if (!p.proveedor && res.proveedor) p.proveedor = prov(res.proveedor);
  const extra = [res.hoja && `hoja ${res.hoja}`, res.notas].filter(Boolean).join(' · ');
  if (extra) p.notas = [p.notas, `${nombre}: ${extra}`].filter(Boolean).join(' | ');
  if (numeroDeHoja(res) && numeroDeHoja(res) !== String(p.numero).replace(/\D/g, '')) {
    p.notas = [p.notas, `${nombre} dice pedido nº ${res.numeroPedido}`].filter(Boolean).join(' | ');
  }
  invalidar(p);
  return n;
}

/**
 * Lee varias fotos de pedidos del comercial.
 *  - destino: el pedido al que van TODAS (cuando se leen desde dentro de un
 *    pedido, o si en el formulario se escribió el nº).
 *  - sin destino: cada foto va al pedido con el nº que se lea en ella; las
 *    hojas 1/4…4/4 del mismo nº se juntan en uno, y lo que no trae nº va a un
 *    pedido «sin número» para revisarlo.
 * Un solo resumen al final en vez de un aviso por foto.
 */
/** Las fotos de la última subida que no se han podido leer (solo en memoria):
 *  se enseñan con su nombre y un botón para volver a intentarlas. */
let fotosFallidas = null;
function vistaFallidas() {
  const f = fotosFallidas;
  if (!f || !f.files.length) return '';
  return `<div class="aviso-caja mal no-imprimir"><b>⚠️ ${f.files.length} foto(s) de la última subida sin leer:</b>
    <div class="pequeno" style="margin:4px 0">${f.files.map((x) => h(x.name)).join(' · ')}</div>
    <div class="fila"><button class="btn primario" onclick="reintentarFallidas()">🔁 Volver a intentar esas ${f.files.length}</button>
    <button class="btn peque" onclick="fotosFallidas=null;pintar()">Olvidarlas</button></div></div>`;
}
function reintentarFallidas() {
  const f = fotosFallidas;
  if (!f) return;
  const destino = f.destinoId ? pedidoPorId(f.destinoId) : null;
  leerFotos(f.files, destino, f.base);
}
async function leerFotos(files, destino, base) {
  const lista = [...files];
  const lote = new Map(); // nº leído → pedido creado en esta tanda
  const tocados = new Set();
  const errores = [];
  let total = 0;
  let sinSaldo = 0; // fotos que quedan sin leer por falta de saldo
  const avisos = [];
  const fallidas = []; // File de las que no se han podido leer, para reintentarlas
  const progreso = (txt) => { const c = document.getElementById('progresoFotos') || document.getElementById('progresoLote'); if (c) c.textContent = txt; };
  for (let i = 0; i < lista.length; i++) {
    progreso(`Leyendo foto ${i + 1} de ${lista.length} (${lista[i].name})… puede tardar un minuto por foto.`);
    // Una foto ya leída (mismo nombre de fichero) no se vuelve a pagar ni a sumar.
    const yaEn = !destino && E.pedidos.find((x) => x.lineas.some((l) => l.foto === lista[i].name) || (x.fotos || []).some((f) => f.nombre === lista[i].name));
    if (yaEn) { errores.push(`${lista[i].name}: ya estaba leída en el pedido nº ${yaEn.numero}, no se repite`); continue; }
    try {
      const res = await leerUnaFoto(lista[i]);
      let p = destino || null;
      let clave = null;
      if (!p) {
        const num = numeroDeHoja(res);
        const cli = claveCliente(res.cliente);
        // Agrupar por nº de pedido; si la hoja no lo trae, por cliente; y si
        // tampoco, la hoja va sola a su propio pedido. NUNCA se juntan hojas
        // «sin nada» en un mismo pedido: eso mezclaba clientes distintos.
        clave = num ? 'n:' + num : cli ? 'c:' + cli : 'f:' + lista[i].name;
        const proveedorHoja = (base && base.proveedor) || prov(res.proveedor);
        const mismaCampana = (x) => !esRepo(x) && !x.validado && x.proveedor === proveedorHoja && (x.campana || '') === ((base && base.campana) || '');
        // Un pedido ya creado (p. ej. fotos hechas de una en una con la cámara)
        // con ese nº —o, sin nº, con ese cliente— recibe la hoja.
        const existente = E.pedidos.find((x) => mismaCampana(x) &&
          (num ? String(x.numero) === num : (cli && !x.numero && claveCliente(x.cliente) === cli)));
        // Desde «Subir los pedidos de una campaña» (soloNuevos) nunca se toca
        // un pedido que ya existía: se crea uno nuevo y se avisa.
        p = lote.get(clave) || (base && base.soloNuevos ? null : existente);
        if (!p && existente && base && base.soloNuevos && !lote.has(clave)) {
          avisos.push(`${lista[i].name}: ya había un pedido nº ${existente.numero || '—'} ${existente.cliente || ''} en esta campaña; se ha creado otro aparte — si es el mismo, quita la foto del nuevo y súbela dentro del existente`);
        }
        if (!p) {
          p = { id: nuevoId(), tipo: 'comercial', proveedor: (base && base.proveedor) || prov(res.proveedor), campana: (base && base.campana) || '', numero: num,
            cliente: '', fecha: (base && base.fecha) || hoy(), notas: '', lineas: [], propuesta: null, decisiones: {}, validado: false, final: null };
          E.pedidos.push(p);
        }
      }
      if (p.lineas.some((l) => l.foto === lista[i].name) || (p.fotos || []).some((f) => f.nombre === lista[i].name)) {
        errores.push(`${lista[i].name}: ya estaba leída en el pedido nº ${p.numero}, no se repite`);
        continue;
      }
      if (clave) lote.set(clave, p);
      total += anadirLecturaA(p, res, lista[i].name);
      tocados.add(p);
      guardar(); pintar();
    } catch (err) {
      if (err.sinSaldo) { sinSaldo = lista.length - i; fallidas.push(...lista.slice(i)); break; }
      errores.push(`${lista[i].name}: ${err.message}`);
      fallidas.push(lista[i]);
    }
  }
  const ps = [...tocados];
  fotosFallidas = fallidas.length ? { files: fallidas, destinoId: destino ? destino.id : null, base, fecha: new Date() } : null;
  if (!destino && ps.length === 1) abrirPedido(ps[0].id); else pintar();
  progreso(total ? `Leídas ${total} líneas. Revísalas con las fotos antes de comparar.` : '');
  let msg = ps.length ? `Leídas ${lista.length - errores.length} de ${lista.length} fotos:\n` +
    ps.map((p) => `· Pedido nº ${p.numero || '(sin número)'} ${p.cliente || ''} — ${p.lineas.length} líneas`).join('\n') : 'No se ha podido leer ninguna foto.';
  if (errores.length) msg += `\n\nNo se han podido leer ${errores.length}:\n` + errores.slice(0, 6).join('\n');
  if (avisos.length) msg += `\n\n⚠️ Revisa:\n` + avisos.slice(0, 6).join('\n');
  if (sinSaldo) msg = `⚠️ ${MSG_SIN_SALDO}\n\nQuedan ${sinSaldo} foto(s) sin leer.` + (ps.length ? '\n\n' + msg : '');
  if (lista.length > 1 || errores.length || avisos.length || sinSaldo) alert(msg);
}

// ── Propuestas (Excel) ───────────────────────────────────────────────────────
async function leerExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const hoja = wb.Sheets[wb.SheetNames[0]];
  return CP.leerPropuesta(XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '', raw: true }));
}
/** Excel → lector de columnas; PDF o foto → lectura con IA + comprobaciones. */
async function leerFicheroProveedor(file, idProgreso) {
  if (!esPdf(file) && !esImagen(file)) return leerExcel(file);
  const caja = idProgreso && document.getElementById(idProgreso);
  if (caja) caja.textContent = `Leyendo ${file.name}… puede tardar uno o dos minutos.`;
  try {
    return CP.lineasDeDocumento(await leerConIA(file, 'documento'));
  } finally {
    const c = idProgreso && document.getElementById(idProgreso);
    if (c) c.textContent = '';
  }
}

/** Resumen de las comprobaciones de un documento leído con IA. */
function avisoControl(doc) {
  if (!doc || !doc.control) return '';
  const c = doc.control;
  const dudas = (doc.lineas || []).filter((l) => l.duda).length;
  const base = c.base == null
    ? `<div class="aviso-caja aviso">No se ha encontrado la base imponible del documento: no puedo comprobar que estén todas las líneas (suma leída ${fmt(c.sumaLineas)} €). Revísalas con el PDF.</div>`
    : c.cuadra
      ? `<div class="aviso-caja ok">Las líneas leídas suman ${fmt(c.sumaLineas)} €, igual que la base del documento (${fmt(c.base)} €).</div>`
      : `<div class="aviso-caja mal"><b>No cuadra:</b> las líneas leídas suman ${fmt(c.sumaLineas)} € y la base del documento es ${fmt(c.base)} €. Falta o sobra alguna línea, o hay un importe mal leído: revísalo con el PDF antes de comparar.</div>`;
  return base + (dudas ? `<div class="aviso-caja aviso">${dudas} línea(s) con duda de lectura (en ámbar abajo).</div>` : '') +
    (doc.cabecera && doc.cabecera.observaciones ? `<div class="pequeno">Notas del documento: ${h(doc.cabecera.observaciones)}</div>` : '');
}

function guardarCatalogo(proveedor, archivo, catalogo) {
  const n = Object.keys(catalogo).length;
  // Solo cuenta como catálogo si trae bastante más que lo pedido: el
  // formulario de Finocam lleva la tarifa entera; una propuesta corta no.
  if (n < 50) return;
  E.catalogos[prov(proveedor)] = { fecha: hoy(), archivo, items: catalogo };
}
function asignarPropuesta(p, archivo, prop) {
  p.propuesta = { archivo, fecha: hoy(), cabecera: prop.cabecera, lineas: prop.lineas, control: prop.control || null };
  guardarCatalogo(p.proveedor, archivo, prop.catalogo);
  invalidar(p);
}
async function cargarPropuestaEn(id, file) {
  if (!file) return;
  const p = pedidoPorId(id);
  try {
    const prop = await leerFicheroProveedor(file, 'progresoProp');
    const n = prop.cabecera.numeroPedido;
    if (n != null && String(n) !== String(p.numero).replace(/\D/g, '') &&
        !confirm(`El Excel dice «${prop.cabecera.observaciones}» y este es el pedido nº ${p.numero}. ¿Cargarlo aquí igualmente?`)) return;
    asignarPropuesta(p, file.name, prop);
    guardar(); pintar();
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
/** Documentos del proveedor leídos pero sin pedido claro: se quedan aquí
 *  (solo en memoria) hasta que el usuario elige a qué pedido van. */
let sinAsignar = [];
let ultimaCarga = [];

/** Pedido al que va una propuesta/factura: por nº y, si no, por el cliente
 *  que aparezca en Observaciones / «su pedido». Solo si hay uno claro. */
function pedidoParaPropuesta(prop) { return pedidoParaDocumento(prop, (p) => !p.validado); }
function pedidoParaDocumento(prop, filtro) {
  const n = prop.cabecera.numeroPedido;
  const abiertos = E.pedidos.filter(filtro);
  let c = abiertos.filter((p) => n != null && String(p.numero).replace(/\D/g, '') === String(n));
  if (c.length !== 1) {
    const obs = claveCliente(prop.cabecera.observaciones);
    const porCliente = abiertos.filter((p) => claveCliente(p.cliente).length >= 4 && obs.includes(claveCliente(p.cliente)));
    if (porCliente.length === 1) c = porCliente;
  }
  return c.length === 1 ? c[0] : null;
}

/** Importe de un documento leído: suma de sus líneas (importe del proveedor
 *  o, si no lo trae, precio neto × cantidad). */
function importeDoc(prop) {
  return CP.red2((prop.lineas || []).reduce((t, l) => {
    const imp = CP.parseNum(l.importe);
    if (imp != null) return t + imp;
    const neto = CP.precioNeto(l);
    return t + (neto != null ? neto * (CP.parseNum(l.cant) || 0) : 0);
  }, 0));
}
const textoParecido = (x) => `${x.comunes} de ${x.deDoc} referencias coinciden`;

async function cargarPropuestasVarias(files) {
  // Copia antes del primer await: el onchange hace this.value='' justo después
  // de llamar, y eso vacía la FileList original (solo se procesaba el primero).
  const lista = [...files];
  ultimaCarga = [];
  const progreso = (t) => { const c = document.getElementById('progresoProps'); if (c) c.textContent = t; };
  // 1) Leer todos.
  const leidos = [];
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    progreso(`Leyendo ${i + 1} de ${lista.length}: ${f.name}${esPdf(f) || esImagen(f) ? ' (PDF/foto: hasta un minuto)' : ''}…`);
    try {
      leidos.push({ id: nuevoId(), archivo: f.name, prop: await leerFicheroProveedor(f) });
    } catch (err) {
      if (err.sinSaldo) { ultimaCarga.push({ ok: false, texto: MSG_SIN_SALDO }); break; }
      ultimaCarga.push({ ok: false, texto: `${f.name}: ${err.message}` });
    }
  }
  progreso('Emparejando cada documento con su pedido…');
  const usados = new Set();
  const asignar = (x, p, como) => {
    if (!p.numero && x.prop.cabecera.numeroPedido != null) p.numero = String(x.prop.cabecera.numeroPedido);
    asignarPropuesta(p, x.archivo, x.prop);
    usados.add(p.id);
    const aviso = x.prop.control && x.prop.control.cuadra === false ? ' — ⚠️ no cuadra con su base imponible, revísalo' : '';
    ultimaCarga.push({ ok: true, importe: importeDoc(x.prop), texto: `${x.archivo} → nº ${p.numero || '—'} ${p.cliente || ''} · ${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${como ? ` (${como})` : ''}${aviso}` });
  };
  // 2) Por nº de pedido o cliente que traiga el documento.
  const resto = [];
  for (const x of leidos) {
    const p = pedidoParaDocumento(x.prop, (q) => !q.validado && !usados.has(q.id));
    if (p) asignar(x, p, ''); else resto.push(x);
  }
  // 3) Los que no: por las referencias que coinciden con pedidos sin propuesta
  //    (también los que quedaron pendientes de otra carga).
  const pendientesAntes = sinAsignar.filter((y) => y.destino !== 'factura');
  const porContenido = resto.concat(pendientesAntes);
  if (porContenido.length) {
    const candidatos = E.pedidos.filter((q) => !q.validado && !q.propuesta && q.lineas.length && !usados.has(q.id));
    const rep = CP.repartirPorContenido(porContenido.map((x) => ({ id: x.id, lineas: x.prop.lineas })), candidatos);
    const asignadosIds = new Set();
    for (const a of rep.asignados) {
      const x = porContenido.find((y) => y.id === a.docId);
      asignar(x, pedidoPorId(a.pedidoId), 'por contenido: ' + textoParecido(a));
      asignadosIds.add(x.id);
    }
    sinAsignar = sinAsignar.filter((y) => !asignadosIds.has(y.id));
    for (const x of resto) {
      if (asignadosIds.has(x.id)) continue;
      sinAsignar.push(Object.assign(x, { sugerencia: rep.sugerencias[x.id] || null }));
    }
    for (const y of sinAsignar) if (!asignadosIds.has(y.id) && rep.sugerencias[y.id]) y.sugerencia = rep.sugerencias[y.id];
  }
  // 4) Sumatorio de la carga.
  const okk = ultimaCarga.filter((x) => x.ok);
  if (leidos.length > 1) {
    ultimaCarga.push({ ok: true, texto: `Total: ${leidos.length} documento(s) leídos · ${leidos.reduce((t, x) => t + x.prop.lineas.length, 0)} líneas · ${fmt(CP.red2(leidos.reduce((t, x) => t + importeDoc(x.prop), 0)))} € · ${okk.length} asignado(s) a su pedido${sinAsignar.length ? ` · ${sinAsignar.length} por confirmar abajo` : ''}` });
  }
  progreso('');
  guardar(); pintar();
}

function vistaSinAsignar() {
  const ok = ultimaCarga.filter((x) => x.ok), mal = ultimaCarga.filter((x) => !x.ok);
  const opcionesDe = (x) => (x.destino === 'factura'
    ? E.pedidos.filter((p) => p.validado && claveGrupo(p) === x.clave)
    : E.pedidos.filter((p) => !p.validado).sort((a, b) => Number(Boolean(a.propuesta)) - Number(Boolean(b.propuesta))))
    .map((p) => `<option value="${p.id}">${esRepo(p) ? 'Repo.' : 'Nº'} ${h(p.numero || '—')} ${h(p.cliente || p.proveedor)}${x.destino === 'factura' ? (p.factura ? ' (ya tiene factura)' : '') : p.propuesta ? ' (ya tiene propuesta)' : ''}</option>`).join('');
  return (ok.length ? `<div class="aviso-caja ok">${ok.map((x) => h(x.texto)).join('<br>')}</div>` : '') +
    (mal.length ? `<div class="aviso-caja mal">No se han podido leer:<br>${mal.map((x) => h(x.texto)).join('<br>')}</div>` : '') +
    (sinAsignar.length ? `<div class="aviso-caja aviso"><b>Confirma a qué pedido va cada uno</b> (${sinAsignar.length}). No traen un nº de pedido ni un cliente reconocible, y sus referencias no coinciden lo bastante con ningún pedido${sinAsignar.some((x) => x.sugerencia) ? '; donde hay un pedido parecido ya está elegido' : ''}. Si no hay pedido para alguno, sube antes el pedido del comercial.
      ${sinAsignar.map((x) => `<div class="fila" style="margin-top:8px;align-items:center">
        <span style="flex:1 1 200px">${x.destino === 'factura' ? '<span class="chip info">Factura final</span> ' : ''}<b>${h(x.archivo)}</b>${x.prop.cabecera.observaciones ? `<div class="pequeno">${h(x.prop.cabecera.observaciones)}</div>` : ''}<div class="pequeno">${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €${x.sugerencia ? ` · parecido a nº ${h((pedidoPorId(x.sugerencia.pedidoId) || {}).numero || '—')}: ${textoParecido(x.sugerencia)}` : ''}</div></span>
        <select id="asig-${x.id}" style="flex:1 1 160px"><option value="">— elegir pedido —</option>${opcionesDe(x).replace(x.sugerencia ? `value="${x.sugerencia.pedidoId}"` : '\u0000', `value="${x.sugerencia ? x.sugerencia.pedidoId : ''}" selected`)}</select>
        <button class="btn peque" onclick="asignarManual('${x.id}')">Asignar</button>
        <button class="btn peque peligro" onclick="descartarSinAsignar('${x.id}')">✕</button></div>`).join('')}
      <div class="fila" style="margin-top:10px"><button class="btn primario" onclick="asignarTodasElegidas()">Asignar todas las elegidas</button></div></div>` : '');
}
function asignarManual(id) {
  const x = sinAsignar.find((y) => y.id === id);
  const pid = document.getElementById('asig-' + id).value;
  if (!x || !pid) { alert('Elige el pedido.'); return; }
  const p = pedidoPorId(pid);
  if (x.destino === 'factura') {
    if (p.factura && !confirm(`El pedido nº ${p.numero} ya tiene factura (${p.factura.archivo}). ¿Sustituirla?`)) return;
    asignarFactura(p, x.archivo, x.prop);
  } else {
    if (p.propuesta && !confirm(`El pedido nº ${p.numero} ya tiene propuesta (${p.propuesta.archivo}). ¿Sustituirla?`)) return;
    asignarPropuesta(p, x.archivo, x.prop);
  }
  sinAsignar = sinAsignar.filter((y) => y.id !== id);
  ultimaCarga.push({ ok: true, texto: `${x.archivo} → nº ${p.numero} ${p.cliente || ''}` });
  guardar(); pintar();
}
function asignarTodasElegidas() {
  const elegidas = sinAsignar.filter((x) => (document.getElementById('asig-' + x.id) || {}).value);
  if (!elegidas.length) { alert('Elige el pedido de al menos uno.'); return; }
  const ids = elegidas.map((x) => document.getElementById('asig-' + x.id).value);
  if (new Set(ids).size !== ids.length && !confirm('Has elegido el mismo pedido para dos documentos: el segundo sustituirá al primero. ¿Seguir?')) return;
  for (const x of elegidas) {
    const p = pedidoPorId(document.getElementById('asig-' + x.id).value);
    if (x.destino === 'factura') asignarFactura(p, x.archivo, x.prop); else asignarPropuesta(p, x.archivo, x.prop);
    ultimaCarga.push({ ok: true, texto: `${x.archivo} → nº ${p.numero || '—'} ${p.cliente || ''} · ${x.prop.lineas.length} líneas · ${fmt(importeDoc(x.prop))} €` });
  }
  const hechos = new Set(elegidas.map((x) => x.id));
  sinAsignar = sinAsignar.filter((x) => !hechos.has(x.id));
  guardar(); pintar();
}
function descartarSinAsignar(id) { sinAsignar = sinAsignar.filter((y) => y.id !== id); pintar(); }

// ── Último control: la factura final del proveedor ───────────────────────────
// Se compara con lo VALIDADO (no con la propuesta): pasa que se confirma una
// propuesta y luego facturan otra cosa porque en ese momento algo se agotó.
function revisarFactura(p) {
  if (!p.factura || !p.final) return null;
  return CP.controlFactura(p.final.lineas, p.factura.lineas, { dtoValidado: p.final.dto, dtoFactura: (p.factura.cabecera || {}).dtoGlobal });
}
function chipFactura(p) {
  const r = revisarFactura(p);
  if (!r) return '';
  if (r.cuadra) return ' <span class="chip ok">Factura ✓</span>';
  const partes = [];
  if (r.faltan.length) partes.push(r.faltan.length + ' no vienen');
  if (r.sobran.length) partes.push(r.sobran.length + ' de más');
  if (r.precios.length) partes.push(r.precios.length + ' precio');
  return ` <span class="chip mal">Factura: ${partes.join(' · ')}</span>`;
}
function vistaFacturaFinal(p) {
  if (!p.validado || !p.final) {
    return p.propuesta ? `<div class="tarjeta"><h2>4 · Factura final del proveedor</h2><div class="vacio">Cuando valides el pedido podrás subir aquí la factura final para el último control.</div></div>` : '';
  }
  const r = revisarFactura(p);
  const lista = (xs, f) => `<ul style="margin:6px 0 0;padding-left:18px">${xs.map(f).join('')}</ul>`;
  return `
  <div class="tarjeta">
    <h2>4 · Factura final del proveedor <span class="pequeno">(último control)</span></h2>
    <p class="pequeno" style="margin:0 0 8px">Sube la factura definitiva: la comparo con lo que validaste y te digo si falta alguna referencia, si viene algo de más o si cambia algún precio.</p>
    <div class="fila no-imprimir">
      <label>Factura final (PDF, Excel o foto)<input type="file" onchange="cargarFacturaEn('${p.id}', this.files[0]); this.value=''"></label>
    </div>
    <div id="progresoFactura" class="progreso"></div>
    ${!p.factura ? '<div class="vacio">Sin factura todavía.</div>' : `
    <div class="resumen"><span class="chip info">${h(p.factura.archivo)}</span><span class="chip gris">${p.factura.lineas.length} líneas</span></div>
    ${p.factura.control ? avisoControl(p.factura) : ''}
    ${r.cuadra ? `<div class="aviso-caja ok"><b>✅ La factura cuadra con lo validado:</b> están todas las referencias, en la misma cantidad y al mismo precio.</div>` : `
    <div class="aviso-caja ${r.faltan.length ? 'mal' : 'ok'}"><b>${r.faltan.length ? `❌ No vienen en la factura ${r.faltan.length} referencia(s)` : '✅ No falta nada de lo validado'}</b>
      ${r.faltan.length ? lista(r.faltan, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — faltan ${x.cant}${x.total ? '' : ` de ${x.de}`} ud.</li>`) : ''}</div>
    ${r.sobran.length ? `<div class="aviso-caja aviso"><b>⚠️ Facturado sin estar en lo validado (${r.sobran.length})</b>${lista(r.sobran, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — +${x.cant} ud.</li>`)}</div>` : ''}
    ${r.precios.length ? `<div class="aviso-caja aviso"><b>Precio neto distinto al validado (${r.precios.length})</b>${lista(r.precios, (x) => `<li><b>${h(x.ref)}</b> ${h(x.desc)} — validado ${fmt(x.validado)} → facturado ${fmt(x.facturado)}</li>`)}</div>` : ''}
    ${r.faltan.length ? '<p class="pequeno">Lo que no viene en la factura no sale en la guía de facturación del cliente.</p>' : ''}`}`}
  </div>`;
}
function asignarFactura(p, archivo, doc) {
  p.factura = { archivo, fecha: hoy(), cabecera: doc.cabecera || {}, lineas: doc.lineas, control: doc.control || null };
}
async function cargarFacturaEn(id, file) {
  if (!file) return;
  const p = pedidoPorId(id);
  try {
    const doc = await leerFicheroProveedor(file, 'progresoFactura');
    const n = doc.cabecera.numeroPedido;
    if (n != null && String(n) !== String(p.numero).replace(/\D/g, '') &&
        !confirm(`La factura parece del pedido ${n} y este es el nº ${p.numero}. ¿Cargarla aquí igualmente?`)) return;
    if (p.factura && !confirm(`Este pedido ya tiene factura (${p.factura.archivo}). ¿Sustituirla?`)) return;
    asignarFactura(p, file.name, doc);
    guardar(); pintar();
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
/** Varias facturas finales de una campaña a la vez: cada una a su pedido
 *  validado por nº o cliente; las que no casan se preguntan. */
async function cargarFacturasVarias(files, clave) {
  const lista = [...files];
  ultimaCarga = [];
  const progreso = (t) => { const c = document.getElementById('progresoProps'); if (c) c.textContent = t; };
  for (let i = 0; i < lista.length; i++) {
    const f = lista[i];
    progreso(`Leyendo factura ${i + 1} de ${lista.length}: ${f.name}…`);
    try {
      const doc = await leerFicheroProveedor(f);
      const p = pedidoParaDocumento(doc, (x) => x.validado && claveGrupo(x) === clave);
      if (p) {
        asignarFactura(p, f.name, doc);
        const r = revisarFactura(p);
        ultimaCarga.push({ ok: true, texto: `Factura ${f.name} → nº ${p.numero} ${p.cliente || ''}${r && r.faltan.length ? ` — ❌ no vienen ${r.faltan.length} referencia(s)` : r && !r.cuadra ? ' — ⚠️ revisar diferencias' : ' — ✅ cuadra'}` });
      } else {
        sinAsignar.push({ id: nuevoId(), archivo: f.name, prop: doc, destino: 'factura', clave });
      }
    } catch (err) {
      if (err.sinSaldo) { ultimaCarga.push({ ok: false, texto: MSG_SIN_SALDO }); break; }
      ultimaCarga.push({ ok: false, texto: `${f.name}: ${err.message}` });
    }
    guardar(); pintar();
  }
  progreso('');
  pintar();
  window.scrollTo(0, 0);
}

// ── Validar: restos y notas ──────────────────────────────────────────────────
function validarPedido() {
  const p = pedidoActual();
  let r;
  try { r = CP.aplicarDecisiones(comparar(p), p.decisiones, { comercial: !esRepo(p) }); }
  catch (err) { alert(err.message); return; }

  // Los restos de este pedido que ya tienen llegadas registradas no se tocan;
  // el resto se regenera desde las decisiones actuales. (Una reposición no
  // genera restos: su lista llega siempre vacía.)
  const conLlegadas = E.restos.filter((x) => x.pedidoId === p.id && x.asignaciones.length);
  E.restos = E.restos.filter((x) => x.pedidoId !== p.id || x.asignaciones.length);
  for (const x of r.restos) {
    if (conLlegadas.some((c) => c.ref === x.ref)) continue;
    E.restos.push({ id: nuevoId(), pedidoId: p.id, proveedor: p.proveedor, cliente: p.cliente, numero: p.numero, ref: x.ref, desc: x.desc, ean: x.ean,
      precio: x.precio, cant: x.cant, pendiente: x.cant, fecha: p.fecha, asignaciones: [], anulado: false });
  }
  E.notas = E.notas.filter((n) => n.pedidoId !== p.id || n.resuelta);
  for (const n of r.notas) {
    E.notas.push({ id: nuevoId(), pedidoId: p.id, cliente: p.cliente, numero: p.numero, proveedor: p.proveedor, ref: n.ref, desc: n.desc, texto: n.texto, fecha: hoy(), resuelta: false });
  }
  p.final = { fecha: hoy(), lineas: r.lineas, dto: (p.propuesta.cabecera || {}).dtoGlobal };
  p.validado = true;
  if (esRepo(p)) {
    // Precio neto aceptado → historial del proveedor, para comparar los próximos.
    const hist = E.historial[p.proveedor] = E.historial[p.proveedor] || {};
    const global = (p.final.dto || 0) / 100;
    for (const l of r.lineas) {
      const neto = CP.precioNeto(l);
      if (neto != null) hist[CP.normRef(l.ref)] = { neto: CP.red2(neto * (1 - global)), fecha: p.fecha };
    }
  }
  guardar(); pintar();
  alert(esRepo(p)
    ? `Reposición validada: ${r.lineas.length} líneas, ${r.notas.length} notas. Precios netos guardados para la próxima comparación.`
    : `Pedido validado: ${r.lineas.length} líneas, ${r.restos.length} a restos, ${r.notas.length} notas de facturación.`);
}

// ── Vista: restos ────────────────────────────────────────────────────────────
let filtroRestos = { proveedor: '', cliente: '', estado: 'abiertos' };
let llegada = null; // {proveedor, origen, lineas, propuesta:{asignaciones,sobrante}}

function vistaRestos() {
  const f = filtroRestos;
  const lista = E.restos.filter((r) =>
    (!f.proveedor || r.proveedor === f.proveedor) &&
    (!f.cliente || r.cliente === f.cliente) &&
    (f.estado === 'todos' || (f.estado === 'abiertos' ? r.pendiente > 0 && !r.anulado : (r.pendiente <= 0 || r.anulado))))
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)) || a.proveedor.localeCompare(b.proveedor) || a.cliente.localeCompare(b.cliente));
  const provs = [...new Set(E.restos.map((r) => r.proveedor))].sort();
  const clis = [...new Set(E.restos.map((r) => r.cliente))].sort();
  const opc = (vals, sel) => vals.map((v) => `<option ${v === sel ? 'selected' : ''}>${h(v)}</option>`).join('');
  return `
  <div class="tarjeta">
    <h2>Restos de pedidos del comercial</h2>

    <div class="fila no-imprimir">
      <label>Proveedor<select onchange="filtroRestos.proveedor=this.value;pintar()"><option value="">Todos</option>${opc(provs, f.proveedor)}</select></label>
      <label>Cliente<select onchange="filtroRestos.cliente=this.value;pintar()"><option value="">Todos</option>${opc(clis, f.cliente)}</select></label>
      <label>Estado<select onchange="filtroRestos.estado=this.value;pintar()">
        <option value="abiertos" ${f.estado === 'abiertos' ? 'selected' : ''}>Pendientes</option>
        <option value="cerrados" ${f.estado === 'cerrados' ? 'selected' : ''}>Servidos / anulados</option>
        <option value="todos" ${f.estado === 'todos' ? 'selected' : ''}>Todos</option></select></label>
      <button class="btn peque" onclick="window.print()">Imprimir</button>
    </div>
    ${lista.length ? `<div class="tabla-scroll"><table style="margin-top:10px">
      <tr><th>Fecha</th><th>Proveedor</th><th>Cliente</th><th>Pedido</th><th>Referencia</th><th>Descripción</th><th class="num">Pedidas</th><th class="num">Pendientes</th><th>Llegadas</th><th class="no-imprimir"></th></tr>
      ${lista.map((r) => `<tr>
        <td>${h(fmtFecha(r.fecha))}</td><td>${h(r.proveedor)}</td><td><b>${h(r.cliente)}</b></td><td>${h(r.numero)}</td>
        <td>${h(r.ref)}</td><td>${h(r.desc)}</td><td class="num">${r.cant}</td>
        <td class="num">${r.anulado ? '<span class="chip gris">Anulado</span>' : r.pendiente > 0 ? `<span class="chip aviso">${r.pendiente}</span>` : '<span class="chip ok">Servido</span>'}</td>
        <td class="pequeno">${r.asignaciones.map((a) => `${h(fmtFecha(a.fecha))}: ${a.cant} (${h(a.origen)})`).join('<br>') || '—'}</td>
        <td class="no-imprimir">${r.pendiente > 0 && !r.anulado ? `<button class="btn peque peligro" onclick="anularResto('${r.id}')">Anular</button>` : ''}</td>
      </tr>`).join('')}
    </table></div>` : `<div class="vacio">No hay restos con este filtro.</div>`}
  </div>

  <div class="tarjeta no-imprimir">
    <h2>Registrar llegada</h2>
    <p class="pequeno">Mercancía que llega en un pedido o albarán posterior. Sube el Excel o pega «referencia cantidad» por línea.</p>
    <div class="fila">
      <label>Proveedor<select id="llProv">${opc([...new Set(E.restos.filter((r) => r.pendiente > 0 && !r.anulado).map((r) => r.proveedor))].sort(), llegada && llegada.proveedor)}</select></label>
      <label>Origen<input id="llOrigen" placeholder="Albarán 1234 / Pedido 5" value="${h(llegada ? llegada.origen : '')}"></label>
      <label>Albarán (PDF, Excel o foto)<input type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv,image/*" onchange="llegadaDesdeExcel(this.files[0]); this.value=''"></label>
    </div>
    <div id="progresoLlegada" class="progreso"></div>
    <textarea id="llTexto" style="margin-top:8px" placeholder="785100027 2&#10;742776027 1"></textarea>
    <button class="btn peque" onclick="llegadaDesdeTexto()">Buscar en restos</button>

function prepararLlegada(lineas) {
  const proveedor = document.getElementById('llProv').value;
  if (!proveedor) { alert('No hay restos pendientes de ningún proveedor.'); return; }
  const origen = document.getElementById('llOrigen').value.trim() || 'Llegada ' + fmtFecha(hoy());
  const abiertos = E.restos.filter((r) => !r.anulado);
  llegada = { proveedor, origen, lineas, propuesta: CP.sugerirAsignacion(abiertos, lineas, proveedor) };
  pintar();
}
async function llegadaDesdeExcel(file) {
  if (!file) return;
  try {
    const p = await leerFicheroProveedor(file, 'progresoLlegada');
    if (p.control && p.control.cuadra === false) alert(`Ojo: las líneas leídas de ${file.name} no cuadran con su base imponible. Revisa el reparto antes de confirmarlo.`);
    prepararLlegada(p.lineas.map((l) => ({ ref: l.ref, cant: l.cant })));
  } catch (err) { alert('No he podido leer ' + file.name + ': ' + err.message); }
}
function llegadaDesdeTexto() {
  const lineas = [];
  for (const t of document.getElementById('llTexto').value.split(/\r?\n/)) {
    const m = t.trim().match(/^(\S+)\s+(\d+(?:[.,]\d+)?)/);
    if (m) lineas.push({ ref: m[1], cant: CP.parseNum(m[2]) });
  }
  if (!lineas.length) { alert('Escribe «referencia cantidad» en cada línea.'); return; }
  prepararLlegada(lineas);
}
function vistaPropuestaLlegada() {
  const { asignaciones, sobrante } = llegada.propuesta;
  const resto = (id) => E.restos.find((r) => r.id === id);
  return `
    <h3>Reparto propuesto (${h(llegada.origen)})</h3>
    ${asignaciones.length ? `<table>
      <tr><th>Cliente</th><th>Pedido</th><th>Fecha resto</th><th>Referencia</th><th>Descripción</th><th class="num">Pendiente</th><th class="num">Se le asigna</th></tr>
      ${asignaciones.map((a, i) => { const r = resto(a.restoId); return `<tr>
        <td><b>${h(r.cliente)}</b></td><td>${h(r.numero)}</td><td>${h(fmtFecha(r.fecha))}</td><td>${h(r.ref)}</td><td>${h(r.desc)}</td>
        <td class="num">${r.pendiente}</td>
        <td class="num"><input class="cant" value="${a.cant}" onchange="llegada.propuesta.asignaciones[${i}].cant=CP.parseNum(this.value)||0"></td></tr>`; }).join('')}
    </table>` : `<div class="aviso-caja aviso">Nada de lo que llega está en restos de ${h(llegada.proveedor)}.</div>`}
    ${sobrante.length ? `<div class="aviso-caja info">Sin cliente esperándolo (va a stock): ${sobrante.map((s) => `${h(s.ref)} × ${s.cant}`).join(', ')}</div>` : ''}
    <div class="fila" style="margin-top:10px">
      ${asignaciones.length ? `<button class="btn primario" onclick="confirmarLlegada()">Confirmar reparto</button>` : ''}
      <button class="btn" onclick="llegada=null;pintar()">Cancelar</button>
    </div>`;
}
function confirmarLlegada() {
  for (const a of llegada.propuesta.asignaciones) {
    const r = E.restos.find((x) => x.id === a.restoId);
    const cant = Math.min(a.cant || 0, r.pendiente);
    if (cant <= 0) continue;
    r.asignaciones.push({ fecha: hoy(), cant, origen: llegada.origen });
    r.pendiente -= cant;
  }
  const resumen = llegada.propuesta.asignaciones.filter((a) => a.cant > 0).map((a) => `${a.cliente}: ${a.ref} × ${a.cant}`).join('\n');
  llegada = null; guardar(); pintar();
  alert('Reparto guardado. Entregar a:\n' + resumen);
}
function anularResto(id) {
  const r = E.restos.find((x) => x.id === id);
  if (!confirm(`¿Anular el resto de ${r.cliente}: ${r.ref} × ${r.pendiente}? (el cliente ya no lo espera)`)) return;
  r.anulado = true; guardar(); pintar();
}

  </div>`;
}
function marcarNota(id, v) { E.notas.find((n) => n.id === id).resuelta = v; guardar(); pintar(); }

// ── Vista: datos ─────────────────────────────────────────────────────────────
function vistaDatos() {
  const cats = Object.entries(E.catalogos);
  return `<div class="tarjeta">
    <h2>Copia de seguridad</h2>
    <p class="pequeno">Todo se guarda solo en este navegador. Descarga una copia de vez en cuando: si se borran los datos del navegador, es la única forma de recuperarlo.</p>
    <div class="fila">
      <button class="btn primario" onclick="descargarCopia()">Descargar copia</button>
      <label>Restaurar una copia<input type="file" accept=".json" onchange="restaurarCopia(this.files[0]); this.value=''"></label>
    </div>
  </div>
  <div class="tarjeta">
    <h2>Catálogos de proveedor</h2>
    <p class="pequeno">Se guardan solos al cargar una propuesta que trae la tarifa completa (como el formulario de Finocam). Sirven para detectar referencias mal leídas.</p>
    ${cats.length ? `<table><tr><th>Proveedor</th><th class="num">Referencias</th><th>Archivo</th><th>Fecha</th></tr>
      ${cats.map(([k, c]) => `<tr><td>${h(k)}</td><td class="num">${Object.keys(c.items).length}</td><td>${h(c.archivo)}</td><td>${h(fmtFecha(c.fecha))}</td></tr>`).join('')}</table>`
      : `<div class="vacio">Ninguno todavía.</div>`}
  </div>
  <div class="tarjeta">
    <h2>Excel para Géminis</h2>
    <p class="pequeno">Géminis solo admite un descuento por línea: los encadenados se convierten en uno equivalente sin tocar el precio base, cuadrando con el importe del proveedor. Con 2 decimales a veces no cuadra al céntimo (la app avisa); cuántos admite Géminis está <b>pendiente de comprobar</b>.</p>
    <p class="pequeno">Formato Excel 5.0/95 (.xls), artículos desde la fila 11, columnas A–N de la plantilla «Propuesta de pedido». Las tildes y la Ñ se quitan porque ese formato no las admite (igual que en la herramienta de PDF). <b>Pendiente:</b> comprobar la cabecera (filas 1–10) con un fichero que Géminis haya aceptado.</p>
    <div class="fila">
      <label>Almacén<input id="cfgAlmacen" value="${h(localStorage.getItem('cp.almacen') || '')}" onchange="localStorage.setItem('cp.almacen', this.value)"></label>
      <label>IGIC %<input id="cfgIgic" type="number" step="0.5" value="${h(localStorage.getItem('cp.igic') || '7')}" onchange="localStorage.setItem('cp.igic', this.value)"></label>
      <label>Decimales del descuento<select onchange="localStorage.setItem('cp.decimales', this.value)">
        ${[2, 3, 4, 6].map((n) => `<option ${String(n) === (localStorage.getItem('cp.decimales') || '2') ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
  </div>`;
}
function descargarCopia() {
  const blob = new Blob([JSON.stringify(E, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `control-pedidos-copia-${hoy()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function restaurarCopia(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.pedidos) || !Array.isArray(d.restos)) throw new Error('no parece una copia de esta app');
    if (!confirm(`La copia tiene ${d.pedidos.length} pedidos y ${d.restos.length} restos. Sustituye TODO lo que hay ahora. ¿Seguir?`)) return;
    E = Object.assign({ pedidos: [], restos: [], notas: [], catalogos: {} }, d);
    guardar(); pintar();
  } catch (err) { alert('No he podido restaurar: ' + err.message); }
}

// ── Salidas: listado imprimible y Excel ──────────────────────────────────────
function imprimirListado(id) {
  const p = pedidoPorId(id);
  const lineas = p.final.lineas;
  // El cliente paga lo que apuntó el comercial, tal cual: sin el descuento
  // global de la propuesta (ese es entre el proveedor y nosotros).
  const dto = esRepo(p) ? (p.final.dto || 0) : 0;
  const restos = E.restos.filter((r) => r.pedidoId === p.id && r.pendiente > 0 && !r.anulado);
  const pc = (l) => (l.precioCliente != null ? l.precioCliente : l.precio) || 0; // precio al cliente, no el coste
  const bruto = lineas.reduce((s, l) => s + pc(l) * l.cant, 0);
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Pedido ${h(p.numero)} ${h(p.cliente)}</title>
  <style>body{font-family:system-ui,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid #ccc;padding:5px;text-align:left}td.n,th.n{text-align:right}h1{font-size:20px;margin:0}h2{font-size:15px;margin-top:24px}</style></head><body>
  <h1>${h(p.cliente)}</h1><p>${h(p.proveedor)} · pedido nº ${h(p.numero)} · ${h(fmtFecha(p.fecha))}${p.campana ? ' · campaña ' + h(p.campana) : ''}</p>
  <table><tr><th>Cant.</th><th>Referencia</th><th>Descripción</th><th class="n">Precio</th><th class="n">Importe</th></tr>
  ${lineas.map((l) => `<tr><td>${l.cant}</td><td>${h(l.ref)}</td><td>${h(l.desc)}</td><td class="n">${fmt(pc(l))}</td><td class="n">${fmt(CP.red2(pc(l) * l.cant))}</td></tr>`).join('')}
  <tr><td colspan="4" class="n"><b>Total bruto</b></td><td class="n"><b>${fmt(CP.red2(bruto))}</b></td></tr>
  ${dto ? `<tr><td colspan="4" class="n">Dto. ${h(dto)} %</td><td class="n">${fmt(CP.red2(bruto * (1 - dto / 100)))}</td></tr>` : ''}</table>
  ${restos.length ? `<h2>Pendiente de recibir</h2><table><tr><th>Cant.</th><th>Referencia</th><th>Descripción</th></tr>
  ${restos.map((r) => `<tr><td>${r.pendiente}</td><td>${h(r.ref)}</td><td>${h(r.desc)}</td></tr>`).join('')}</table>` : ''}
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

function exportarSeleccionados(raiz) {
  const ids = [...(raiz || document).querySelectorAll('.selPed:checked')].map((c) => c.value);
  if (!ids.length) { alert('Marca los pedidos que quieres exportar.'); return; }
  exportarPedidos(ids);
}
function exportarPedidos(ids) {
  const ps = ids.map(pedidoPorId).filter(Boolean);
  const sinValidar = ps.filter((p) => !p.validado);
  if (sinValidar.length) { alert('No se puede exportar con discordancias sin resolver. Sin validar: ' + sinValidar.map((p) => 'nº ' + p.numero).join(', ')); return; }
  const provs = [...new Set(ps.map((p) => p.proveedor))];
  if (provs.length > 1) { alert('Exporta los pedidos de un proveedor cada vez.'); return; }
  // Cada línea con un único descuento equivalente (encadenados + global del
  // pedido) sin tocar el precio base. Varias selecciones se suman por
  // referencia, precio y descuento.
  const decimales = CP.parseNum(localStorage.getItem('cp.decimales') || '2');
  const suma = new Map();
  for (const p of ps) {
    for (const l of CP.lineasParaGeminis(p.final.lineas, { dtoGlobal: p.final.dto, decimales })) {
      const k = [l.ref, l.precio, l.dto].join('|');
      if (!suma.has(k)) { suma.set(k, Object.assign({}, l)); continue; }
      const g = suma.get(k);
      g.cant += l.cant; g.total = CP.red2(g.total + l.total); g.residuo = CP.red2(g.residuo + l.residuo);
    }
  }
  const descuadres = [...suma.values()].filter((l) => l.residuo);
  if (descuadres.length && !confirm(`Con ${decimales} decimales en el descuento, ${descuadres.length} línea(s) no cuadran al céntimo con el importe del proveedor:\n` +
    descuadres.slice(0, 8).map((l) => `${l.ref}: ${l.residuo > 0 ? '+' : ''}${fmt(l.residuo)} €`).join('\n') +
    '\n\nPuedes subir los decimales en «Datos». ¿Exportar igualmente?')) return;
  const quitar = (v) => typeof v === 'string' ? v.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[Ññ]/g, (m) => (m === 'Ñ' ? 'N' : 'n')) : v;
  const numero = ps.length === 1 ? ps[0].numero : ps.map((p) => p.numero).join('+');
  const aoa = CP.filasGeminis([...suma.values()], {
    proveedor: provs[0], fecha: fmtFecha(hoy()), numero, almacen: localStorage.getItem('cp.almacen') || '',
    observaciones: ps.map((p) => `${p.numero} ${p.cliente || ''}`.trim()).join(', '),
  }, { igic: CP.parseNum(localStorage.getItem('cp.igic') || '7') }).map((f) => f.map(quitar));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 15 }, { wch: 38 }, { wch: 14 }, { wch: 6 }, { wch: 8 }, { wch: 8 }, { wch: 9 }, { wch: 7 }, { wch: 6 }, { wch: 10 }, { wch: 9 }, { wch: 9 }, { wch: 12 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'fichero');
  XLSX.writeFile(wb, `PEDIDO_${quitar(provs[0]).replace(/\W+/g, '_')}_${String(numero).replace(/\W+/g, '_')}.xls`, { bookType: 'biff5' });
}

pintar();

// El mismo service worker del resto del ecosistema: sirve el HTML siempre
// fresco desde la red (no deja la app atascada en una versión vieja) y basta
// para que Android ofrezca instalarla como app.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
