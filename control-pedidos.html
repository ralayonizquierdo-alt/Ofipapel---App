<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Pedidos · Ofipapel</title>
<meta name="theme-color" content="#1e7d32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-pedidos.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="icon-compras-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-compras-192.png">
<link rel="apple-touch-icon" href="icon-compras-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- La versión en la URL obliga a bajar la lógica nueva junto con el HTML (que
     nunca se cachea). Sin ella, un móvil cargó el HTML nuevo con la lógica
     vieja y la app se quedó trabada (2026-10-07). Cámbiala al tocar la lógica. -->
<script src="control-pedidos-logica.js?v=2026-10-29-1"></script>
<!--
  Control de pedidos del comercial: compara lo que el comercial apuntó a mano
  con la propuesta que manda el proveedor, obliga a decidir cada discordancia,
  deja en RESTOS lo que el cliente pidió y no llega, y reconoce esos restos
  cuando aparecen en un pedido posterior. Exporta el Excel 5.0/95 para Géminis.

  Las reglas viven en control-pedidos-logica.js (con pruebas en
  scripts/probar-control-pedidos.js); aquí solo hay interfaz.

  Los datos se guardan en este navegador (localStorage). Es una app de un solo
  usuario por ahora: si se borra el navegador se pierde todo, así que la
  pestaña «Datos» descarga una copia de seguridad. Pasar a una base de datos
  compartida es el siguiente paso cuando haga falta usarla desde dos equipos.
-->
<style>
:root{
  --verde-oscuro:#145c26; --verde:#1e7d32; --verde-claro:#eaf7ec; --acento:#8bc34a;
  --texto:#1c2b1f; --texto2:#5d6b5f; --borde:#dfe8e1; --fondo:#f6f9f7; --tarjeta:#fff;
  --rojo:#b3261e; --rojo-claro:#fdecea; --ambar:#8a5a00; --ambar-claro:#fff4dc; --azul-claro:#e8f0fe; --azul:#1a56b0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:var(--texto);background:var(--fondo);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));color:#fff;padding:18px 16px 0}
header h1{margin:0 0 10px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Estado de la nube, junto al título. */
.nube{font-size:12px;font-weight:500;background:#fff2;border-radius:12px;padding:3px 9px;white-space:nowrap;cursor:pointer;border:0;color:#fff}
.nube.mal{background:#b3261e}
#avisoNube{max-width:1180px;margin:0 auto;padding:10px 16px 0}
#avisoNube:empty,#avisoFallo:empty,#avisoWeb:empty{display:none}
#avisoWeb{max-width:1180px;margin:0 auto;padding:10px 16px 0}
#avisoFallo{max-width:1180px;margin:0 auto;padding:10px 16px 0}
/* Entrada con usuario: tapa toda la app hasta que hay sesión. */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));display:flex;align-items:center;justify-content:center;padding:16px}
#login form{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px #0004}
#login h2{margin:0;color:var(--verde-oscuro);font-size:20px}
#login input{font-size:16px}
#login .error{color:var(--rojo);font-size:14px;min-height:1em}
/* Las pestañas, siempre en una sola línea: si no caben, se desliza la barra (nunca la página). */
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;white-space:nowrap;background:transparent;border:0;color:#fff;opacity:.75;padding:10px 12px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0}
nav button.activa{background:var(--fondo);color:var(--verde-oscuro);opacity:1;font-weight:600}
nav .cuenta{background:#fff3;border-radius:10px;padding:1px 7px;margin-left:4px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:14px}
.tarjeta h2{margin:0 0 12px;font-size:17px;color:var(--verde-oscuro)}
.tarjeta h3{margin:14px 0 8px;font-size:15px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--texto2);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c8d4cb;border-radius:8px;background:#fff;color:var(--texto)}
input[type=number]{width:80px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.btn{font:inherit;border:1px solid var(--verde);background:#fff;color:var(--verde-oscuro);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--verde-claro)}
.btn.primario{background:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-oscuro)}
.btn.peligro{border-color:var(--rojo);color:var(--rojo)}
.btn.peque{padding:4px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok,.btn.ok:disabled{opacity:1;background:var(--verde-claro);border-color:var(--verde);color:var(--verde-oscuro);cursor:default}
details.decididas{margin-top:8px}
details.decididas>summary{cursor:pointer;color:var(--texto2);font-size:13px}
.tabla-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--texto2);font-weight:600;border-bottom:2px solid var(--borde);padding:6px}
td{border-bottom:1px solid var(--borde);padding:5px 6px;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clic{cursor:pointer} tr.clic:hover{background:var(--verde-claro)}
td input{padding:4px 6px;width:100%} td input.cant{width:64px} td input.precio{width:82px}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
/* Un nombre de fichero o una referencia muy larga sin espacios no puede
   ensanchar la página: en Android eso hace que Chrome la aleje entera. */
main{overflow-wrap:anywhere}
.chip.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.chip.mal{background:var(--rojo-claro);color:var(--rojo)}
.chip.aviso{background:var(--ambar-claro);color:var(--ambar)}
.chip.info{background:var(--azul-claro);color:var(--azul)}
.chip.gris{background:#eef0ef;color:var(--texto2)}
.motivo{font-size:12px;color:var(--texto2)}
.motivo.revisar{color:var(--rojo)}
.duda{background:var(--ambar-claro)}
.fuera-catalogo input.ref{border-color:var(--rojo);background:var(--rojo-claro)}
.sugerencia{font-size:12px;margin-top:3px}
.sugerencia button{font-size:12px;border:1px dashed var(--azul);background:var(--azul-claro);color:var(--azul);border-radius:6px;padding:1px 6px;cursor:pointer;margin:2px 3px 0 0}
.aviso-caja{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.aviso-caja.mal{background:var(--rojo-claro);color:var(--rojo)}
.aviso-caja.aviso{background:var(--ambar-claro);color:var(--ambar)}
.aviso-caja.ok{background:var(--verde-claro);color:var(--verde-oscuro)}
.aviso-caja.info{background:var(--azul-claro);color:var(--azul)}
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.vacio{color:var(--texto2);font-style:italic;padding:8px 0}
#vistaImportar{padding:0 12px 12px}
#vistaImportar iframe{display:block;width:100%;height:calc(100vh - 150px);min-height:600px;border:1px solid var(--borde);border-radius:12px;background:#fff}
.importar-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
li.descartada{text-decoration:line-through;opacity:.65}
.dlg{border:0;border-radius:14px;padding:18px;width:min(560px,94vw);box-shadow:0 10px 40px #0005}
.hub{font-size:14px;font-weight:600;color:var(--verde-oscuro);background:#fff;text-decoration:none;border-radius:999px;padding:6px 12px;box-shadow:0 2px 6px #0003;white-space:nowrap}.hub:hover{background:#eef6ef}
.campana{position:relative;font-size:22px;line-height:1;background:#fff;border:0;border-radius:50%;width:42px;height:42px;cursor:pointer;box-shadow:0 2px 6px #0003;margin-left:auto}
.campana .globo{position:absolute;top:-6px;right:-6px;background:var(--rojo);color:#fff;font-size:12px;font-weight:700;border-radius:11px;min-width:22px;height:22px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.campana.hay{animation:sonar 1.6s ease-in-out infinite}
@keyframes sonar{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.aviso-nuevo{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--borde,#ddd)}
.dlg::backdrop{background:#0006}
.dlg h2{margin:0 0 10px;color:var(--verde-oscuro);font-size:18px}
.dlg label{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.dlg textarea{min-height:110px}
.libreta{margin:10px 0}
.libreta-cab{margin-bottom:6px}
/* Hoja de libreta: renglones azules de 36px, margen rojo y columnas como el talonario. */
.hoja{--r:36px;--f:20px;--m:44px;position:relative;background-color:#fffef4;border:1px solid #e6dfbf;border-radius:6px;box-shadow:0 2px 6px #0001;
  background-image:linear-gradient(to right,transparent calc(var(--m) - 2px),#e79a9a calc(var(--m) - 2px),#e79a9a var(--m),transparent var(--m)),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--r) - 1px),#bcd4ec calc(var(--r) - 1px),#bcd4ec var(--r));
  max-height:60vh;overflow:auto;font-family:'Kalam','Segoe Print','Comic Sans MS',cursive}
.renglon{display:grid;grid-template-columns:var(--m,44px) 104px 150px 1fr 96px;height:var(--r,36px);align-items:end;margin:0}
.renglon > span{padding:0 8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #f0c9c9;height:100%;display:flex;align-items:flex-end}
.renglon > .l-num{border-left:0;justify-content:center;color:#c98a8a;font-size:14px}
.renglon.titulos{position:sticky;top:0;z-index:1;background:#fffef4}
.renglon.titulos .t-corto{display:none}
.renglon.titulos .exp-toggle{margin-left:6px;letter-spacing:0;text-transform:none}
.renglon.titulos > span{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a55;align-items:center}
.renglon.escrito{color:#1c3f94;font-size:var(--f,20px);line-height:1}
.renglon .l-precio{justify-content:flex-end}
.renglon .l-todo{grid-column:2 / -1}
.renglon.tachado > span:not(.l-num){text-decoration:line-through;text-decoration-color:#c33;color:#7c8aa8}
.renglon.nuevo input{all:unset;box-sizing:border-box;width:100%;height:calc(var(--r,36px) - 2px);padding-top:calc(var(--r,36px) - 24px);line-height:var(--f,20px);font:inherit;font-size:var(--f,20px);color:#1c3f94;caret-color:#c33}
.renglon.nuevo input:focus{background:#fff3b0aa}
.renglon.nuevo input::placeholder{color:#9fb3d6}
.renglon.nuevo .l-precio input{text-align:right}
.renglon.nuevo .l-cant{gap:4px;align-items:center;padding-bottom:0}
.renglon.nuevo .l-cant input{min-width:0;flex:1 1 auto}
.exp-toggle{flex:0 0 auto;font:600 11px/1 system-ui,sans-serif;padding:5px 6px;border:1px solid #9fb3d6;border-radius:999px;background:#fff;color:#1c3f94;cursor:pointer;min-height:0}
.exp-toggle[aria-pressed=true]{background:#c33;border-color:#c33;color:#fff}
#qaRefModo[aria-pressed=true]{background:#1c3f94;border-color:#1c3f94}
.renglon .l-cant small{margin-left:4px;color:#c33;font-size:12px}
/* El comercial (Miguel) trabaja en una tableta: todo más grande, a lo ancho, y
   el bloc con renglones y letra grandes ocupando la pantalla. */
@media (min-width:701px){
  body.comercial{zoom:1.22}
  body.comercial main,body.comercial #avisoNube,body.comercial #avisoWeb,body.comercial #avisoFallo{max-width:none}
  body.comercial .hoja{--r:54px;--f:28px;--m:58px;max-height:none}
  body.comercial .renglon{grid-template-columns:var(--m) 150px 230px 1fr 140px}
  body.comercial .renglon.titulos > span{font-size:13px}
  body.comercial .exp-toggle{font-size:14px;padding:8px 10px}
  body.comercial .renglon > .l-num{font-size:17px}
}
.casilla{flex-direction:row!important;align-items:center;gap:6px;align-self:flex-end;padding-bottom:8px}
details.grupo{border:1px solid var(--borde,#ddd);border-radius:10px;padding:10px 12px;margin-top:12px}
details.grupo>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px}
details.grupo>summary .resumen{margin:0}
details.grupo>summary::before{content:"▸";color:var(--texto2)}
details.grupo[open]>summary::before{content:"▾"}
.pequeno{font-size:12px;color:var(--texto2)}
.oculto{display:none!important}
details.archivados{margin-top:14px;font-size:13px;color:var(--texto2)}
details.archivados>summary{cursor:pointer}
.fila-archivo{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:4px 0;border-bottom:1px solid var(--borde)}
.fila-archivo .btn.peque{min-height:0;padding:2px 8px;font-size:12px;margin-left:auto}
table.lista-pedidos .c-movil{display:none}
.progreso{font-size:13px;color:var(--texto2);margin-top:6px}
/* ── Móvil (Android) ──────────────────────────────────────────────────────
   Por debajo de 700px las tablas se convierten en tarjetas: cada fila es una
   tarjeta y cada celda lleva delante el nombre de su columna (data-th, que
   pone ponerEtiquetas() al pintar). Controles de al menos 44px para el dedo y
   letra de 16px en los campos para que el navegador no haga zoom al tocarlos. */
@media (max-width:700px){
  html,body{font-size:15px}
  header{padding:12px 12px 0}
  header h1{font-size:19px;margin-bottom:8px}
  nav button{padding:10px 10px}
  main{padding:10px}
  .tarjeta{padding:12px;border-radius:10px}
  .fila{gap:8px}
  .fila > label{flex:1 1 140px}
  .fila > .btn{flex:1 1 auto}
  input,select,textarea{font-size:16px;min-height:44px}
  input[type=checkbox]{min-height:0;width:22px;height:22px}
  input[type=file]{min-height:0;font-size:14px;max-width:100%}
  .btn{min-height:44px;padding:10px 14px}
  .btn.peque{min-height:40px;font-size:14px}
  .tabla-scroll{overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  tr:has(> th){display:none}
  tr{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
  tr.duda{background:var(--ambar-claro)}
  td{border:0;padding:4px 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;text-align:right}
  td::before{content:attr(data-th);font-size:12px;color:var(--texto2);text-align:left;flex:0 0 34%}
  td[data-th=""]::before{display:none}
  td[data-th=""]{justify-content:flex-end}
  td input,td select{flex:1 1 55%;width:auto;min-width:0}
  td input.cant,td input.precio{flex:0 1 120px}
  td > div,td .fila{flex:1 1 100%;text-align:left}
  td.num{text-align:right}
  .resumen{gap:6px}
  .chip{font-size:12px}
  .sugerencia button{padding:6px 8px;margin:4px 4px 0 0}
  /* Pedidos de una campaña: lista compacta de dos líneas por pedido. */
  table.lista-pedidos tr{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:0 8px;padding:8px 8px;margin-bottom:6px}
  table.lista-pedidos tr:has(> th){display:none}
  table.lista-pedidos td.c-d{display:none}
  table.lista-pedidos td.c-movil{display:block;text-align:left;padding:0;min-width:0}
  table.lista-pedidos td::before{display:none}
  table.lista-pedidos td.c-sel,table.lista-pedidos td.c-borrar{display:block;padding:0;width:auto}
  table.lista-pedidos td.c-borrar .btn{min-height:38px;padding:4px 10px}
  table.lista-pedidos .m-tit{font-weight:600;font-size:15px;overflow-wrap:anywhere}
  table.lista-pedidos .m-dat{font-size:12px;color:var(--texto2);margin-top:2px}
  table.lista-pedidos .m-est{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  table.lista-pedidos .m-est .chip{font-size:11px;padding:1px 7px}
  .renglon{grid-template-columns:28px 82px 92px 1fr 64px}
  .renglon.titulos .t-largo{display:none}
  .renglon.titulos .t-corto{display:inline}
  /* Líneas de artículos: tarjetas compactas (cantidad, exp., referencia y
     precio en una fila; descripción debajo; la duda solo si la hay). */
  table.t-lineas tr,table.t-repo tr{display:grid;gap:2px 6px;padding:6px 8px;margin-bottom:6px}
  table.t-lineas tr{grid-template-columns:62px 34px 1fr 86px;grid-template-areas:"cant exp ref precio" "desc desc desc x" "duda duda duda duda"}
  table.t-repo tr{grid-template-columns:58px 1fr 84px 84px;grid-template-areas:"cant ref ref precio" "desc desc desc dtos" "imp imp neto x" "duda duda duda duda"}
  .duda-txt{font-size:13px;line-height:1.35;color:#7a5a00;white-space:normal;overflow-wrap:anywhere}
  table.t-lineas tr:has(> th),table.t-repo tr:has(> th){display:none}
  table.t-lineas td,table.t-repo td{display:block;padding:0;min-width:0;text-align:left}
  table.t-lineas td::before,table.t-repo td::before{display:block;font-size:10px;line-height:1.3;margin:0}
  table.t-lineas td input:not([type=checkbox]),table.t-repo td input{width:100%;min-height:36px;padding:4px 6px}
  table.t-lineas td.c-exp input{margin-top:6px}
  .c-cant{grid-area:cant}.c-exp{grid-area:exp}.c-ref{grid-area:ref}.c-precio{grid-area:precio}.c-desc{grid-area:desc}
  .c-duda{grid-area:duda}.c-x{grid-area:x;align-self:end}.c-dtos{grid-area:dtos}.c-imp{grid-area:imp}.c-neto{grid-area:neto}
  table.t-repo td.c-imp,table.t-repo td.c-neto{display:flex;gap:6px;font-size:13px}
  table.t-repo td.c-imp::before,table.t-repo td.c-neto::before{font-size:12px}
  td.c-duda.vacia{display:none}
  td.c-duda .btn{margin-top:4px}
  td.c-x .btn{min-height:36px;padding:4px 12px}
  .renglon > span{padding:0 4px 2px}
  .renglon.escrito,.renglon.nuevo input{font-size:18px}
  .hoja{background-image:linear-gradient(to right,transparent 28px,#e79a9a 28px,#e79a9a 30px,transparent 30px),
    repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--r) - 1px),#bcd4ec calc(var(--r) - 1px),#bcd4ec var(--r))}
}
@media print{@page{size:A4;margin:20mm 16mm 18mm}header,nav,.no-imprimir{display:none!important}body{background:#fff;padding:6mm 10mm 12mm 6mm;box-decoration-break:clone;-webkit-box-decoration-break:clone}.tarjeta{border:0}tr{break-inside:avoid;page-break-inside:avoid}thead{display:table-header-group}}
</style>
</head>
<body>
<header>
  <h1><a href="inicio.html" class="hub no-imprimir" title="Volver al hub de Ofipapel">⬅ Hub</a>Control de Pedidos <button id="estadoNube" class="nube oculto" onclick="vista='datos';pedidoAbierto=null;pintar()" title="Ver el estado de la nube"></button>
    <button id="campana" class="campana no-imprimir" onclick="abrirAvisos()" title="Pedidos y campañas nuevos">🔔<span class="globo oculto" id="globoAvisos">0</span></button>
    <button class="hub no-imprimir" onclick="salir()" title="Cerrar la sesión en este dispositivo" style="border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600">Cerrar sesión</button></h1>
  <nav id="nav">
    <button data-vista="importar" class="activa">📄 PDF a Excel</button>
    <button data-vista="pedidos">Campañas</button>
    <button data-vista="nuevo">✍️ Pedido a mano</button>
    <button data-vista="reposicion">🔄 Reposición</button>

<script>
'use strict';
const CP = window.ControlPedidos;
// Cualquier fallo, a la vista: mejor un aviso rojo que una app que no responde.
window.addEventListener('error', (ev) => mostrarFallo(ev.message));
window.addEventListener('unhandledrejection', (ev) => mostrarFallo(ev.reason && (ev.reason.message || ev.reason)));
function mostrarFallo(msg) {
  const c = document.getElementById('avisoFallo');
  if (!c || !msg) return;
  c.innerHTML = `<div class="aviso-caja mal" style="margin:0"><b>⚠️ Algo ha fallado:</b> ${String(msg).replace(/[<>&]/g, '')}. Recarga la página; si se repite, haz captura de este aviso.</div>`;
}
const CLAVE = 'ofipapel.controlPedidos.v1';
const OCR_TOKEN = 'ofipapel-ocr-2026'; // el mismo que leer-reserva-airbnb; no es un secreto (ver la función)
const FN = '/.netlify/functions/';
// La lectura de fotos y PDF vive en las funciones de Netlify: la copia de
// GitHub Pages (y cualquier otra web) no las tiene y daba «405». Los datos
// están en la nube, así que basta con abrir la app en la web buena.
const WEB_BUENA = 'https://ofipapel.netlify.app/control-pedidos.html';
const EN_NETLIFY = /(^|\.)netlify\.app$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

// ── Estado ───────────────────────────────────────────────────────────────────
// pedidos:  [{id, tipo:'comercial'|'reposicion', proveedor, campana, numero, cliente, fecha, notas,
//             lineas:[{ref,desc,cant,precio,exp,duda, dtos,udsCaja,importe (reposición)}],
//             propuesta:{archivo,fecha,cabecera,lineas}, decisiones:{ref:{accion,cant,precio,nota}}, validado, final}]
// restos:   [{id, pedidoId, proveedor, cliente, numero, ref, desc, ean, precio, cant, pendiente, fecha, asignaciones:[{fecha,cant,origen}], anulado}]
// notas:    [{id, pedidoId, cliente, numero, proveedor, ref, desc, texto, fecha, resuelta}]
// catalogos:{PROVEEDOR: {fecha, archivo, items:{ref:{d,p,ean}}}}
// historial:{PROVEEDOR: {REF: {neto, fecha}}}  último precio neto aceptado en una reposición validada
let E = cargar();
// El comercial (Miguel) solo ve lo suyo: sin «PDF a Excel» ni «Reposición», y
// en las campañas sin los botones de compras (enviar al proveedor, propuestas,
// Excel de Géminis, último control). Es solo para no estorbarle: no es un
// permiso (los datos son los mismos para todas las cuentas de cp_miembros).
const USUARIOS_COMERCIAL = new Set(['miguel']);
const CLAVE_ULTIMO_USUARIO = 'ofipapel-control-pedidos-ultimo-usuario';
const esComercial = () => USUARIOS_COMERCIAL.has(nube.usuario || (() => { try { return localStorage.getItem(CLAVE_ULTIMO_USUARIO); } catch { return null; } })());
const VISTAS_SOLO_COMPRAS = ['importar', 'reposicion'];
// La app arranca en «PDF a Excel», la primera pestaña; el comercial, en «Campañas».
let vista = (() => { try { return USUARIOS_COMERCIAL.has(localStorage.getItem(CLAVE_ULTIMO_USUARIO)) ? 'pedidos' : 'importar'; } catch { return 'importar'; } })();
let pedidoAbierto = null;
let soloDiscordancias = true;
/** Discordancias marcadas para decidir en bloque (solo en memoria, como `seleccionados`). */
const marcadasDec = new Set();

function cargar() {
  const base = { pedidos: [], restos: [], notas: [], catalogos: {}, historial: {} };
  try {
    const raw = localStorage.getItem(CLAVE);
    return raw ? Object.assign(base, JSON.parse(raw)) : base;
  } catch { return base; }
}
function guardar() {
  guardarLocal();
  pintarCuentas();
  programarSubida();
}
function guardarLocal() {
  try { localStorage.setItem(CLAVE, JSON.stringify(E)); }
  catch (e) { alert('No se han podido guardar los cambios en este navegador (' + e.message + '). Descarga una copia en «Datos».'); }
}

const h = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Valor seguro dentro de un onclick="…": literal JSON escapado para atributo. */
const js = (v) => h(JSON.stringify(String(v == null ? '' : v)));
const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const hoy = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => CP.fmt(n);
/** Precio unitario sin perder decimales: 1,065 se ve 1,065 (no 1,07); si no hay más de 2, como siempre. */
const fmtPrecio = (n) => (n == null || Math.abs(n * 100 - Math.round(n * 100)) < 1e-9 ? fmt(n)
  : Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
const fmtFecha = (f) => (f && /^\d{4}-\d{2}-\d{2}/.test(f)) ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : (f || '');
const prov = (s) => String(s || '').trim().toUpperCase();
const pedidoPorId = (id) => E.pedidos.find((p) => p.id === id);
const catalogoDe = (proveedor) => { const it = (E.catalogos[prov(proveedor)] || {}).items; return it && Object.keys(it).length ? it : null; };
// Cómo se pasa el precio de la tarifa a precio de venta (ver CP.precioVenta).
const ajusteDe = (proveedor) => (E.catalogos[prov(proveedor)] || {}).ajuste || null;
const esRepo = (p) => p.tipo === 'reposicion';
/** Artículo del catálogo por referencia; las numéricas casan con o sin ceros delante (00839 = 000000839). */
const indicesCat = new WeakMap();
function enCatalogo(cat, ref) {
  if (!cat || !ref) return null;
  if (cat[CP.normRef(ref)]) return cat[CP.normRef(ref)];
  if (!indicesCat.has(cat)) indicesCat.set(cat, new Map(Object.keys(cat).map((k) => [CP.claveRef(k), cat[k]])));
  return indicesCat.get(cat).get(CP.claveRef(ref)) || null;
}
/** Nº de pedido con el cero delante (08, 09, 10) para que se lea en orden. Solo
 *  se ve así: lo guardado no cambia (las propuestas lo buscan tal cual). */
const nPed = (n) => { const s = String(n == null ? '' : n).trim(); return /^\d$/.test(s) ? '0' + s : s; };
/** Marca de «enviado al proveedor» (p.enviado). Los primeros envíos se guardaron
 *  en p.envio, que en reposición es el nombre del fichero subido: solo vale si es un objeto. */
// Pedidos marcados en las listas de campaña. En memoria y no en el DOM: la
// sincronización repinta la pantalla y, si no, las marcas se perdían y se
// enviaba la campaña entera.
const seleccionados = new Set();
function marcarSel(c) { if (c.checked) seleccionados.add(c.value); else seleccionados.delete(c.value); }
const envioDe = (p) => p.enviado || (p.envio && typeof p.envio === 'object' ? p.envio : null);
const preciosAnteriores = (proveedor) => Object.fromEntries(Object.entries(E.historial[prov(proveedor)] || {}).map(([k, v]) => [k, v.neto]));
const fmtDtos = (d) => (CP.parseDtos(d).length ? CP.parseDtos(d).map((x) => fmt(x).replace(',00', '')).join('+') + ' %' : '');

// ── Navegación ───────────────────────────────────────────────────────────────
document.getElementById('nav').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-vista]');
  if (!b) return;
  vista = b.dataset.vista;
  pedidoAbierto = null;
  prefijoNuevo = null; // desde la pestaña, sin campaña impuesta
  pintar();
});

function pintarCuentas() {
  document.getElementById('cuentaRestos').textContent = E.restos.filter((r) => r.pendiente > 0 && !r.anulado).length;
  document.getElementById('cuentaNotas').textContent = E.notas.filter((n) => !n.resuelta).length;
}

function pintar() {
  if (pedidoAbierto && !pedidoPorId(pedidoAbierto)) pedidoAbierto = null; // lo borró otro dispositivo
  try { pintarNube(); } catch (e) { mostrarFallo('estado de la nube: ' + e.message); }
  try { pintarCampana(); } catch (e) { mostrarFallo('avisos: ' + e.message); }
  const comercial = esComercial();
  document.body.classList.toggle('comercial', comercial);
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('oculto', comercial && VISTAS_SOLO_COMPRAS.includes(b.dataset.vista)));
  if (comercial && VISTAS_SOLO_COMPRAS.includes(vista)) {
    vista = 'pedidos';
    if (pedidoAbierto && esRepo(pedidoPorId(pedidoAbierto))) pedidoAbierto = null;
  }
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('activa', b.dataset.vista === vista));
  const main = document.getElementById('main');
  const importar = document.getElementById('vistaImportar');
  main.classList.toggle('oculto', vista === 'importar');
  importar.classList.toggle('oculto', vista !== 'importar');
  if (vista === 'importar') {
    // El iframe se crea la primera vez y se conserva después.
    if (!importar.querySelector('iframe')) {
      const f = document.createElement('iframe');
      f.src = 'importacion-pedidos-proveedores.html';
      f.title = 'Importación Pedidos Proveedores';
      importar.appendChild(f);
    }
    pintarCuentas();
    return;
  }
  if (vista === 'pedidos') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaLista();
  else if (vista === 'nuevo') { main.innerHTML = vistaNuevo(); ponerCampanas(); }
  else if (vista === 'reposicion') main.innerHTML = pedidoAbierto ? vistaDetalle(pedidoPorId(pedidoAbierto)) : vistaReposicion();
  else if (vista === 'restos') main.innerHTML = vistaRestos();
  else if (vista === 'notas') main.innerHTML = vistaNotas();
  else main.innerHTML = vistaDatos();
  ponerEtiquetas(main);
  pintarCuentas();
}

/** Copia el título de cada columna a sus celdas (data-th) para que en el
 *  móvil, donde la tabla se ve como tarjetas, cada dato lleve su nombre. */
// Al imprimir, lo plegado (decisiones ya tomadas) también sale.
window.addEventListener('beforeprint', () => document.querySelectorAll('details.decididas').forEach((d) => { d.open = true; }));
function ponerEtiquetas(raiz) {
  raiz.querySelectorAll('table').forEach((t) => {
    const cab = [...t.rows].find((f) => f.querySelector('th'));
    if (!cab) return;
    const nombres = [...cab.cells].map((c) => c.textContent.trim());
    for (const fila of t.rows) {
      if (fila === cab) continue;
      [...fila.cells].forEach((c, i) => { if (!c.hasAttribute('data-th')) c.setAttribute('data-th', nombres[i] || ''); });
    }
  });
}

// ── Estado de un pedido ──────────────────────────────────────────────────────
/** Pedidos leídos antes de entender «2 ALTA NUEVA» (referencia «2»): se arreglan una vez. */
function repararAltas(p) {
  if (!p.lineas.some((l) => CP.marcarAlta(l) !== l)) return;
  p.lineas = p.lineas.map(CP.marcarAlta);
  if (p.validado) invalidar(p); // lo validado se hizo con la referencia «2»: hay que volver a validar
  setTimeout(guardar, 0);
}
/** Equivalencias de referencia (la del proveedor → la nuestra): las que se
 *  emparejan solas, las del proveedor que ya se dijeron otra vez y las de este
 *  pedido, que mandan. */
function equivalenciasDe(p) {
  const delProv = ((E.catalogos[prov(p.proveedor)] || {}).equivalencias) || {};
  const nuestras = new Set(p.lineas.map((l) => CP.claveRef(l.ref)));
  const conocidas = Object.fromEntries(Object.entries(delProv).filter(([, r]) => nuestras.has(CP.claveRef(r))));
  const manuales = Object.assign({}, conocidas, p.equivalencias || {});
  const conMan = p.propuesta.lineas.map((l) => (manuales[l.ref] ? Object.assign({}, l, { ref: manuales[l.ref] }) : l));
  return Object.assign(CP.emparejarReferencias(p.lineas, conMan), manuales);
}
function comparar(p) {
  repararAltas(p);
  if (!p.propuesta) return null;
  // La referencia del proveedor que es la nuestra con otro código se compara como la nuestra.
  const eq = equivalenciasDe(p);
  const inv = Object.fromEntries(Object.entries(eq).map(([a, b]) => [CP.claveRef(b), a]));
  const filas = compararSinEquivalencias(p, p.propuesta.lineas.map((l) => (eq[l.ref] ? Object.assign({}, l, { ref: eq[l.ref] }) : l)));
  for (const f of filas) { const r = inv[CP.claveRef(f.ref)]; if (r && CP.claveRef(r) !== CP.claveRef(f.ref)) f.refProveedor = r; }
  return filas;
}
function compararSinEquivalencias(p, lineasPropuesta) {
  // Reposición: precio NETO (tras todos los descuentos), 0,25 € informativo, y
  // si el pedido no trae precio se compara con el último aceptado.
  if (esRepo(p)) {
    return CP.compararPedido(p.lineas, lineasPropuesta, { catalogo: catalogoDe(p.proveedor), comparar: 'neto',
      tolerancia: CP.TOLERANCIA.reposicion, preciosAnteriores: preciosAnteriores(p.proveedor) });
  }
  // Comercial: tolerancia cero en precio. El comercial apunta siempre el precio
  // NETO (nunca descuentos): se compara con el neto de cada línea del proveedor
  // (tras sus descuentos, sin el global, que es entre el proveedor y nosotros).
  // Proveedor de netos con margen en su tarifa: el comercial apunta precio de venta.
  return CP.compararPedido(p.lineas, lineasPropuesta, { catalogo: catalogoDe(p.proveedor), comparar: 'neto', tolerancia: CP.TOLERANCIA.comercial, ajusteVenta: ajusteDe(p.proveedor) });
}
/** Fotos del pedido (las antiguas, sin registro, se deducen de sus líneas). */
function fotosDe(p) {
  if (p.fotos && p.fotos.length) return p.fotos;
  return [...new Set(p.lineas.map((l) => l.foto).filter(Boolean))].map((nombre) => ({ nombre, hoja: '' }));
}
/** Hojas del pedido: las leídas en las fotos, o las que diga el usuario en
 *  «Hojas del pedido» (p.hojas) si la lectura se equivocó. */
function hojasDe(p) {
  const r = CP.hojasDelPedido(fotosDe(p), p.hojas);
  // También la foto repetida por contenido (sin nº de hoja que la delate).
  r.fotosRepetidas = CP.fotosRepetidas(p.lineas);
  r.hayRepetida = r.repetidas.length > 0 || r.fotosRepetidas.length > 0;
  return r;
}
/** En el móvil, cada pedido de la campaña en dos líneas: nº y cliente, y debajo
 *  lo demás en pequeño (en vez de una ficha con una fila por dato). */
function filaMovil(p, e) {
  const r = hojasDe(p);
  const datos = [fmtFecha(p.fecha).slice(0, 5), p.lineas.length + ' lín.', esRepo(p) ? '' : r.fotos ? '📷 ' + r.fotos + (r.total ? '/' + r.total : '') : ''].filter(Boolean).join(' · ');
  return `<div class="m-tit">${esRepo(p) ? h(p.proveedor) + (p.numero ? ' · nº ' + h(p.numero) : '') : `nº ${h(nPed(p.numero))} · ${h(p.cliente)}`}</div>
    <div class="m-dat">${h(datos)}${r.faltan.length ? ` <span class="chip mal">falta hoja ${r.faltan.join(', ')}</span>` : ''}${r.hayRepetida ? ` <span class="chip mal">foto repetida</span>` : ''}</div>
    <div class="m-est"><span class="chip ${e.chip}">${h(e.texto)}</span>${chipsFaltasSobras(p)}${chipFactura(p)}</div>`;
}
function celdaFotos(p) {
  const r = hojasDe(p);
  if (!r.fotos) return '—';
  return `${r.fotos}${r.total ? ` <span class="pequeno">(${r.hojas.length} de ${r.total} hojas)</span>` : ''}${r.faltan.length ? ` <span class="chip mal">falta hoja ${r.faltan.join(', ')}</span>` : ''}${r.hayRepetida ? ` <span class="chip mal">foto repetida</span>` : ''}`;
}
function avisoFotos(p) {
  const fotos = fotosDe(p);
  const r = hojasDe(p);
  if (!r.fotos) return '';
  return `<div class="aviso-caja ${r.faltan.length || r.hayRepetida ? 'mal' : 'info'}">📷 <b>${r.fotos} foto(s)</b>${r.total ? ` · hojas leídas ${r.hojas.join(', ')} de ${r.total}${r.aMano ? ' (total puesto a mano)' : ''}` : ''}
    ${r.faltan.length ? `<br><b>⚠️ Falta la hoja ${r.faltan.join(', ')} de ${r.total}:</b> súbela con «Hacer foto» o «Elegir de la galería».` : ''}
    ${r.repetidas.length ? `<br><b>⚠️ La hoja ${r.repetidas.join(', ')} está subida dos veces:</b> sus líneas están duplicadas (salen faltas que no lo son). Quita la foto repetida con «quitar».` : ''}
    ${r.fotosRepetidas.map((x) => `<br><b>⚠️ La foto ${h(x.foto)} es la misma que ${h(x.igualA)}</b> (mismas referencias y cantidades): sus líneas están duplicadas. Quítala con «quitar».`).join('')}
    <div class="pequeno" style="margin-top:4px">${fotos.map((f) => `<span style="display:inline-block;margin:2px 8px 2px 0">${h(f.nombre)}${f.hoja ? ` (hoja ${h(f.hoja)})` : ''}${f.lineas != null ? ` · ${f.lineas} línea(s)` : ''}
      <button class="btn peque peligro no-imprimir" style="padding:1px 6px" onclick="quitarFoto(${js(f.nombre)})" title="Quitar esta foto y sus líneas">quitar</button></span>`).join('')}</div></div>`;
}
function chipsFaltasSobras(p) {
  const filas = comparar(p);
  if (!filas) return '';
  const sobran = sobrasPendientes(p, filas);
  const faltan = CP.faltasPendientes(filas, p.decisiones);
  return ` <span class="chip ${faltan.length ? 'mal' : 'ok'}">${faltan.length} faltan</span> <span class="chip ${sobran.length ? 'aviso' : 'ok'}">${sobran.length} sobran</span>`;
}
/** Lo que sobra y aún hay que decidir (o está reclamado): lo aceptado ya se le factura al cliente. */
function sobrasPendientes(p, filas) {
  return CP.faltasYSobras(filas).sobran.filter((x) => { const a = (p.decisiones[x.ref] || {}).accion; return !a || a === 'reclamar'; });
}
function estadoPedido(p) {
  if (p.validado) return { chip: 'ok', texto: 'Validado' };
  if (!p.lineas.length) return { chip: 'gris', texto: 'Sin líneas' };
  if (!p.propuesta) return { chip: 'gris', texto: 'Sin propuesta' };
  const pend = CP.sinDecidir(comparar(p), p.decisiones).length;
  return pend ? { chip: 'aviso', texto: pend + ' por decidir' } : { chip: 'info', texto: 'Listo para validar' };
}

// ── Campañas ─────────────────────────────────────────────────────────────────
// Los pedidos del comercial se agrupan por proveedor + campaña; las
// reposiciones, por proveedor. La campaña se escribe a mano, así que se busca
// una ya existente que solo cambie en mayúsculas, tildes o espacios
// («agendas  2027» → «Agendas 2027»): si no, saldrían dos campañas distintas.
const claveTexto = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
function campanaCanonica(proveedor, texto) {
  const t = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  const igual = E.pedidos.find((p) => !esRepo(p) && p.campana && prov(p.proveedor) === prov(proveedor) && claveTexto(p.campana) === claveTexto(t));
  return igual ? igual.campana : t;
}
const campanasExistentes = () => [...new Set(E.pedidos.filter((p) => !esRepo(p) && p.campana).map((p) => p.campana))].sort((a, b) => a.localeCompare(b, 'es'));
const claveGrupo = (p) => esRepo(p) ? 'R|' + prov(p.proveedor) : 'C|' + prov(p.proveedor) + '|' + claveTexto(p.campana);
const nombreGrupo = (p) => esRepo(p) ? `Reposición · ${p.proveedor}` : `${p.proveedor} · ${p.campana || 'sin campaña'}`;
let gruposAbiertos = null; // claves de campaña desplegadas (por defecto, la más reciente)
const reclamaciones = {};  // texto de reclamación por campaña

// ── Vista: lista de pedidos ──────────────────────────────────────────────────
/** Grupos (campañas o reposiciones de un proveedor) de los pedidos dados. */
function agruparPedidos(lista) {
  const ps = lista.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }));
  const grupos = new Map();
  for (const p of ps) {
    const k = claveGrupo(p);
    if (!grupos.has(k)) grupos.set(k, { clave: k, nombre: nombreGrupo(p), pedidos: [] });
    grupos.get(k).pedidos.push(p);
  }
  // Dentro de cada campaña, por nº de pedido (01, 02… 10), no por fecha.
  for (const g of grupos.values()) g.pedidos.sort((a, b) => String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }) || (a.fecha || '').localeCompare(b.fecha || ''));
  // Todas minimizadas por defecto; solo se despliega la que abre el usuario
  // (o la del pedido del que vuelve).
  gruposAbiertos = gruposAbiertos || new Set();
  return grupos;
}

/** Guía para facturar a mano en nuestro sistema: un bloque por cliente con
 *  SOLO lo que se factura — lo validado a precio de cliente (lo que apuntó el
 *  comercial, sin el descuento de la propuesta), menos lo que no haya venido
 *  en la factura final — y sus notas de facturación. Nada de restos. Los
 *  pedidos sin validar no entran: se avisa arriba. */
/** Nuestra liquidación de Géminis («Propuesta de Pedido», PDF) de la campaña:
 *  guarda en cada pedido su código interno por referencia (`p.codigos`) para
 *  que la guía de facturación salga con él. Se lee sin IA. */
async function cargarCodigosCampana(files, clave) {
  const lineas = [];
  for (const f of [...files]) {
    try {
      const g = /\.pdf$/i.test(f.name) ? CP.leerPedidoGeminis(await textoDePdf(f)) : null;
      if (!g) { alert(`${f.name} no parece una «Propuesta de Pedido» de Géminis en PDF.`); continue; }
      lineas.push(...g.lineas);
    } catch (err) { alert('No he podido leer ' + f.name + ': ' + err.message); }
  }
  if (!lineas.length) return;
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave);
  let con = 0, sin = [];
  for (const p of ps) {
    const todas = p.lineas.concat((p.final && p.final.lineas) || []);
    p.codigos = Object.assign({}, p.codigos, CP.codigosInternos(todas, lineas));
    // Solo cuentan las líneas que saldrán en la guía: con factura final, lo facturado.
    const tiene = (ref) => Object.keys(p.codigos).some((r) => CP.claveRef(r) === CP.claveRef(ref));
    for (const l of (p.factura && p.factura.lineas) || (p.final && p.final.lineas) || []) { if (tiene(l.ref)) con++; else sin.push(`nº ${nPed(p.numero)} ${l.ref}`); }
  }
  guardar(); pintar();
  alert(`Liquidación leída: ${lineas.length} códigos.\n${con} líneas de los pedidos ya tienen código interno.` +
    (sin.length ? `\nSin código (${sin.length}): ${sin.slice(0, 15).join(', ')}${sin.length > 15 ? '…' : ''}` : ''));
}
function codigoDe(p, ref) {
  const c = p.codigos || {};
  if (c[ref]) return c[ref];
  const k = Object.keys(c).find((r) => CP.claveRef(r) === CP.claveRef(ref));
  return k ? c[k] : '';
}
/** Hoja A4 para las ventanas de imprimir. El margen va también dentro del body:
 *  Chrome en Android y algunas impresoras ignoran el de @page y la hoja salía
 *  cortada por arriba y por la derecha. */
// El relleno del body se repite en cada hoja (box-decoration-break: clone): si
// el @page se ignora, sin él las filas del final de cada hoja salían cortadas.
const CSS_HOJA = '@page{size:A4;margin:12mm 10mm 16mm 10mm}html{margin:0}body{margin:0;padding:8mm 12mm 12mm 8mm;box-sizing:border-box;box-decoration-break:clone;-webkit-box-decoration-break:clone}';
function imprimirGuiaFacturacion(clave, opciones) {
  // Con `soloFactura`, la guía de esa factura del proveedor: a cada cliente solo
  // lo que le llega en ella (lo validado, a su precio, hasta lo que trae la factura).
  const soloFactura = opciones && opciones.soloFactura;
  const fraDe = (l, p) => CP.facturaDeLinea(l, l.origen || (p.factura.cabecera || {}).numero || p.factura.archivo);
  const deLaFactura = (p) => (p.factura && p.factura.lineas || []).filter((l) => fraDe(l, p) === soloFactura);
  const ps = E.pedidos.filter((p) => claveGrupo(p) === clave)
    .sort((a, b) => String(a.numero).localeCompare(String(b.numero), 'es', { numeric: true }) || String(a.cliente).localeCompare(String(b.cliente), 'es'));
  if (!ps.length) return;
  const nombre = nombreGrupo(ps[0]);
  const validados = ps.filter((p) => p.validado && p.final);
  const sinValidar = ps.filter((p) => !(p.validado && p.final));
  if (!validados.length) { alert('Todavía no hay ningún pedido validado en esta campaña.'); return; }
  const pc = (l) => (l.precioCliente != null ? l.precioCliente : l.precio) || 0;
  // Con la liquidación de Géminis subida, cada línea lleva nuestro código interno.
  const conCodigos = validados.some((p) => p.codigos && Object.keys(p.codigos).length);
  // Solo se factura lo que ha llegado: si la campaña ya trabaja con facturas
  // finales, un pedido sin la suya no entra (no ha llegado). Sin ninguna, sale todo lo validado.
  const conFactura = (p) => Boolean(p.factura && (p.factura.lineas || []).length);
  const sinFactura = validados.some(conFactura) ? validados.filter((p) => !conFactura(p)) : [];
  const incluidos = soloFactura ? validados.filter((p) => deLaFactura(p).length) : validados.filter((p) => !sinFactura.includes(p));
  let totalCampana = 0;
  const bloques = incluidos.map((p) => {
    // Si ya está la factura final, solo se factura al cliente lo que ha venido.
    const rf = soloFactura ? null : revisarFactura(p);
    const noVino = new Map(((rf && rf.faltan) || []).map((x) => [CP.claveRef(x.ref), x.cant]));
    const lineas = p.final.lineas.map((l) => {
      const menos = noVino.get(CP.claveRef(l.ref)) || 0;
      if (!menos) return l;
      const quitar = Math.min(menos, l.cant);
      noVino.set(CP.claveRef(l.ref), menos - quitar);
      return Object.assign({}, l, { cant: CP.red2(l.cant - quitar) });
    }).filter((l) => l.cant > 0);
    if (soloFactura) {
      const eq = Object.assign({}, p.equivalencias);
      const llega = new Map();
      for (const l of deLaFactura(p)) { const k = CP.claveRef(eq[l.ref] || l.ref); llega.set(k, (llega.get(k) || 0) + (CP.parseNum(l.cant) || 0)); }
      lineas.splice(0, lineas.length, ...p.final.lineas.map((l) => {
        const k = CP.claveRef(l.ref); const q = Math.min(l.cant, llega.get(k) || 0);
        llega.set(k, (llega.get(k) || 0) - q);
        return Object.assign({}, l, { cant: CP.red2(q) });
      }).filter((l) => l.cant > 0));
    }
    const total = CP.red2(lineas.reduce((s, l) => s + pc(l) * l.cant, 0));
    totalCampana += total;
    const notas = E.notas.filter((n) => n.pedidoId === p.id && !n.resuelta);
    return `<section>
      <h2><span class="caja"></span> ${h(p.cliente)} <small>· pedido nº ${h(nPed(p.numero))} · ${h(fmtFecha(p.fecha))}</small></h2>

/** Nº del siguiente pedido a mano: correlativo dentro de su campaña (proveedor

  return String((nums.length ? Math.max(...nums) : 0) + 1);
}

/** Pide la marca y la pone en todos los pedidos de la campaña. Devuelve la

function elegirMarca(clave) {

  const usadas = [...new Set(E.pedidos.map((p) => p.marca).filter(Boolean))].sort();
  const delProv = E.pedidos.filter((p) => p.marca && prov(p.proveedor) === prov(ps[0].proveedor)).map((p) => p.marca);
  const propuesta = marcaDe(ps) || delProv[delProv.length - 1] || prov(ps[0].proveedor);

    (usadas.length ? `\nYa usadas: ${usadas.join(', ')}` : ''), propuesta);
  if (r == null || !r.trim()) return '';

/** Reposición: nuestro pedido al proveedor. No pasa por «Pedido a mano». */
/** Nombre del proveedor tal como ya lo tenemos («Miquelrius, S.A.» →
 *  «MIQUELRIUS» si ya existe). Ofipapel nunca es el proveedor. */
function proveedorCanonico(texto) {
  const t = prov(texto).replace(/[.,]/g, ' ').replace(/\b(S\s*A\s*U|S\s*L\s*U|S\s*A|S\s*L)\b/g, '').replace(/\s+/g, ' ').trim();
  if (!t || /OFIPAPEL/.test(t)) return '';
  const conocidos = [...new Set(E.pedidos.map((x) => prov(x.proveedor)).concat(Object.keys(E.catalogos)))].filter(Boolean);
  return conocidos.find((c) => t === c || t.includes(c) || c.includes(t)) || t;
}

async function subirEnvio(file) {
  if (!file) return;
  if (E.pedidos.some((x) => esRepo(x) && x.envio === file.name) && !confirm(`${file.name} ya está subido. ¿Crear otro pedido con él?`)) return;
  const caja = document.getElementById('progresoEnvios');
  if (caja) caja.textContent = `Leyendo ${file.name}${esPdf(file) || esImagen(file) ? '… puede tardar un minuto' : '…'}`;
  try {
    const doc = await leerFicheroProveedor(file);
    let proveedor = proveedorCanonico(doc.cabecera.proveedor);
    if (!proveedor) {
      const r = prompt('El documento no dice de qué proveedor es. Escríbelo:', '');
      if (r == null || !r.trim()) { if (caja) caja.textContent = ''; return; }
      proveedor = proveedorCanonico(r) || prov(r);
    }
    const p = { id: nuevoId(), tipo: 'reposicion', proveedor, campana: '', numero: String(doc.cabecera.numero || doc.cabecera.numeroPedido || ''),
      cliente: '', fecha: hoy(), notas: '',
      lineas: doc.lineas.map((l) => ({ ref: l.ref, desc: l.desc, ean: l.ean, cant: l.cant, precio: l.precio, dtos: l.dtos || [], udsCaja: l.udsCaja, importe: l.importe, duda: l.duda || '', ...(l.alta ? { alta: true, descAlta: l.descAlta } : {}) })),
      envio: file.name, envioControl: doc.control || null, propuesta: null, decisiones: {}, validado: false, final: null };
    guardarCatalogo(proveedor, file.name, doc.catalogo);
    E.pedidos.push(p);
    guardar();
    abrirPedido(p.id);
  } catch (err) {
    if (caja) caja.textContent = '';
    alert(err.sinSaldo ? MSG_SIN_SALDO : 'No he podido leer el pedido: ' + err.message);
  }
}

/** Antes de abrir la galería o la cámara: proveedor y campaña escritos, y
 *  confirmación de a qué campaña van. Sin valores por defecto, para que las
 *  fotos no acaben en FINOCAM (o en otra campaña) sin querer. */
function pedirFotosNuevas(idInput) {
  const v = (id) => document.getElementById(id).value.trim();
  if (!v('lotProv') || !v('lotCamp')) { alert('Escribe primero el proveedor y la campaña de estas fotos.'); (v('lotProv') ? document.getElementById('lotCamp') : document.getElementById('lotProv')).focus(); return; }
  const proveedor = prov(v('lotProv'));
  const campana = campanaCanonica(proveedor, v('lotCamp'));
  const ya = E.pedidos.filter((p) => !esRepo(p) && p.proveedor === proveedor && claveTexto(p.campana) === claveTexto(campana)).length;
  const texto = ya
    ? `Las fotos irán a la campaña «${proveedor} · ${campana}», que ya tiene ${ya} pedido(s), como pedidos NUEVOS.\n\nPara completar un pedido que ya existe, ábrelo y usa «Hacer foto».\n\n¿Seguir?`
    : `Se creará la campaña nueva «${proveedor} · ${campana}». ¿Seguir?`;
  if (!confirm(texto)) return;
  document.getElementById(idInput).click();
}
/** Quita una foto del pedido junto con las líneas que se leyeron de ella
 *  (p. ej. si se subió al pedido equivocado). */
function quitarFoto(nombre) {
  const p = pedidoActual();
  const n = p.lineas.filter((l) => l.foto === nombre).length;
  if (!confirm(`¿Quitar la foto ${nombre} y sus ${n} línea(s) de este pedido?`)) return;
  p.lineas = p.lineas.filter((l) => l.foto !== nombre);
  p.fotos = (p.fotos || []).filter((f) => f.nombre !== nombre);
  invalidar(p); guardar(); pintar();
}
// ── Campana de avisos: pedidos (y campañas) nuevos que han subido OTROS ─────
// Se apuntan al bajar de la nube los pedidos que no teníamos y que ha creado
// otra persona; se quitan al abrirlos o con «Marcar todo como visto». Cada
// dispositivo lleva sus avisos (localStorage); la primera sincronización de un
// dispositivo no avisa de nada (sería todo).
const CLAVE_AVISOS = 'ofipapel-control-pedidos-avisos';
let avisos = (() => { try { return JSON.parse(localStorage.getItem(CLAVE_AVISOS)) || []; } catch { return []; } })();
function guardarAvisos() { try { localStorage.setItem(CLAVE_AVISOS, JSON.stringify(avisos)); } catch { /* solo en memoria */ } }
function avisosVivos() {
  const vivos = avisos.filter((a) => pedidoPorId(a.id));
  if (vivos.length !== avisos.length) { avisos = vivos; guardarAvisos(); }
  return avisos;
}
function pintarCampana() {
  const n = avisosVivos().length;
  const b = document.getElementById('campana');
  const g = document.getElementById('globoAvisos');
  if (!b || !g) return;
  b.classList.toggle('hay', n > 0);
  g.classList.toggle('oculto', !n);
  g.textContent = n > 99 ? '99+' : String(n);
  b.title = n ? `${n} pedido(s) nuevo(s)` : 'Sin pedidos nuevos';
}
function quitarAviso(id) {
  const antes = avisos.length;
  avisos = avisos.filter((a) => a.id !== id);
  if (avisos.length !== antes) { guardarAvisos(); pintarCampana(); }
}
function abrirAvisos() {
  const lista = avisosVivos();
  const dlg = document.getElementById('dlgAvisos');
  // Agrupados por campaña; «campaña nueva» si todos sus pedidos son nuevos.
  const grupos = new Map();
  for (const a of lista) {
    const p = pedidoPorId(a.id);
    const k = claveGrupo(p);
    if (!grupos.has(k)) grupos.set(k, { nombre: nombreGrupo(p), clave: k, items: [] });
    grupos.get(k).items.push({ a, p });
  }
  const nuevaCampana = (g) => !esRepo(g.items[0].p) && E.pedidos.filter((p) => claveGrupo(p) === g.clave).length === g.items.length;
  dlg.innerHTML = `
    <h2>🔔 Novedades</h2>
    ${lista.length ? [...grupos.values()].map((g) => `
      <h3 style="margin:14px 0 4px">${h(g.nombre)} ${nuevaCampana(g) ? '<span class="chip mal">🆕 campaña nueva</span>' : ''}</h3>
      ${g.items.map(({ a, p }) => `<div class="aviso-nuevo">
        <div><b>${esRepo(p) ? (p.numero ? 'nº ' + h(p.numero) : 'Pedido de reposición') : `nº ${h(nPed(p.numero))} · ${h(p.cliente)}`}</b>
          <div class="pequeno">${p.lineas.length} línea(s) · subido por ${h(a.autor || '¿?')}${a.cuando ? ' · ' + h(fmtFecha(String(a.cuando).slice(0, 10))) : ''}</div></div>
        <button class="btn peque primario" onclick="document.getElementById('dlgAvisos').close(); quitarAviso(${js(p.id)}); abrirPedido(${js(p.id)})">Abrir</button>
      </div>`).join('')}`).join('')
    : '<div class="vacio">No hay pedidos nuevos.</div>'}
    <div class="fila" style="margin-top:14px">
      ${lista.length ? `<button class="btn" onclick="avisos = []; guardarAvisos(); pintarCampana(); document.getElementById('dlgAvisos').close()">✓ Marcar todo como visto</button>` : ''}
      <button class="btn peque" onclick="document.getElementById('dlgAvisos').close()">Cerrar</button>
    </div>`;
  dlg.showModal();
}
function abrirPedido(id) {
  quitarAviso(id);
  // Al volver a la lista, la campaña de este pedido queda desplegada.
  const p = pedidoPorId(id);
  if (p) (gruposAbiertos = gruposAbiertos || new Set()).add(claveGrupo(p));
  pedidoAbierto = id; vista = p && esRepo(p) ? 'reposicion' : 'pedidos'; pintar(); window.scrollTo(0, 0); }

/** Precio en la comparación: en reposición, el neto con el base y los descuentos debajo. */
function celdaPrecio(p, base, dtos, neto) {
  if (!esRepo(p)) return base == null ? '—' : fmt(base);
  if (neto == null) return '—';
  const det = base != null && (CP.parseDtos(dtos).length || CP.red2(base) !== CP.red2(neto)) ? `<div class="pequeno">${fmt(base)}${dtos && CP.parseDtos(dtos).length ? ' − ' + fmtDtos(dtos) : ''}</div>` : '';
  return fmt(neto) + det;
}

/** Las líneas de la propuesta, plegadas salvo que haya algo que revisar
 *  (dudas de lectura o un documento que no cuadra con su base). */
function tablaPropuesta(p, cat) {
  const pr = p.propuesta;
  const revisar = pr.lineas.some((l) => l.duda) || (pr.control && pr.control.cuadra === false);
  return plegableLineas(p, 'propuesta', revisar, `Ver y corregir las ${pr.lineas.length} líneas de la propuesta`, tablaLineasRepo(p, cat, 'propuesta'));
}
/** Las líneas de nuestro pedido de reposición, plegables (en el móvil ocupan
 *  mucho): abiertas mientras no hay propuesta o si alguna tiene duda. */
function tablaPedidoRepo(p, cat) {
  if (!p.lineas.length) return tablaLineasRepo(p, cat, 'pedido');
  const abrir = !p.propuesta || p.lineas.some((l) => l.duda);
  return plegableLineas(p, 'pedido', abrir, `Ver y corregir las ${p.lineas.length} líneas de nuestro pedido`, tablaLineasRepo(p, cat, 'pedido'));
}
// Lo que el usuario abre o cierra a mano (clic en el título; «toggle» salta
// también al pintar abierto) se respeta al repintar (si no, al
// corregir una línea la lista se volvía a plegar sola). Solo en memoria.

function plegableLineas(p, lado, abrirPorDefecto, titulo, contenido) {

}

function tablaLineasRepo(p, cat, lado) {

    ${arr.map((l, i) => {

        <td class="c-dtos"><input class="precio" inputmode="decimal" value="${h(Array.isArray(l.dtos) ? l.dtos.join('+') : l.dtos)}" placeholder="—" title="Descuentos encadenados, p. ej. 10+5" onchange="cambiaLinea(${i},'dtos',this.value${L})"></td>

        <td class="c-x"><button class="btn peque peligro" onclick="borrarLinea(${i}${L})" title="Borrar la línea entera">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  `;
}

async function cargarEnvio(file) {
  if (!file) return;
  const p = pedidoActual();
  try {
    const prop = await leerFicheroProveedor(file, 'progresoEnvio');
    if (p.lineas.length && !confirm(`El pedido ya tiene ${p.lineas.length} líneas. ¿Sustituirlas por las ${prop.lineas.length} del Excel?`)) return;
    p.lineas = prop.lineas.map((l) => ({ ref: l.ref, desc: l.desc, ean: l.ean, cant: l.cant, precio: l.precio, dtos: l.dtos || [], udsCaja: l.udsCaja, importe: l.importe, duda: l.duda || '', ...(l.alta ? { alta: true, descAlta: l.descAlta } : {}) }));
    p.envio = file.name;
    p.envioControl = prop.control || null;
    guardarCatalogo(p.proveedor, file.name, prop.catalogo);
    invalidar(p); guardar(); pintar();
  } catch (err) { alert('No he podido leer el pedido: ' + err.message); }
}
function quitarPropuesta() {
  const p = pedidoActual();
  if (!confirm('¿Quitar la propuesta y sus decisiones?')) return;
  p.propuesta = null; p.decisiones = {}; invalidar(p); guardar(); pintar();
}

function tablaLineas(p, cat) {
  if (!p.lineas.length) return `<div class="vacio">Sin líneas. Lee las fotos, pégalas o añádelas a mano.</div>`;
  const fueraCat = cat ? p.lineas.filter((l) => l.ref && !enCatalogo(cat, l.ref)).length : 0;
  // Una duda de lectura deja de importar cuando la propuesta del proveedor trae
  // esa misma referencia y cuadra en todo (cantidad y precio): ya no se enseña.
  let confirmadas = new Set();
  try { if (p.propuesta) confirmadas = new Set(comparar(p).filter((f) => f.estado === 'ok').map((f) => CP.claveRef(f.ref))); } catch (e) { /* sin comparación, se enseñan todas */ }
  const dudaDe = (l) => (l.duda && !confirmadas.has(CP.claveRef(l.ref)) ? l.duda : '');
  const dudas = p.lineas.filter((l) => dudaDe(l)).length;
  return `
  <div class="resumen">
    <span class="chip gris">${p.lineas.length} líneas</span>
    ${dudas ? `<span class="chip aviso">${dudas} con dudas de lectura</span>` : ''}
    ${cat ? (fueraCat ? `<span class="chip mal">${fueraCat} referencias no existen en el catálogo</span>` : `<span class="chip ok">Todas las referencias existen en el catálogo</span>`) : ''}
  </div>
  <div class="tabla-scroll"><table class="t-lineas">
    <tr><th class="num">Cant.</th><th>Exp.</th><th>Referencia</th><th>Descripción</th><th class="num">Precio</th><th>Duda de lectura</th><th></th></tr>
    ${p.lineas.map((l, i) => {
      const ref = CP.normRef(l.ref);
      const fuera = cat && ref && !enCatalogo(cat, ref);
      const sug = fuera ? CP.sugerenciasCatalogo(ref, cat, 4) : [];
      const enCat = enCatalogo(cat, ref);
      const duda = dudaDe(l);
      return `<tr class="${fuera ? 'fuera-catalogo' : ''} ${duda ? 'duda' : ''}">
        <td class="c-cant"><input class="cant" inputmode="decimal" value="${h(l.cant)}" onchange="cambiaLinea(${i},'cant',this.value)"></td>
        <td class="c-exp"><input type="checkbox" ${l.exp ? 'checked' : ''} onchange="cambiaLinea(${i},'exp',this.checked)"></td>
        <td class="c-ref"><input class="ref" value="${h(l.ref)}" onchange="cambiaLinea(${i},'ref',this.value)">${l.alta ? `<div class="pequeno">🆕 ${CP.REF_ALTA}</div>` : ''}
          ${fuera ? `<div class="sugerencia">No está en el catálogo.${sug.length ? ' ¿Quizá…? ' + sug.map((s) => `<button onclick="cambiaLinea(${i},'ref',${js(s.ref)})" title="${h(s.desc)}">${h(s.ref)} · ${h(s.desc.slice(0, 24))}${s.precio != null ? ' · ' + fmt(s.precio) : ''}</button>`).join('') : ''}</div>` : ''}</td>
        <td class="c-desc"><input value="${h(l.desc)}" onchange="cambiaLinea(${i},'desc',this.value)">${enCat && enCat.d ? `<div class="pequeno">${h(enCat.d)}</div>` : ''}</td>
        <td class="c-precio"><input class="precio" inputmode="decimal" value="${l.precio == null ? '' : h(fmtPrecio(l.precio))}" onchange="cambiaLinea(${i},'precio',this.value)">
          ${enCat && enCat.p != null && l.precio != null && CP.red2(enCat.p) !== CP.red2(l.precio) ? `<div class="pequeno">Tarifa ${fmt(enCat.p)}</div>` : ''}</td>
        <td class="c-duda${duda ? '' : ' vacia'}">${duda ? `<div class="duda-txt">${h(duda)}</div>` : `<input value="" onchange="cambiaLinea(${i},'duda',this.value)" placeholder="—">`}${duda ? `<button class="btn peque" title="La he revisado: quitar la duda" onclick="cambiaLinea(${i},'duda','')">✓ Está bien</button>` : ''}</td>
        <td class="c-x"><button class="btn peque peligro" onclick="borrarLinea(${i})" title="Borrar la línea entera">✕</button></td>
      </tr>`;
    }).join('')}
  </table></div>
  ${dudas ? `` : ''}`;
}

function vistaComparacion(p, filas) {
  const pend = CP.sinDecidir(filas, p.decisiones);
  const n = {
    ok: filas.filter((f) => f.estado === 'ok').length,
    info: filas.filter((f) => !f.revisar && f.motivos.some((m) => m.informativo)).length,
    revisar: filas.filter((f) => f.revisar).length,
  };
  // Lo esencial primero: lo que falta, luego lo que sobra, luego el resto.
  const peso = (f) => (f.cantPropuesta < f.cantPedida ? 0 : f.cantPropuesta > f.cantPedida ? 1 : 2);
  const orden = (xs) => xs.slice().sort((a, b) => peso(a) - peso(b));
  // Por defecto solo lo que falta decidir; lo ya decidido y los cambios
  // informativos quedan plegados debajo (se pueden abrir para cambiarlos).
  const porDecidir = (f) => { const d = p.decisiones[f.ref] || {}; return f.revisar && (!d.accion || (d.accion === 'manual' && !String(d.cant || '').trim())); };
  const mostrar = orden(soloDiscordancias ? filas.filter(porDecidir) : filas);
  const plegadas = soloDiscordancias ? orden(filas.filter((f) => f.motivos.length && !porDecidir(f))) : [];
  const nombres = { reclamar: '✉️ Reclamar al proveedor (esperar respuesta)', resto: 'Sin stock: dejar en restos', anular: 'Descartar (descatalogado o ya no lo quiere)', aceptar: 'Aceptar propuesta', mantener: 'Mantener lo pedido', manual: 'Cantidad/precio a mano', excluir: 'Excluir línea' };
  const tabla = (xs) => `<div class="tabla-scroll"><table>
      <tr><th class="no-imprimir c-sel"><input type="checkbox" title="Marcar todas" onchange="this.closest('table').querySelectorAll('.selDec').forEach((c) => { c.checked = this.checked; marcarDec(c); })"></th><th>Referencia</th><th>Descripción</th><th class="num">Pedido</th><th class="num">Propuesta</th><th class="num">${esRepo(p) ? 'Neto pedido' : 'Precio pedido'}</th><th class="num">${esRepo(p) ? 'Neto propuesta' : 'Precio propuesta'}</th><th>Qué pasa</th><th${esRepo(p) ? '' : ' title="En un cambio de precio, la decisión fija el precio al cliente; el Excel de Géminis lleva siempre el coste del proveedor."'}>Decisión</th></tr>
      ${xs.map((f) => {
        const d = p.decisiones[f.ref] || {};
        const acciones = CP.accionesPara(f, p.tipo);
        return `<tr>
          <td class="no-imprimir c-sel">${f.revisar ? `<input type="checkbox" class="selDec" value="${h(f.ref)}" ${marcadasDec.has(f.ref) ? 'checked' : ''} onchange="marcarDec(this)">` : ''}</td>
          <td><b>${h(f.ref)}</b>${f.refProveedor ? `<div class="pequeno" title="El proveedor la factura con otro código">${(p.iaDeshacer || []).some((e) => e.tipo === 'emparejar' && e.delProveedor === f.refProveedor) ? '🧠 ' : ''}🔗 proveedor: ${h(f.refProveedor)}${(p.equivalencias || {})[f.refProveedor] ? ` <button class="btn peque" onclick="emparejar(${js(f.refProveedor)}, '')" title="No es la misma: deshacer">deshacer</button>` : ''}</div>` : ''}${f.alta ? ` <span class="pequeno">🆕 alta nueva</span>` : ''}${f.sugerencias.length ? `<div class="sugerencia">¿Quizá ${f.sugerencias.map((s) => h(s.ref)).join(', ')}? Corrígela arriba.</div>` : ''}</td>
          <td>${h(f.desc)}</td>
          <td class="num">${f.cantPedida || '—'}</td><td class="num">${f.cantPropuesta || '—'}</td>
          <td class="num">${f.precioDeHistorial ? fmt(f.precioReferencia) + '<div class="pequeno">(último aceptado)</div>' : celdaPrecio(p, f.precioPedido, f.dtosPedido, f.netoPedido)}</td>
          <td class="num">${f.ventaPropuesta != null ? `${fmt(f.ventaPropuesta)}${esComercial() ? '' : `<div class="pequeno">venta · coste ${fmt(f.netoPropuesta)}</div>`}` : celdaPrecio(p, f.precioPropuesta, f.dtosPropuesta, f.netoPropuesta)}${f.difPrecio != null ? `<div class="motivo ${Math.abs(f.difPrecio) > (esRepo(p) ? CP.TOLERANCIA.reposicion : CP.TOLERANCIA.comercial) ? 'revisar' : ''}">${f.difPrecio > 0 ? '+' : ''}${fmt(f.difPrecio)} € (${f.difPrecioPct > 0 ? '+' : ''}${fmt(f.difPrecioPct)} %)</div>` : ''}</td>
          <td>${f.motivos.length ? f.motivos.map((m) => `<div class="motivo ${m.revisar ? 'revisar' : ''}">${h(m.texto)}</div>`).join('') : '<span class="chip ok">Cuadra</span>'}</td>
          <td class="no-imprimir">${f.revisar ? `
            <select onchange="decide(${js(f.ref)},'accion',this.value)">
              <option value="">— decidir —</option>
              ${acciones.map((a) => `<option value="${a}" ${d.accion === a ? 'selected' : ''}>${a === 'aceptar' && f.cantPropuesta > f.cantPedida ? (esRepo(p) ? 'Aceptar: nos lo quedamos' : '➕ Sumarlo al pedido del cliente') : nombres[a]}</option>`).join('')}
              ${f.estado === 'falta' ? filas.filter((x) => x.estado === 'extra').map((x) => `<option value="eq:${h(x.ref)}">🔗 Es la «${h(x.ref)}» del proveedor (${h(String(x.desc || '').slice(0, 30))})</option>`).join('') : ''}
            </select>
            ${d.accion === 'manual' ? `<div class="fila" style="margin-top:4px"><input class="cant" placeholder="Cant." value="${h(d.cant)}" onchange="decide(${js(f.ref)},'cant',this.value)"><input class="precio" placeholder="${esRepo(p) ? 'Neto' : 'Precio'}" value="${h(d.precio)}" onchange="decide(${js(f.ref)},'precio',this.value)"></div>` : ''}
            ${d.accion === 'reclamar' ? `<input style="margin-top:4px" placeholder="Motivo para el proveedor (opcional)" title="Sale en el texto de la reclamación, debajo de esta referencia" value="${h(d.motivo)}" onchange="decide(${js(f.ref)},'motivo',this.value)">` : ''}
            ${d.accion || d.nota ? `<input style="margin-top:4px" placeholder="Nota de facturación (opcional)" value="${h(d.nota)}" onchange="decide(${js(f.ref)},'nota',this.value)">` : ''}
          ` : ''}</td>
        </tr>`;
      }).join('')}
    </table></div>`;
  return `
  <div class="tarjeta">
    <h2>3 · Comparación y decisiones</h2>
    ${bloqueFaltasSobras(p, filas)}
    ${bloqueReclamacionPedido(p, filas)}
    <h3 style="margin-top:16px">Todas las diferencias</h3>
    <div class="resumen">
      <span class="chip ok">${n.ok} cuadran</span>
      ${n.info ? `<span class="chip info">${n.info} con cambio de precio informativo</span>` : ''}
      <span class="chip ${n.revisar ? 'mal' : 'ok'}">${n.revisar} discordancias</span>
      ${pend.length ? `<span class="chip aviso">${pend.length} sin decidir</span>` : ''}
    </div>
    <label class="no-imprimir" style="flex-direction:row;align-items:center;gap:6px;margin:6px 0">
      <input type="checkbox" ${soloDiscordancias ? 'checked' : ''} onchange="soloDiscordancias=this.checked;pintar()"> Ver solo lo que falta decidir
    </label>
    ${n.revisar ? (() => { const nm = filas.filter((f) => f.revisar && marcadasDec.has(f.ref)).length; return `<div id="barraBloque" class="fila no-imprimir" style="margin:6px 0;gap:6px;align-items:center;${nm ? '' : 'display:none'}">
      <b><span id="nMarcadas">${nm}</span> marcadas:</b>
      <select id="accionBloque"><option value="">— decisión —</option>${['aceptar', 'reclamar', 'resto', 'anular', 'mantener', 'excluir'].filter((a) => esRepo(p) ? a !== 'resto' && a !== 'anular' : true).map((a) => `<option value="${a}">${nombres[a]}</option>`).join('')}</select>
      <button class="btn primario peque" onclick="decidirEnBloque(document.getElementById('accionBloque').value)">Aplicar</button>
    </div>`; })() : ''}
    ${mostrar.length ? tabla(mostrar) : `<div class="aviso-caja ok">${n.revisar ? '✅ Todas las discordancias están decididas.' : 'Todo cuadra.'}</div>`}
    ${plegadas.length ? `<details class="decididas"><summary>Ya decididas o solo informativas (${plegadas.length}) — abrir para ver o cambiar</summary>${tabla(plegadas)}</details>` : ''}
    <div class="fila no-imprimir" style="margin-top:14px">
      ${p.validado ? `<button class="btn ok" disabled>✅ Pedido validado</button>`
        : `<button class="btn primario" ${pend.length ? 'disabled' : ''} onclick="validarPedido()">Validar pedido</button>`}
      ${p.validado ? '' : pend.length ? `<span class="pequeno">Decide las ${pend.length} discordancias pendientes para poder validar.</span>` : (esRepo(p) ? ``
        : ``)}
    </div>
    ${p.validado ? `<div class="fila no-imprimir" style="margin-top:10px">
      ${esRepo(p) ? `<button class="btn" onclick="window.print()">Imprimir comparación</button>` : `<button class="btn" onclick="imprimirListado('${p.id}')">Imprimir listado del cliente</button>`}
      <button class="btn" onclick="exportarPedidos(['${p.id}'])">📥 Excel de la compra al proveedor (Géminis)</button>
    </div>` : ''}
  </div>`;
}

/** Lo que de verdad importa de un pedido: qué falta y qué sobra. */
function bloqueFaltasSobras(p, filas) {
  const { faltan, sobran } = CP.faltasYSobras(filas);
  const pendientes = CP.faltasPendientes(filas, p.decisiones);
  const pend = new Set(pendientes.map((x) => x.ref));
  const decidido = { reclamar: '✉️ reclamada, esperando respuesta del proveedor', resto: 'sin stock: en restos', anular: 'descartada definitivamente', excluir: 'descartada', aceptar: 'aceptada la propuesta', mantener: 'se mantiene lo pedido', manual: 'a mano' };
  const filaDe = new Map(filas.map((f) => [f.ref, f]));
  const cortos = { aceptar: '✅ Aceptar', excluir: '🗑️ Quitar del pedido', anular: '🗑️ Descartar', resto: 'Sin stock: a restos', mantener: 'Mantener lo pedido' };
  // Una reclamada se puede cerrar desde aquí cuando conteste el proveedor.
  const cambiarReclamada = (x) => {
    const f = filaDe.get(x.ref);
    if (!f || (p.decisiones[x.ref] || {}).accion !== 'reclamar') return '';
    const rotulo = (a) => (a === 'aceptar' && f.cantPropuesta > f.cantPedida && !esRepo(p) ? '➕ Sumar al cliente' : cortos[a]);
    return ' ' + CP.accionesPara(f, p.tipo).filter((a) => cortos[a]).map((a) => `<button class="btn peque no-imprimir" onclick="decide(${js(x.ref)},'accion','${a}')">${rotulo(a)}</button>`).join(' ');
  };
  const linea = (x, signo, falta) => {
    const acc = (p.decisiones[x.ref] || {}).accion;
    const fuera = false;
    return `<li${fuera ? ' class="descartada"' : ''}><b>${h(x.ref)}</b> ${h(x.desc)} — ${x.total ? `${signo}${x.cant} ud.` : falta
      ? `pedidas ${x.de}, vienen ${x.de - x.cant} → <b>faltan ${x.cant}</b>`
      : `pedidas ${x.de - x.cant}, vienen ${x.de} → <b>${x.cant} de más</b>`}${x.sustitucion ? ` <span class="pequeno">¿sustitución ${h(x.sustitucion)}?</span>` : ''}${acc ? ` <span class="pequeno">· ${h(decidido[acc] || acc)}</span>` : ''}${cambiarReclamada(x)}</li>`;
  };
  // Lo ya decidido sale de la lista (queda plegado aparte, por si hay que revisarlo).
  // Una sobra reclamada sigue a la vista (como las faltas reclamadas) hasta que el proveedor conteste.
  const sobraDecidida = (x) => { const a = (p.decisiones[x.ref] || {}).accion; return Boolean(a) && a !== 'reclamar'; };
  const faltanVer = faltan.filter((x) => pend.has(x.ref));
  const faltanYa = faltan.filter((x) => !pend.has(x.ref));
  const sobranVer = sobran.filter((x) => !sobraDecidida(x));
  const sobranYa = sobran.filter(sobraDecidida);
  const lista = (xs, signo, falta) => xs.length ? `<ul style="margin:6px 0 0;padding-left:18px">${xs.map((x) => linea(x, signo, falta)).join('')}</ul>` : '';
  const plegado = (xs, signo, falta) => xs.length ? `<details class="decididas"><summary>${xs.length} ya decidida(s)</summary>${lista(xs, signo, falta)}</details>` : '';
  return `${bloqueExplicaciones(p, faltanVer, sobranVer)}
    <div class="aviso-caja ${pendientes.length ? 'mal' : 'ok'}" style="margin-top:0">
      <b>${pendientes.length ? `❌ Faltan ${pendientes.length} referencia(s)` : faltan.length ? '✅ Ninguna falta pendiente' : '✅ No falta nada'}</b>
      ${lista(faltanVer, '', true)}${plegado(faltanYa, '', true)}
    </div>
    <div class="aviso-caja ${sobranVer.length ? 'aviso' : 'ok'}">
      <b>${sobranVer.length ? `⚠️ Sobran ${sobranVer.length} referencia(s)` : sobran.length ? '✅ Ninguna sobra pendiente' : '✅ No sobra nada'}</b>
      ${lista(sobranVer, '+')}${plegado(sobranYa, '+')}
    </div>`;
}

/** «🧠 Por qué falta y sobra»: lo que una persona vería al mirar juntas las faltas
 *  y las sobras (erratas, expositor por piezas, sustitutos, mercancía de otro
 *  pedido de la campaña), con el botón para aplicarlo. */
function bloqueExplicaciones(p, faltan, sobran) {
  // Aunque ya no quede nada, lo aplicado por la IA se tiene que poder deshacer.
  if (!faltan.length && !sobran.length) return (p.iaDeshacer || []).length && !esComercial() ? `<div class="aviso-caja info no-imprimir" style="margin-top:0">${bloqueIA(p)}</div>` : '';
  const otros = E.pedidos.filter((q) => q.id !== p.id && claveGrupo(q) === claveGrupo(p) && q.propuesta && q.lineas.length).map((q) => {
    const f = comparar(q);
    return { id: q.id, pedido: `${nPed(q.numero)}${esRepo(q) ? '' : ' (' + q.cliente + ')'}`, faltan: CP.faltasPendientes(f, q.decisiones), sobran: CP.faltasYSobras(f).sobran.filter((x) => !(q.decisiones[x.ref] || {}).accion) };
  });
  // Factura por bloques: manda el bloque; nunca se propone pasar mercancía a otro pedido.
  const porBloques = (q) => [q.propuesta, q.factura].some((x) => x && (x.lineas || []).some((l) => l.bloque));
  const ex = CP.explicarDiferencias(faltan, sobran, { otros: porBloques(p) ? [] : otros });
  const icono = { errata: '✏️', sustituto: '🔁', expositor: '🧩', otroPedido: '📦' };
  const boton = (x) => x.tipo === 'errata' || x.tipo === 'sustituto'
    ? `<button class="btn peque" onclick="emparejar(${js(x.sobra.ref)}, ${js(x.falta.ref)})">🔗 Es la misma: emparejar</button>`
    : x.tipo === 'expositor'
      ? `<button class="btn peque" onclick="aplicarExpositor(${js(x.falta.ref)}, ${js(x.sobras.map((s) => s.ref).join('\n'))}, ${x.parcial ? 'true' : 'false'})">🧩 ${x.parcial ? 'Las piezas al cliente y reclamar lo que falta' : 'Dar el expositor por servido en piezas'}</button>`
      : x.tipo === 'otroPedido' && x.sobra
        ? `<button class="btn peque" onclick="pasarAOtroPedido(${js(x.sobra.ref)}, ${js(x.id)})">📦 Pasarla al pedido ${h(x.pedido)}</button>`
        : '';
  if (!ex.length) return `<div class="no-imprimir" style="margin:0 0 8px">${bloqueIA(p)}</div>`;
  return `<div class="aviso-caja info no-imprimir" style="margin-top:0"><b>🧠 Por qué falta y sobra</b>
    ${ex.length ? `<ul style="margin:6px 0 0;padding-left:18px">${ex.map((x) => `<li>${icono[x.tipo] || ''} ${h(x.texto)} ${boton(x)}</li>`).join('')}</ul>` : ''}
    ${bloqueIA(p)}</div>`;
}
// ── «🧠 Revisar con IA» ─────────────────────────────────────────────────────
// La IA solo propone; cada propuesta se aplica con su botón y todo lo aplicado
// queda apuntado en p.iaDeshacer para deshacerlo de golpe.
const iaPropuestas = {};
function datosParaIA(p) {
  const filas = comparar(p);
  const corta = (x) => ({ ref: x.ref, desc: x.desc, cant: x.cant, precio: x.precio });
  const pend = (q, f) => ({ faltan: CP.faltasPendientes(f, q.decisiones).map(corta), sobran: sobrasPendientes(q, f).filter((x) => (q.decisiones[x.ref] || {}).accion !== 'reclamar').map(corta) });
  const otros = E.pedidos.filter((q) => q.id !== p.id && claveGrupo(q) === claveGrupo(p) && q.propuesta && q.lineas.length)
    .map((q) => Object.assign({ id: q.id, pedido: nPed(q.numero) + (esRepo(q) ? '' : ' ' + q.cliente) }, pend(q, comparar(q))))
    .filter((o) => o.faltan.length || o.sobran.length);
  // Si la factura viene por bloques, manda el bloque: no se le enseñan otros pedidos a la IA.
  const bloques = [p.propuesta, p.factura].some((x) => x && (x.lineas || []).some((l) => l.bloque));
  return Object.assign({ proveedor: p.proveedor, tipo: esRepo(p) ? 'reposicion' : 'comercial', otros: bloques ? [] : otros }, pend(p, filas));
}
async function revisarConIA() {
  const p = pedidoActual();
  if (!EN_NETLIFY) { alert('La revisión con IA solo funciona en ofipapel.netlify.app.'); return; }
  const datos = datosParaIA(p);
  if (!datos.faltan.length && !datos.sobran.length) { alert('No queda nada sin explicar.'); return; }
  iaPropuestas[p.id] = { estado: 'cargando' }; pintar();
  try {
    const jobId = nuevoId();
    const cab = { 'content-type': 'application/json', 'x-ocr-token': OCR_TOKEN };
    const r = await fetchReintentando(FN + 'revisar-diferencias-background', { method: 'POST', headers: cab, body: JSON.stringify({ jobId, datos }) }, 2);
    if (r.status !== 202 && !r.ok) throw new Error('La revisión no responde (' + r.status + ')');
    const limite = Date.now() + 5 * 60 * 1000;
    let res = null;
    while (!res && Date.now() < limite) {
      await espera(3000);
      let e;
      try { e = await fetch(FN + 'leer-pedido-manuscrito-estado?jobId=' + encodeURIComponent(jobId), { headers: { 'x-ocr-token': OCR_TOKEN } }); } catch { continue; }
      if (e.status === 202) continue;
      const d = await e.json().catch(() => ({}));
      if (!e.ok || d.status === 'error') throw errorDeLectura(d.error || 'Error en la revisión');
      if (d.status === 'done') res = d.resultado;
    }
    if (!res) throw new Error('La revisión ha tardado demasiado');

function aplicarIA(i, enLote) {

  p.iaDeshacer = (p.iaDeshacer || []).slice();
  const dec = (r) => (p.decisiones[r] ? Object.assign({}, p.decisiones[r]) : null);
  if (x.tipo === 'emparejar') {
    const c = E.catalogos[prov(p.proveedor)] || {};
    p.iaDeshacer.push({ tipo: 'emparejar', delProveedor: x.delProveedor, nuestra: x.nuestra, dec: dec(x.nuestra), cat: (c.equivalencias || {})[x.delProveedor] || null, pEq: (p.equivalencias || {})[x.delProveedor] || null });

/** Deshace, del último al primero, todo lo que aplicó la IA en este pedido. */
function deshacerIA() {
  const p = pedidoActual();
  const log = (p.iaDeshacer || []).slice().reverse();
  if (!log.length || !confirm(`¿Deshacer las ${log.length} cosas que aplicó la IA en este pedido? Tus decisiones a mano no se tocan.`)) return;
  const c = E.catalogos[prov(p.proveedor)] = E.catalogos[prov(p.proveedor)] || { fecha: hoy(), items: {} };
  const ponDec = (r, d) => { if (d) p.decisiones[r] = d; else delete p.decisiones[r]; };
  for (const e of log) {
    if (e.tipo === 'emparejar') {
      p.equivalencias = Object.assign({}, p.equivalencias); c.equivalencias = Object.assign({}, c.equivalencias);
      if (e.pEq) p.equivalencias[e.delProveedor] = e.pEq; else delete p.equivalencias[e.delProveedor];
      if (e.cat) c.equivalencias[e.delProveedor] = e.cat; else delete c.equivalencias[e.delProveedor];
      ponDec(e.nuestra, e.dec);
    } else if (e.tipo === 'decisiones') {
      for (const [r, d] of Object.entries(e.antes)) ponDec(r, d);
    } else if (e.tipo === 'mover') {
      const q = pedidoPorId(e.destinoId);
      for (const [campo, ls] of Object.entries(e.movidas || {})) {
        if (q && q[campo]) {
          const quitar = ls.map((l) => JSON.stringify(l));
          q[campo].lineas = q[campo].lineas.filter((l) => { const i = quitar.indexOf(JSON.stringify(l)); if (i < 0) return true; quitar.splice(i, 1); return false; });

        p[campo].lineas = p[campo].lineas.concat(ls);

      ponDec(e.ref, e.dec);

/** Lo que llegó al pedido equivocado: sus líneas de propuesta y factura pasan al otro. */
function pasarAOtroPedido(ref, destinoId, silencioso) {
  const p = pedidoActual(); const q = pedidoPorId(destinoId);
  if (!p || !q) return null;
  const k = CP.claveRef(ref);
  let n = 0;
  const movidas = {};
  for (const campo of ['propuesta', 'factura']) {
    const x = p[campo]; if (!x) continue;
    const van = x.lineas.filter((l) => CP.claveRef(l.ref) === k);
    if (!van.length) continue;
    x.lineas = x.lineas.filter((l) => !van.includes(l));
    q[campo] = q[campo] || { fecha: hoy(), archivo: x.archivo, cabecera: Object.assign({}, x.cabecera), lineas: [] };
    q[campo].lineas = q[campo].lineas.concat(van);
    movidas[campo] = JSON.parse(JSON.stringify(van));
    n += van.length;
  }
  if (!n) return null;
  delete p.decisiones[ref];
  invalidar(p); invalidar(q); guardar(); pintar();
  if (silencioso) return movidas;
