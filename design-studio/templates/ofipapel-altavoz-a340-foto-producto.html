<!doctype html>

<title>Ofipapel — Altavoz A340 · foto producto</title>
<style>
@font-face { font-family:'Outfit'; src:url('../fonts/Outfit-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:'Outfit'; src:url('../fonts/Outfit-Bold.ttf') format('truetype'); font-weight:700; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1620px; overflow:hidden; font-family:'Outfit',sans-serif; }
body { position:relative; background:#fcfdfb; }

.wave { position:absolute; top:0; left:0; width:1080px; height:1620px; }

.product { position:absolute; left:10px; top:150px; width:660px; }
.product img { width:100%; display:block; mix-blend-mode:multiply; }

.title { position:absolute; left:540px; top:222px; right:64px; }
.title .l1 { font-family:'Outfit'; font-weight:700; font-size:56px; letter-spacing:-0.015em; color:#14201a; line-height:1.05; white-space:nowrap; }
.title .l2 { font-family:'Outfit'; font-weight:700; font-size:56px; letter-spacing:-0.015em; color:#1A5C1A; line-height:1.05; white-space:nowrap; }

.price-badge { position:absolute; left:540px; top:400px; right:64px; background:#1A5C1A; border-radius:22px; padding:26px 0 32px 40px; box-shadow:0 14px 30px rgba(20,60,20,0.28); }
.price-badge .num { font-family:'Outfit'; font-weight:700; font-size:96px; color:#fff; letter-spacing:-0.01em; }
.price-badge .cents { font-size:56px; }

.specs { position:absolute; left:540px; top:610px; right:64px; }
.spec-row { display:flex; align-items:center; gap:26px; padding:32px 0; border-bottom:1.5px solid #dbe6da; }
.spec-row:last-child { border-bottom:none; }
.spec-icon { width:70px; height:70px; border-radius:50%; border:2.5px solid #1A5C1A; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.spec-icon svg { width:32px; height:32px; }
.spec-text .label { font-family:'Outfit'; font-weight:400; font-size:22px; color:#6b7a6b; }
.spec-text .value { font-family:'Outfit'; font-weight:700; font-size:29px; color:#14201a; margin-top:2px; }

.logo { position:absolute; left:540px; top:1210px; width:230px; }

.footer { position:absolute; bottom:0; left:0; width:1080px; height:96px; background:#123f14; display:flex; align-items:center; justify-content:space-between; padding:0 56px; }
.footer-item { display:flex; align-items:center; gap:16px; flex:1; }
.footer-item svg { width:34px; height:34px; flex-shrink:0; }
.footer-item span { font-family:'Outfit'; font-weight:700; font-size:20px; color:#fff; line-height:1.15; }
.footer-divider { width:1.5px; height:48px; background:rgba(255,255,255,0.3); margin:0 20px; }
</style>

  <svg class="wave" viewBox="0 0 1080 1620" preserveAspectRatio="none">
