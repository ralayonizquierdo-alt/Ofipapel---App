name: Deploy to GitHub Pages
# GitHub Pages sirve producción (el propietario entra a sus apps por
# ralayonizquierdo-alt.github.io), así que esto NO es un respaldo prescindible.
# Pero ejecuta el mismo `build.sh` que Netlify, y `build.sh` no copia a `_site/`
# ni `.claude/**`, ni `docs/**`, ni los `.md`: reconstruir por ellos publica un
# resultado idéntico byte a byte. Se saltan, igual que en `netlify-ignore.sh`.
#
# `workflow_dispatch` se conserva a propósito: si alguna vez hace falta
# republicar sin tocar código, se lanza a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths-ignore: ['.claude/**', 'docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            alquileres/package-lock.json
            joe-app/package-lock.json

      # Mismo script que usa Netlify — una sola lista de ficheros que
      # mantener, en vez de duplicarla también aquí.
      - run: bash build.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
