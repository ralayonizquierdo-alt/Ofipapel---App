name: Revisión de secretos

# Avisa si alguien sube por error una clave secreta (Anthropic, OpenAI, WhatsApp/Meta, GitHub, AWS, claves
# privadas…). El repositorio es público: lo que entra en git lo puede leer cualquiera, y borrarlo después no
# basta (queda en el historial). Si salta, hay que CAMBIAR la clave en su servicio, no solo quitarla del código.
#
# Herramienta: gitleaks (gratuita), desde su imagen oficial, sin licencia ni cuentas. Reglas: las suyas por
# defecto más `.gitleaks.toml` (qué ficheros se saltan: imágenes, documentos, generados).
#
# Qué revisa: SOLO los commits nuevos de cada subida o PR. El historial antiguo se revisó entero el 21/11/2026
# y estaba limpio; volver a revisarlo en cada subida solo daría alarmas viejas (claves públicas de Supabase y
# Firebase, que van a la vista por diseño). Si una línea con una clave pública cambia y salta la alarma, se
# marca en esa línea con un comentario `gitleaks:allow`.
#
# Cómo avisa: el trabajo sale en rojo y GitHub manda un correo al dueño del repositorio. El detalle (fichero,
# línea y tipo de clave, sin enseñarla) está en el resumen de la ejecución.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      todo:
        description: 'Revisar TODO el historial (no solo lo nuevo)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qué commits revisar
        id: rango
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
          TODO: ${{ inputs.todo }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$TODO" = "true" ]; then
            echo "opts=--all" >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" = "pull_request" ]; then
            echo "opts=$BASE..$CABEZA" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES" 2>/dev/null; then
            echo "opts=$ANTES..$DESPUES" >> "$GITHUB_OUTPUT"
          else
            # Rama nueva: lo que trae respecto a main (o, si no hay main, solo el último commit).
            if git rev-parse -q --verify origin/main >/dev/null; then
              echo "opts=origin/main..$DESPUES" >> "$GITHUB_OUTPUT"
            else
              echo "opts=-1 $DESPUES" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Buscar secretos
        env:
          OPTS: ${{ steps.rango.outputs.opts }}
        run: |
          echo "Revisando: $OPTS"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --log-opts="$OPTS" --redact --no-banner \
            --report-format json --report-path /repo/gitleaks.json --exit-code 1 && r=0 || r=$?
          if [ "$r" != "0" ]; then
            {
              echo "## ⚠️ Posible clave secreta subida al repositorio"
              echo ""
              echo "Cámbiala en su servicio (no basta con borrarla del código: queda en el historial)."
              echo ""
              echo "| Tipo | Fichero | Línea | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) |"' gitleaks.json 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ Sin secretos en lo revisado" >> "$GITHUB_STEP_SUMMARY"
