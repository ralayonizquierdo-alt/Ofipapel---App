<title>Ofipapel 360°</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  color:#EAF5EA;
  min-height:100svh;
  overflow-x:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3vh 12px;
}

/* ─── Fondo: malla de nodos/partículas generada por canvas, coloreada según
   la cercanía real a cada satélite (ver script) — estático, sin bucle de
   animación continuo por batería. ─── */
#bg-stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.orbit-shell{
  position:relative;z-index:1;
  width:min(92vmin,760px);aspect-ratio:1/1;
  opacity:0;animation:fadeUp .8s ease forwards;
}
.connector-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.connector-svg path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  opacity:.75;transition:opacity .25s, stroke-width .25s;
}
.connector-svg path.cbolt{stroke-width:.55;filter:url(#boltGlow);}
.connector-svg path.cbranch{stroke-width:.35;opacity:.55;filter:url(#boltGlow);}
.connector-svg .active .cbolt{opacity:1;stroke-width:.9;}
.connector-svg .active .cbranch{opacity:.85;}
.connector-svg .cnode{opacity:.9;}

.orbit{position:relative;width:100%;height:100%;}

/* ─── Centro: nodo completo recortado tal cual de la referencia (aro +
   trébol + "OFIPAPEL 360°"), sin recrear nada por CSS ─── */
.hub-center{
  position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:clamp(112px,23vmin,172px);height:clamp(112px,23vmin,172px);
  opacity:0;animation:popIn .85s cubic-bezier(.34,1.56,.64,1) .1s forwards, pulseGreen 3.6s ease-in-out 2s infinite;
  z-index:3;
}
.hub-center img{width:100%;height:100%;object-fit:contain;}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes pulseGreen{
  0%,100%{filter:drop-shadow(0 0 14px rgba(46,204,64,.55));}
  50%{filter:drop-shadow(0 0 26px rgba(120,255,140,.8));}
}

/* ─── Satélites (8, a 45°): cada uno es el nodo completo recortado de la
   referencia (aro de neón + icono + etiqueta ya incluidos en la imagen) ─── */
.satellite{
  position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);
  transform:translate(-50%,-50%);
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;
  width:clamp(84px,18vmin,124px);
  z-index:2;
}
.sat-inner{
  opacity:0;transform:scale(.35) translateY(-8px);
  animation:satIn .8s cubic-bezier(.34,1.56,.64,1) forwards;
  display:flex;flex-direction:column;align-items:center;width:100%;
  animation-delay:inherit;
}
@keyframes satIn{to{opacity:1;transform:scale(1) translateY(0);}}
.satellite:nth-child(2) .sat-inner{animation-delay:.45s;}
.satellite:nth-child(3) .sat-inner{animation-delay:.62s;}
.satellite:nth-child(4) .sat-inner{animation-delay:.79s;}
.satellite:nth-child(5) .sat-inner{animation-delay:.96s;}
.satellite:nth-child(6) .sat-inner{animation-delay:1.13s;}
.satellite:nth-child(7) .sat-inner{animation-delay:1.30s;}
.satellite:nth-child(8) .sat-inner{animation-delay:1.47s;}
.satellite:nth-child(9) .sat-inner{animation-delay:1.64s;}

.sat-node{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 10px var(--c-glow));
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
  animation:float 5s ease-in-out infinite;
  animation-delay:inherit;
}
.satellite:nth-child(2) .sat-node{animation-delay:.05s;} .satellite:nth-child(3) .sat-node{animation-delay:.35s;}
.satellite:nth-child(4) .sat-node{animation-delay:.65s;} .satellite:nth-child(5) .sat-node{animation-delay:.95s;}
.satellite:nth-child(6) .sat-node{animation-delay:1.25s;} .satellite:nth-child(7) .sat-node{animation-delay:1.55s;}
.satellite:nth-child(8) .sat-node{animation-delay:1.85s;} .satellite:nth-child(9) .sat-node{animation-delay:2.15s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.satellite:hover .sat-node, .satellite:focus-visible .sat-node{
  transform:translateY(-5px) scale(1.08);
  filter:drop-shadow(0 0 20px var(--c-glow));
}
.satellite:focus-visible{outline:none;}

@media (max-width:480px){
  .orbit-shell{width:96vmin;}
  .hub-center{width:clamp(84px,28vw,120px);height:clamp(84px,28vw,120px);}
  .satellite{width:clamp(66px,20vw,96px);}
}
@media (orientation:landscape) and (max-height:700px){
  body{padding:1.4svh 2vw;}
  .orbit-shell{width:min(92svh,92vw);}
}
</style>

<script>
(function(){
  var sats = document.querySelectorAll('.satellite');
  var svg = document.querySelector('.connector-svg');
  var group = document.getElementById('connectors');
  var NS = 'http://www.w3.org/2000/svg';

  // ── Fondo "red neuronal": malla densa de nodos + líneas finas entre
  // vecinos, coloreada según cercanía a cada satélite (o al verde del
  // centro) — imita el polvo/nervios de la referencia. Canvas estático
  // (se dibuja una vez, sin bucle continuo, para no gastar batería). ──
  (function mesh(){
    var cv = document.getElementById('bg-stars');
    var ctx = cv.getContext('2d');

    function hexToRgb(hex){
      hex = hex.trim();
      var m = hex.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return [255,255,255];
      var h = m[1];
      if (h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
      var num = parseInt(h, 16);
      return [(num>>16)&255, (num>>8)&255, num&255];
    }

    function draw(){
      var w = window.innerWidth, h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // zonas de color: cada satélite + el verde del centro, en coordenadas
      // reales de viewport (a partir del rect de .orbit-shell)
      var shellRect = document.querySelector('.orbit-shell').getBoundingClientRect();
      var zones = [{ x: shellRect.left + shellRect.width*0.5, y: shellRect.top + shellRect.height*0.5, rgb: [46,204,64] }];
      sats.forEach(function(sat){
        var cs = sat.style;
        var x = parseFloat(cs.getPropertyValue('--x'));
        var y = parseFloat(cs.getPropertyValue('--y'));
        var ring = cs.getPropertyValue('--c-ring').trim();
        zones.push({
          x: shellRect.left + (x/100)*shellRect.width,
          y: shellRect.top + (y/100)*shellRect.height,
          rgb: hexToRgb(ring)
        });
      });
      var ZONE_RADIUS = Math.max(shellRect.width, shellRect.height) * 0.5;

      function colorFor(x, y){
        var best = null, bestD = Infinity;
        for (var i=0;i<zones.length;i++){
          var dz = zones[i];
          var d = Math.hypot(x-dz.x, y-dz.y);
          if (d < bestD){ bestD = d; best = dz; }
        }
        var t = Math.max(0, 1 - bestD/ZONE_RADIUS); // 1 = justo en el nodo, 0 = lejos
        var neutral = [190,200,210];
        var rgb = best.rgb.map(function(c,i){ return Math.round(neutral[i] + (c-neutral[i])*t); });
        return { rgb: rgb, t: t };
      }

      // nube densa de puntos
      var n = Math.round((w * h) / 2200);
      var pts = [];
      for (var i = 0; i < n; i++){
        var x = Math.random() * w, y = Math.random() * h;
        pts.push({ x:x, y:y, c: colorFor(x,y) });
      }

      // líneas finas entre puntos cercanos (efecto malla/constelación)
      var MAXD = Math.min(90, Math.max(60, Math.min(w,h)*0.09));
      var cell = MAXD, grid = {};
      pts.forEach(function(p, i){
        var gx = Math.floor(p.x/cell), gy = Math.floor(p.y/cell);
        var key = gx+','+gy;
        (grid[key] = grid[key] || []).push(i);
      });
      pts.forEach(function(p, i){
        var gx = Math.floor(p.x/cell), gy = Math.floor(p.y/cell);
        for (var dx=-1; dx<=1; dx++){
          for (var dy=-1; dy<=1; dy++){
            var neighbors = grid[(gx+dx)+','+(gy+dy)];
            if (!neighbors) continue;
            neighbors.forEach(function(j){
              if (j <= i) return;
              var q = pts[j];
              var d = Math.hypot(p.x-q.x, p.y-q.y);
              if (d < MAXD){
                var op = (1 - d/MAXD) * (0.10 + 0.22*Math.max(p.c.t, q.c.t));
                var r = (p.c.rgb[0]+q.c.rgb[0])/2, g = (p.c.rgb[1]+q.c.rgb[1])/2, b = (p.c.rgb[2]+q.c.rgb[2])/2;
                ctx.strokeStyle = 'rgba('+r+','+g+','+b+','+op.toFixed(3)+')';
                ctx.lineWidth = 0.6;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
                ctx.stroke();
              }
            });
          }
        }
      });

      // puntos (algunos más grandes/brillantes cerca de cada zona)
      pts.forEach(function(p){
        var r = Math.random() * 1.1 + .25 + p.c.t*1.4;
        var alpha = Math.min(1, (Math.random() * .5 + .18) + p.c.t*.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba('+p.c.rgb[0]+','+p.c.rgb[1]+','+p.c.rgb[2]+','+alpha.toFixed(3)+')';
        ctx.fill();
      });
    }
    draw();
    var t;
    window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(draw, 200); });
  })();

  // ── Conectores tipo "rayo/red neuronal": línea principal quebrada del
  // centro (50,50) a cada satélite + un par de ramificaciones cortas +
  // pequeños nodos brillantes, generados a partir de --x/--y/--c-ring/
  // --c-glow ya declarados en cada satélite (única fuente de verdad). ──
  var conns = [];
  sats.forEach(function(sat, i){
    var cs = sat.style;
    var x = parseFloat(cs.getPropertyValue('--x'));
    var y = parseFloat(cs.getPropertyValue('--y'));
    var ring = cs.getPropertyValue('--c-ring').trim();
    var glow = cs.getPropertyValue('--c-glow').trim();

    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'conn');

    // línea principal quebrada (varios segmentos con jitter perpendicular,
    // que se anula en los dos extremos para anclar limpio en centro/satélite)
    var segs = 5;
    var dx = x - 50, dy = y - 50;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len; // perpendicular unitario
    var pts = [[50, 50]];
    for (var s = 1; s < segs; s++){
      var t = s / segs;
      var taper = Math.sin(Math.PI * t); // 0 en los extremos, máximo al centro
      var jitter = (Math.random() - .5) * 6 * taper;
      pts.push([50 + dx * t + nx * jitter, 50 + dy * t + ny * jitter]);
    }
    pts.push([x, y]);
    var d = 'M' + pts.map(function(p){ return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' L');

    var main = document.createElementNS(NS, 'path');
    main.setAttribute('class', 'cbolt');
    main.setAttribute('d', d);
    main.setAttribute('stroke', ring);
    g.appendChild(main);

    // 2 ramificaciones cortas desde puntos interiores del trazo
    [2, 3].forEach(function(idx, bi){
      if (idx >= pts.length - 1) return;
      var p = pts[idx];
      var ang = Math.random() * Math.PI * 2;
      var blen = 5 + Math.random() * 5;
      var bx = p[0] + Math.cos(ang) * blen;
      var by = p[1] + Math.sin(ang) * blen;
      var midx = p[0] + Math.cos(ang) * blen * .5 + (Math.random() - .5) * 3;
      var midy = p[1] + Math.sin(ang) * blen * .5 + (Math.random() - .5) * 3;
      var branch = document.createElementNS(NS, 'path');
      branch.setAttribute('class', 'cbranch');
      branch.setAttribute('d', 'M' + p[0].toFixed(2) + ',' + p[1].toFixed(2) + ' L' + midx.toFixed(2) + ',' + midy.toFixed(2) + ' L' + bx.toFixed(2) + ',' + by.toFixed(2));
      branch.setAttribute('stroke', ring);
      g.appendChild(branch);
      var node = document.createElementNS(NS, 'circle');
      node.setAttribute('class', 'cnode');
      node.setAttribute('cx', bx); node.setAttribute('cy', by); node.setAttribute('r', .6);
      node.setAttribute('fill', ring);
      g.appendChild(node);
    });

    // nodo brillante a mitad de camino del trazo principal
    var mid = pts[Math.floor(pts.length / 2)];
    var midNode = document.createElementNS(NS, 'circle');
    midNode.setAttribute('class', 'cnode');
    midNode.setAttribute('cx', mid[0]); midNode.setAttribute('cy', mid[1]); midNode.setAttribute('r', .7);
    midNode.setAttribute('fill', ring);
    g.appendChild(midNode);

    group.appendChild(g);
    conns.push({ g: g, main: main });

    var pid = 'connpath' + i;
    main.setAttribute('id', pid);
    var dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', .9);
    dot.setAttribute('fill', '#fff');
    dot.setAttribute('opacity', '.9');
    var anim = document.createElementNS(NS, 'animateMotion');
    anim.setAttribute('dur', (2.4 + Math.random() * .8).toFixed(2) + 's');
    anim.setAttribute('begin', (i * .3).toFixed(2) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    var mpath = document.createElementNS(NS, 'mpath');
    mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + pid);
    mpath.setAttribute('href', '#' + pid);
    anim.appendChild(mpath);
    dot.appendChild(anim);
    dot.setAttribute('filter', 'url(#boltGlow)');
    g.appendChild(dot);
  });

  // Dibuja cada trazo (longitud real vía getTotalLength) con retardo
  // escalonado por satélite — la "animación de conexión de nodos".
  conns.forEach(function(c, i){
    [c.main].concat(Array.prototype.slice.call(c.g.querySelectorAll('.cbranch'))).forEach(function(path, bi){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      var delay = 0.25 + i * 0.16 + (bi > 0 ? 0.55 : 0);
      requestAnimationFrame(function(){
        path.style.transition = 'stroke-dashoffset ' + (bi > 0 ? '.6s' : '1.1s') + ' cubic-bezier(.4,0,.2,1) ' + delay + 's';
        path.style.strokeDashoffset = '0';
      });
    });
  });

  // Resalta el conector cuando se pasa el ratón/foco por su satélite
  sats.forEach(function(sat, i){
    var c = conns[i];
    if (!c) return;
    var on = function(){ c.g.classList.add('active'); };
    var off = function(){ c.g.classList.remove('active'); };
    sat.addEventListener('mouseenter', on);
    sat.addEventListener('mouseleave', off);
    sat.addEventListener('focus', on);
    sat.addEventListener('blur', off);
  });

  // Único sonido: el golpe metálico real (mp3 del propietario), nada más
  // abrir la app, con un fundido de entrada de .45s (el golpe seco del
  // principio del audio original sonaba demasiado fuerte) — el fundido se
  // hace en código con un nodo de ganancia de Web Audio, sin tocar el
  // fichero. Acompaña visualmente a la animación de conexión de arriba. El
  // navegador puede bloquear la reproducción automática sin gesto previo
  // del usuario — si play() falla, queda pendiente y se reintenta en el
  // primer clic/toque/tecla.
  var openAudio = new Audio('sound-connect.mp3');
  openAudio.preload = 'auto';
  var openAudioPending = false;
  var fadeCtx = null, fadeGain = null;
  var FADE_IN = .45;
  function setupFade(){
    if (fadeGain) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      fadeCtx = new Ctx();
      var source = fadeCtx.createMediaElementSource(openAudio);
      fadeGain = fadeCtx.createGain();
      source.connect(fadeGain).connect(fadeCtx.destination);
    } catch (e) {}
  }
  function playOpenSound(){
    setupFade();
    if (fadeCtx && fadeCtx.state !== 'running') fadeCtx.resume().catch(function(){});
    if (fadeGain && fadeCtx) {
      var now = fadeCtx.currentTime;
      fadeGain.gain.cancelScheduledValues(now);
      fadeGain.gain.setValueAtTime(0, now);
      fadeGain.gain.linearRampToValueAtTime(1, now + FADE_IN);
    }
    openAudio.currentTime = 0;
    var p = openAudio.play();
    if (p && p.catch) {
      p.then(function(){ openAudioPending = false; })
       .catch(function(){ openAudioPending = true; });
    }
  }
  playOpenSound();
  ['pointerdown', 'keydown'].forEach(function(evt){
    document.addEventListener(evt, function(){
      if (fadeCtx && fadeCtx.state !== 'running') fadeCtx.resume().catch(function(){});
      if (openAudioPending) {
        playOpenSound();
      }
    }, { passive: true });
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
