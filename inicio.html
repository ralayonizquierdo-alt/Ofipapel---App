<title>Ofipapel 360°</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  color:#EAF5EA;
  min-height:100svh;
  overflow-x:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ─── Escenario del vídeo de apertura. El tamaño real (ancho/alto en px)
   lo fija el script, no esta regla: calcula el rectángulo más grande que
   cabe en pantalla sin deformar demasiado el 16:9 del vídeo (ver
   layoutStage() más abajo) — con esto basta como arranque antes de que
   corra el script y como red por si algo falla. El vídeo usa
   object-fit:cover (recorta un poco si la pantalla no es 16:9, a propósito:
   mejor perder un margen que dejar marco negro alrededor) y la capa SVG
   recalcula su viewBox para recortar exactamente lo mismo que el vídeo,
   así que vídeo y zonas quedan siempre alineados. ─── */
.hub-stage{
  position:relative;z-index:1;
  width:min(1400px, 94vw);
  aspect-ratio:16/9;
  border-radius:16px;
  overflow:hidden;
  opacity:0;animation:fadeUp .8s ease forwards;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  background:#000;
}
.hub-video{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;object-fit:cover;object-position:center;
}
.hub-freeze{opacity:0;pointer-events:none;transition:opacity .25s ease;}
.hub-stage.ready .hub-freeze{opacity:1;}

/* ─── Zonas clicables: capa SVG transparente sobre el vídeo. El viewBox se
   recalcula en JS para recortar exactamente lo mismo que object-fit:cover
   recorta del vídeo (mismas coordenadas de origen, 1920×1080), así que
   quedan siempre alineadas sea cual sea la forma real de pantalla.
   Inactiva (pointer-events:none) mientras dura el vídeo; se activa sola
   al terminar (ver script). ─── */
.dept-overlay{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;
}
.hub-stage.ready .dept-overlay{pointer-events:auto;}

.dept{cursor:pointer;outline:none;}

/* Borde fino y nítido, del color del departamento — una vez listo
   (.ready), se queda encendido de forma permanente como seña de "esto se
   puede pulsar", no solo al pasar el ratón. */
.dept-hit{
  fill:transparent;
  stroke:var(--c);
  stroke-width:0;
  stroke-opacity:.9;
  transition:stroke-width .3s ease;
}
.hub-stage.ready .dept-hit{stroke-width:2.5;}
.dept:hover .dept-hit,
.dept:focus-visible .dept-hit,
.dept:active .dept-hit{stroke-width:4.5;}

/* Halo desenfocado detrás del borde, para que no sea una simple línea sino
   que se note "brillante" — también permanente una vez listo. */
.dept-glow{
  fill:var(--c);
  stroke:var(--c);
  stroke-width:6;
  fill-opacity:0;
  stroke-opacity:0;
  filter:url(#deptGlow);
  transition:fill-opacity .3s ease, stroke-opacity .3s ease;
  pointer-events:none;
}
.hub-stage.ready .dept-glow{fill-opacity:.08;stroke-opacity:.5;}
.dept:hover .dept-glow,
.dept:focus-visible .dept-glow,
.dept:active .dept-glow{
  fill-opacity:.22;stroke-opacity:.9;
  transition-duration:.2s;
}

/* ─── Pulso único al terminar el vídeo: sube de golpe por encima del nivel
   permanente de arriba y baja hasta quedarse justo en ese nivel (no en
   cero) — así el "encendido" queda fijo después del aviso inicial. ─── */
@keyframes deptGlowPulse{
  0%{fill-opacity:0;stroke-opacity:0;}
  35%{fill-opacity:.4;stroke-opacity:1;}
  100%{fill-opacity:.08;stroke-opacity:.5;}
}
@keyframes deptEdgePulse{
  0%{stroke-width:0;}
  35%{stroke-width:5;}
  100%{stroke-width:2.5;}
}
.hub-stage.pulse-once .dept-glow{animation:deptGlowPulse 1.1s ease-out 1 forwards;}
.hub-stage.pulse-once .dept-hit{animation:deptEdgePulse 1.1s ease-out 1 forwards;}

/* ─── Logo central "OFIPAPEL 360°": solo un efecto de sonido al tocarlo,
   no un departamento — por eso no lleva el borde fijo que dejan las 8
   zonas tras el pulso, solo reacciona (igual de suave) al pasar el
   ratón/tocar, para no insinuar que "va a algún sitio". ─── */
.logo-tap{cursor:pointer;outline:none;}
.logo-hit{
  fill:transparent;stroke:var(--c);stroke-width:0;stroke-opacity:.9;
  transition:stroke-width .2s ease;
}
.logo-glow{
  fill:var(--c);stroke:var(--c);stroke-width:6;
  fill-opacity:0;stroke-opacity:0;
  filter:url(#deptGlow);
  transition:fill-opacity .2s ease, stroke-opacity .2s ease;
  pointer-events:none;
}
.logo-tap:hover .logo-hit,
.logo-tap:focus-visible .logo-hit,
.logo-tap:active .logo-hit{stroke-width:4;}
.logo-tap:hover .logo-glow,
.logo-tap:focus-visible .logo-glow,
.logo-tap:active .logo-glow{fill-opacity:.2;stroke-opacity:.85;}

/* ─── Botón de sonido: solo aparece cuando el autoplay con audio se ha
   bloqueado (ver script) — en el resto de casos el vídeo ya suena solo y
   no hace falta. ─── */
.sound-toggle{
  position:absolute;right:14px;bottom:14px;z-index:5;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;
  border:1.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(3px);
  transition:background .2s ease, transform .2s ease;
  animation:soundBtnIn .3s ease;
}
.sound-toggle:hover{background:rgba(0,0,0,.75);transform:scale(1.08);}
@keyframes soundBtnIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
</style>
</head>

<script>
(function(){
  var video = document.getElementById('hubVideo');
  var stage = document.querySelector('.hub-stage');
  var overlay = document.getElementById('deptOverlay');
  var depts = document.querySelectorAll('.dept');

  // ── Sonido al pulsar cada zona (puerta deslizante, como entrar en el
  // departamento): se retrasa un poco la navegación real para que le dé
  // tiempo a oírse (si no, el navegador descarga la página siguiente y

  // usuario claramente NO quiere una navegación normal en la misma
  // pestaña (clic central/derecho, Ctrl/Cmd/Shift+clic) — ahí no se toca
  // nada y el navegador hace lo suyo tal cual. Las zonas no son clicables
  // hasta que el vídeo termina (pointer-events:none en .dept-overlay), así
  // que este sonido nunca puede sonar encima de la música de apertura.
  var clickAudio = new Audio('sound-click-door.mp3');
  clickAudio.preload = 'auto';
  var CLICK_DELAY = 180;
  depts.forEach(function(dept){
    dept.addEventListener('click', function(evt){
      if (evt.defaultPrevented || evt.button !== 0 || evt.metaKey || evt.ctrlKey || evt.shiftKey || evt.altKey) return;
      evt.preventDefault();
      try { clickAudio.currentTime = 0; clickAudio.play().catch(function(){}); } catch(e){}
      setTimeout(function(){ window.location.href = dept.getAttribute('href'); }, CLICK_DELAY);
    });
  });

  // ── Logo central "OFIPAPEL 360°": no navega a ningún sitio, solo suena
  // (sin el retraso de las zonas de arriba, que es para dar tiempo antes
  // de cambiar de página — aquí no hay cambio de página). ──
  var logoTap = document.querySelector('.logo-tap');
  var logoAudio = new Audio('sound-logo-reveal.mp3');
  logoAudio.preload = 'auto';
  if (logoTap) {
    logoTap.addEventListener('click', function(evt){
      evt.preventDefault();
      try { logoAudio.currentTime = 0; logoAudio.play().catch(function(){}); } catch(e){}
    });
  }

  // ── Tamaño del escenario + recorte del vídeo. SRC_W/SRC_H son la
  // resolución real del vídeo (1920×1080, 16:9). El vídeo usa
  // object-fit:cover para llenar la pantalla aunque no sea 16:9 (mejor
  // recortar un poco que dejar marco negro alrededor); MIN/MAX_ASPECT
  // evitan que ese recorte se dispare en pantallas muy distintas de 16:9
  // (un móvil en vertical perdería casi todo el ancho si se dejara sin
  // tope). El viewBox del SVG se recalcula para recortar EXACTAMENTE lo
  // mismo que el vídeo (mismo centro, mismas proporciones), así que las 8
  // zonas quedan siempre alineadas con lo que se ve de verdad.
  var SRC_W = 1920, SRC_H = 1080, SRC_ASPECT = SRC_W / SRC_H;
  var MIN_ASPECT = 1.25, MAX_ASPECT = 2.3;
  function layoutStage(){
    var margin = 20; // dos veces el padding del body (10px arriba+abajo/izq+der)
    var availW = (window.visualViewport ? window.visualViewport.width : window.innerWidth) - margin;
    var availH = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - margin;
    if (availW <= 0 || availH <= 0) return;

    var w = availW, h = availH, aspect = w / h;
    if (aspect > MAX_ASPECT) { w = h * MAX_ASPECT; }
    else if (aspect < MIN_ASPECT) { h = w / MIN_ASPECT; }

    stage.style.width = w + 'px';
    stage.style.height = h + 'px';

    var boxAspect = w / h, vbX, vbY, vbW, vbH;
    if (boxAspect > SRC_ASPECT) {
      // la caja es relativamente más ancha que el vídeo: cover recorta arriba/abajo
      vbW = SRC_W;
      vbH = SRC_W / boxAspect;
      vbX = 0;
      vbY = (SRC_H - vbH) / 2;
    } else {
      // la caja es relativamente más alta/estrecha: cover recorta los lados
      vbH = SRC_H;
      vbW = SRC_H * boxAspect;
      vbY = 0;
      vbX = (SRC_W - vbW) / 2;
    }
    overlay.setAttribute('viewBox', vbX.toFixed(1) + ' ' + vbY.toFixed(1) + ' ' + vbW.toFixed(1) + ' ' + vbH.toFixed(1));
  }
  layoutStage();
  var layoutTimer;
  window.addEventListener('resize', function(){ clearTimeout(layoutTimer); layoutTimer = setTimeout(layoutStage, 120); });
  window.addEventListener('orientationchange', function(){ setTimeout(layoutStage, 200); });

  // ── Despierta en segundo plano las apps externas que "duermen" tras un
  // rato sin uso (Almacén en Vercel, Atención al Cliente/WhatsApp BOT en
  // una función de Netlify) — para cuando el usuario pulse la zona, el
  // servidor ya no esté frío. 'no-cors' porque no nos hace falta leer la
  // respuesta, solo que la petición llegue; los fallos se ignoran.
  ['https://rax-os.vercel.app/login?next=%2F',
   'https://spontaneous-lebkuchen-60fa41.netlify.app/.netlify/functions/conversations'
  ].forEach(function(url){
    try { fetch(url, { mode: 'no-cors', credentials: 'omit' }).catch(function(){}); } catch(e){}
  });

  // ── Fin del vídeo: deja el último fotograma fijo (el propio <video>
  // pausado ya no consume recursos), lanza el pulso único sobre las 8
  // zonas y las activa como clicables. Si seguía muteado (nadie tocó nada
  // a tiempo), el botón de sonido se queda para poder repetirlo con
  // audio bajo demanda (ver más abajo). ──
  function onEnded(){
    stage.classList.add('ready');
    stage.classList.add('pulse-once');
    setTimeout(function(){ stage.classList.remove('pulse-once'); }, 1200);
  }
  video.addEventListener('ended', onEnded, { once: true });

  // ── Botón de sonido: casi ningún navegador deja reproducir con audio
  // sin que haya habido antes un gesto del usuario en la página (ver
  // abajo), y mirar un vídeo no cuenta como gesto — así que esperar a que
  // el usuario toque algo "por su cuenta" antes de que termine el vídeo
  // (8s) no es fiable. Se muestra un botón explícito en vez de confiar en
  // eso: si el vídeo sigue sonando, lo desmutea sin más; si ya terminó
  // (muteado del todo), lo repite desde el principio ya con sonido —
  // único reinicio permitido, y solo a petición directa del usuario, sin
  // tocar el estado de las zonas (ya activas, siguen estándolo). ──
  var soundBtn = null;
  function hideSoundButton(){
    if (!soundBtn) return;
    soundBtn.remove();
    soundBtn = null;
  }
  function showSoundButton(){
    if (soundBtn) return;
    soundBtn = document.createElement('button');
    soundBtn.type = 'button';
    soundBtn.className = 'sound-toggle';
    soundBtn.setAttribute('aria-label', 'Activar sonido del vídeo');
    soundBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>';
    soundBtn.addEventListener('click', function(){
      if (video.ended) {
        video.currentTime = 0;
        video.muted = false;
        video.play().catch(function(){});
      } else {
        video.muted = false;
      }
      hideSoundButton();
    });
    stage.appendChild(soundBtn);
  }

  // ── Reproducción automática una sola vez, sin loop, con el sonido
  // propio del vídeo. Si el navegador bloquea el autoplay con audio (muy
  // habitual sin gesto previo del usuario), se reproduce muteado para no
  // perder la animación igualmente a tiempo, se enseña el botón de
  // sonido, y de regalo se desmutea también con el primer gesto en
  // cualquier parte de la página (clic/toque/tecla) por si llega a
  // tiempo — sin reiniciar el vídeo. ──
  function unmuteOnGesture(){
    video.muted = false;
    hideSoundButton();
    document.removeEventListener('pointerdown', unmuteOnGesture);
    document.removeEventListener('keydown', unmuteOnGesture);
  }
  var played = video.play();
  if (played && played.catch) {
    played.catch(function(){
      video.muted = true;
      video.play().catch(function(){});
      showSoundButton();
      document.addEventListener('pointerdown', unmuteOnGesture, { passive: true });
      document.addEventListener('keydown', unmuteOnGesture, { passive: true });
    });
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
