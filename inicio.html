<title>Ofipapel 360°</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  color:#EAF5EA;
  min-height:100svh;
  overflow-x:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3vh 12px;
}

/* ─── Fondo: malla de nodos/partículas generada por canvas, coloreada según
   la cercanía real a cada satélite (ver script) — estático, sin bucle de
   animación continuo por batería. ─── */
#bg-stars,#bg-pulses{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.orbit-shell{
  position:relative;z-index:1;
  width:min(92vmin,760px);aspect-ratio:1/1;
  opacity:0;animation:fadeUp .8s ease forwards;
}
.connector-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.connector-svg path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  opacity:.75;transition:opacity .25s, stroke-width .25s;
}
.connector-svg path.cbolt{stroke-width:.55;filter:url(#boltGlow);}
.connector-svg path.cbranch{stroke-width:.35;opacity:.55;filter:url(#boltGlow);}
.connector-svg .active .cbolt{opacity:1;stroke-width:.9;}
.connector-svg .active .cbranch{opacity:.85;}
.connector-svg .cnode{opacity:.9;}
/* Maraña: hilos finos entre los nodos pequeños de rayos distintos */
.connector-svg path.cweb{stroke-width:.3;opacity:.62;filter:url(#boltGlow);}
.connector-svg path.cweb.active{opacity:1;stroke-width:.42;}
.connector-svg path.cweb.zap{opacity:1;stroke-width:.45;transition:none;}

.orbit{position:relative;width:100%;height:100%;}

/* ─── Centro: nodo completo recortado tal cual de la referencia (aro +
   trébol + "OFIPAPEL 360°"), sin recrear nada por CSS. Desde 2026-10-27
   es un enlace de verdad (antes era puramente decorativo, un <div>): abre
   el ERP propio de Ofipapel, todavía en desarrollo — enlace provisional
   del propietario, se actualizará cuando el ERP tenga dominio definitivo.
   Encaja con el nombre: "OFIPAPEL 360°" como puerta de entrada a la vista
   completa del negocio. ─── */
.hub-center{
  position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:clamp(112px,23vmin,172px);height:clamp(112px,23vmin,172px);
  opacity:0;animation:popIn .85s cubic-bezier(.34,1.56,.64,1) .1s forwards, pulseGreen 3.6s ease-in-out 2s infinite;
  z-index:3;
  text-decoration:none;color:inherit;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
}
.hub-center img{width:100%;height:100%;object-fit:contain;display:block;}
.hub-center:hover, .hub-center:focus-visible{
  transform:translate(-50%,-50%) scale(1.06);
  filter:drop-shadow(0 0 22px rgba(120,255,140,.75));
}
.hub-center:focus-visible{outline:none;}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes pulseGreen{
  0%,100%{filter:drop-shadow(0 0 14px rgba(46,204,64,.55));}
  50%{filter:drop-shadow(0 0 26px rgba(120,255,140,.8));}
}

/* ─── Satélites (9, a 40°; eran 8 a 45° hasta que entró Reparto, el
   16/11/2026): cada uno es el nodo completo recortado de la referencia (aro
   de neón + icono + etiqueta ya incluidos en la imagen). La posición sale
   solo de --x/--y; el JS de los conectores la lee de ahí. ─── */
.satellite{
  position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);
  transform:translate(-50%,-50%);
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;align-items:center;
  width:clamp(84px,18vmin,124px);
  z-index:2;
}
.sat-inner{
  opacity:0;transform:scale(.35) translateY(-8px);
  animation:satIn .8s cubic-bezier(.34,1.56,.64,1) forwards;
  display:flex;flex-direction:column;align-items:center;width:100%;
  animation-delay:inherit;
}
@keyframes satIn{to{opacity:1;transform:scale(1) translateY(0);}}
.satellite:nth-child(2) .sat-inner{animation-delay:.45s;}
.satellite:nth-child(3) .sat-inner{animation-delay:.62s;}
.satellite:nth-child(4) .sat-inner{animation-delay:.79s;}
.satellite:nth-child(5) .sat-inner{animation-delay:.96s;}
.satellite:nth-child(6) .sat-inner{animation-delay:1.13s;}
.satellite:nth-child(7) .sat-inner{animation-delay:1.30s;}
.satellite:nth-child(8) .sat-inner{animation-delay:1.47s;}
.satellite:nth-child(9) .sat-inner{animation-delay:1.64s;}
.satellite:nth-child(10) .sat-inner{animation-delay:1.81s;}

.sat-node{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 10px var(--c-glow));
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
  animation:float 5s ease-in-out infinite;
  animation-delay:inherit;
}
.satellite:nth-child(2) .sat-node{animation-delay:.05s;} .satellite:nth-child(3) .sat-node{animation-delay:.35s;}
.satellite:nth-child(4) .sat-node{animation-delay:.65s;} .satellite:nth-child(5) .sat-node{animation-delay:.95s;}
.satellite:nth-child(6) .sat-node{animation-delay:1.25s;} .satellite:nth-child(7) .sat-node{animation-delay:1.55s;}
.satellite:nth-child(8) .sat-node{animation-delay:1.85s;} .satellite:nth-child(9) .sat-node{animation-delay:2.15s;}
.satellite:nth-child(10) .sat-node{animation-delay:2.45s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.satellite:hover .sat-node, .satellite:focus-visible .sat-node{
  transform:translateY(-5px) scale(1.08);
  filter:drop-shadow(0 0 20px var(--c-glow));
}
.satellite:focus-visible{outline:none;}

/* Globo de avisos sobre un satélite, como los de WhatsApp (Luis, 09/11/2026):
   hoy solo Alquileres, con sus conformidades por enviar. */
.sat-globo{
  position:absolute;top:2%;right:6%;z-index:3;
  min-width:28px;height:28px;padding:0 7px;border-radius:14px;
  background:#FF3B30;color:#fff;border:2px solid #05070d;
  font:700 15px/24px system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;
  box-shadow:0 0 12px rgba(255,59,48,.7);pointer-events:none;
  transform:scale(0);animation:globoIn .45s cubic-bezier(.34,1.56,.64,1) 1.8s forwards;
}
@keyframes globoIn{to{transform:scale(1);}}

/* ─── Agentes (22/11/2026): esquina superior izquierda, aparte de la red
   de nodos — no son apps sino agentes, y se van sumando en fila. Clase
   propia (.agente, no .satellite) para que no entren en los conectores.
   Para añadir uno: otro <a class="agente"> con su imagen y --c-glow. ─── */
.agentes{
  position:fixed;z-index:3;
  top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  opacity:0;animation:fadeUp .8s ease 2.2s forwards;
}
.agentes-titulo{
  font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.28em;
  color:rgba(234,245,234,.55);padding-left:6px;
}
.agentes-lista{display:flex;flex-wrap:wrap;gap:4px;max-width:min(46vw,420px);}
.agente{display:block;width:clamp(70px,12vmin,112px);text-decoration:none;}
.agente img{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 8px var(--c-glow));
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), filter .3s;
}
.agente:hover img, .agente:focus-visible img{
  transform:translateY(-3px) scale(1.08);
  filter:drop-shadow(0 0 18px var(--c-glow));
}
.agente:focus-visible{outline:none;}
.agente-ficha{
  margin:auto;width:min(420px,calc(100vw - 32px));max-height:calc(100svh - 48px);overflow:auto;
  background:radial-gradient(120% 80% at 50% 0%,rgba(0,163,255,.16),rgba(5,7,13,.97) 60%);
  color:#EAF5EA;border:1px solid var(--ficha-c,#00A3FF);border-radius:18px;
  box-shadow:0 0 28px var(--ficha-glow,rgba(0,163,255,.45)),inset 0 0 18px rgba(0,163,255,.08);
  padding:22px 22px 18px;font-family:'Inter',sans-serif;
}
.agente-ficha[open]{animation:fichaIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes fichaIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.agente-ficha::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px);}
.ficha-cerrar{position:absolute;top:8px;right:12px;background:none;border:0;color:#EAF5EA;
  font-size:28px;line-height:1;cursor:pointer;opacity:.7;}
.ficha-cerrar:hover{opacity:1;}
.ficha-img{display:block;width:96px;margin:0 auto 6px;filter:drop-shadow(0 0 12px var(--ficha-glow,rgba(0,163,255,.5)));}
.agente-ficha h2{text-align:center;font-size:20px;font-weight:800;margin-bottom:6px;}
.ficha-intro{text-align:center;font-size:14px;opacity:.85;margin-bottom:14px;}
.agente-ficha h3{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ficha-c,#00A3FF);margin:14px 0 8px;}
.agente-ficha ul{list-style:none;display:flex;flex-direction:column;gap:6px;}
.agente-ficha li{font-size:14px;line-height:1.4;padding-left:16px;position:relative;}
.agente-ficha li::before{content:'';position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;
  background:var(--ficha-c,#00A3FF);box-shadow:0 0 6px var(--ficha-c,#00A3FF);}
.agente-ficha li.vacio{opacity:.6;font-style:italic;}
.agente-ficha li.vacio::before{display:none;}
@media (max-width:480px){ .agente{width:clamp(54px,15vw,66px);} }

@media (max-width:480px){
  .orbit-shell{width:96vmin;}
  .hub-center{width:clamp(84px,28vw,120px);height:clamp(84px,28vw,120px);}
  /* 9 nodos a 40° dejan menos hueco que 8 a 45°: un 10% más pequeños para
     que los recuadros (las imágenes son cuadradas) no se pisen al tocar. */
  .satellite{width:clamp(60px,18vw,86px);}

<script>
(function(){
  var sats = document.querySelectorAll('.satellite');
  var svg = document.querySelector('.connector-svg');
  var group = document.getElementById('connectors');
  var NS = 'http://www.w3.org/2000/svg';

  // ── Despierta en segundo plano las apps externas que "duermen" tras un
  // rato sin uso (Roturas Almacén en Vercel, WhatsApp BOT en una función de
  // Netlify) — para cuando el usuario pulse el nodo, el servidor ya no
  // esté frío. 'no-cors' porque no nos hace falta leer la respuesta, solo
  // que la petición llegue; los fallos se ignoran, es solo un aviso.
  ['https://rax-os.vercel.app/login?next=%2F',
   'https://spontaneous-lebkuchen-60fa41.netlify.app/.netlify/functions/conversations'
  ].forEach(function(url){
    try { fetch(url, { mode: 'no-cors', credentials: 'omit' }).catch(function(){}); } catch(e){}
  });

  // ── Fondo "red neuronal": malla densa de nodos + líneas finas entre
  // vecinos, coloreada según cercanía a cada satélite (o al verde del
  // centro) — imita el polvo/nervios de la referencia. Canvas estático
  // (se dibuja una vez, sin bucle continuo, para no gastar batería). ──
  (function mesh(){
    var cv = document.getElementById('bg-stars');
    var ctx = cv.getContext('2d');
    var pcv = document.getElementById('bg-pulses');
    var pctx = pcv.getContext('2d');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var rafId = null;

    function hexToRgb(hex){
      hex = hex.trim();
      var m = hex.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!m) return [255,255,255];
      var h = m[1];
      if (h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
      var num = parseInt(h, 16);
      return [(num>>16)&255, (num>>8)&255, num&255];
    }

    function draw(){
      var w = window.innerWidth, h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // zonas de color: cada satélite + el verde del centro, en coordenadas
      // reales de viewport (a partir del rect de .orbit-shell)
      var shellRect = document.querySelector('.orbit-shell').getBoundingClientRect();
      var zones = [{ x: shellRect.left + shellRect.width*0.5, y: shellRect.top + shellRect.height*0.5, rgb: [46,204,64] }];
      sats.forEach(function(sat){
        var cs = sat.style;
        var x = parseFloat(cs.getPropertyValue('--x'));
        var y = parseFloat(cs.getPropertyValue('--y'));
        var ring = cs.getPropertyValue('--c-ring').trim();
        zones.push({
          x: shellRect.left + (x/100)*shellRect.width,
          y: shellRect.top + (y/100)*shellRect.height,
          rgb: hexToRgb(ring)
        });
      });
      var ZONE_RADIUS = Math.max(shellRect.width, shellRect.height) * 0.5;

      function colorFor(x, y){
        var best = null, bestD = Infinity;
        for (var i=0;i<zones.length;i++){
          var dz = zones[i];
          var d = Math.hypot(x-dz.x, y-dz.y);
          if (d < bestD){ bestD = d; best = dz; }
        }
        var t = Math.max(0, 1 - bestD/ZONE_RADIUS); // 1 = justo en el nodo, 0 = lejos
        var neutral = [190,200,210];
        var rgb = best.rgb.map(function(c,i){ return Math.round(neutral[i] + (c-neutral[i])*t); });
        return { rgb: rgb, t: t };
      }

      // nube densa de puntos
      var n = Math.round((w * h) / 2200);
      var pts = [];
      for (var i = 0; i < n; i++){
        var x = Math.random() * w, y = Math.random() * h;
        pts.push({ x:x, y:y, c: colorFor(x,y) });
      }

      // líneas finas entre puntos cercanos (efecto malla/constelación) —
      // se guardan en "edges" además de dibujarse, para poder animar
      // pulsos viajando por una parte de ellas (ver startPulses).
      var MAXD = Math.min(90, Math.max(60, Math.min(w,h)*0.09));
      var cell = MAXD, grid = {};
      var edges = [];
      pts.forEach(function(p, i){
        var gx = Math.floor(p.x/cell), gy = Math.floor(p.y/cell);
        var key = gx+','+gy;
        (grid[key] = grid[key] || []).push(i);
      });
      pts.forEach(function(p, i){
        var gx = Math.floor(p.x/cell), gy = Math.floor(p.y/cell);
        for (var dx=-1; dx<=1; dx++){
          for (var dy=-1; dy<=1; dy++){
            var neighbors = grid[(gx+dx)+','+(gy+dy)];
            if (!neighbors) continue;
            neighbors.forEach(function(j){
              if (j <= i) return;
              var q = pts[j];
              var d = Math.hypot(p.x-q.x, p.y-q.y);
              if (d < MAXD){
                var op = (1 - d/MAXD) * (0.10 + 0.22*Math.max(p.c.t, q.c.t));
                var r = (p.c.rgb[0]+q.c.rgb[0])/2, g = (p.c.rgb[1]+q.c.rgb[1])/2, b = (p.c.rgb[2]+q.c.rgb[2])/2;
                ctx.strokeStyle = 'rgba('+r+','+g+','+b+','+op.toFixed(3)+')';
                ctx.lineWidth = 0.6;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
                ctx.stroke();
                edges.push({ p:p, q:q, rgb:[r,g,b], t: Math.max(p.c.t, q.c.t) });
              }
            });
          }
        }
      });

      // puntos (algunos más grandes/brillantes cerca de cada zona)
      pts.forEach(function(p){
        var r = Math.random() * 1.1 + .25 + p.c.t*1.4;
        var alpha = Math.min(1, (Math.random() * .5 + .18) + p.c.t*.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba('+p.c.rgb[0]+','+p.c.rgb[1]+','+p.c.rgb[2]+','+alpha.toFixed(3)+')';
        ctx.fill();
      });

      return edges;
    }

    // ── Pulsos viajando por una parte de la malla, como sinapsis
    // disparando (efecto "red neuronal" pedido) — solo se anima este
    // segundo canvas (pequeño número de puntos), el de arriba es estático
    // y no se vuelve a tocar, así que el coste por fotograma es mínimo.
    function startPulses(edges, w, h){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      pcv.width = w * dpr; pcv.height = h * dpr;
      pcv.style.width = w + 'px'; pcv.style.height = h + 'px';
      pctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (reduceMotion || !edges.length) return;

      var count = Math.min(70, Math.max(18, Math.round(edges.length * 0.05)));
      var pool = edges.slice().sort(function(){ return Math.random() - .5; }).slice(0, count);
      var pulses = pool.map(function(e){
        return {
          e: e,
          dur: 1600 + Math.random()*2200,
          delay: Math.random()*4000,
          start: null
        };
      });

      function frame(now){
        pctx.clearRect(0, 0, w, h);
        pulses.forEach(function(pu){
          if (pu.start === null) pu.start = now + pu.delay;
          var elapsed = now - pu.start;
          if (elapsed < 0) return;
          var t = (elapsed % pu.dur) / pu.dur;
          var e = pu.e;
          var x = e.p.x + (e.q.x - e.p.x) * t;
          var y = e.p.y + (e.q.y - e.p.y) * t;
          var fade = Math.sin(t * Math.PI); // 0 en los extremos, máximo a mitad de camino
          var rgb = e.rgb;
          var rad = 1.3 + e.t*1.2;
          var grad = pctx.createRadialGradient(x,y,0,x,y,rad*3.2);
          grad.addColorStop(0, 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.9*fade).toFixed(3)+')');
          grad.addColorStop(1, 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
          pctx.fillStyle = grad;
          pctx.beginPath();
          pctx.arc(x, y, rad*3.2, 0, Math.PI*2);
          pctx.fill();
        });
        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    }

    function rebuild(){
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      var w = window.innerWidth, h = window.innerHeight;
      var edges = draw();
      startPulses(edges, w, h);
    }
    rebuild();
    var t;
    window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(rebuild, 200); });
  })();

  // ── Conectores tipo "rayo/red neuronal": línea principal quebrada del
  // centro (50,50) a cada satélite + un par de ramificaciones cortas +
  // pequeños nodos brillantes, generados a partir de --x/--y/--c-ring/
  // --c-glow ya declarados en cada satélite (única fuente de verdad). ──
  var conns = [];
  var webNodes = []; // nodos pequeños de todos los rayos, para la maraña
  sats.forEach(function(sat, i){
    var cs = sat.style;
    var x = parseFloat(cs.getPropertyValue('--x'));
    var y = parseFloat(cs.getPropertyValue('--y'));
    var ring = cs.getPropertyValue('--c-ring').trim();
    var glow = cs.getPropertyValue('--c-glow').trim();

    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'conn');

    // línea principal quebrada (varios segmentos con jitter perpendicular,
    // que se anula en los dos extremos para anclar limpio en centro/satélite)
    var segs = 5;
    var dx = x - 50, dy = y - 50;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len, ny = dx / len; // perpendicular unitario
    var pts = [[50, 50]];
    for (var s = 1; s < segs; s++){
      var t = s / segs;
      var taper = Math.sin(Math.PI * t); // 0 en los extremos, máximo al centro
      var jitter = (Math.random() - .5) * 6 * taper;
      pts.push([50 + dx * t + nx * jitter, 50 + dy * t + ny * jitter]);
    }
    pts.push([x, y]);
    var d = 'M' + pts.map(function(p){ return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' L');

    var main = document.createElementNS(NS, 'path');
    main.setAttribute('class', 'cbolt');
    main.setAttribute('d', d);
    main.setAttribute('stroke', ring);
    g.appendChild(main);

    // 2 ramificaciones cortas desde puntos interiores del trazo
    [2, 3].forEach(function(idx, bi){
      if (idx >= pts.length - 1) return;
      var p = pts[idx];
      var ang = Math.random() * Math.PI * 2;
      var blen = 5 + Math.random() * 5;
      var bx = p[0] + Math.cos(ang) * blen;
      var by = p[1] + Math.sin(ang) * blen;
      var midx = p[0] + Math.cos(ang) * blen * .5 + (Math.random() - .5) * 3;
      var midy = p[1] + Math.sin(ang) * blen * .5 + (Math.random() - .5) * 3;
      var branch = document.createElementNS(NS, 'path');
      branch.setAttribute('class', 'cbranch');
      branch.setAttribute('d', 'M' + p[0].toFixed(2) + ',' + p[1].toFixed(2) + ' L' + midx.toFixed(2) + ',' + midy.toFixed(2) + ' L' + bx.toFixed(2) + ',' + by.toFixed(2));
      branch.setAttribute('stroke', ring);
      g.appendChild(branch);
      var node = document.createElementNS(NS, 'circle');
      node.setAttribute('class', 'cnode');
      node.setAttribute('cx', bx); node.setAttribute('cy', by); node.setAttribute('r', .6);
      node.setAttribute('fill', ring);
      g.appendChild(node);
    });

    // nodo brillante a mitad de camino del trazo principal
    var mid = pts[Math.floor(pts.length / 2)];
    var midNode = document.createElementNS(NS, 'circle');
    midNode.setAttribute('class', 'cnode');
    midNode.setAttribute('cx', mid[0]); midNode.setAttribute('cy', mid[1]); midNode.setAttribute('r', .7);
    midNode.setAttribute('fill', ring);
    g.appendChild(midNode);
    var spokeAng = Math.atan2(y - 50, x - 50);
    webNodes.push({ x: mid[0], y: mid[1], color: ring, spoke: i, ring: 1, ang: spokeAng });
    // nodo del anillo interior, más cerca del centro, sobre el propio rayo
    var inner = pts[2];
    var innerNode = document.createElementNS(NS, 'circle');
    innerNode.setAttribute('class', 'cnode');
    innerNode.setAttribute('cx', inner[0]); innerNode.setAttribute('cy', inner[1]); innerNode.setAttribute('r', .6);
    innerNode.setAttribute('fill', ring);
    g.appendChild(innerNode);
    webNodes.push({ x: inner[0], y: inner[1], color: ring, spoke: i, ring: 0, ang: spokeAng });

    group.appendChild(g);
    conns.push({ g: g, main: main });

    var pid = 'connpath' + i;
    main.setAttribute('id', pid);
    var dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', .9);
    dot.setAttribute('fill', '#fff');
    dot.setAttribute('opacity', '.9');
    var anim = document.createElementNS(NS, 'animateMotion');
    anim.setAttribute('dur', (2.4 + Math.random() * .8).toFixed(2) + 's');
    anim.setAttribute('begin', (i * .3).toFixed(2) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    var mpath = document.createElementNS(NS, 'mpath');
    mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + pid);
    mpath.setAttribute('href', '#' + pid);
    anim.appendChild(mpath);
    dot.appendChild(anim);
    dot.setAttribute('filter', 'url(#boltGlow)');
    g.appendChild(dot);
  });

  // ── Tela de araña (16/11/2026, a petición del propietario): los rayos
  // se unen entre sí en dos anillos concéntricos, cada nodo solo con el del
  // rayo vecino a la misma altura — ordenado, no una maraña (la primera
  // versión unía cada punta con sus 3 vecinos más cercanos y quedaba
  // demasiado enredada). Hilos quebrados como los rayos, en degradado del
  // color de un extremo al del otro, debajo de los rayos.
  var webLinks = [];
  var webGroup = document.createElementNS(NS, 'g');
  webGroup.setAttribute('class', 'web');
  group.insertBefore(webGroup, group.firstChild);
  var defs = svg.querySelector('defs');
  var seen = {};
  function linkKey(a, b){ var i = webNodes.indexOf(a), j = webNodes.indexOf(b); return i < j ? i + '-' + j : j + '-' + i; }
  function addLink(a, b){
    var k = linkKey(a, b);
    if (seen[k] || a.spoke === b.spoke) return;
    seen[k] = true;
    var gid = 'webgrad' + webLinks.length;
    var grad = document.createElementNS(NS, 'linearGradient');
    grad.setAttribute('id', gid);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', a.x); grad.setAttribute('y1', a.y);
    grad.setAttribute('x2', b.x); grad.setAttribute('y2', b.y);
    [[0, a.color], [1, b.color]].forEach(function(st){
      var s = document.createElementNS(NS, 'stop');
      s.setAttribute('offset', st[0]); s.setAttribute('stop-color', st[1]);
      grad.appendChild(s);
    });
    defs.appendChild(grad);
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('class', 'cweb');
    path.setAttribute('d', boltPath(a, b));
    path.setAttribute('stroke', 'url(#' + gid + ')');
    webGroup.appendChild(path);
    webLinks.push({ path: path, a: a, b: b, spokes: [a.spoke, b.spoke] });
  }
  // Trazo quebrado tipo rayo, como los conectores principales: tramos con
  // salto perpendicular aleatorio, que se anula en los dos extremos para que
  // el hilo siga anclado en sus nodos aunque cambie de forma.
  function boltPath(a, b){
    var ddx = b.x - a.x, ddy = b.y - a.y, dl = Math.hypot(ddx, ddy) || 1;
    var px = -ddy / dl, py = ddx / dl, segs = 4, out = 'M' + a.x.toFixed(2) + ',' + a.y.toFixed(2);
    for (var s = 1; s < segs; s++){
      var t = s / segs, j = (Math.random() - .5) * Math.min(4, dl * .28) * Math.sin(Math.PI * t);
      out += ' L' + (a.x + ddx * t + px * j).toFixed(2) + ',' + (a.y + ddy * t + py * j).toFixed(2);
    }
    return out + ' L' + b.x.toFixed(2) + ',' + b.y.toFixed(2);
  }
  [0, 1].forEach(function(r){
    var ringNodes = webNodes.filter(function(n){ return n.ring === r; }).sort(function(a, b){ return a.ang - b.ang; });
    ringNodes.forEach(function(n, k){ addLink(n, ringNodes[(k + 1) % ringNodes.length]); });
  });
  // un pulso de luz recorre de vez en cuando uno de cada tres hilos
  webLinks.forEach(function(l, k){
    if (k % 3) return;
    var pid = 'webpath' + k;
    l.path.setAttribute('id', pid);
    var dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', .45); dot.setAttribute('fill', '#fff'); dot.setAttribute('opacity', '.8');
    dot.setAttribute('filter', 'url(#boltGlow)');
    var anim = document.createElementNS(NS, 'animateMotion');
    anim.setAttribute('dur', (3 + Math.random() * 2.5).toFixed(2) + 's');
    anim.setAttribute('begin', (2.6 + Math.random() * 2).toFixed(2) + 's');
    anim.setAttribute('repeatCount', 'indefinite');
    if (Math.random() < .5) { anim.setAttribute('keyPoints', '1;0'); anim.setAttribute('keyTimes', '0;1'); anim.setAttribute('calcMode', 'linear'); }
    var mp = document.createElementNS(NS, 'mpath');
    mp.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#' + pid);
    mp.setAttribute('href', '#' + pid);
    anim.appendChild(mp); dot.appendChild(anim);
    webGroup.appendChild(dot);
  });
  // los hilos se dibujan después de los rayos y sus ramitas
  webLinks.forEach(function(l, k){
    var len = l.path.getTotalLength();
    l.path.style.strokeDasharray = len;
    l.path.style.strokeDashoffset = len;
    var delay = 0.25 + sats.length * 0.16 + 0.7 + k * 0.03;
    requestAnimationFrame(function(){
      l.path.style.transition = 'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1) ' + delay + 's';
      l.path.style.strokeDashoffset = '0';
    });
    // ya dibujado, se quita el guion: si no, al cambiar de forma (y de
    // longitud) en el chisporroteo se vería cortado
    setTimeout(function(){
      l.path.style.transition = '';
      l.path.style.strokeDasharray = 'none';
      l.path.style.strokeDashoffset = '';
    }, (delay + 1) * 1000);
  });
  // Chisporroteo eléctrico: cada poco, un hilo al azar cambia de
  // forma de golpe y a veces da un fogonazo, como corriente viva. Arranca cuando
  // la red ya está dibujada; se para con la pestaña oculta y no se activa si
  // el sistema pide reducir movimiento.
  var webReady = (0.25 + sats.length * 0.16 + 0.7 + webLinks.length * 0.03 + 1) * 1000;
  if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    setTimeout(function(){
      setInterval(function(){
        if (document.hidden || !webLinks.length) return;
        for (var n = 0; n < 1; n++){
          var l = webLinks[Math.floor(Math.random() * webLinks.length)];
          l.path.setAttribute('d', boltPath(l.a, l.b));
          if (Math.random() < .35) {
            l.path.classList.add('zap');
            (function(p){ setTimeout(function(){ p.classList.remove('zap'); }, 110 + Math.random() * 90); })(l.path);
          }
        }
      }, 140);
    }, webReady);
  }

  // Dibuja cada trazo (longitud real vía getTotalLength) con retardo
  // escalonado por satélite — la "animación de conexión de nodos".
  conns.forEach(function(c, i){
    [c.main].concat(Array.prototype.slice.call(c.g.querySelectorAll('.cbranch'))).forEach(function(path, bi){
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      var delay = 0.25 + i * 0.16 + (bi > 0 ? 0.55 : 0);
      requestAnimationFrame(function(){
        path.style.transition = 'stroke-dashoffset ' + (bi > 0 ? '.6s' : '1.1s') + ' cubic-bezier(.4,0,.2,1) ' + delay + 's';
        path.style.strokeDashoffset = '0';
      });
    });
  });

  // Resalta el conector cuando se pasa el ratón/foco por su satélite
  sats.forEach(function(sat, i){
    var c = conns[i];
    if (!c) return;
    var mine = webLinks.filter(function(l){ return l.spokes.indexOf(i) >= 0; });
    var on = function(){ c.g.classList.add('active'); mine.forEach(function(l){ l.path.classList.add('active'); }); };
    var off = function(){ c.g.classList.remove('active'); mine.forEach(function(l){ l.path.classList.remove('active'); }); };
    sat.addEventListener('mouseenter', on);
    sat.addEventListener('mouseleave', off);
    sat.addEventListener('focus', on);
    sat.addEventListener('blur', off);
  });

  // Sonido al pulsar cada app: se retrasa un poco la navegación real para
  // que le dé tiempo a oírse (si no, el navegador descarga la página y
  // corta el audio casi al instante). Se respetan los casos en los que el
  // usuario claramente NO quiere una navegación normal en la misma
  // pestaña (clic central/derecho, Ctrl/Cmd/Shift+clic, target="_blank")
  // — ahí no se toca nada y el navegador hace lo suyo tal cual.
  var clickAudio = new Audio('sound-click.mp3');
  clickAudio.preload = 'auto';
  var CLICK_DELAY = 220;
  sats.forEach(function(sat){
    sat.addEventListener('click', function(evt){
      if (evt.defaultPrevented || evt.button !== 0 || evt.metaKey || evt.ctrlKey || evt.shiftKey || evt.altKey) return;
      if (sat.target && sat.target !== '_self') return;
      evt.preventDefault();
      try { clickAudio.currentTime = 0; clickAudio.play().catch(function(){}); } catch(e){}
      setTimeout(function(){ window.location.href = sat.href; }, CLICK_DELAY);
    });
  });

  // Agentes de la esquina: no navegan, abren su ficha (propietario,
  // 22/11/2026): quién es, qué funciones tiene, qué ha hecho hoy y qué
  // tiene pendiente. "resumen" = código del agente en el ERP: se pregunta a
  // fn_agente_resumen_publico (Supabase del ERP), que devuelve SOLO números y
  // estado (nada de proveedores, importes ni nombres), por eso puede ir con
  // la clave pública. Si no contesta, se dice que no hay registro: nunca se
  // inventa.
  var ERP_RPC = 'https://sufxvpiwcncnyltrvoun.supabase.co/rest/v1/rpc/fn_agente_resumen_publico';
  var ERP_CLAVE_PUBLICA = 'sb_publishable_IArWyleDbhD_twn1W5-jHA_l9kECHap';
  var AGENTES = {
    emilio: {
      nombre: 'E-milio',
      color: '#00A3FF', glow: 'rgba(0,163,255,.45)',
      intro: '¡Hola! Soy E-milio, el agente del correo de Ofipapel. Leo los e-mails de los proveedores para que nadie tenga que abrirlos uno a uno.',
      funciones: [
        'Vigilo el buzón de compras día y noche, cada 10 minutos. Solo leo: no borro, no muevo y no contesto a nadie.',
        'Cojo los PDF de los proveedores y digo qué son: propuesta o confirmación de pedido, factura o albarán.',
        'Reconozco al proveedor y busco su pedido, se hiciera en el ERP o en GeminisWin.',
        'Cruzo cada documento con su pedido, línea a línea, con IA: aviso de lo que falta, viene sin stock, de menos o de más, o cambia de precio por encima del margen.',
        'Preparo las facturas finales con su nombre ordenado para la carpeta de facturas de proveedores.',
        'Lo dejo todo en el Gestor de Pedidos 2.0 → «Correo de proveedores». Yo preparo; decidís vosotros. Me manda NEXA.'
      ],
      resumen: 'correo_proveedores'
    }
  };
  function plural(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  // Del resumen numérico del ERP a frases de E-milio.
  function frasesCorreo(r){
    var hoy = [], pend = [], h = r.hoy || {}, p = r.pendiente || {};
    if (r.estado === 'esperando_conexion') hoy.push('Todavía no estoy conectado al buzón de compras: espero la conexión de Microsoft para empezar.');
    else if (r.estado === 'parado') hoy.push('Estoy parado: NEXA me puede volver a poner en marcha.');
    else if (r.estado === 'con_error') hoy.push('En mi última pasada algo falló al leer el buzón: lo estoy reintentando.');
    if (r.estado !== 'esperando_conexion'){
      if (!h.documentos) hoy.push('Hoy todavía no ha llegado ningún documento de proveedores.');
      else {
        var tipos = [];
        if (h.propuestas) tipos.push(plural(h.propuestas, 'propuesta', 'propuestas'));
        if (h.facturas) tipos.push(plural(h.facturas, 'factura', 'facturas'));
        if (h.albaranes) tipos.push(plural(h.albaranes, 'albarán', 'albaranes'));
        if (h.otros) tipos.push(plural(h.otros, 'otro', 'otros'));
        hoy.push('He leído ' + plural(h.documentos, 'documento', 'documentos') + (tipos.length ? ': ' + tipos.join(', ') : '') + '.');
        if (h.cruzados_con_pedido) hoy.push('He cruzado ' + h.cruzados_con_pedido + ' con su pedido: ' + plural(h.cuadran || 0, 'cuadra', 'cuadran') + ' y ' + plural(h.con_diferencias || 0, 'tiene diferencias', 'tienen diferencias') + '.');
      }
      if (r.ultima_pasada) hoy.push('Mi última vuelta por el buzón: ' + new Date(r.ultima_pasada).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', timeZone:'Atlantic/Canary'}) + '.');
    }
    if (p.por_revisar) pend.push(plural(p.por_revisar, 'documento por revisar', 'documentos por revisar') + ' en el Gestor 2.0.');
    if (p.con_diferencias) pend.push(plural(p.con_diferencias, 'documento con diferencias', 'documentos con diferencias') + ' con su pedido.');
    if (p.sin_pedido) pend.push(plural(p.sin_pedido, 'documento al que no le encuentro pedido', 'documentos a los que no les encuentro pedido') + '.');
    if (p.facturas_sin_copiar) pend.push(plural(p.facturas_sin_copiar, 'factura por copiar', 'facturas por copiar') + ' a la carpeta de facturas.');
    return { hoy: hoy, pend: pend };
  }
  var ficha = document.getElementById('agenteFicha');
  function liste(ul, items, vacio){
    ul.innerHTML = '';
    if (!items || !items.length){ var li=document.createElement('li'); li.className='vacio'; li.textContent=vacio; ul.appendChild(li); return; }
    items.forEach(function(t){ var li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
  }
  function abrirFicha(id, img){
    var ag = AGENTES[id]; if (!ag || !ficha) return;
    ficha.style.setProperty('--ficha-c', ag.color);
    ficha.style.setProperty('--ficha-glow', ag.glow);
    ficha.querySelector('.ficha-img').src = img.src;
    ficha.querySelector('h2').textContent = ag.nombre;
    ficha.querySelector('.ficha-intro').textContent = ag.intro;
    liste(ficha.querySelector('.ficha-funciones'), ag.funciones, 'Sin funciones descritas todavía.');
    var hoy = ficha.querySelector('.ficha-hoy');
    var pendT = ficha.querySelector('.ficha-pend-t'), pend = ficha.querySelector('.ficha-pendiente');
    pendT.hidden = pend.hidden = true;
    var SIN = 'Todavía no tengo conectado el registro de lo que hago cada día.';
    if (ag.resumen){
      liste(hoy, [], 'Mirando lo de hoy…');
      fetch(ERP_RPC, {method:'POST', cache:'no-store', headers:{'apikey':ERP_CLAVE_PUBLICA, 'Content-Type':'application/json'}, body:JSON.stringify({p_agente: ag.resumen})})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if (!d){ liste(hoy, [], SIN); return; }
          var f = frasesCorreo(d);
          liste(hoy, f.hoy, 'Hoy todavía no he hecho nada.');
          if (f.pend.length){ liste(pend, f.pend, ''); pendT.hidden = pend.hidden = false; }
          else if (d.estado !== 'esperando_conexion'){ liste(pend, [], 'Nada: lo tengo todo al día.'); pendT.hidden = pend.hidden = false; }
        })
        .catch(function(){ liste(hoy, [], SIN); });
    } else liste(hoy, [], SIN);
    if (ficha.showModal) ficha.showModal(); else ficha.setAttribute('open','');
  }
  if (ficha){
    ficha.querySelector('.ficha-cerrar').addEventListener('click', function(){ ficha.close(); });
    ficha.addEventListener('click', function(e){
      // solo fuera del recuadro (el fondo), no en su relleno
      var r = ficha.getBoundingClientRect();
      if (e.target === ficha && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) ficha.close();
    });
  }
  document.querySelectorAll('.agente').forEach(function(ag){
    ag.addEventListener('click', function(evt){
      evt.preventDefault();
      try { clickAudio.currentTime = 0; clickAudio.play().catch(function(){}); } catch(e){}
      abrirFicha(ag.getAttribute('data-agente'), ag.querySelector('img'));
    });
  });

  // El centro (ERP) no entra en "sats" a propósito -- esa lista también
  // dirige el dibujado de las líneas conectoras a cada satélite, y el
  // centro no es uno de ellos. Mismo sonido/retraso que el resto.
  var hubCenterLink = document.querySelector('.hub-center');
  if (hubCenterLink) {
    hubCenterLink.addEventListener('click', function(evt){
      if (evt.defaultPrevented || evt.button !== 0 || evt.metaKey || evt.ctrlKey || evt.shiftKey || evt.altKey) return;
      if (hubCenterLink.target && hubCenterLink.target !== '_self') return;
      evt.preventDefault();
      try { clickAudio.currentTime = 0; clickAudio.play().catch(function(){}); } catch(e){}
      setTimeout(function(){ window.location.href = hubCenterLink.href; }, CLICK_DELAY);
    });
  }

  // Único sonido: el golpe metálico real (mp3 del propietario), nada más
  // abrir la app, con un fundido de entrada de .45s (el golpe seco del
  // principio del audio original sonaba demasiado fuerte) — el fundido se
  // hace en código con un nodo de ganancia de Web Audio, sin tocar el
  // fichero. Acompaña visualmente a la animación de conexión de arriba. El
  // navegador puede bloquear la reproducción automática sin gesto previo
  // del usuario — si play() falla, queda pendiente y se reintenta en el
  // primer clic/toque/tecla.
  // 2026-10-27: el fundido se hacía con un nodo de ganancia de Web Audio
  // (AudioContext + GainNode) -- el propietario detectó un corte
  // perceptible justo al empezar, repetible siempre. Causa probable: al
  // crear el AudioContext y llamar a .play() en el mismo instante, el
  // navegador tarda un poco en arrancar el pipeline de audio real, y ese
  // arranque no está sincronizado con la rampa de ganancia (programada en
  // el reloj del AudioContext, no en el de la reproducción) -- se oye
  // silencio/corte hasta que ambos cuadran. Se cambia a un fundido simple
  // subiendo audio.volume con requestAnimationFrame: no hay dos relojes
  // que sincronizar, el volumen afecta directamente a lo que ya se está
  // reproduciendo.
  var openAudio = new Audio('sound-connect.mp3');
  openAudio.preload = 'auto';
  var openAudioPending = false;
  var FADE_IN_MS = 450;
  var fadeRAF = null;
  function fadeVolumeIn(){
    if (fadeRAF) cancelAnimationFrame(fadeRAF);
    var start = performance.now();
    openAudio.volume = 0;
    function step(now){
      var t = Math.max(0, Math.min(1, (now - start) / FADE_IN_MS));
      openAudio.volume = t;
      fadeRAF = t < 1 ? requestAnimationFrame(step) : null;
    }
    fadeRAF = requestAnimationFrame(step);
  }
  function playOpenSound(){
    fadeVolumeIn();
    openAudio.currentTime = 0;
    var p = openAudio.play();
    if (p && p.catch) {
      p.then(function(){ openAudioPending = false; })
       .catch(function(){ openAudioPending = true; });
    }
  }
  playOpenSound();
  ['pointerdown', 'keydown'].forEach(function(evt){
    document.addEventListener(evt, function(){
      if (openAudioPending) {
        playOpenSound();
      }
    }, { passive: true });
  });
})();
</script>
<script>
// Globo de Alquileres: conformidades por enviar. La app de Alquileres (mismo
// sitio) deja en localStorage las horas a las que avisa cada una; aquí se
// cuentan las que ya han llegado. Ver alquileres/src/lib/conformidades.ts.
(function(){
  var sat = document.querySelector('.satellite[href="alquileres/"]');
  if (!sat) return;
  function pinta(){
    var n = 0;
    try {
      var d = JSON.parse(localStorage.getItem('ofipapel:alquileres:conformidades') || 'null');
      var ya = new Date().toISOString();
      if (d && d.avisos) n = d.avisos.filter(function(a){ return a <= ya; }).length;
    } catch (e) { n = 0; }
    var g = sat.querySelector('.sat-globo');

  }
