# Despliegue automático del ERP propio en Netlify (sitio ofipapel-erp-propio-preview).
# El sitio tiene «Base directory» = erp-propio, así que Netlify lee este fichero y no el
# netlify.toml de la raíz (que es el de las demás apps del repositorio).
[build]
  command = "npm ci && npm run build"
  publish = "dist"
  # No reconstruir si el cambio no toca el ERP (el repositorio tiene más proyectos).
  # En la primera publicación de la rama los dos commits son iguales: entonces se construye.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  VITE_BASE_PATH = "/"
  NODE_VERSION = "22"

# Cabeceras de seguridad (hardening ISO 27001 A.8.9/A.8.26 · SOC 2 CC6.6). Se aplican a todo el sitio.
# Falta a propósito la Content-Security-Policy: se prepara primero en modo «solo informar» para no
# romper pantallas (ver docs/HARDENING_ISO27001_SOC2_27701.md, hallazgo H-06).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), interest-cohort=()"

# version.json siempre fresco: la app lo consulta para avisar de que hay una versión nueva.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# index.html tampoco se guarda en caché: al pulsar «Actualizar» tiene que llegar el nuevo.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
